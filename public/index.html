function FamilyTelegramSettings() {
  const { currentUser, showNotif, addLog } = useContext(AppCtx);
  const fam = currentUser;
  const [token, setToken] = useState(fam.telegramConfig?.token || '');
  const [chatId, setChatId] = useState(fam.telegramConfig?.chatId || '');
  const [enabled, setEnabled] = useState(fam.telegramConfig?.enabled ?? false);
  const [notifyRedemptions, setNotifyRedemptions] = useState(fam.telegramConfig?.notifyRedemptions ?? true);
  const [notifyHafalan, setNotifyHafalan] = useState(fam.telegramConfig?.notifyHafalan ?? true);
  const [testing, setTesting] = useState(false);
  const [saving, setSaving] = useState(false);

  const handleTest = async () => {
    if (!token || !chatId) {
      showNotif('Bot Token dan Chat ID wajib diisi untuk uji coba', 'error');
      return;
    }
    setTesting(true);
    try {
      const res = await apiFetch('/api/family/telegram-test', {
        method: 'POST',
        body: JSON.stringify({ token, chatId })
      });
      if (res && res.success) {
        showNotif('✓ Pesan uji coba berhasil terkirim ke Telegram Anda!', 'success');
        addLog(currentUser.name, 'Uji coba notifikasi Telegram keluarga berhasil', 'admin');
      } else {
        throw new Error(res?.error || 'Gagal mengirim pesan');
      }
    } catch (err) {
      showNotif(err.message, 'error');
    } finally {
      setTesting(false);
    }
  };

  const handleSave = async () => {
    setSaving(true);
    try {
      const res = await apiFetch('/api/family/telegram-config', {
        method: 'POST',
        body: JSON.stringify({ token, chatId, enabled, notifyRedemptions, notifyHafalan })
      });
      if (res && res.success) {
        showNotif('✓ Pengaturan notifikasi Telegram berhasil disimpan!', 'success');
        addLog(currentUser.name, `Memperbarui konfigurasi Telegram (${enabled ? 'Aktif' : 'Nonaktif'})`, 'admin');
      } else {
        throw new Error(res?.error || 'Gagal menyimpan');
      }
    } catch (err) {
      showNotif(err.message, 'error');
    } finally {
      setSaving(false);
    }
  };

  return (
    <div className="fade-in">
      <div className="page-header flex items-center justify-between mb-6" style={{gap:12,flexWrap:'wrap'}}>
        <div>
          <h2 style={{color:'var(--t1)',display:'flex',alignItems:'center',gap:8}}>
            <UiIcon name="bell" size={20} color="var(--primary)" /> Notifikasi Telegram Real-Time
          </h2>
          <p style={{color:'var(--t3)',fontSize:12,marginTop:2}}>
            Terima pemberitahuan instan saat anak menukarkan hadiah koin atau menyelesaikan setoran hafalan
          </p>
        </div>
        <span className={`badge ${enabled && token && chatId ? 'badge-success' : 'badge-warn'}`}>
          {enabled && token && chatId ? '● AKTIF' : '○ BELUM AKTIF'}
        </span>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
        <div className="card">
          <div style={{fontWeight:700,fontSize:14,color:'var(--t1)',marginBottom:14,display:'flex',alignItems:'center',gap:8}}>
            <UiIcon name="settings" size={16} color="var(--primary)" /> Konfigurasi Bot
          </div>

          <div style={{marginBottom:14}}>
            <label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:6,fontFamily:'var(--font-display)'}}>
              Telegram Bot Token
            </label>
            <input
              type="password"
              value={token}
              onChange={e=>setToken(e.target.value)}
              placeholder="Contoh: 123456789:ABC-DEF1234ghIkl..."
              style={{width:'100%',padding:'10px 12px',borderRadius:8,background:'var(--bg)',border:'1px solid var(--border)',color:'var(--t1)',fontSize:13}}
            />
          </div>

          <div style={{marginBottom:16}}>
            <label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:6,fontFamily:'var(--font-display)'}}>
              Chat ID Penerima (Orang Tua / Grup Keluarga)
            </label>
            <input
              type="text"
              value={chatId}
              onChange={e=>setChatId(e.target.value)}
              placeholder="Contoh: 123456789 atau -100123456789"
              style={{width:'100%',padding:'10px 12px',borderRadius:8,background:'var(--bg)',border:'1px solid var(--border)',color:'var(--t1)',fontSize:13}}
            />
          </div>

          <div style={{background:'var(--bg-elevated)',borderRadius:12,padding:'12px 14px',marginBottom:16,border:'1px solid var(--border)'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
              <div>
                <div style={{fontWeight:700,fontSize:13,color:'var(--t1)'}}>Aktifkan Notifikasi Telegram</div>

                <input type="checkbox" checked={notifyRedemptions} onChange={e=>setNotifyRedemptions(e.target.checked)} />

              </label>
              <label style={{display:'flex',alignItems:'center',gap:8,fontSize:12,color:'var(--t2)',cursor:'pointer'}}>
                <input type="checkbox" checked={notifyHafalan} onChange={e=>setNotifyHafalan(e.target.checked)} />
                <span>📖 Notifikasi Setoran Hafalan Baru</span>
              </label>
            </div>
          </div>

}

// FAMILY STUDY REPORT & ACHIEVEMENT CERTIFICATE
// ============================================================
function FamilyReportCertificate({ myKids, selectedKid }) {
  const { state, currentUser, showNotif } = useContext(AppCtx);
  const [kidId, setKidId] = useState(selectedKid?.id || myKids[0]?.id);
  const [downloading, setDownloading] = useState(false);

  const currentKid = myKids.find(k => k.id === kidId) || selectedKid || myKids[0];
  const hafalanDone = (currentKid?.hafalanDone || []).length;
  const totalHafalan = HAFALAN_LIST.length;
  const storiesDone = (state.storyRecords || []).filter(r => r.kidId === currentKid?.id).length;
  const drawingsDone = (state.drawingRecords || []).filter(r => r.kidId === currentKid?.id).length;
  const records = (state.hafalanRecords || []).filter(r => r.kidId === currentKid?.id);
  const aiRecords = records.filter(r => r.score !== undefined);
  const avgAiScore = aiRecords.length > 0 
    ? Math.round(aiRecords.reduce((s, r) => s + (r.score || 0), 0) / aiRecords.length) 
    : (hafalanDone > 0 ? 88 : 0);
  const totalCoins = currentKid?.coins || 0;
  const watchTime = currentKid?.watchTime || 0;
  const streak = currentKid?.streak || 0;
  const certDate = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
  const certNo = `VK-${(currentKid?.id || 'KID').toUpperCase()}-${new Date().getFullYear()}`;

  const downloadCertificate = () => {
    setDownloading(true);
    try {
      const canvas = document.createElement('canvas');
      canvas.width = 900;
      canvas.height = 620;
      const ctx = canvas.getContext('2d');

      // Background Luxury Ivory
      const bgGrad = ctx.createLinearGradient(0, 0, 900, 620);
      bgGrad.addColorStop(0, '#ffffff');
      bgGrad.addColorStop(1, '#fffbeb');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 900, 620);

      // Outer Gold Border
      ctx.strokeStyle = '#d97706';
      ctx.lineWidth = 14;
      ctx.strokeRect(18, 18, 864, 584);

      // Inner Thin Border
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 2;
      ctx.strokeRect(32, 32, 836, 556);

      // Corner Ornaments
      const drawCorner = (x, y) => {
        ctx.fillStyle = '#b45309';
        ctx.beginPath();
        ctx.arc(x, y, 8, 0, Math.PI * 2);
        ctx.fill();
      };
      drawCorner(32, 32);
      drawCorner(868, 32);
      drawCorner(32, 588);
      drawCorner(868, 588);

      // Header Brand
      ctx.fillStyle = '#1e3a8a';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('VIDKIDZ ISLAMIC & KIDS ACADEMY', 450, 80);

      ctx.fillStyle = '#d97706';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText('PIAGAM PENGHARGAAN & PRESTASI BELAJAR', 450, 105);

      ctx.fillStyle = '#64748b';
      ctx.font = '11px sans-serif';
      ctx.fillText(`No. Registrasi: ${certNo}`, 450, 125);

      // Certificate Title
      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 26px serif';
      ctx.fillText('SERTIFIKAT KELULUSAN & KETEKUNAN', 450, 175);

      ctx.fillStyle = '#475569';
      ctx.font = '14px sans-serif';
      ctx.fillText('Diberikan kepada ananda tercinta:', 450, 215);

      // Kid Name
      ctx.fillStyle = '#0284c7';
      ctx.font = 'bold 32px sans-serif';
      ctx.fillText(`${currentKid?.name || 'Anak Hebat'}`, 450, 260);

      // Achievement Narrative
      ctx.fillStyle = '#334155';
      ctx.font = '13px sans-serif';
      ctx.fillText(`Atas ketekunan menyelesaikan rangkaian materi edukasi, setoran hafalan surah & doa harian,`, 450, 305);
      ctx.fillText(`serta pembentukan karakter budi pekerti luhur melalui dongeng santai di platform VIDKIDZ.`, 450, 325);

      // Stat Box Background
      ctx.fillStyle = '#f8fafc';
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 1;
      ctx.fillRect(90, 365, 720, 95);
      ctx.strokeRect(90, 365, 720, 95);

      const stats = [
        { label: 'Hafalan Tuntas', val: `${hafalanDone} Materi`, icon: '📖' },
        { label: 'Dongeng & Budi Pekerti', val: `${storiesDone} Cerita`, icon: '📚' },
        { label: 'Skor Pelafalan AI', val: `${avgAiScore}%`, icon: '🎯' },
        { label: 'Koin Prestasi', val: `${totalCoins} 🪙`, icon: '⭐' }
      ];

      stats.forEach((st, idx) => {
        const xPos = 180 + idx * 180;
        ctx.fillStyle = '#64748b';
        ctx.font = '11px sans-serif';
        ctx.fillText(`${st.icon} ${st.label}`, xPos, 395);
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 20px sans-serif';
        ctx.fillText(st.val, xPos, 430);
      });

      // Footer Signatures
      ctx.fillStyle = '#64748b';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`Diterbitkan pada: ${certDate}`, 100, 525);
      ctx.fillText('Status: Terverifikasi Digital', 100, 545);

      ctx.textAlign = 'right';
      ctx.fillText(`Keluarga: ${currentUser?.name || 'Orang Tua'}`, 800, 525);
      ctx.fillText('Tanda Tangan & Restu Orang Tua: ✓ Sah', 800, 545);

      // Rosette Medal
      ctx.textAlign = 'center';
      ctx.font = '38px sans-serif';
      ctx.fillText('🎖️', 450, 540);

      // Trigger Download
      const link = document.createElement('a');
      link.download = `Sertifikat-VIDKIDZ-${(currentKid?.name || 'Anak').replace(/\s+/g, '_')}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      showNotif('✓ Sertifikat berhasil diunduh dalam format gambar resolusi tinggi!', 'success');
    } catch (e) {
      showNotif('Gagal mengunduh sertifikat: ' + e.message, 'error');
    } finally {
      setDownloading(false);
    }
  };

  const shareWhatsApp = () => {
    const text = `🎓 *SERTIFIKAT PRESTASI BELAJAR VIDKIDZ* 🌟\n\n` +
      `Alhamdulillah, ananda *${currentKid?.name}* telah menuntaskan capaian belajar hebat:\n\n` +
      `📖 *Hafalan Tuntas:* ${hafalanDone} Materi\n` +
      `📚 *Dongeng Budi Pekerti:* ${storiesDone} Cerita\n` +
      `🎨 *Karya Seni Mewarnai:* ${drawingsDone} Lukisan\n` +
      `🎯 *Rata-rata Skor Pelafalan AI:* ${avgAiScore}% (Mumtaz)\n` +
      `⏱️ *Waktu Belajar Aktif:* ${watchTime} Menit\n` +
      `🪙 *Total Koin Prestasi:* ${totalCoins} Koin\n` +
      `🔥 *Streak Belajar:* ${streak} Hari Aktif\n\n` +
      `Terus semangat dan berprestasi, ananda kebanggaan keluarga! 🤲✨`;
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
  };

  return (
    <div className="fade-in">
      <div className="page-header flex items-center justify-between mb-6" style={{gap:12,flexWrap:'wrap'}}>
        <div>
          <h2 style={{color:'var(--t1)',display:'flex',alignItems:'center',gap:8}}>
            <UiIcon name="award" size={22} color="var(--coin)" /> Rapor & Sertifikat Prestasi Belajar
          </h2>
          <p style={{color:'var(--t3)',fontSize:12,marginTop:2}}>
            Apresiasi pencapaian ananda dengan piagam resmi VIDKIDZ yang dapat diunduh dan dibagikan
          </p>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          {myKids.map(k => (
            <button
              key={k.id}
              onClick={()=>setKidId(k.id)}
              style={{
                display:'inline-flex',
                alignItems:'center',
                gap:6,
                padding:'6px 14px',
                borderRadius:20,
                fontSize:12,
                cursor:'pointer',
                fontWeight:700,
                background: currentKid?.id === k.id ? 'var(--primary)' : 'var(--bg-elevated)',
                color: currentKid?.id === k.id ? '#fff' : 'var(--t2)',
                border: `1px solid ${currentKid?.id === k.id ? 'var(--primary)' : 'var(--border)'}`
              }}
            >
              <span>{k.avatar}</span> <span>{k.name}</span>
            </button>
          ))}
        </div>
      </div>

      {/* Visual Certificate Card */}
      <div style={{maxWidth:860,margin:'0 auto 24px'}}>
        <div style={{
          background:'linear-gradient(180deg, #ffffff 0%, #fffdf7 100%)',
          borderRadius:24,
          padding:'36px 40px',
          border:'12px solid #f59e0b',
          outline:'2px dashed #d97706',
          outlineOffset:'-8px',
          boxShadow:'0 16px 48px -12px rgba(245,158,11,0.25)',
          color:'#0f172a',
          position:'relative',
          textAlign:'center'
        }}>
          <div style={{fontSize:11,fontWeight:800,letterSpacing:'1.5px',color:'#d97706',textTransform:'uppercase',marginBottom:6}}>
            VIDKIDZ ISLAMIC & KIDS ACADEMY

            SERTIFIKAT PRESTASI BELAJAR & HAFALAN

          <div style={{fontSize:12,color:'#64748b',marginBottom:24}}>

          <div style={{fontSize:14,color:'#475569',fontStyle:'italic',marginBottom:12}}>

// FAMILY ART GALLERY (CHILDREN DRAWINGS & COLORING REPOSITORY)
// ============================================================
function FamilyArtGallery({ myKids }) {
  const { state, updateState, showNotif, addLog, currentUser } = useContext(AppCtx);
  const [selectedKidFilter, setSelectedKidFilter] = useState('all');
  const [activePreview, setActivePreview] = useState(null);

  const myKidIds = new Set(myKids.map(k => k.id));
  const drawings = (state.drawingRecords || []).filter(d => myKidIds.has(d.kidId));
  const filteredDrawings = selectedKidFilter === 'all' ? drawings : drawings.filter(d => d.kidId === selectedKidFilter);

  const handleGiveAppreciation = (drawing) => {
    updateState(s => {
      const target = (s.drawingRecords || []).find(d => d.id === drawing.id);
      if (target) {
        target.stars = (target.stars || 0) + 1;
        target.parentPraise = 'Bunda & Ayah sangat bangga dengan karya lukisanmu! Teruslah berkreasi! ⭐';
      }
    });
    addLog(currentUser.name, `Memberikan bintang apresiasi untuk karya seni ${drawing.kidName || 'Anak'}`, 'coin');
    showNotif('⭐ Apresiasi dan bintang berhasil dikirim ke galeri anak!', 'coin');
  };

  const handleDeleteArtwork = (drawingId) => {
    if (!window.confirm('Yakin ingin menghapus lukisan ini dari galeri?')) return;
    updateState(s => {
      s.drawingRecords = (s.drawingRecords || []).filter(d => d.id !== drawingId);
    });
    showNotif('Lukisan telah dihapus dari galeri', 'warn');
  };

  return (
    <div className="fade-in">
      <div className="page-header flex items-center justify-between mb-6" style={{gap:12,flexWrap:'wrap'}}>
        <div>
          <h2 style={{color:'var(--t1)',display:'flex',alignItems:'center',gap:10}}>
            <UiIcon name="palette" size={26} color="var(--primary)" /> Galeri Seni & Mewarnai Anak
          </h2>
          <p style={{color:'var(--t3)',fontSize:13,marginTop:2}}>
            Koleksi karya lukisan dan mewarnai karakter fabel hasil kreasi anak-anak Anda
          </p>
        </div>
        {myKids.length > 1 && (
          <div style={{display:'flex',gap:8,background:'var(--bg-elevated)',padding:4,borderRadius:12,border:'1px solid var(--border)'}}>
            <button className={`btn btn-sm ${selectedKidFilter==='all'?'btn-primary':'btn-ghost'}`} onClick={()=>setSelectedKidFilter('all')}>Semua Anak</button>
            {myKids.map(k => (
              <button key={k.id} className={`btn btn-sm ${selectedKidFilter===k.id?'btn-primary':'btn-ghost'}`} onClick={()=>setSelectedKidFilter(k.id)}>
                {k.avatar} {k.name}
              </button>
            ))}
          </div>
        )}
      </div>

      {filteredDrawings.length === 0 ? (
        <div className="card" style={{textAlign:'center',padding:'60px 20px',borderRadius:20}}>
          <div style={{fontSize:54,marginBottom:12}}>🎨</div>
          <div style={{fontFamily:'var(--font-display)',fontWeight:800,fontSize:18,color:'var(--t1)',marginBottom:6}}>Belum Ada Karya Seni yang Disimpan</div>
          <p style={{fontSize:13,color:'var(--t3)',maxWidth:460,margin:'0 auto 20px'}}>
            Anak-anak dapat membuka menu "Mewarnai 🎨" di Kids Dashboard untuk mulai mewarnai fabel budi pekerti atau melukis di kanvas bebas!
          </p>
        </div>
      ) : (
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(min(280px,100%),1fr))',gap:18}}>
          {filteredDrawings.map(d => {
            const kidObj = myKids.find(k => k.id === d.kidId);
            return (
              <div key={d.id} className="card" style={{borderRadius:18,padding:16,display:'flex',flexDirection:'column',gap:12,background:'var(--bg-card)',border:'1.5px solid var(--border)',transition:'all 0.2s'}}>
                <div style={{position:'relative',borderRadius:12,overflow:'hidden',background:'#fff',border:'1px solid rgba(0,0,0,0.08)',aspectRatio:'4/3',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}
                  onClick={() => setActivePreview(d)}>
                  {d.dataUrl ? (
                    <img src={d.dataUrl} alt={d.title} style={{width:'100%',height:'100%',objectFit:'contain'}} />
                  ) : (
                    <div style={{fontSize:48}}>🎨</div>
                  )}
                  <div style={{position:'absolute',top:8,right:8,background:'rgba(0,0,0,0.6)',backdropFilter:'blur(4px)',borderRadius:8,padding:'3px 8px',fontSize:10,color:'#fff',fontWeight:700}}>
                    🔍 Perbesar
                  </div>
                </div>

                <div>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:4}}>
                    <h3 style={{fontFamily:'var(--font-display)',fontWeight:800,fontSize:16,color:'var(--t1)',margin:0}}>{d.title || 'Karya Mewarnai'}</h3>
                    <div style={{background:'rgba(245,158,11,0.15)',color:'#f59e0b',borderRadius:8,padding:'2px 8px',fontSize:11,fontWeight:800}}>
                      +10 🪙
                    </div>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:'var(--t3)'}}>
                    <span>{kidObj?.avatar || '👦'} {d.kidName || kidObj?.name || 'Anak'}</span>
                    <span>•</span>
                    <span>{d.createdAt ? new Date(d.createdAt).toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' }) : '-'}</span>
                  </div>
                  {d.parentPraise && (
                    <div style={{marginTop:8,background:'rgba(245,158,11,0.08)',border:'1px solid rgba(245,158,11,0.2)',borderRadius:8,padding:'6px 10px',fontSize:11,color:'#f59e0b',fontStyle:'italic'}}>
                      💬 "{d.parentPraise}"
                    </div>
                  )}
                </div>

                <div style={{display:'flex',gap:8,marginTop:'auto'}}>
                  <button className="btn btn-primary btn-sm flex-1" onClick={() => handleGiveAppreciation(d)} style={{justifyContent:'center',display:'inline-flex',alignItems:'center',gap:6}}>
                    <span>⭐</span> Beri Bintang ({d.stars || 0})
                  </button>
                  {d.dataUrl && (
                    <a className="btn btn-ghost btn-sm" href={d.dataUrl} download={`${d.title || 'karya_anak'}.png`} title="Unduh Gambar" style={{padding:'6px 10px'}}>
                      <UiIcon name="download" size={15} />
                    </a>
                  )}
                  <button className="btn btn-ghost btn-sm" onClick={() => handleDeleteArtwork(d.id)} title="Hapus" style={{padding:'6px 10px',color:'var(--danger)'}}>
                    <UiIcon name="trash" size={15} />
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Fullscreen High-Res Modal */}
      {activePreview && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.85)',backdropFilter:'blur(8px)',zIndex:999,display:'flex',alignItems:'center',justifyContent:'center',padding:20}} onClick={() => setActivePreview(null)}>
          <div style={{background:'var(--bg-card)',borderRadius:20,maxWidth:720,width:'100%',padding:24,border:'1px solid var(--border)'}} onClick={e => e.stopPropagation()}>

// FAMILY BEDTIME VOICE STUDIO (PARENT VOICE RECORDER)
// ============================================================
function FamilyBedtimeVoiceStudio({ myKids }) {
  const { state, updateState, showNotif, addLog, currentUser } = useContext(AppCtx);
  const [activeStory, setActiveStory] = useState(null);
  const [isRecording, setIsRecording] = useState(false);
  const [recordSeconds, setRecordSeconds] = useState(0);
  const [recordedAudioUrl, setRecordedAudioUrl] = useState(null);
  const [recordedBlob, setRecordedBlob] = useState(null);

  const mediaRecorderRef = useRef(null);
  const audioChunksRef = useRef([]);
  const timerRef = useRef(null);
  const previewAudioRef = useRef(null);

  const myAudios = (state.parentStoryAudios || []).filter(a => a.familyId === currentUser.id);

  // Clean up timer on unmount
  useEffect(() => {
    return () => {
      if (timerRef.current) clearInterval(timerRef.current);
    };
  }, []);

  const startRecording = async () => {
    try {
      audioChunksRef.current = [];
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const recorder = new MediaRecorder(stream);
      mediaRecorderRef.current = recorder;

      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) audioChunksRef.current.push(e.data);
      };

      recorder.onstop = () => {
        const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
        setRecordedBlob(audioBlob);
        const url = URL.createObjectURL(audioBlob);
        setRecordedAudioUrl(url);
        stream.getTracks().forEach(t => t.stop());
      };

      recorder.start(250);
      setIsRecording(true);
      setRecordSeconds(0);
      timerRef.current = setInterval(() => {
        setRecordSeconds(s => s + 1);
      }, 1000);
      showNotif('🎙️ Perekaman suara dimulai. Silakan bacakan cerita dengan nada hangat.');
    } catch (err) {
      console.error(err);
      showNotif('Izin mikrofon diperlukan untuk merekam suara dongeng.', 'warn');
    }
  };

  const stopRecording = () => {
    if (mediaRecorderRef.current && isRecording) {
      mediaRecorderRef.current.stop();
      setIsRecording(false);
      if (timerRef.current) clearInterval(timerRef.current);
      showNotif('⏹️ Perekaman selesai! Dengarkan pratinjau sebelum menyimpan.');
    }
  };

  const handleSaveRecording = () => {
    if (!recordedBlob || !activeStory) return;
    const reader = new FileReader();
    reader.onloadend = () => {
      const base64Data = reader.result;
      const newAudioRecord = {
        id: `audio_${activeStory.id}_${currentUser.id}`,
        familyId: currentUser.id,
        storyId: activeStory.id,
        storyTitle: activeStory.title,
        recordedBy: currentUser.name,
        audioData: base64Data,
        duration: recordSeconds,
        recordedAt: Date.now()
      };

      updateState(s => {
        const other = (s.parentStoryAudios || []).filter(a => !(a.familyId === currentUser.id && a.storyId === activeStory.id));
        s.parentStoryAudios = [...other, newAudioRecord];
      });

      addLog(currentUser.name, `Menyimpan rekaman suara dongeng: ${activeStory.title}`, 'admin');
      showNotif('🎉 Rekaman suara berhasil disimpan! Anak kini dapat mendengarkan suara Anda.', 'coin');
      setActiveStory(null);
      setRecordedAudioUrl(null);
      setRecordedBlob(null);
      setRecordSeconds(0);
    };
    reader.readAsDataURL(recordedBlob);
  };

  const handleDeleteAudio = (storyId) => {
    if (!window.confirm('Hapus rekaman suara untuk dongeng ini?')) return;
    updateState(s => {
      s.parentStoryAudios = (s.parentStoryAudios || []).filter(a => !(a.familyId === currentUser.id && a.storyId === storyId));
    });
    showNotif('Rekaman suara dihapus', 'warn');
  };

  const formatTime = (sec) => {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
  };

  return (
    <div className="fade-in">
      <div className="page-header flex items-center justify-between mb-6" style={{gap:12,flexWrap:'wrap'}}>
        <div>
          <h2 style={{color:'var(--t1)',display:'flex',alignItems:'center',gap:10}}>
            <UiIcon name="volume" size={26} color="var(--primary)" /> Rekam Suara Dongeng Tidur
          </h2>
          <p style={{color:'var(--t3)',fontSize:13,marginTop:2}}>
            Bacakan dongeng fabel dengan suara asli Ayah atau Bunda agar ananda tidur lelap dengan hangat
          </p>
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(min(320px,100%),1fr))',gap:18}}>
        {STORY_LIST.map(story => {
          const audio = myAudios.find(a => a.storyId === story.id);
          return (
            <div key={story.id} className="card" style={{borderRadius:18,padding:20,display:'flex',flexDirection:'column',gap:14,border:`1.5px solid ${audio?'rgba(16,185,129,0.3)':'var(--border)'}`,background:'var(--bg-card)'}}>
              <div style={{display:'flex',alignItems:'flex-start',gap:14}}>
                <div style={{fontSize:42,background:'rgba(255,255,255,0.05)',borderRadius:16,padding:10}}>{story.emoji}</div>
                <div style={{flex:1}}>
                  <h3 style={{fontFamily:'var(--font-display)',fontWeight:800,fontSize:16,color:'var(--t1)',margin:0,lineHeight:1.3}}>{story.title}</h3>
                  <div style={{fontSize:12,color:'var(--t3)',marginTop:4}}>Karakter: {story.character}</div>
                  <div style={{fontSize:11,color:'var(--primary)',marginTop:2}}>⏱️ {story.durationMinutes} menit membaca</div>
                </div>
              </div>

              {audio ? (
                <div style={{background:'rgba(16,185,129,0.08)',border:'1px solid rgba(16,185,129,0.25)',borderRadius:12,padding:'10px 14px',display:'flex',flexDirection:'column',gap:8}}>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                    <span style={{fontSize:12,fontWeight:700,color:'#10b981',display:'flex',alignItems:'center',gap:6}}>
                      <span>✓</span> Suara Ayah/Bunda Aktif
                    </span>
                    <span style={{fontSize:10,color:'var(--t3)'}}>
                      {new Date(audio.recordedAt).toLocaleDateString('id-ID', { day:'numeric', month:'short' })}
                    </span>
                  </div>
                  <audio controls src={audio.audioData} style={{width:'100%',height:32,marginTop:2}} />
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:4}}>
                    <button className="btn btn-ghost btn-sm" onClick={() => { setActiveStory(story); setRecordedAudioUrl(null); setRecordedBlob(null); }} style={{fontSize:11,padding:'4px 8px',color:'var(--primary)'}}>
                      🎙️ Rekam Ulang
                    </button>
                    <button className="btn btn-ghost btn-sm" onClick={() => handleDeleteAudio(story.id)} style={{fontSize:11,padding:'4px 8px',color:'var(--danger)'}}>
                      🗑️ Hapus
                    </button>
                  </div>
                </div>
              ) : (
                <div style={{background:'rgba(0,120,255,0.04)',border:'1px solid rgba(0,120,255,0.15)',borderRadius:12,padding:'12px',textAlign:'center'}}>
                  <div style={{fontSize:12,color:'var(--t3)',marginBottom:8}}>Belum ada rekaman suara orang tua</div>
                  <button className="btn btn-primary btn-sm" onClick={() => { setActiveStory(story); setRecordedAudioUrl(null); setRecordedBlob(null); }} style={{display:'inline-flex',alignItems:'center',gap:6}}>
                    <UiIcon name="mic" size={14} /> Mulai Rekam Suara
                  </button>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Recording Studio Modal */}
      {activeStory && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.85)',backdropFilter:'blur(8px)',zIndex:999,display:'flex',alignItems:'center',justifyContent:'center',padding:20}} onClick={() => { if (!isRecording) setActiveStory(null); }}>
          <div style={{background:'var(--bg-card)',borderRadius:22,maxWidth:740,width:'100%',padding:24,border:'1.5px solid var(--border)',maxHeight:'90vh',display:'flex',flexDirection:'column'}} onClick={e => e.stopPropagation()}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <span style={{fontSize:28}}>{activeStory.emoji}</span>
                <div>
                  <h3 style={{fontFamily:'var(--font-display)',fontSize:18,fontWeight:800,color:'var(--t1)',margin:0}}>{activeStory.title}</h3>
                  <div style={{fontSize:12,color:'var(--t3)',marginTop:2}}>Bacakan paragraf di bawah dengan tenang dan ekspresif</div>
                </div>
              </div>
              {!isRecording && (
                <button className="btn btn-ghost btn-sm" onClick={() => setActiveStory(null)} style={{fontSize:18}}>✕</button>
              )}
            </div>

            {/* Scrollable Story Text */}
            <div style={{flex:1,overflowY:'auto',background:'rgba(255,255,255,0.03)',borderRadius:14,padding:18,marginBottom:18,border:'1px solid var(--border)',lineHeight:1.8,fontSize:15,color:'var(--t1)'}}>
              {activeStory.paragraphs.map((p, idx) => (
                <p key={idx} style={{marginBottom:14,textIndent:20}}>{p}</p>
              ))}
              <div style={{background:'rgba(245,158,11,0.1)',borderLeft:'4px solid #f59e0b',padding:'10px 14px',borderRadius:8,fontSize:13,color:'#fbbf24',fontStyle:'italic'}}>
                💡 Pesan Moral: "{activeStory.moralLearned}"
              </div>
            </div>

            {/* Recording Controls */}
            <div style={{background:'var(--bg-elevated)',borderRadius:16,padding:16,display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
              <div style={{display:'flex',alignItems:'center',gap:12}}>
                <div style={{width:14,height:14,borderRadius:'50%',background:isRecording?'#ef4444':'#64748b',animation:isRecording?'pulse 1.2s infinite':'none'}} />

                  {formatTime(recordSeconds)}
                </div>
                {isRecording && <span style={{fontSize:12,color:'#ef4444',fontWeight:700}}>Sedang Merekam...</span>}

              <div style={{display:'flex',alignItems:'center',gap:10}}>
                {!isRecording && !recordedAudioUrl && (
                  <button className="btn btn-primary" onClick={startRecording} style={{background:'#ef4444',borderColor:'#ef4444',display:'inline-flex',alignItems:'center',gap:8}}>
                    <UiIcon name="mic" size={16} /> Mulai Rekam

                )}

                  <button className="btn btn-primary" onClick={stopRecording} style={{background:'#10b981',borderColor:'#10b981',display:'inline-flex',alignItems:'center',gap:8}}>
                    <span>⏹️</span> Selesai Merekam

                {!isRecording && recordedAudioUrl && (
                  <>
                    <button className="btn btn-ghost" onClick={startRecording} style={{display:'inline-flex',alignItems:'center',gap:6}}>
                      <UiIcon name="refresh" size={15} /> Rekam Ulang
                    </button>
                    <audio ref={previewAudioRef} src={recordedAudioUrl} controls style={{height:36}} />
                    <button className="btn btn-primary" onClick={handleSaveRecording} style={{display:'inline-flex',alignItems:'center',gap:8,background:'linear-gradient(135deg,#10b981,#059669)',borderColor:'#059669'}}>
                      <span>💾</span> Simpan Suara

            </div>
          </div>
        </div>
      )}
    </div>
  );
}

    showNotif(`Layar ${kid?.name} ${kid?.isLocked?'dibuka':'dikunci'}`);
  };

  const deleteKid = (kidId) => {
    const kid = myKids.find(k=>k.id===kidId);
    if (!kid) return;
    updateState(s => {
      s.users.kids = s.users.kids.filter(k=>k.id!==kidId);
      const fam = s.users.families.find(f=>f.id===currentUser.id);
      if (fam) fam.linkedKids = (fam.linkedKids||[]).filter(id=>id!==kidId);
      s.redemptions = (s.redemptions||[]).filter(r=>r.kidId!==kidId);
    });
    addLog(currentUser.name, `Menghapus anak: ${kid.name}`, 'edit');
    showNotif('Data anak dihapus');
  };

  const pendingRedemptions = state.redemptions.filter(r => {
    const reward = state.rewards.find(rw=>rw.id===r.rewardId);
    return r.status==='pending' && reward && myKids.find(k=>k.id===r.kidId);
  });

  return (

      <nav className="sidebar">

          <img src="/logo-mark.png" alt="VIDKIDZ" />

            <div className="sidebar-brand-title">VIDKIDZ</div>

          </div>
        </div>
        {!isTestPreview && (

            {myKids.map(kid => (
              <div key={kid.id} className={`nav-item kid-picker-item ${selectedKidId===kid.id||(!selectedKidId&&myKids[0]?.id===kid.id)?'active-family':''}`} onClick={()=>setSelectedKidId(kid.id)}>

        <div className="nav-sep" />
        <div className="nav-label">Menu</div>
        {navItems.map(n => (

      </div>

      {modal?.type==='addKid' && <AddKidModal familyId={currentUser.id} onClose={()=>setModal(null)} />}

function FamilyKidsManager({ myKids, selectedKidId, setSelectedKidId, setPage, setModal, setConfirm, toggleLock, deleteKid, launchKidSession }) {
  const totalCoins = myKids.reduce((s,k)=>s+(k.coins||0),0);
  const onlineKids = myKids.filter(k=>k.isOnline).length;
  const lockedKids = myKids.filter(k=>k.isLocked).length;
  return (
    <div className="fade-in">
      <div className="page-header flex items-center justify-between mb-6" style={{gap:12,flexWrap:'wrap'}}>
        <div>
          <h2 style={{color:'var(--t1)',display:'flex',alignItems:'center',gap:8}}>
            <UiIcon name="users" size={20} color="var(--primary)" /> Manajemen Anak
          </h2>
          <p style={{color:'var(--t3)',fontSize:12,marginTop:2}}>Kontrol profil, PIN, kunci perangkat, dan akses Kids dari dashboard Family.</p>
        </div>
        <button className="btn btn-family" onClick={()=>setModal({type:'addKid'})} style={{display:'inline-flex',alignItems:'center',gap:6}}>
          <UiIcon name="plus" size={14} /> Tambah Anak
        </button>
      </div>

      <div className="dashboard-stats" style={{display:'grid',gridTemplateColumns:'repeat(4,minmax(0,1fr))',gap:16,marginBottom:24}}>
        <StatCard label="Total Anak" value={myKids.length} icon="ui:users" color="var(--primary)" />
        <StatCard label="Online" value={onlineKids} icon="ui:activity" color="var(--primary)" />
        <StatCard label="Terkunci" value={lockedKids} icon="ui:lock" color="var(--primary)" />
        <StatCard label="Total Koin" value={totalCoins} icon="ui:coin" color="var(--primary)" />
      </div>

      <div className="card">
        <table>
          <thead><tr><th>Anak</th><th>Usia</th><th>Koin</th><th>Streak</th><th>Status</th><th>Akses Kids</th><th>Aksi</th></tr></thead>
          <tbody>
            {myKids.map(kid => (
              <tr key={kid.id}>
                <td>
                  <div className="flex items-center gap-2">
                    <span style={{fontSize:22}}>{kid.avatar}</span>
                    <div>
                      <div style={{fontWeight:700,color:'var(--t1)'}}>{kid.name}</div>
                      <div style={{fontSize:10,color:'var(--t4)'}}>ID: {kid.id}</div>
                    </div>
                  </div>
                </td>
                <td>{kid.age} tahun</td>
                <td><span className="badge badge-coin">🪙 {kid.coins||0}</span></td>
                <td><span style={{color:'var(--warn)',fontWeight:700}}>🔥 {kid.streak||0}</span></td>
                <td><div className="flex gap-1 flex-wrap"><span className={`badge ${kid.isOnline?'badge-success':'badge-gray'}`}>{kid.isOnline?'Online':'Offline'}</span>{kid.isLocked&&<span className="badge badge-danger"><UiIcon name="lock" size={11} /></span>}</div></td>
                <td><button className="btn btn-primary btn-sm" onClick={()=>launchKidSession(kid.id)}>Buka Kids</button></td>
                <td>
                  <div className="flex gap-1">
                    <button className="btn btn-icon btn-sm" title="Pilih anak" onClick={()=>setSelectedKidId(kid.id)}><UiIcon name="check" size={14} /></button>
                    <button className="btn btn-icon btn-sm" title="Edit profil" onClick={()=>setModal({type:'editKid',data:kid})}><UiIcon name="edit" size={14} /></button>
                    <button className={`btn btn-sm ${kid.isLocked?'btn-family':'btn-danger'}`} title={kid.isLocked?'Buka kunci':'Kunci'} onClick={()=>toggleLock(kid.id)}><UiIcon name={kid.isLocked?'unlock':'lock'} size={14} /></button>
                    <button className="btn btn-icon btn-sm" title="Monitor" onClick={()=>{setSelectedKidId(kid.id);setPage('monitor');}}><UiIcon name="eye" size={14} /></button>
                    <button className="btn btn-icon btn-sm" title="Hapus" onClick={()=>setConfirm({msg:`Hapus anak "${kid.name}"?`,fn:()=>deleteKid(kid.id)})}><UiIcon name="trash" size={14} /></button>

              </tr>

            {myKids.length===0 && <tr><td colSpan={7} style={{textAlign:'center',color:'var(--t3)',padding:'34px 0'}}>Belum ada anak. Tambahkan anak dari dashboard Family.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function FamilyCoinsPanel({ myKids }) {
  const { state, updateState, showNotif, currentUser, addLog } = useContext(AppCtx);
  const [modal, setModal] = useState(null);
  const [tab, setTab] = useState('rewards');

  const myRewards = state.rewards.filter(r => r.familyId === currentUser.id);
  const pendingRedemptions = state.redemptions.filter(r => {
    const reward = state.rewards.find(rw=>rw.id===r.rewardId);
    return reward?.familyId === currentUser.id;
  });

  const approveRedemption = (redId) => {
    const red = state.redemptions.find(r=>r.id===redId);
    if (!red) return;
    updateState(s => {
      const r = s.redemptions.find(x=>x.id===redId);
      if (r) r.status = 'approved';
    });
    addLog(currentUser.name, `Menyetujui klaim "${red.rewardName}" oleh ${red.kidName}`, 'coin');
    showNotif(`Klaim ${red.rewardName} disetujui! 🎉`);
  };

  const rejectRedemption = (redId) => {
    const red = state.redemptions.find(r=>r.id===redId);
    if (!red) return;
    updateState(s => {
      const r = s.redemptions.find(x=>x.id===redId);
      if (r) r.status = 'rejected';
      // refund coins
      const k = s.users.kids.find(u=>u.id===red.kidId);
      if (k) k.coins = (k.coins||0) + red.cost;
    });
    showNotif(`Klaim ditolak, koin dikembalikan`,'warn');
  };

  const addReward = (form) => {
    updateState(s => { s.rewards.push({ ...form, id:uid(), familyId:currentUser.id, active:true }); });
    showNotif('Hadiah berhasil ditambahkan! 🎁');
  };

  return (
    <div className="fade-in">
      <div className="page-header flex items-center justify-between mb-6" style={{gap:12,flexWrap:'wrap'}}>
        <div>
          <h2 style={{color:'var(--t1)',display:'flex',alignItems:'center',gap:8}}>
            <UiIcon name="coin" size={20} color="var(--primary)" /> Sistem Koin & Hadiah
          </h2>
          <p style={{color:'var(--t3)',fontSize:12,marginTop:2}}>Kelola koin anak dan daftar hadiah yang bisa ditukar</p>
        </div>
        <button className="btn btn-coin" onClick={()=>setModal({type:'addReward'})} style={{display:'inline-flex',alignItems:'center',gap:6}}>
          <UiIcon name="plus" size={14} /> Tambah Hadiah
        </button>
      </div>

      {/* Coin summary */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:16,marginBottom:24}}>
        {myKids.map(kid => (
          <div key={kid.id} style={{background:'linear-gradient(135deg, rgba(255,190,26,0.1), rgba(250,204,21,0.05))',border:'1.5px solid rgba(255,190,26,0.25)',borderRadius:16,padding:16,textAlign:'center'}}>
            <div style={{fontSize:32}}>{kid.avatar}</div>
            <div style={{fontFamily:'var(--font-display)',fontWeight:800,fontSize:14,color:'var(--t1)',marginTop:6}}>{kid.name}</div>
            <div className="coin-badge" style={{marginTop:8,justifyContent:'center',display:'inline-flex',alignItems:'center',gap:6}}>
              <UiIcon name="coin" size={14} color="currentColor" /> {kid.coins||0}
            </div>
            <div style={{fontSize:11,color:'var(--t3)',marginTop:6,display:'flex',alignItems:'center',justifyContent:'center',gap:4}}>
              <UiIcon name="flame" size={13} color="var(--primary)" /> {kid.streak||0} hari streak
            </div>
          </div>
        ))}
      </div>

      {/* Tabs */}
      <div style={{display:'flex',gap:8,marginBottom:16}}>
        {[
          {id:'rewards',label:'Daftar Hadiah',icon:'gift'},
          {id:'pending',label:`Klaim Pending (${pendingRedemptions.filter(r=>r.status==='pending').length})`,icon:'clock'},
          {id:'history',label:'Riwayat',icon:'clipboard'}
        ].map(t => (
          <button key={t.id} className={`btn ${tab===t.id?'btn-family':'btn-ghost'} btn-sm`} onClick={()=>setTab(t.id)} style={{display:'inline-flex',alignItems:'center',gap:6}}>
            <UiIcon name={t.icon} size={14} color="currentColor" />
            <span>{t.label}</span>
          </button>
        ))}
      </div>

      {tab==='rewards' && (
        <div>
          {myRewards.length === 0 ? (
            <div className="card" style={{textAlign:'center',padding:'40px 0',color:'var(--t3)'}}>
              <div style={{marginBottom:12,display:'flex',justifyContent:'center'}}><UiIcon name="gift" size={48} color="var(--primary)" /></div>
              <div>Belum ada hadiah. Tambahkan hadiah agar anak termotivasi!</div>
            </div>
          ) : (
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:16}}>
              {myRewards.map(reward => (
                <div key={reward.id} className="reward-card">
                  <div style={{fontSize:40,marginBottom:8}}>{reward.emoji}</div>
                  <div style={{fontFamily:'var(--font-display)',fontWeight:700,color:'var(--t1)',fontSize:14}}>{reward.name}</div>
                  <div className="coin-badge" style={{marginTop:10,justifyContent:'center',fontSize:16,display:'inline-flex',alignItems:'center',gap:6}}>
                    <UiIcon name="coin" size={16} color="currentColor" /> {reward.cost}
                  </div>
                  <div style={{fontSize:11,color:'var(--t3)',marginTop:6}}>
                    <span className={`badge ${reward.type==='money'?'badge-success':reward.type==='toy'?'badge-kids':'badge-primary'}`}>{reward.type}</span>
                  </div>
                  <button className="btn btn-danger btn-sm" style={{marginTop:10,width:'100%',justifyContent:'center',display:'inline-flex',alignItems:'center',gap:6}} onClick={()=>{
                    updateState(s=>{s.rewards=s.rewards.filter(r=>r.id!==reward.id)});
                    showNotif('Hadiah dihapus');
                  }}><UiIcon name="trash" size={14} /> Hapus</button>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {tab==='pending' && (
        <div>
          {pendingRedemptions.filter(r=>r.status==='pending').length === 0 ? (
            <div className="card" style={{textAlign:'center',padding:'40px 0',color:'var(--t3)'}}><div style={{fontSize:48,marginBottom:12}}>✅</div><div>Tidak ada klaim yang perlu disetujui</div></div>
          ) : (
            pendingRedemptions.filter(r=>r.status==='pending').map(red => {
              const kid = myKids.find(k=>k.id===red.kidId);
              const reward = state.rewards.find(r=>r.id===red.rewardId);
              return (
                <div key={red.id} className="card" style={{marginBottom:12,border:'1.5px solid rgba(255,190,26,0.3)'}}>
                  <div className="flex items-center gap-4">
                    <div style={{fontSize:36}}>{reward?.emoji||'🎁'}</div>
                    <div style={{flex:1}}>
                      <div style={{fontFamily:'var(--font-display)',fontWeight:700,color:'var(--t1)',fontSize:15}}>{red.rewardName}</div>
                      <div style={{fontSize:12,color:'var(--t3)'}}>Diminta oleh: {kid?.avatar} {red.kidName} · {timeAgo(red.requestedAt)}</div>
                      <div className="coin-badge" style={{marginTop:6}}>🪙 {red.cost} koin</div>
                    </div>
                    <div style={{display:'flex',gap:8}}>
                      <button className="btn btn-family btn-sm" onClick={()=>approveRedemption(red.id)}>✅ Setujui</button>
                      <button className="btn btn-danger btn-sm" onClick={()=>rejectRedemption(red.id)}>✕ Tolak</button>
                    </div>
                  </div>
                </div>
              );
            })
          )}
        </div>
      )}

      {tab==='history' && (
        <div className="card">
          <table>
            <thead><tr><th>Anak</th><th>Hadiah</th><th>Koin</th><th>Status</th><th>Waktu</th></tr></thead>
            <tbody>
              {pendingRedemptions.map(red => (
                <tr key={red.id}>
                  <td><span style={{fontWeight:600,color:'var(--t1)'}}>{red.kidName}</span></td>
                  <td>{red.rewardName}</td>
                  <td><span className="badge badge-coin">🪙 {red.cost}</span></td>
                  <td><span className={`badge ${red.status==='approved'?'badge-success':red.status==='rejected'?'badge-danger':'badge-warn'}`}>{red.status}</span></td>
                  <td style={{fontSize:11,color:'var(--t3)'}}>{timeAgo(red.requestedAt)}</td>
                </tr>
              ))}
              {pendingRedemptions.length===0 && <tr><td colSpan={5} style={{textAlign:'center',color:'var(--t3)',padding:'30px 0'}}>Belum ada riwayat</td></tr>}
            </tbody>
          </table>
        </div>
      )}

      {modal?.type==='addReward' && (
        <Modal open title="🎁 Tambah Hadiah Baru" onClose={()=>setModal(null)}>
          <AddRewardForm onSave={f=>{addReward(f);setModal(null);}} onClose={()=>setModal(null)} />
        </Modal>
      )}
    </div>
  );
}

function FamilyPhotoGallery() {
  const { state, updateState, currentUser, showNotif, addLog } = useContext(AppCtx);
  const [selectedAlbumId, setSelectedAlbumId] = useState(null);
  const [modal, setModal] = useState(null);
  const photoAlbums = (state.photoAlbums || []).filter(a => a.familyId === currentUser.id);
  const selectedAlbum = photoAlbums.find(a => a.id === selectedAlbumId) || photoAlbums[0];

  const addAlbum = (form) => {
    const album = {
      id: uid(),
      familyId: currentUser.id,
      name: form.name,
      description: form.description,
      cover: form.cover,
      createdAt: now(),
      photos: []
    };
    updateState(s => {
      if (!Array.isArray(s.photoAlbums)) s.photoAlbums = [];
      s.photoAlbums.unshift(album);
    });
    setSelectedAlbumId(album.id);
    addLog(currentUser.name, `Membuat album foto "${form.name}"`, 'photo');
    showNotif('Album foto berhasil dibuat');
    setModal(null);
  };

  const addPhoto = (albumId, form) => {
    updateState(s => {
      if (!Array.isArray(s.photoAlbums)) s.photoAlbums = [];
      const album = s.photoAlbums.find(a => a.id === albumId && a.familyId === currentUser.id);
      if (!album) return;
      if (!Array.isArray(album.photos)) album.photos = [];
      album.photos.unshift({
        id: uid(),
        title: form.title,
        caption: form.caption,
        src: form.src,
        color: form.color,
        emoji: form.emoji,
        createdAt: now()
      });
    });
    addLog(currentUser.name, `Menambah foto ke album kenangan`, 'photo');
    showNotif('Foto kenangan ditambahkan');
    setModal(null);
  };

  const deletePhoto = (albumId, photoId) => {
    updateState(s => {
      const album = (s.photoAlbums || []).find(a => a.id === albumId && a.familyId === currentUser.id);
      if (album) album.photos = (album.photos || []).filter(p => p.id !== photoId);
    });
    showNotif('Foto dihapus');
  };

  return (
    <div className="fade-in">
      <div className="page-header flex items-center justify-between mb-6" style={{gap:12,flexWrap:'wrap'}}>
        <div>
          <h2 style={{color:'var(--t1)'}}>Foto Keluarga</h2>
          <p style={{color:'var(--t3)',fontSize:12,marginTop:2}}>Galeri album kenangan dan momen keluarga</p>
        </div>
        <button className="btn btn-family" onClick={()=>setModal({type:'album'})}>+ Album</button>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1.25fr',gap:18}}>
        <div>
          <div style={{display:'grid',gap:12}}>
            {photoAlbums.length ? photoAlbums.map(album => (
              <div key={album.id} className="photo-album-card" onClick={()=>setSelectedAlbumId(album.id)} style={{borderRadius:20,padding:12,cursor:'pointer',border:selectedAlbum?.id===album.id?'2px solid var(--primary)':'1px solid var(--border)',transition:'all 0.18s'}}>
                <div className="photo-cover" style={{'--photo-color':album.cover || '#0aa7e5',minHeight:112}}>
                  {(album.photos || [])[0]?.src ? <img src={album.photos[0].src} alt={album.name} /> : <div className="photo-cover-emoji">FOTO</div>}
                  <div className="photo-count-badge">{(album.photos||[]).length} foto</div>
                </div>
                <div style={{padding:'12px 4px 2px'}}>
                  <div style={{fontFamily:'var(--font-display)',fontWeight:900,color:'var(--t1)',fontSize:15}}>{album.name}</div>
                  <div style={{fontSize:12,color:'var(--t3)',marginTop:2,lineHeight:1.35}}>{album.description || 'Album kenangan keluarga'}</div>
                </div>
              </div>
            )) : (
              <div className="card" style={{textAlign:'center',padding:28}}>
                <div style={{fontSize:44,marginBottom:10}}>📷</div>
                <div style={{fontWeight:800,color:'var(--t1)',fontFamily:'var(--font-display)'}}>Belum ada album foto</div>
                <div style={{fontSize:12,color:'var(--t3)',marginTop:4}}>Buat album pertama untuk momen keluarga</div>
              </div>
            )}
          </div>
        </div>

        <div className="card" style={{minHeight:420}}>
          {selectedAlbum ? (
            <>
              <div className="flex items-center justify-between mb-4">
                <div>
                  <h3 style={{color:'var(--t1)'}}>{selectedAlbum.name}</h3>
                  <p style={{fontSize:12,color:'var(--t3)',marginTop:2}}>{selectedAlbum.description || 'Album kenangan keluarga'}</p>
                </div>
                <button className="btn btn-primary btn-sm" onClick={()=>setModal({type:'photo', albumId:selectedAlbum.id})}>+ Foto</button>
              </div>
              {(selectedAlbum.photos || []).length ? (
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(150px,1fr))',gap:12}}>
                  {selectedAlbum.photos.map(photo => (
                    <div key={photo.id} className="photo-memory-card" style={{borderRadius:18,padding:10,position:'relative'}}>
                      <div className="photo-cover" style={{'--photo-color':photo.color || selectedAlbum.cover || '#0aa7e5',minHeight:132}}>
                        {photo.src ? <img src={photo.src} alt={photo.title} /> : <div className="photo-cover-emoji">{photo.emoji || '\u{1F4F7}'}</div>}
                      </div>
                      <div style={{padding:'10px 2px 2px'}}>
                        <div style={{fontFamily:'var(--font-display)',fontWeight:800,color:'var(--t1)',fontSize:13}}>{photo.title}</div>
                        <div style={{fontSize:11,color:'var(--t3)',lineHeight:1.35,marginTop:3}}>{photo.caption || 'Momen keluarga'}</div>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:8}}>
                          <span style={{fontSize:10,color:'var(--t4)'}}>{timeAgo(photo.createdAt)}</span>
                          <button className="btn btn-ghost btn-sm" onClick={()=>deletePhoto(selectedAlbum.id, photo.id)} style={{padding:'3px 8px',fontSize:10}}>Hapus</button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
                <div style={{textAlign:'center',padding:'70px 0',color:'var(--t3)'}}>
                  <div style={{fontSize:20,marginBottom:12,fontFamily:'var(--font-display)',fontWeight:900}}>FOTO</div>
                  <div style={{fontFamily:'var(--font-display)',fontWeight:800,color:'var(--t1)'}}>Album ini masih kosong</div>
                  <div style={{fontSize:12,marginTop:4}}>Tambahkan foto keluarga pertama</div>
                </div>
              )}
            </>
          ) : (
            <div style={{textAlign:'center',padding:'70px 0',color:'var(--t3)'}}>Pilih atau buat album foto</div>
          )}
        </div>
      </div>

      {modal?.type === 'album' && <Modal open title="Album Foto Baru" onClose={()=>setModal(null)}><AddPhotoAlbumForm onSave={addAlbum} onClose={()=>setModal(null)} /></Modal>}
      {modal?.type === 'photo' && <Modal open title="Tambah Foto Kenangan" onClose={()=>setModal(null)}><AddPhotoForm onSave={(form)=>addPhoto(modal.albumId, form)} onClose={()=>setModal(null)} /></Modal>}
    </div>
  );
}

function AddPhotoForm({ onSave, onClose }) {
  const [form, setForm] = useState({ title:'', caption:'', src:'', color:'#0aa7e5', emoji:'\u{1F4F7}' });
  const [reading, setReading] = useState(false);
  const handleFile = (file) => {
    if (!file) return;
    if (!file.type.startsWith('image/')) return;
    setReading(true);
    const reader = new FileReader();
    reader.onload = () => {
      setForm(prev => ({ ...prev, src: reader.result }));
      setReading(false);
    };

  };
  return (

        {reading && <div style={{fontSize:11,color:'var(--t3)',marginTop:6}}>Membaca foto...</div>}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 92px',gap:10,marginBottom:14}}>

          <label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:5,fontFamily:'var(--font-display)'}}>Judul</label>

        </div>
        <div>
          <label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:5,fontFamily:'var(--font-display)'}}>Ikon</label>
          <input value={form.emoji} maxLength="4" onChange={e=>setForm({...form,emoji:e.target.value})} />
        </div>
      </div>
      <div style={{marginBottom:18}}>

      </div>
      <div className="flex gap-3 justify-end">

        <button className="btn btn-primary" onClick={()=>form.title && onSave(form)} disabled={!form.title || reading}>Simpan Foto</button>
      </div>
    </>
  );
}

function FamilyScheduleModal({ kid, onClose }) {
  const { updateState, addLog, currentUser, showNotif } = useContext(AppCtx);
  const [enabled, setEnabled] = useState(kid.schedule?.enabled ?? false);
  const [lockStart, setLockStart] = useState(kid.schedule?.lockStart || '21:00');
  const [lockEnd, setLockEnd] = useState(kid.schedule?.lockEnd || '07:00');

  const applyPreset = (start, end) => {
    setLockStart(start);
    setLockEnd(end);
    setEnabled(true);
  };

  const handleSave = () => {
    const updatedSchedule = { enabled, lockStart, lockEnd };
    updateState(s => {
      const k = s.users.kids.find(u => u.id === kid.id);
      if (k) k.schedule = updatedSchedule;
    });
    addLog(
      currentUser.name,
      `Jadwal istirahat ${kid.name} diperbarui (${enabled ? `${lockStart} - ${lockEnd}` : 'Nonaktif'})`,
      'control'
