<script>

// ============================================================
// API CLIENT — Full Stack Integration
// ============================================================
const API_BASE = '';
const TOKEN_KEY = 'vidkidzToken';
const SESSION_META_KEY = 'vidkidzSessionMeta';
const SESSION_TTL_MS = 30 * 24 * 60 * 60 * 1000;
const decodeJwtPayload = (token) => {
  try {
    let payload = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    while (payload.length % 4) payload += '=';
    return JSON.parse(atob(payload));
  } catch(e) { return null; }
};
const getToken = () => {
  const token = localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY);
  const payload = token ? decodeJwtPayload(token) : null;
  let meta = null;
  try { meta = JSON.parse(localStorage.getItem(SESSION_META_KEY) || sessionStorage.getItem(SESSION_META_KEY) || 'null'); } catch(e) { meta = null; }
  const tokenExpiresAt = payload?.exp ? payload.exp * 1000 : 0;
  if (!token || !payload || !tokenExpiresAt || Date.now() > tokenExpiresAt) {
    clearToken();
    return null;
  }
  if (!meta?.expiresAt) {
    meta = {
      firstLoginAt: payload.iat ? payload.iat * 1000 : Date.now(),
      expiresAt: tokenExpiresAt,
      role: payload.role || null
    };
    localStorage.setItem(SESSION_META_KEY, JSON.stringify(meta));
  }
  if (Date.now() > meta.expiresAt) {
    clearToken();
    return null;
  }
  if (!localStorage.getItem(TOKEN_KEY)) localStorage.setItem(TOKEN_KEY, token);
  if (!localStorage.getItem(SESSION_META_KEY)) localStorage.setItem(SESSION_META_KEY, JSON.stringify(meta));
  return token;
};
const setToken = (t) => {
  const payload = decodeJwtPayload(t);
  const expiresAt = payload?.exp ? payload.exp * 1000 : Date.now() + SESSION_TTL_MS;
  localStorage.setItem(TOKEN_KEY, t);
  localStorage.setItem(SESSION_META_KEY, JSON.stringify({
    firstLoginAt: Date.now(),
    expiresAt,
    role: payload?.role || null
  }));
  sessionStorage.setItem(TOKEN_KEY, t);
  sessionStorage.setItem(SESSION_META_KEY, localStorage.getItem(SESSION_META_KEY));
};
const clearToken = () => {
  sessionStorage.removeItem(TOKEN_KEY);
  sessionStorage.removeItem(SESSION_META_KEY);
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(SESSION_META_KEY);
};
async function apiFetch(path, options={}) {
  const token = getToken();
  const headers = { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) };
  const res = await fetch(API_BASE + path, { ...options, headers: { ...headers, ...(options.headers||{}) } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
  return data;
}

@keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes scanLine { 0% { top: 0; } 100% { top: 100%; } }
@keyframes glow { 0%,100% { box-shadow: 0 0 8px rgba(255,95,125,0.5); } 50% { box-shadow: 0 0 20px rgba(255,95,125,0.9); } }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes bounce { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
@keyframes coinPop { 0% { transform: scale(0) rotate(-20deg); opacity: 0; } 60% { transform: scale(1.3) rotate(5deg); opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes starBurst { 0% { transform: scale(0) rotate(0); opacity: 0; } 50% { transform: scale(1.4); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@keyframes confetti { 0% { transform: translateY(-10px) rotate(0); opacity: 1; } 100% { transform: translateY(80px) rotate(360deg); opacity: 0; } }
@keyframes recordPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,95,125,0.6); } 50% { box-shadow: 0 0 0 10px rgba(255,95,125,0); } }

.fade-in { animation: fadeIn 0.25s ease forwards; }
.slide-in { animation: slideIn 0.25s ease forwards; }
.slide-up { animation: slideUp 0.3s ease forwards; }
.animate-pulse { animation: pulse 2s ease-in-out infinite; }
.animate-spin { animation: spin 1s linear infinite; }
.animate-glow { animation: glow 1.5s ease-in-out infinite; }
.animate-float { animation: float 3s ease-in-out infinite; }
.animate-bounce { animation: bounce 0.6s ease-in-out infinite; }
.animate-coin { animation: coinPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
.animate-star { animation: starBurst 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
.animate-shake { animation: shake 0.4s ease; }
.recording-dot { animation: recordPulse 1.5s ease-in-out infinite; }

.avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 13px; }
.progress { background: var(--border); border-radius: 10px; height: 6px; overflow: hidden; }
.progress-bar { height: 100%; border-radius: 10px; transition: width 0.5s ease; }
.tooltip-wrap { position: relative; }
.tooltip { position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%); background: var(--bg-elevated); border: 1px solid var(--border-light); color: var(--t1); font-size: 11px; padding: 5px 10px; border-radius: 6px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 100; }
.tooltip-wrap:hover .tooltip { opacity: 1; }

.album-card { background: var(--bg-card); border: 2px solid var(--border); border-radius: 18px; overflow: hidden; cursor: pointer; transition: all 0.25s; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; position: relative; }
.album-card:hover { transform: translateY(-4px) scale(1.02); border-color: var(--primary); box-shadow: 0 12px 30px rgba(0,120,255,0.24); }

/* ===== GAME CARDS ===== */
.game-card {
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  cursor: pointer;
  transition: all 0.25s;
  position: relative;
  overflow: hidden;
  text-align: center;
}
.game-card:hover { transform: translateY(-6px) scale(1.02); box-shadow: 0 16px 40px rgba(0,0,0,0.4); }
.game-card::before { content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity 0.25s; }
.game-card:hover::before { opacity: 1; }

/* ===== COIN DISPLAY ===== */
.coin-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: linear-gradient(135deg, rgba(255,190,26,0.2), rgba(250,204,21,0.1));
  border: 1.5px solid rgba(255,190,26,0.4);
  border-radius: 30px;
  padding: 6px 14px;
  font-family: var(--font-display);
  font-weight: 800;
  color: var(--coin);
  font-size: 15px;
}
.coin-icon { font-size: 20px; }

/* ===== KIDS HEADER ===== */
.kids-header {
  background: rgba(7,9,15,0.8);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 10;
}

/* ===== GAME ANSWER BUTTONS ===== */
.answer-btn {
  background: rgba(255,255,255,0.06);
  border: 2px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 16px 20px;
  font-family: var(--font-kids);
  font-size: 16px;
  color: #fff;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  width: 100%;
}
.answer-btn:hover { background: rgba(0,120,255,0.22); border-color: var(--primary); transform: scale(1.02); }
.answer-btn.correct { background: rgba(34,197,94,0.25); border-color: var(--success); color: var(--success); }
.answer-btn.wrong { background: rgba(255,95,125,0.2); border-color: var(--danger); color: var(--danger); animation: shake 0.4s ease; }

/* ===== HAFALAN CARD ===== */
.hafalan-card {
  background: linear-gradient(135deg, rgba(0,120,255,0.13), rgba(31,182,255,0.06));
  border: 1.5px solid rgba(0,120,255,0.22);
  border-radius: 16px;
  padding: 16px 20px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 16px;
}
.hafalan-card:hover { border-color: var(--primary); background: rgba(0,120,255,0.16); transform: translateX(4px); }
.hafalan-card.done { border-color: rgba(34,197,94,0.4); background: rgba(34,197,94,0.08); }

/* ===== REWARD CARD ===== */
.reward-card {
  background: linear-gradient(135deg, rgba(255,190,26,0.08), rgba(250,204,21,0.04));
  border: 1.5px solid rgba(255,190,26,0.22);
  border-radius: 16px;
  padding: 16px;
  text-align: center;
  transition: all 0.2s;
}
.reward-card:hover { border-color: var(--coin); transform: translateY(-2px); }

/* ===== MONITORING ===== */
.monitor-dot { width: 8px; height: 8px; border-radius: 50%; }
.monitor-dot.active { background: var(--danger); animation: pulse 1s ease-in-out infinite; }
.monitor-dot.inactive { background: var(--t3); }
.lock-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.97); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
.cam-overlay { position: absolute; inset: 0; pointer-events: none; }
.cam-corner { position: absolute; width: 20px; height: 20px; border-color: var(--family); border-style: solid; }
.cam-corner.tl { top: 10px; left: 10px; border-width: 2px 0 0 2px; }
.cam-corner.tr { top: 10px; right: 10px; border-width: 2px 2px 0 0; }
.cam-corner.bl { bottom: 10px; left: 10px; border-width: 0 0 2px 2px; }
.cam-corner.br { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; }
.scan-line { position: absolute; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--family), transparent); animation: scanLine 2.5s linear infinite; opacity: 0.6; }
.terminal { background: #020b1f; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; font-family: 'Courier New', monospace; font-size: 12px; color: #9bdcff; line-height: 2; }
.terminal .t-green { color: var(--success); }
.terminal .t-yellow { color: var(--admin); }
.terminal .t-red { color: var(--danger); }
.terminal .t-gray { color: var(--t3); }
.terminal .prompt::before { content: '→ '; color: var(--primary); }
.notif { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; background: var(--bg-elevated); border: 1px solid var(--border-light); border-radius: var(--radius-sm); padding: 12px 18px; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow); animation: fadeIn 0.2s ease; width: min(390px, calc(100vw - 28px)); }
.demo-timer {
  position: fixed;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9997;
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(3,17,44,0.88);
  border: 1px solid rgba(255,190,26,0.36);
  border-radius: 12px;
  padding: 9px 12px;
  width: min(390px, calc(100vw - 28px));
  justify-content: center;
  box-shadow: 0 12px 30px rgba(0,0,0,0.34);
  backdrop-filter: blur(12px);
  color: var(--coin);
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 12px;
}
.demo-timer span {
  color: var(--t2);
  font-weight: 700;
}
.demo-timer strong {
  font-size: 14px;
  color: var(--coin);
}
.install-prompt {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  z-index: 9998;
  width: min(420px, calc(100vw - 28px));
  background: rgba(7,27,61,0.92);

  border-radius: 16px;
  padding: 10px;

}

  width: 44px;
  height: 44px;

}

}

  nodes.forEach(node => {
    const repaired = repairMojibakeTextValue(node.nodeValue);
    if (repaired !== node.nodeValue) node.nodeValue = repaired;
  });
}
function startIconRepairObserver() {
  let scheduled = false;
  const run = () => {
    scheduled = false;
    repairMojibakeText();
  };
  const schedule = () => {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(run);
  };
  schedule();
  const observer = new MutationObserver(schedule);
  observer.observe(document.body, { childList: true, subtree: true, characterData: true });
  return () => observer.disconnect();
}
function scheduleSoftReload(showNotif) {
  let done = false;
  const reload = () => {
    if (done) return;
    done = true;
    window.location.reload();
  };
  const refreshWhenIdle = () => {
    const focused = document.querySelector('input:focus, textarea:focus, select:focus');
    if (!focused) reload();
  };
  if (document.hidden) {
    reload();
    return;
  }
  showNotif('Update aplikasi siap. Refresh otomatis saat aplikasi idle.', 'warn');
  const onHidden = () => {
    if (document.hidden) {
      document.removeEventListener('visibilitychange', onHidden);
      reload();
    }
  };
  document.addEventListener('visibilitychange', onHidden);
  const idle = window.requestIdleCallback || ((cb) => setTimeout(cb, 9000));
  idle(refreshWhenIdle, { timeout: 15000 });
}
async function checkBackgroundVersion(registration, showNotif) {
  try {
    const response = await fetch('/api/version?ts=' + Date.now(), { cache: 'no-store' });
    if (!response.ok) return;
    const remote = await response.json();
    const version = remote.version + ':' + remote.assetVersion;
    const known = localStorage.getItem(VERSION_KEY);
    if (!known) {
      localStorage.setItem(VERSION_KEY, version);
      if (remote.version && remote.version !== APP_VERSION) {
        showNotif('Sinkronisasi tampilan terbaru. Aplikasi akan refresh otomatis.', 'warn');
        scheduleSoftReload(showNotif);
      }
      return;
    }
    if (known !== version) {
      const alreadySynced = sessionStorage.getItem(VERSION_SYNC_KEY) === version;
      registration.active?.postMessage({ type: 'WARM_UPDATE' });
      await registration.update();
      if (registration.waiting) {
        registration.waiting.postMessage({ type: 'SKIP_WAITING' });
      }
      if (!alreadySynced) {
        sessionStorage.setItem(VERSION_SYNC_KEY, version);
        localStorage.setItem(VERSION_KEY, version);
        showNotif('Sinkronisasi tampilan terbaru. Aplikasi akan refresh otomatis.', 'warn');
        scheduleSoftReload(showNotif);
      }
    }
  } catch(e) {
    console.warn('Version check error:', e.message);
  }
}
function registerBackgroundUpdater(showNotif) {
  if (!('serviceWorker' in navigator)) return () => {};
  let hadController = !!navigator.serviceWorker.controller;
  let refreshQueued = false;
  let intervalId = null;
  const onControllerChange = () => {
    if (!hadController) {
      hadController = true;
      return;
    }
    if (refreshQueued) return;
    refreshQueued = true;
    scheduleSoftReload(showNotif);
  };
  const onMessage = (event) => {
    if (event.data?.type === 'VIDKIDZ_SW_ACTIVE') {
      localStorage.setItem(VERSION_KEY, event.data.version + ':' + event.data.cacheVersion);
    }
  };
  navigator.serviceWorker.addEventListener('controllerchange', onControllerChange);
  navigator.serviceWorker.addEventListener('message', onMessage);
  navigator.serviceWorker.register('/sw.js').then((registration) => {
    const watchInstalling = () => {
      const worker = registration.installing;
      if (!worker) return;
      worker.addEventListener('statechange', () => {
        if (worker.state === 'installed' && navigator.serviceWorker.controller) {
          registration.waiting?.postMessage({ type: 'SKIP_WAITING' });
        }
      });
    };
    watchInstalling();
    registration.addEventListener('updatefound', watchInstalling);
    registration.active?.postMessage({ type: 'WARM_UPDATE' });
    checkBackgroundVersion(registration, showNotif);
    intervalId = setInterval(() => checkBackgroundVersion(registration, showNotif), VERSION_POLL_MS);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) checkBackgroundVersion(registration, showNotif);
    });
  }).catch(err => console.warn('Service worker error:', err.message));
  return () => {
    navigator.serviceWorker.removeEventListener('controllerchange', onControllerChange);
    navigator.serviceWorker.removeEventListener('message', onMessage);
    if (intervalId) clearInterval(intervalId);
  };
}

function isDesktopDeviceViewport() {
  return window.matchMedia('(min-width: 900px)').matches;
}

function DeviceViewShell({ children }) {
  const [isDesktopDevice, setIsDesktopDevice] = useState(() => isDesktopDeviceViewport());
  const [deviceView, setDeviceView] = useState(() => {
    try {
      const savedView = sessionStorage.getItem(DEVICE_VIEW_KEY);
      return ['tablet', 'desktop'].includes(savedView) ? savedView : 'desktop';
    } catch(e) {
      return 'desktop';
    }
  });

  useEffect(() => {
    const widthQuery = window.matchMedia('(min-width: 900px)');
    const inputQuery = window.matchMedia('(hover: hover) and (pointer: fine)');
    const sync = () => setIsDesktopDevice(isDesktopDeviceViewport());
    sync();
    widthQuery.addEventListener?.('change', sync);
    inputQuery.addEventListener?.('change', sync);
    window.addEventListener('resize', sync);
    return () => {
      widthQuery.removeEventListener?.('change', sync);
      inputQuery.removeEventListener?.('change', sync);
      window.removeEventListener('resize', sync);
    };
  }, []);

  useEffect(() => {
    if (!isDesktopDevice) return;
    try {
      sessionStorage.setItem(DEVICE_VIEW_KEY, deviceView);
    } catch(e) {}
  }, [deviceView, isDesktopDevice]);

  const effectiveView = isDesktopDevice ? deviceView : 'phone';

  return (
    <div className={`device-view-root ${isDesktopDevice ? 'is-desktop-device' : ''} device-view-${effectiveView}`}>
      {(
        <div className="device-view-switcher" aria-label="Pilihan tampilan device">
          {DEVICE_VIEW_OPTIONS.map(option => (
            <button
              key={option.id}
              className={`device-view-option ${effectiveView===option.id?'active':''}`}
              type="button"
              title={`Tampilan ${option.label}`}
              aria-label={`Tampilan ${option.label}`}
              aria-pressed={effectiveView===option.id}
              onClick={() => setDeviceView(option.id)}
            >
              <UiIcon name={option.icon} size={18} color="currentColor" />
            </button>
          ))}
        </div>
      )}
      {children}
    </div>
  );
}

// ============================================================
// CONTEXT
// ============================================================
const AppCtx = createContext(null);

function AppProvider({ children }) {
  const [state, setState] = useState(null);
  const [appLoading, setAppLoading] = useState(true);
  const [currentUser, setCurrentUser] = useState(null);
  const [currentKidId, setCurrentKidId] = useState(null);
  const [notif, setNotif] = useState(null);
  const [installPrompt, setInstallPrompt] = useState(null);
  const [showInstallPrompt, setShowInstallPrompt] = useState(false);
  const [demoExpiresAt, setDemoExpiresAt] = useState(null);
  const [demoRemaining, setDemoRemaining] = useState(0);
  const [apiKey, setApiKey] = useState('');
  const saveTimerRef = useRef(null);
  const currentUserRef = useRef(null);
  useEffect(() => { currentUserRef.current = currentUser; }, [currentUser]);

  useEffect(() => {
    const stopRepair = startIconRepairObserver();
    const stopUpdater = registerBackgroundUpdater(showNotif);
    const refreshInstallPromptVisibility = () => {
      if (isPwaStandalone()) {
        setShowInstallPrompt(false);
        setInstallPrompt(null);
        localStorage.setItem('vidkidzPwaInstalled', '1');
        return;
      }
      localStorage.removeItem('vidkidzInstallDismissed');
      localStorage.removeItem('vidkidzPwaInstalled');
      setShowInstallPrompt(true);
    };
    const onBeforeInstall = (event) => {
      event.preventDefault();
      setInstallPrompt(event);
      setShowInstallPrompt(true);
    };
    const onInstalled = () => {
      setShowInstallPrompt(false);
      setInstallPrompt(null);
      localStorage.removeItem('vidkidzInstallDismissed');
      localStorage.setItem('vidkidzPwaInstalled', '1');
      showNotif('VIDKIDZ berhasil dipasang sebagai aplikasi');
    };
    refreshInstallPromptVisibility();
    const onVisibilityChange = () => {
      if (!document.hidden) refreshInstallPromptVisibility();
    };
    const reminder = window.setInterval(refreshInstallPromptVisibility, INSTALL_REMINDER_MS);
    window.addEventListener('beforeinstallprompt', onBeforeInstall);
    window.addEventListener('appinstalled', onInstalled);
    window.addEventListener('focus', refreshInstallPromptVisibility);
    document.addEventListener('visibilitychange', onVisibilityChange);
    return () => {
      window.clearInterval(reminder);
      window.removeEventListener('beforeinstallprompt', onBeforeInstall);
      window.removeEventListener('appinstalled', onInstalled);
      window.removeEventListener('focus', refreshInstallPromptVisibility);
      document.removeEventListener('visibilitychange', onVisibilityChange);
      stopRepair?.();
      stopUpdater?.();
    };
  }, []);

  useEffect(() => {
    const token = getToken();
    let restoredPayload = null;
    if (token) {
      try {
        const payload = decodeJwtPayload(token);
        const demoExpired = payload.demo && payload.demoExpiresAt && Date.now() > payload.demoExpiresAt;
        if (payload.exp * 1000 > Date.now() && !demoExpired) restoredPayload = payload;
        else clearToken();
      } catch(e) { clearToken(); }
    }
    apiFetch('/api/state')
      .then(s => {
        s = normalizeState(s);
        setState(s);
        setApiKey(s.systemSettings?.apiKey || '');
        if (restoredPayload?.demoExpiresAt) setDemoExpiresAt(restoredPayload.demoExpiresAt);
        if (restoredPayload?.role === 'admin') {
          const admin = s.users.admins.find(a => a.id === restoredPayload.id);
          if (admin) setCurrentUser({ ...admin, role:'admin' });
          else clearToken();
        } else if (restoredPayload?.role === 'family') {
          const family = s.users.families.find(f => f.id === restoredPayload.id);
          if (family) setCurrentUser({ ...family, role:'family', demoAccess: !!restoredPayload.demo, demoExpiresAt: restoredPayload.demoExpiresAt });
          else clearToken();
        } else if (restoredPayload?.role === 'kids') {
          const kid = s.users.kids.find(k => k.id === restoredPayload.id);
          if (kid) {
            setCurrentUser({ ...kid, role:'kids', demoAccess: !!restoredPayload.demo, demoExpiresAt: restoredPayload.demoExpiresAt });
            setCurrentKidId(kid.id);
          } else clearToken();
        }
      })
      .catch(() => setState(loadState()))
      .finally(() => setAppLoading(false));
  }, []);

  useEffect(() => {
    if (!state || appLoading) return;
    if (currentUserRef.current?.demoAccess) return;
    if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(async () => {
      const user = currentUserRef.current;
      if (!user) return;
      try {
        if (user.role === 'admin') {
          await apiFetch('/api/state', { method:'PUT', body: JSON.stringify(state) });
        } else {
          await apiFetch('/api/state', { method:'PATCH', body: JSON.stringify({ state }) });
        }
      } catch(e) { console.warn('Auto-save error:', e.message); }
    }, 1000);
  }, [state]);

  const showNotif = useCallback((msg, type='success') => {
    setNotif({ msg, type, id: uid() });
    setTimeout(() => setNotif(null), 3500);
  }, []);

  const closeDemoSession = useCallback((message='Waktu demo habis. Silakan login kembali.') => {
    clearToken();
    setCurrentUser(null);
    setCurrentKidId(null);
    setDemoExpiresAt(null);
    setDemoRemaining(0);
    showNotif(message, 'warn');
  }, [showNotif]);

  useEffect(() => {
    if (!demoExpiresAt || !currentUser?.demoAccess) return;
    const tick = () => {
      const remaining = Math.max(0, demoExpiresAt - Date.now());
      setDemoRemaining(remaining);
      if (remaining <= 0) closeDemoSession();
    };
    tick();
    const timer = setInterval(tick, 1000);
    return () => clearInterval(timer);
  }, [demoExpiresAt, currentUser?.demoAccess, closeDemoSession]);

  const installApp = useCallback(async () => {
    if (!installPrompt) {
      showNotif('Install tersedia dari ikon install di address bar browser', 'warn');
      return;
    }
    installPrompt.prompt();
    const choice = await installPrompt.userChoice.catch(() => null);
    setInstallPrompt(null);
    if (choice?.outcome === 'accepted') {
      setShowInstallPrompt(false);
      showNotif('VIDKIDZ sedang dipasang');
      return;
    }
    setShowInstallPrompt(false);
    window.setTimeout(() => {
      if (!isPwaStandalone()) setShowInstallPrompt(true);
    }, INSTALL_REMINDER_MS);
  }, [installPrompt, showNotif]);

  const dismissInstallPrompt = useCallback(() => {
    setShowInstallPrompt(false);
    localStorage.removeItem('vidkidzInstallDismissed');
    window.setTimeout(() => {
      if (!isPwaStandalone()) setShowInstallPrompt(true);
    }, INSTALL_REMINDER_MS);
  }, []);

  const updateState = useCallback((fn) => {
    setState(prev => {
      if (!prev) return prev;
      if (currentUserRef.current?.demoAccess) {
        showNotif('Akun demo hanya untuk melihat. Perubahan tidak disimpan.', 'warn');
        return prev;
      }
      const next = JSON.parse(JSON.stringify(prev));
      fn(next);
      return next;
    });
  }, [showNotif]);

  const addLog = useCallback((user, action, type='admin') => {
    updateState(s => {
      s.activityLog.unshift({ id:uid(), ts:now(), user, action, type });
      if (s.activityLog.length > 200) s.activityLog.pop();
    });
  }, [updateState]);

  const addCoins = useCallback((kidId, amount, reason) => {
    updateState(s => {
      const k = s.users.kids.find(u=>u.id===kidId);
      if (!k) return;
      k.coins = (k.coins||0) + amount;
      if (!k.badges) k.badges = [];
      if (k.coins >= 200 && !k.badges.includes('koin_sultan')) k.badges.push('koin_sultan');
      s.activityLog.unshift({ id:uid(), ts:now(), user:k.name, action:'Mendapat '+amount+' koin — '+reason, type:'coin' });
    });
  }, [updateState]);

  const login = useCallback(async (email, password, requestedRole) => {
    try {
      const data = await apiFetch('/api/auth/login', { method:'POST', body: JSON.stringify({ email, password, role: requestedRole }) });
      setToken(data.token);
      const freshState = normalizeState(await apiFetch('/api/state'));
      setState(freshState);
      if (data.role === 'admin') {
        const admin = freshState.users.admins.find(a => a.id === data.user.id);
        setCurrentUser({ ...(admin || data.user), role:'admin' });
        setCurrentKidId(null);
      } else if (data.role === 'family') {
        const family = freshState.users.families.find(f => f.id === data.user.id);
        setCurrentUser({ ...(family || data.user), role:'family', demoAccess: !!data.demo, demoExpiresAt: data.demoExpiresAt });
        setCurrentKidId(null);
      } else if (data.role === 'kids') {
        const kid = freshState.users.kids.find(k => k.id === (data.kidId || data.user.id));
        setCurrentUser({ ...(kid || data.user), role:'kids', demoAccess: !!data.demo, demoExpiresAt: data.demoExpiresAt });
        setCurrentKidId(data.kidId || data.user.id);
      }
      setDemoExpiresAt(data.demoExpiresAt || null);
      return data.role;
    } catch(e) { return null; }
  }, []);

  const registerFamily = useCallback(async (payload) => {
    const data = await apiFetch('/api/auth/register', { method:'POST', body: JSON.stringify(payload) });
    setToken(data.token);
    const freshState = normalizeState(await apiFetch('/api/state'));
    setState(freshState);
    const family = freshState.users.families.find(f => f.id === data.user.id);
    setCurrentUser({ ...(family || data.user), role:'family' });
    setCurrentKidId(null);
    setDemoExpiresAt(null);
    return data;
  }, []);

  const googleSignup = useCallback(async (accessToken) => {
    const data = await apiFetch('/api/auth/google', { method:'POST', body: JSON.stringify({ accessToken }) });
    setToken(data.token);
    const freshState = normalizeState(await apiFetch('/api/state'));
    setState(freshState);
    const family = freshState.users.families.find(f => f.id === data.user.id);
    setCurrentUser({ ...(family || data.user), role:'family', demoAccess: !!data.demo, demoExpiresAt: data.demoExpiresAt });
    setCurrentKidId(null);
    setDemoExpiresAt(data.demoExpiresAt || null);
    return data;
  }, []);

  const launchKidSession = useCallback(async (kidId) => {
    try {
      const data = await apiFetch('/api/auth/kids-session', { method:'POST', body: JSON.stringify({ kidId }) });
      setToken(data.token);
      const freshState = normalizeState(await apiFetch('/api/state'));
      setState(freshState);
      const kid = freshState.users.kids.find(k => k.id === (data.kidId || data.user.id));
      setCurrentUser({ ...(kid || data.user), role:'kids', demoAccess: !!data.demo, demoExpiresAt: data.demoExpiresAt });
      setCurrentKidId(data.kidId || data.user.id);
      setDemoExpiresAt(data.demoExpiresAt || null);
      return true;
    } catch(e) {
      showNotif(e.message || 'Gagal membuka akses Kids', 'error');
      return false;
    }
  }, []);

  const logout = useCallback(async () => {
    try { await apiFetch('/api/auth/logout', { method:'POST' }); } catch(e) {}
    clearToken();
    setCurrentUser(null);
    setCurrentKidId(null);
    setDemoExpiresAt(null);
    setDemoRemaining(0);
  }, []);

  if (appLoading || !state) {
    return (
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',flexDirection:'column',gap:16,background:'var(--bg)'}}>
        <img className="brand-mark" src="/logo-mark.png" alt="VIDKIDZ" />
        <div style={{fontFamily:'var(--font-display)',color:'var(--primary)',fontSize:20,fontWeight:900}}>VIDKIDZ</div>
        <div style={{color:'var(--t3)',fontSize:13}}>Menghubungkan ke server...</div>
        <div style={{width:140,height:3,background:'var(--border)',borderRadius:4,overflow:'hidden',marginTop:8}}>
          <div style={{height:'100%',background:'linear-gradient(90deg,var(--primary),var(--kids))',borderRadius:4,animation:'scanLine 1.2s ease-in-out infinite'}}></div>
        </div>
      </div>
    );
  }

  return (
    <AppCtx.Provider value={{ state, updateState, currentUser, currentKidId, setCurrentKidId, login, registerFamily, googleSignup, launchKidSession, logout, showNotif, addLog, apiKey, setApiKey, addCoins }}>
      <DeviceViewShell>
        {children}
        {currentUser?.demoAccess && demoRemaining > 0 && (
          <div className="demo-timer"> <span>Demo berakhir dalam</span> <strong>{formatDemoTime(demoRemaining)}</strong>
          </div>
        )}
        {showInstallPrompt && (
          <div className="install-prompt">
            <div className="install-prompt-logo"><img src="/logo-mark.png" alt="VIDKIDZ" /></div>
            <div className="install-prompt-text">
              <div className="install-prompt-title">Install VIDKIDZ</div>
              <div className="install-prompt-sub">Akses cepat tanpa buka browser</div>
            </div>
            <div className="install-prompt-actions">
              <button className="install-dismiss" onClick={dismissInstallPrompt}>Nanti</button>
              <button className="btn btn-primary btn-sm" onClick={installApp}>Install</button>
            </div>
          </div>
        )}
        {notif && (
          <div className="notif" style={{
            borderLeft: '3px solid '+(notif.type==='error'?'var(--danger)':notif.type==='warn'?'var(--warn)':notif.type==='coin'?'var(--coin)':'var(--success)'),
            color: notif.type==='error'?'var(--danger)':notif.type==='warn'?'var(--warn)':notif.type==='coin'?'var(--coin)':'var(--success)'
          }}>
            {notif.type==='error'?'✗':notif.type==='warn'?'⚠':notif.type==='coin'?'🪙':'✓'} {notif.msg}
          </div>
        )}
      </DeviceViewShell>
    </AppCtx.Provider>
  );
}

    <div className="avatar" style={{ width:size, height:size, minWidth:size, background:bg+'22', color:bg, border:`1.5px solid ${bg}44`, fontSize: size*0.36 }}>

}

  if (name === 'hourglass') return <svg {...common}><path d="M6 3h12M6 21h12M8 3c0 4 8 5 8 9s-8 5-8 9M16 3c0 4-8 5-8 9s8 5 8 9"/></svg>;
  if (name === 'bag') return <svg {...common}><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>;
  if (name === 'users') return <svg {...common}><circle cx="9" cy="8" r="3"/><circle cx="16.5" cy="9" r="2.5"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M14 17.5a4.5 4.5 0 0 1 6.5 2.5"/></svg>;
  return <span style={{fontSize:size,lineHeight:1}}>{name}</span>;
}
function IconSlot({ icon, size=22, color='currentColor' }) {
  return typeof icon === 'string' && icon.startsWith('ui:')
    ? <UiIcon name={icon.slice(3)} size={size} color={color} />
    : <span style={{fontSize:size}}>{icon}</span>;
}
function formatDemoTime(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function Toggle({ checked, onChange, accent='family' }) {
  return (
    <label className="toggle">
      <input type="checkbox" checked={checked} onChange={e=>onChange(e.target.checked)} />
      <span className={`toggle-slider ${accent==='admin'?'admin-toggle':''}`} />
    </label>
  );
}
function Modal({ open, onClose, title, children, lg }) {
  if (!open) return null;
  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className={`modal fade-in ${lg?'modal-lg':''}`}>
        <div className="flex items-center justify-between mb-4">
          <h3 style={{color:'var(--t1)'}}>{title}</h3>
          <button className="btn-icon btn" onClick={onClose} style={{fontSize:16}}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}
function StatCard({ label, value, icon, color, sub }) {
  return (
    <div className="stat-card">
      <div className="stat-glow" style={{ background: color }} />
      <div className="flex items-center justify-between mb-3">
        <span className="stat-label" style={{color:'var(--t3)',fontSize:11,textTransform:'uppercase',letterSpacing:'1px',fontFamily:'var(--font-display)',fontWeight:700}}>{label}</span>
        <span className="stat-icon" style={{display:'inline-flex',alignItems:'center',justifyContent:'center',color:color||'var(--primary)'}}><IconSlot icon={icon} size={23} color={color||'currentColor'} /></span>
      </div>
      <div className="stat-value" style={{fontFamily:'var(--font-display)',fontWeight:800,fontSize:32,color:'var(--t1)',lineHeight:1}}>{value}</div>
      {sub && <div className="stat-sub" style={{color:'var(--t3)',fontSize:12,marginTop:6}}>{sub}</div>}
    </div>
  );
}
function ConfirmDialog({ open, title, msg, onConfirm, onClose, danger }) {
  if (!open) return null;
  return (
    <Modal open title={title} onClose={onClose}>
      <p style={{color:'var(--t2)',marginBottom:20}}>{msg}</p>

        <button className={`btn ${danger?'btn-danger':'btn-primary'}`} onClick={()=>{onConfirm();onClose();}}>Konfirmasi</button>

}

function RoleIcon({ type, color, compact=false }) {

function LoginScreen() {
  const { login, registerFamily, googleSignup, showNotif } = useContext(AppCtx);
  const [mode, setMode] = useState('login');
  const [authMethod, setAuthMethod] = useState('email');
  const [loginRole, setLoginRole] = useState(ROLES.FAMILY);
  const [account, setAccount] = useState('budi@vidkidz.local');
  const [otp, setOtp] = useState('');
  const [password, setPassword] = useState('family123');
  const [confirmPassword, setConfirmPassword] = useState('');
  const [referralCode, setReferralCode] = useState('');
  const [acceptedTerms, setAcceptedTerms] = useState(true);
  const [loading, setLoading] = useState(false);
  const [googleLoading, setGoogleLoading] = useState(false);
  const [googleClientId, setGoogleClientId] = useState('');
  const [showPass, setShowPass] = useState(false);
  const [showConfirmPass, setShowConfirmPass] = useState(false);
  const [adminUnlocked, setAdminUnlocked] = useState(false);
  const [adminClickCount, setAdminClickCount] = useState(0);

  const handleLoginScreenClick = () => {
    if (adminUnlocked) return;
    setAdminClickCount((count) => {
      const next = count + 1;
      if (next >= 9) {
        setAdminUnlocked(true);
        setMode('login');
        setLoginRole(ROLES.ADMIN);
        fillDemoCredentials(ROLES.ADMIN);
        showNotif('Login admin terbuka', 'warn');
      } else if (next >= 5) {
        const remaining = 9 - next;
        showNotif(`Klik ${remaining} kali lagi untuk membuka login admin`, 'warn');
      }
      return Math.min(next, 9);
    });
  };

  useEffect(() => {
    apiFetch('/api/auth/config')
      .then(cfg => setGoogleClientId(cfg.googleClientId || ''))
      .catch(() => setGoogleClientId(''));
  }, []);

  const loadGoogleScript = () => new Promise((resolve, reject) => {
    if (window.google?.accounts?.oauth2) return resolve();
    const existing = document.querySelector('script[data-google-identity]');
    if (existing) {
      existing.addEventListener('load', resolve, { once:true });
      existing.addEventListener('error', reject, { once:true });
      return;
    }
    const script = document.createElement('script');
    script.src = 'https://accounts.google.com/gsi/client';
    script.async = true;
    script.defer = true;
    script.dataset.googleIdentity = 'true';
    script.onload = resolve;
    script.onerror = () => reject(new Error('Gagal memuat Google Identity'));
    document.head.appendChild(script);
  });

  const resetAuthFields = () => {
    setAccount('');
    setOtp('');
    setPassword('');
    setConfirmPassword('');
    setReferralCode('');
    setShowPass(false);
    setShowConfirmPass(false);
  };

  const fillDemoCredentials = (role = ROLES.FAMILY) => {
    setAuthMethod('email');
    setOtp('');
    setConfirmPassword('');
    setReferralCode('');
    setShowPass(false);
    setShowConfirmPass(false);
    if (role === ROLES.ADMIN) {
      setAccount('admin@vidkidz.local');
      setPassword('admin123');
      return;
    }
    setAccount('budi@vidkidz.local');
    setPassword('family123');
  };

  const switchMode = (nextMode) => {
    setMode(nextMode);
    if (nextMode === 'login') {
      fillDemoCredentials(loginRole);
    } else {
      resetAuthFields();
      setLoginRole(ROLES.FAMILY);
    }
  };

  const selectLoginRole = (role) => {
    setLoginRole(role);
    fillDemoCredentials(role);
  };

  const handleSendOtp = async () => {
    const target = account.trim();
    if (!target) {
      showNotif(authMethod === 'email' ? 'Masukkan email dahulu' : 'Masukkan nomor telepon dahulu', 'error');
      return;
    }
    setLoading(true);
    try {
      const data = await apiFetch('/api/auth/send-otp', {
        method:'POST',
        body: JSON.stringify({ method: authMethod, target })
      });
      setOtp(data.otp || '');
      showNotif(data.message || 'Kode OTP dikirim');
    } catch (err) {
      showNotif(err.message || 'Gagal mengirim kode OTP', 'error');
    } finally {
      setLoading(false);
    }
  };

  const handleRegister = async () => {
    if (!account.trim() || !otp.trim() || !password || !confirmPassword) {
      showNotif('Lengkapi semua field wajib', 'error');
      return;
    }
    if (password !== confirmPassword) {
      showNotif('Konfirmasi password tidak cocok', 'error');
      return;
    }
    if (!acceptedTerms) {
      showNotif('Setujui perjanjian pengguna dan kebijakan privasi', 'error');
      return;
    }
    setLoading(true);
    try {
      await registerFamily({
        method: authMethod,
        email: authMethod === 'email' ? account.trim() : '',
        phone: authMethod === 'phone' ? account.trim() : '',
        otp: otp.trim(),
        password,
        referralCode: referralCode.trim(),
        acceptedTerms
      });
      showNotif('Akun Family berhasil dibuat');
    } catch (err) {
      showNotif(err.message || 'Gagal membuat akun', 'error');
    } finally {
      setLoading(false);
    }
  };

  const handleLogin = async () => {
    if (!account || !password) { showNotif('Isi akun dan password', 'error'); return; }
    setLoading(true);
    const result = await login(account, password, loginRole);
    setLoading(false);
    if (!result) showNotif('Akun/password salah', 'error');
  };

  const handleGoogleSignup = async () => {
    if (!googleClientId) {
      showNotif('GOOGLE_CLIENT_ID belum dikonfigurasi di server', 'error');
      return;
    }
    setGoogleLoading(true);
    try {
      await loadGoogleScript();
      const tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: googleClientId,
        scope: 'openid email profile',
        prompt: 'select_account',
        callback: async (response) => {
          if (!response?.access_token) {
            setGoogleLoading(false);
            showNotif('Login Google dibatalkan', 'error');
            return;
          }
          try {
            const data = await googleSignup(response.access_token);
            showNotif(data.isNew ? 'Akun Family Google berhasil dibuat' : 'Berhasil masuk dengan Google');
          } catch (err) {
            showNotif(err.message || 'Gagal daftar dengan Google', 'error');
          } finally {
            setGoogleLoading(false);
          }
        }
      });
      tokenClient.requestAccessToken();
    } catch (err) {
      setGoogleLoading(false);
      showNotif(err.message || 'Gagal memulai Google Sign-In', 'error');
    }
  };

  return (
    <div className="mobile-auth-screen grid-bg" onClick={handleLoginScreenClick}>
      <div className="mobile-phone-shell">
        <div className="mobile-status-bar" />
        <div className="mobile-auth-content auth-form-layout">
        <div className="login-hero">
          <div className="login-logo-wrap">
            <img className="brand-logo" src="/logo.png" alt="VIDKIDZ" />
          </div>
          <p className="login-tagline">Belajar lewat Video, Game, dan Hadiah</p>
          <p className="login-subtitle">Platform Edukasi Menyenangkan untuk Anak</p>
        </div>

        <div className="auth-entry-card fade-in" onClick={e=>e.stopPropagation()}>
          <img className="auth-card-logo" src="/icon96.png" alt="VIDKIDZ" />
          <p className="auth-card-tagline">Belajar lewat Video, Game, dan Hadiah</p>
          <div className="auth-tabs">
            <button className={`auth-tab ${authMethod==='phone'?'active':''}`} onClick={()=>setAuthMethod('phone')}>Telepon</button>
            <span className="auth-tab-separator" />
            <button className={`auth-tab ${authMethod==='email'?'active':''}`} onClick={()=>setAuthMethod('email')}>Email</button>
          </div>

          {mode === 'register' ? (
            <>
              <div className="auth-field">
                <input value={account} onChange={e=>setAccount(e.target.value)} placeholder={authMethod==='email' ? 'Masukkan email' : 'Masukkan nomor telepon'} />
              </div>
              <div className="auth-field auth-inline-field">
                <input value={otp} onChange={e=>setOtp(e.target.value)} placeholder="Masukkan kode OTP" />
                <button className="auth-inline-action" onClick={handleSendOtp} disabled={loading}>Kirim kode</button>
              </div>
              <div className="auth-field auth-password-field">
                <input type={showPass?'text':'password'} value={password} onChange={e=>setPassword(e.target.value)} placeholder="Atur ulang kata sandi" />
                <button className="auth-password-toggle" onClick={()=>setShowPass(!showPass)}>{showPass ? 'Sembunyi' : 'Lihat'}</button>
              </div>
              <div className="auth-field auth-password-field">
                <input type={showConfirmPass?'text':'password'} value={confirmPassword} onChange={e=>setConfirmPassword(e.target.value)} placeholder="Konfirmasi kata sandi" onKeyDown={e=>e.key==='Enter'&&handleRegister()} />
                <button className="auth-password-toggle" onClick={()=>setShowConfirmPass(!showConfirmPass)}>{showConfirmPass ? 'Sembunyi' : 'Lihat'}</button>
              </div>
              <div className="auth-field">
                <input value={referralCode} onChange={e=>setReferralCode(e.target.value)} placeholder="Masukkan kode referral" />
              </div>
              <div className="auth-consent" onClick={()=>setAcceptedTerms(v=>!v)}>
                <span className="auth-check">{acceptedTerms ? '✓' : ''}</span>
                <span>Mendaftar berarti Anda menyetujui <a href="#" onClick={e=>e.preventDefault()}>{'<Perjanjian Pengguna>'}</a> dan <a href="#" onClick={e=>e.preventDefault()}>{'<Kebijakan Privasi>'}</a></span>
              </div>
              <button className="btn auth-submit" onClick={handleRegister} disabled={loading}>
                {loading ? 'Memproses...' : 'Buat akun'}
              </button>
              <div className="auth-footer">Sudah punya akun? <button className="auth-tab active" onClick={()=>switchMode('login')}>Masuk</button></div>
            </>
          ) : (
            <>
              {adminUnlocked && (
                <div className="auth-field" style={{display:'flex',gap:8}}>
                  <button className={`btn btn-sm ${loginRole===ROLES.FAMILY?'btn-family':'btn-ghost'}`} onClick={()=>selectLoginRole(ROLES.FAMILY)} style={{flex:1,justifyContent:'center'}}>Family</button>
                  <button className={`btn btn-sm ${loginRole===ROLES.ADMIN?'btn-admin':'btn-ghost'}`} onClick={()=>selectLoginRole(ROLES.ADMIN)} style={{flex:1,justifyContent:'center'}}>Admin</button>
                </div>
              )}
              <div className="auth-field">
                <input value={account} onChange={e=>setAccount(e.target.value)} placeholder={loginRole===ROLES.ADMIN ? 'Email admin' : (authMethod==='email' ? 'Email akun' : 'Nomor telepon akun')} />
              </div>
              <div className="auth-field auth-password-field">
                <input type={showPass?'text':'password'} value={password} onChange={e=>setPassword(e.target.value)} placeholder="Kata sandi" onKeyDown={e=>e.key==='Enter'&&handleLogin()} />
                <button className="auth-password-toggle" onClick={()=>setShowPass(!showPass)}>{showPass ? 'Sembunyi' : 'Lihat'}</button>
              </div>
              <button className="btn auth-submit" onClick={handleLogin} disabled={loading}>
                {loading ? 'Masuk...' : `Masuk ${loginRole===ROLES.ADMIN ? 'Admin' : 'Family'}`}
              </button>
              {loginRole === ROLES.FAMILY && (
                <>
                  <div className="divider" style={{color:'rgba(255,255,255,0.54)'}}>atau</div>
                  <button className="btn google-btn w-full" onClick={handleGoogleSignup} disabled={googleLoading || loading} style={{padding:'11px 16px',justifyContent:'center'}}>
                    {googleLoading ? <span className="animate-spin" style={{display:'inline-block'}}>⊙</span> : <GoogleMark />}
                    {googleLoading ? 'Menghubungkan Google...' : 'Masuk dengan Google'}
                  </button>
                </>
              )}
              <div className="auth-demo-hint">{loginRole===ROLES.ADMIN ? 'Demo: admin@vidkidz.local / admin123' : 'Demo: budi@vidkidz.local / family123'}</div>
              <div className="auth-footer">Belum punya akun? <button className="auth-tab active" onClick={()=>switchMode('register')}>Daftar</button></div>
            </>
          )}
        </div>
        <p className="auth-bottom-caption">VIDKIDZ · Video edukasi aman untuk anak</p>
      </div>
      </div>
    </div>
  );
}

    { id:'test', label:'Test Dashboard', icon:'ui:monitor' },
    { id:'settings', label:'System Settings', icon:'⚙' },
  ].filter(n => !isTestPreview || n.id !== 'test');

  const { admins, families, kids } = state.users;
  const premiumFamilies = families.filter(f=>f.plan==='Premium').length;
  const basicFamilies = families.filter(f=>f.plan!=='Premium').length;
  const totalFamilyKids = families.reduce((sum,f)=>sum+(f.linkedKids?.length||0),0);

  const deleteUser = (type, id) => {
    updateState(s => {
      if (type==='admin') {
        if (id === currentUser.id) return;
        s.users.admins = s.users.admins.filter(u=>u.id!==id);
      }
      if (type==='family') {
        const ownedKidIds = new Set(s.users.kids.filter(k => k.familyId === id).map(k => k.id));
        s.users.families = s.users.families.filter(u=>u.id!==id);
        s.users.kids = s.users.kids.filter(k=>k.familyId!==id);
        s.redemptions = (s.redemptions || []).filter(r => !ownedKidIds.has(r.kidId));
      }
      if (type==='kids') {
        const kid = s.users.kids.find(k=>k.id===id);
        s.users.kids = s.users.kids.filter(k=>k.id!==id);
        const fam = s.users.families.find(f=>f.id===kid?.familyId);
        if (fam) fam.linkedKids = (fam.linkedKids || []).filter(kidId=>kidId!==id);
        s.redemptions = (s.redemptions || []).filter(r=>r.kidId!==id);
      }
    });
    addLog(currentUser.name, `Menghapus user ${type}: ${id}`, 'admin');

function AdminUserManager({ admins, families, kids, currentUser, updateState, addLog, showNotif, setModal, setConfirm, deleteUser }) {
  const [search, setSearch] = useState('');
  const [roleFilter, setRoleFilter] = useState('all');
  const [sortBy, setSortBy] = useState('newest');
  const [selected, setSelected] = useState(null);

  const familyById = useMemo(() => {
    const map = {};
    families.forEach(f => { map[f.id] = f; });
    return map;
  }, [families]);

  const rows = useMemo(() => {
    const adminRows = admins.map(a => ({
      ...a,
      type: 'admin',
      role: 'admin',
      displayName: a.name,
      credential: a.email,
      status: 'active',
      childCount: 0,
      familyName: '-',
      plan: 'GOD MODE'
    }));

    const familyRows = families.map(f => ({
      ...f,
      type: 'family',
      role: 'family',
      displayName: f.name,
      credential: f.email,
      status: f.isSuspended ? 'suspended' : 'active',
      childCount: f.linkedKids?.length || 0,
      familyName: f.name,
      plan: f.plan || 'Basic'
    }));

    const kidRows = kids.map(k => {
      const family = familyById[k.familyId];
      return {
        ...k,
        type: 'kids',
        role: 'kids',
        displayName: k.name,
        credential: `PIN ${k.lockPin || '----'}`,
        status: k.isLocked ? 'locked' : (k.isOnline ? 'online' : 'active'),
        childCount: 0,
        familyName: family?.name || 'Tanpa keluarga',
        plan: `${k.age || '-'} tahun`
      };
    });

    return [...adminRows, ...familyRows, ...kidRows];
  }, [admins, families, kids, familyById]);

  const filteredRows = useMemo(() => {
    const q = search.trim().toLowerCase();
    return rows
      .filter(row => roleFilter === 'all' || row.role === roleFilter)
      .filter(row => {
        if (!q) return true;
        return [
          row.displayName,
          row.credential,
          row.familyName,
          row.plan,
          row.role
        ].some(value => String(value || '').toLowerCase().includes(q));
      })
      .sort((a, b) => {
        if (sortBy === 'name') return String(a.displayName).localeCompare(String(b.displayName));
        if (sortBy === 'role') return String(a.role).localeCompare(String(b.role));
        if (sortBy === 'oldest') return Number(a.createdAt || 0) - Number(b.createdAt || 0);
        return Number(b.createdAt || 0) - Number(a.createdAt || 0);
      });
  }, [rows, search, roleFilter, sortBy]);

  const stats = {
    all: rows.length,
    admin: rows.filter(r => r.role === 'admin').length,
    family: rows.filter(r => r.role === 'family').length,
    kids: rows.filter(r => r.role === 'kids').length,
    suspended: rows.filter(r => r.status === 'suspended' || r.status === 'locked').length
  };

  const roleBadge = role => role === 'admin' ? 'badge-admin' : role === 'family' ? 'badge-family' : 'badge-kids';
  const roleLabel = role => role === 'admin' ? 'Admin' : role === 'family' ? 'Family' : 'Kids';
  const statusBadge = status => status === 'active' || status === 'online' ? 'badge-success' : status === 'locked' ? 'badge-warn' : 'badge-danger';
  const statusLabel = status => status === 'online' ? 'Online' : status === 'locked' ? 'Locked' : status === 'suspended' ? 'Suspended' : 'Aktif';

  const toggleUserStatus = row => {
    if (row.type === 'admin') {
      showNotif('Akun admin utama tidak memakai suspend lokal', 'warn');
      return;
    }
    updateState(s => {
      if (row.type === 'family') {
        const family = s.users.families.find(f => f.id === row.id);
        if (family) family.isSuspended = !family.isSuspended;
      }
      if (row.type === 'kids') {
        const kid = s.users.kids.find(k => k.id === row.id);
        if (kid) kid.isLocked = !kid.isLocked;
      }
    });
    addLog(currentUser.name, `${row.status === 'active' || row.status === 'online' ? 'Suspend/lock' : 'Aktifkan'} user ${row.displayName}`, 'admin');
    showNotif('Status user diperbarui');
  };

  const openEdit = row => {
    if (row.type === 'admin') setModal({ type:'editAdmin', data:row });
    if (row.type === 'family') setModal({ type:'editFamily', data:row });
    if (row.type === 'kids') setModal({ type:'adminEditKid', data:row });
  };

  const confirmDelete = row => {
    if (row.type === 'admin' && row.id === currentUser.id) {
      showNotif('Admin yang sedang login tidak bisa menghapus dirinya sendiri', 'error');
      return;
    }
    const extra = row.type === 'family' && row.childCount > 0 ? ` Ini juga menghapus ${row.childCount} akun anak terkait.` : '';
    setConfirm({
      msg: `Hapus ${roleLabel(row.role)} "${row.displayName}"?${extra}`,
      fn: () => deleteUser(row.type, row.id)
    });
  };

  return (
    <div className="fade-in">
      <div className="flex items-center justify-between mb-6" style={{gap:12,flexWrap:'wrap'}}>
        <div>
          <h2 style={{color:'var(--t1)'}}>👥 User Manager</h2>
          <p style={{color:'var(--t3)',fontSize:12,marginTop:2}}>Kelola admin, family, kids, status akses, dan detail akun dalam satu panel.</p>
        </div>
        <button className="btn btn-admin" onClick={()=>setModal({type:'addFamily'})}>+ Tambah Family</button>
      </div>

      <div className="user-manager-stats" style={{display:'grid',gridTemplateColumns:'repeat(4,minmax(0,1fr))',gap:12,marginBottom:16}}>
        <StatCard label="Total User" value={stats.all} icon="👥" color="#0078ff" sub="Semua role" />
        <StatCard label="Admin" value={stats.admin} icon="⚡" color="#ffbe1a" sub="GOD MODE" />
        <StatCard label="Family" value={stats.family} icon="👨‍👩‍👧" color="#7bdc38" sub="Orang tua" />
        <StatCard label="Kids" value={stats.kids} icon="🧒" color="#1fb6ff" sub="Profil anak" />
      </div>

      <div className="card mb-4">
        <div style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr',gap:12}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Cari nama, email/PIN, keluarga, plan, role..." />
          <select value={roleFilter} onChange={e=>setRoleFilter(e.target.value)}>
            <option value="all">Semua Role</option>
            <option value="admin">Admin</option>
            <option value="family">Family</option>
            <option value="kids">Kids</option>
          </select>
          <select value={sortBy} onChange={e=>setSortBy(e.target.value)}>
            <option value="newest">Terbaru</option>
            <option value="oldest">Terlama</option>
            <option value="name">Nama A-Z</option>
            <option value="role">Role A-Z</option>
          </select>
        </div>
      </div>

      <div className="card">
        <table>
          <thead><tr><th>User</th><th>Kredensial</th><th>Role</th><th>Family/Plan</th><th>Status</th><th>Terakhir</th><th>Aksi</th></tr></thead>
          <tbody>
            {filteredRows.map(row => (
              <tr key={`${row.type}-${row.id}`}>
                <td><div className="flex items-center gap-2"><Avatar name={row.displayName} size={30} color={row.role === 'admin' ? 'var(--admin)' : undefined} /><span style={{fontWeight:700,color:'var(--t1)'}}>{row.displayName}</span></div></td>
                <td style={{fontSize:12,color:'var(--t2)'}}>{row.credential}</td>
                <td><span className={`badge ${roleBadge(row.role)}`}>{roleLabel(row.role)}</span></td>
                <td style={{fontSize:12}}>{row.role === 'kids' ? row.familyName : row.plan}{row.childCount ? ` · ${row.childCount} anak` : ''}</td>
                <td><span className={`badge ${statusBadge(row.status)}`}>{statusLabel(row.status)}</span></td>
                <td style={{fontSize:11,color:'var(--t3)'}}>{row.lastLogin ? timeAgo(row.lastLogin) : formatTs(row.createdAt)}</td>
                <td>
                  <div className="flex gap-1" style={{flexWrap:'wrap'}}>
                    <button className="btn btn-icon btn-sm" title="Detail" onClick={()=>setSelected(row)}>👁</button>
                    <button className="btn btn-icon btn-sm" title="Edit" onClick={()=>openEdit(row)}>✏️</button>
                    <button className="btn btn-icon btn-sm" title="Suspend / lock" onClick={()=>toggleUserStatus(row)}>🔒</button>
                    <button className="btn btn-icon btn-sm" title="Hapus" onClick={()=>confirmDelete(row)}>🗑️</button>
                  </div>
                </td>
              </tr>
            ))}
            {!filteredRows.length && (
              <tr><td colSpan="7" style={{textAlign:'center',padding:28,color:'var(--t3)'}}>Tidak ada user sesuai filter.</td></tr>
            )}
          </tbody>
        </table>
      </div>

      {selected && (
        <Modal open lg title={`Detail ${roleLabel(selected.role)} · ${selected.displayName}`} onClose={()=>setSelected(null)}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
            <div className="card" style={{boxShadow:'none'}}>
              <h3 style={{color:'var(--t1)',marginBottom:10}}>Identitas</h3>
              <p style={{fontSize:13,color:'var(--t2)'}}>ID: {selected.id}</p>
              <p style={{fontSize:13,color:'var(--t2)'}}>Role: {roleLabel(selected.role)}</p>
              <p style={{fontSize:13,color:'var(--t2)'}}>Kredensial: {selected.credential}</p>
              <p style={{fontSize:13,color:'var(--t2)'}}>Dibuat: {formatTs(selected.createdAt)}</p>
            </div>
            <div className="card" style={{boxShadow:'none'}}>
              <h3 style={{color:'var(--t1)',marginBottom:10}}>Akses</h3>
              <p style={{fontSize:13,color:'var(--t2)'}}>Status: {statusLabel(selected.status)}</p>
              <p style={{fontSize:13,color:'var(--t2)'}}>Last login: {selected.lastLogin ? formatTs(selected.lastLogin) : '-'}</p>
              <p style={{fontSize:13,color:'var(--t2)'}}>Family/Plan: {selected.role === 'kids' ? selected.familyName : selected.plan}</p>
            </div>
          </div>
          {selected.role === 'kids' && (
            <div className="card mt-4" style={{boxShadow:'none'}}>
              <h3 style={{color:'var(--t1)',marginBottom:10}}>Aktivitas Anak</h3>
              <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}}>
                <StatCard label="Koin" value={selected.coins || 0} icon="🪙" color="#ffbe1a" />
                <StatCard label="Video" value={selected.totalVideos || 0} icon="▶" color="#0078ff" />
                <StatCard label="Menit" value={selected.watchTime || 0} icon="⏱" color="#20d69f" />
                <StatCard label="Streak" value={selected.streak || 0} icon="🔥" color="#ff5f7d" />
              </div>
            </div>
          )}
          <div className="flex gap-3 justify-end mt-4">
            <button className="btn btn-ghost" onClick={()=>setSelected(null)}>Tutup</button>
            <button className="btn btn-admin" onClick={()=>{openEdit(selected);setSelected(null);}}>Edit User</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function getTestPreviewFit() {
  if (typeof window === 'undefined') {
    return { scale: 0.78, slotWidth: 335, height: 980 };
  }
  const baseWidth = 430;
  const baseHeight = 980;
  const gap = 10;
  const minScale = 0.26;
  const maxScale = 0.79;
  const availableWidth = Math.max(360, window.innerWidth - 16);
  const availableHeight = Math.max(420, window.innerHeight);
  const widthScale = (availableWidth - gap * 2) / (baseWidth * 3);
  const heightScale = availableHeight / baseHeight;
  const scale = Math.max(minScale, Math.min(maxScale, widthScale, heightScale));
  return {
    scale: Number(scale.toFixed(3)),
    slotWidth: Math.round(baseWidth * scale),
    height: baseHeight
  };
}

function handleTestPreviewWheel(e) {
  const scroller = e.currentTarget.querySelector('.admin-main, .family-main, .kids-app.app-mobile-frame > div:last-child');
  if (!scroller || scroller.scrollHeight <= scroller.clientHeight) return;
  const maxTop = scroller.scrollHeight - scroller.clientHeight;
  const nextTop = scroller.scrollTop + e.deltaY;
  if ((e.deltaY < 0 && scroller.scrollTop <= 0) || (e.deltaY > 0 && scroller.scrollTop >= maxTop)) return;
  e.preventDefault();
  e.stopPropagation();
  scroller.scrollTop = Math.max(0, Math.min(maxTop, nextTop));
}

function handleTestPreviewTouchStart(e) {
  e.currentTarget.dataset.touchY = String(e.touches?.[0]?.clientY || 0);
}

function handleTestPreviewTouchMove(e) {
  const lastY = Number(e.currentTarget.dataset.touchY || 0);
  const currentY = e.touches?.[0]?.clientY || lastY;
  const deltaY = lastY - currentY;
  if (!deltaY) return;
  e.currentTarget.dataset.touchY = String(currentY);
  const scroller = e.currentTarget.querySelector('.admin-main, .family-main, .kids-app.app-mobile-frame > div:last-child');
  if (!scroller || scroller.scrollHeight <= scroller.clientHeight) return;
  const maxTop = scroller.scrollHeight - scroller.clientHeight;
  const nextTop = scroller.scrollTop + deltaY;
  if ((deltaY < 0 && scroller.scrollTop <= 0) || (deltaY > 0 && scroller.scrollTop >= maxTop)) return;
  e.preventDefault();
  e.stopPropagation();
  scroller.scrollTop = Math.max(0, Math.min(maxTop, nextTop));
}

function TestDashboardPreview({ item, previewBase }) {
  const [previewUser, setPreviewUser] = useState(item.user);
  const [previewKidId, setPreviewKidId] = useState(item.user.role === ROLES.KIDS ? item.user.id : null);
  useEffect(() => {
    setPreviewUser(item.user);
    setPreviewKidId(item.user.role === ROLES.KIDS ? item.user.id : null);
  }, [item.user.id, item.user.role]);

  const launchPreviewKidSession = useCallback((kidId) => {
    const kid = previewBase.state.users.kids.find(k => k.id === kidId);
    if (!kid || kid.isLocked) {
      previewBase.showNotif(kid?.isLocked ? 'Preview Kids terkunci' : 'Data anak tidak ditemukan', 'warn');
      return false;
    }
    setPreviewUser({ ...kid, role: ROLES.KIDS, demoAccess: true });
    setPreviewKidId(kid.id);
    return true;
  }, [previewBase]);

  const resetPreviewSession = useCallback(() => {
    setPreviewUser(item.user);
    setPreviewKidId(item.user.role === ROLES.KIDS ? item.user.id : null);
    previewBase.showNotif('Preview dikembalikan ke tampilan awal', 'warn');
  }, [item.user, previewBase]);

  let component = item.component;
  if (previewUser.role === ROLES.ADMIN) component = <AdminDashboard />;
  if (previewUser.role === ROLES.FAMILY) component = <FamilyDashboard />;
  if (previewUser.role === ROLES.KIDS) component = <KidsDashboard />;

  return (
    <AppCtx.Provider value={{
      ...previewBase,
      isTestPreview: true,
      currentUser: previewUser,
      currentKidId: previewKidId,
      setCurrentKidId: setPreviewKidId,
      launchKidSession: launchPreviewKidSession,
      logout: resetPreviewSession,
    }}>
      {component}
    </AppCtx.Provider>
  );
}

function AdminEditKidModal({ data, onClose }) {
  const { state, updateState, addLog, showNotif, currentUser } = useContext(AppCtx);

  const handle = () => {
    if (!form.name || !form.familyId || !form.lockPin) { showNotif('Nama, keluarga, dan PIN wajib diisi','error'); return; }
    updateState(s => {
      const prev = s.users.kids.find(k=>k.id===data.id);
      const idx = s.users.kids.findIndex(k=>k.id===data.id);
      if (idx >= 0) {
        s.users.kids[idx] = {
          ...s.users.kids[idx],
          name: form.name,
          age: parseInt(form.age)||1,
          avatar: form.avatar,
          familyId: form.familyId,
          lockPin: form.lockPin,
          isLocked: !!form.isLocked
        };
      }
      if (prev?.familyId !== form.familyId) {
        const oldFam = s.users.families.find(f=>f.id===prev?.familyId);
        const newFam = s.users.families.find(f=>f.id===form.familyId);
        if (oldFam) oldFam.linkedKids = (oldFam.linkedKids || []).filter(id=>id!==data.id);
        if (newFam) newFam.linkedKids = [...new Set([...(newFam.linkedKids || []), data.id])];

function FamilyDashboard() {
  const { state, currentUser, logout, updateState, addLog, showNotif, apiKey, setApiKey, launchKidSession } = useContext(AppCtx);
  const [page, setPage] = useState('overview');
  const [selectedKidId, setSelectedKidId] = useState(null);
  const [modal, setModal] = useState(null);
  const [confirm, setConfirm] = useState(null);

  const myKids = state.users.kids.filter(k => k.familyId === currentUser.id || currentUser.linkedKids?.includes(k.id));
  const selectedKid = state.users.kids.find(k => k.id === selectedKidId) || myKids[0];

  const navItems = [
    { id:'overview', label:'Overview', icon:'⊞' },
    { id:'kids', label:'Manajemen Anak', icon:'ui:users' },
    { id:'coins', label:'Koin & Hadiah', icon:'ui:coin' },
    { id:'videos', label:'Kelola Video', icon:'ui:play' },
    { id:'photos', label:'Foto', icon:'ui:camera' },
    { id:'control', label:'Kendali Perangkat', icon:'ui:lock' },
    { id:'monitor', label:'Monitor Anak', icon:'ui:eye' },
    { id:'ai', label:'AI Analisis', icon:'ui:brain' },
  ];

  const toggleLock = (kidId) => {
    const kid = state.users.kids.find(k=>k.id===kidId);
    updateState(s => { const k = s.users.kids.find(u=>u.id===kidId); if (k) k.isLocked = !k.isLocked; });
    addLog(currentUser.name, `${kid?.isLocked?'Membuka':'Mengunci'} layar ${kid?.name}`, kid?.isLocked?'unlock':'lock');
    showNotif(`Layar ${kid?.name} ${kid?.isLocked?'dibuka':'dikunci'}`);
  };

  const deleteKid = (kidId) => {
    const kid = myKids.find(k=>k.id===kidId);
    if (!kid) return;
    updateState(s => {
      s.users.kids = s.users.kids.filter(k=>k.id!==kidId);
      const fam = s.users.families.find(f=>f.id===currentUser.id);
      if (fam) fam.linkedKids = (fam.linkedKids||[]).filter(id=>id!==kidId);
      s.redemptions = (s.redemptions||[]).filter(r=>r.kidId!==kidId);
    });
    addLog(currentUser.name, `Menghapus anak: ${kid.name}`, 'edit');
    showNotif('Data anak dihapus');
  };

  const pendingRedemptions = state.redemptions.filter(r => {
    const reward = state.rewards.find(rw=>rw.id===r.rewardId);
    return r.status==='pending' && reward && myKids.find(k=>k.id===r.kidId);
  });

  return (
    <div className="family-app-shell" style={{display:'flex',height:'100vh',overflow:'hidden'}}>

            <div style={{fontSize:11,color:'var(--family)',marginTop:4,fontWeight:700}}>Family Control</div>
          </div>
        </div>
        <div className="nav-sep" />
        <div className="nav-label">Pilih Anak</div>
        {myKids.map(kid => (
          <div key={kid.id} className={`nav-item kid-picker-item ${selectedKidId===kid.id||(!selectedKidId&&myKids[0]?.id===kid.id)?'active-family':''}`} onClick={()=>setSelectedKidId(kid.id)}>

                    <button className="btn btn-ghost btn-sm" onClick={()=>{setSelectedKidId(kid.id);setPage('monitor');}}>👁</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {page==='kids' && (
          <FamilyKidsManager
            myKids={myKids}
            selectedKidId={selectedKidId}
            setSelectedKidId={setSelectedKidId}
            setPage={setPage}
            setModal={setModal}
            setConfirm={setConfirm}
            toggleLock={toggleLock}
            deleteKid={deleteKid}
            launchKidSession={launchKidSession}
          />
        )}
        {page==='coins' && <FamilyCoinsPanel myKids={myKids} />}
        {page==='photos' && <FamilyPhotoGallery />}
        {page==='videos' && <FamilyVideoManager selectedKid={selectedKid} />}
        {page==='control' && <FamilyDeviceControl myKids={myKids} toggleLock={toggleLock} />}
        {page==='monitor' && <FamilyMonitor selectedKid={selectedKid} />}
        {page==='ai' && <FamilyAIAnalysis selectedKid={selectedKid} />}
      </div>

      {modal?.type==='addKid' && <AddKidModal familyId={currentUser.id} onClose={()=>setModal(null)} />}
      {modal?.type==='editKid' && <EditKidModal data={modal.data} onClose={()=>setModal(null)} />}
      <ConfirmDialog open={!!confirm} title="Konfirmasi" msg={confirm?.msg} danger onConfirm={confirm?.fn} onClose={()=>setConfirm(null)} />
    </div>
  );
}

function FamilyCoinsPanel({ myKids }) {
  const { state, updateState, showNotif, currentUser, addLog } = useContext(AppCtx);
  const [modal, setModal] = useState(null);
  const [tab, setTab] = useState('rewards');

  const myRewards = state.rewards.filter(r => r.familyId === currentUser.id);
  const pendingRedemptions = state.redemptions.filter(r => {
    const reward = state.rewards.find(rw=>rw.id===r.rewardId);
    return reward?.familyId === currentUser.id;
  });

  const approveRedemption = (redId) => {
    const red = state.redemptions.find(r=>r.id===redId);
    if (!red) return;
    updateState(s => {
      const r = s.redemptions.find(x=>x.id===redId);
      if (r) r.status = 'approved';
    });
    addLog(currentUser.name, `Menyetujui klaim "${red.rewardName}" oleh ${red.kidName}`, 'coin');
    showNotif(`Klaim ${red.rewardName} disetujui! 🎉`);
  };

  const rejectRedemption = (redId) => {
    const red = state.redemptions.find(r=>r.id===redId);
    if (!red) return;
    updateState(s => {
      const r = s.redemptions.find(x=>x.id===redId);
      if (r) r.status = 'rejected';
      // refund coins
      const k = s.users.kids.find(u=>u.id===red.kidId);
      if (k) k.coins = (k.coins||0) + red.cost;
    });
    showNotif(`Klaim ditolak, koin dikembalikan`,'warn');
  };

  const addReward = (form) => {
    updateState(s => { s.rewards.push({ ...form, id:uid(), familyId:currentUser.id, active:true }); });
    showNotif('Hadiah berhasil ditambahkan! 🎁');
  };

  return (
    <div className="fade-in">
      <div className="flex items-center justify-between mb-6">
        <div>
          <h2 style={{color:'var(--t1)'}}>🪙 Sistem Koin & Hadiah</h2>
          <p style={{color:'var(--t3)',fontSize:12,marginTop:2}}>Kelola koin anak dan daftar hadiah yang bisa ditukar</p>
        </div>
        <button className="btn btn-coin" onClick={()=>setModal({type:'addReward'})}>+ Tambah Hadiah</button>
      </div>

      {/* Coin summary */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:16,marginBottom:24}}>
        {myKids.map(kid => (
          <div key={kid.id} style={{background:'linear-gradient(135deg, rgba(255,190,26,0.1), rgba(250,204,21,0.05))',border:'1.5px solid rgba(255,190,26,0.25)',borderRadius:16,padding:16,textAlign:'center'}}>
            <div style={{fontSize:32}}>{kid.avatar}</div>
            <div style={{fontFamily:'var(--font-display)',fontWeight:800,fontSize:14,color:'var(--t1)',marginTop:6}}>{kid.name}</div>
            <div className="coin-badge" style={{marginTop:8,justifyContent:'center'}}>🪙 {kid.coins||0}</div>
            <div style={{fontSize:11,color:'var(--t3)',marginTop:6}}>🔥 {kid.streak||0} hari streak</div>
          </div>
        ))}
      </div>

      {/* Tabs */}
      <div style={{display:'flex',gap:8,marginBottom:16}}>
        {[{id:'rewards',label:'🎁 Daftar Hadiah'},{id:'pending',label:`⏳ Klaim Pending (${pendingRedemptions.filter(r=>r.status==='pending').length})`},{id:'history',label:'📋 Riwayat'}].map(t => (
          <button key={t.id} className={`btn ${tab===t.id?'btn-family':'btn-ghost'} btn-sm`} onClick={()=>setTab(t.id)}>{t.label}</button>
        ))}
      </div>

      {tab==='rewards' && (
        <div>
          {myRewards.length === 0 ? (
            <div className="card" style={{textAlign:'center',padding:'40px 0',color:'var(--t3)'}}>
              <div style={{fontSize:48,marginBottom:12}}>🎁</div>
              <div>Belum ada hadiah. Tambahkan hadiah agar anak termotivasi!</div>
            </div>
          ) : (
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:16}}>
              {myRewards.map(reward => (
                <div key={reward.id} className="reward-card">
                  <div style={{fontSize:40,marginBottom:8}}>{reward.emoji}</div>
                  <div style={{fontFamily:'var(--font-display)',fontWeight:700,color:'var(--t1)',fontSize:14}}>{reward.name}</div>
                  <div className="coin-badge" style={{marginTop:10,justifyContent:'center',fontSize:16}}>🪙 {reward.cost}</div>
                  <div style={{fontSize:11,color:'var(--t3)',marginTop:6}}>
                    <span className={`badge ${reward.type==='money'?'badge-success':reward.type==='toy'?'badge-kids':'badge-primary'}`}>{reward.type}</span>
                  </div>
                  <button className="btn btn-danger btn-sm" style={{marginTop:10,width:'100%',justifyContent:'center'}} onClick={()=>{
                    updateState(s=>{s.rewards=s.rewards.filter(r=>r.id!==reward.id)});
                    showNotif('Hadiah dihapus');
                  }}>Hapus</button>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {tab==='pending' && (
        <div>
          {pendingRedemptions.filter(r=>r.status==='pending').length === 0 ? (
            <div className="card" style={{textAlign:'center',padding:'40px 0',color:'var(--t3)'}}><div style={{fontSize:48,marginBottom:12}}>✅</div><div>Tidak ada klaim yang perlu disetujui</div></div>
          ) : (
            pendingRedemptions.filter(r=>r.status==='pending').map(red => {
              const kid = myKids.find(k=>k.id===red.kidId);
              const reward = state.rewards.find(r=>r.id===red.rewardId);
              return (
                <div key={red.id} className="card" style={{marginBottom:12,border:'1.5px solid rgba(255,190,26,0.3)'}}>
                  <div className="flex items-center gap-4">
                    <div style={{fontSize:36}}>{reward?.emoji||'🎁'}</div>
                    <div style={{flex:1}}>
                      <div style={{fontFamily:'var(--font-display)',fontWeight:700,color:'var(--t1)',fontSize:15}}>{red.rewardName}</div>
                      <div style={{fontSize:12,color:'var(--t3)'}}>Diminta oleh: {kid?.avatar} {red.kidName} · {timeAgo(red.requestedAt)}</div>
                      <div className="coin-badge" style={{marginTop:6}}>🪙 {red.cost} koin</div>
                    </div>
                    <div style={{display:'flex',gap:8}}>
                      <button className="btn btn-family btn-sm" onClick={()=>approveRedemption(red.id)}>✅ Setujui</button>
                      <button className="btn btn-danger btn-sm" onClick={()=>rejectRedemption(red.id)}>✕ Tolak</button>
                    </div>
                  </div>
                </div>
              );
            })
          )}
        </div>
      )}

      {tab==='history' && (
        <div className="card">
          <table>
            <thead><tr><th>Anak</th><th>Hadiah</th><th>Koin</th><th>Status</th><th>Waktu</th></tr></thead>
            <tbody>
              {pendingRedemptions.map(red => (
                <tr key={red.id}>
                  <td><span style={{fontWeight:600,color:'var(--t1)'}}>{red.kidName}</span></td>
                  <td>{red.rewardName}</td>
                  <td><span className="badge badge-coin">🪙 {red.cost}</span></td>
                  <td><span className={`badge ${red.status==='approved'?'badge-success':red.status==='rejected'?'badge-danger':'badge-warn'}`}>{red.status}</span></td>
                  <td style={{fontSize:11,color:'var(--t3)'}}>{timeAgo(red.requestedAt)}</td>
                </tr>
              ))}
              {pendingRedemptions.length===0 && <tr><td colSpan={5} style={{textAlign:'center',color:'var(--t3)',padding:'30px 0'}}>Belum ada riwayat</td></tr>}
            </tbody>
          </table>
        </div>
      )}

      {modal?.type==='addReward' && (
        <Modal open title="🎁 Tambah Hadiah Baru" onClose={()=>setModal(null)}>
          <AddRewardForm onSave={f=>{addReward(f);setModal(null);}} onClose={()=>setModal(null)} />
        </Modal>
      )}
    </div>
  );
}

      <div style={{marginBottom:14}}>

        <input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Contoh: Es Krim Favorit" />

        <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
          {EMOJIS.map(e => (<button key={e} onClick={()=>setForm({...form,emoji:e})} style={{width:36,height:36,borderRadius:8,fontSize:18,border:`2px solid ${form.emoji===e?'var(--coin)':'var(--border)'}`,background:form.emoji===e?'var(--coin-dim)':'var(--bg-elevated)',cursor:'pointer'}}>{e}</button>))}
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:16}}>
        <div>
          <label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:5,fontFamily:'var(--font-display)'}}>Harga (Koin)</label>
          <input type="number" min="1" value={form.cost} onChange={e=>setForm({...form,cost:parseInt(e.target.value)||1})} />

        <div>
          <label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:5,fontFamily:'var(--font-display)'}}>Tipe</label>
          <select value={form.type} onChange={e=>setForm({...form,type:e.target.value})}>
