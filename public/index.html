      <div className="flex gap-3 justify-end">
        <button className="btn btn-ghost" onClick={onClose}>Batal</button>
        <button className="btn btn-coin" onClick={()=>{if(form.name)onSave(form);}} disabled={!form.name}>Tambah Hadiah</button>
      </div>
    </>
  );
}

function FamilyVideoManager({ selectedKid }) {
  const { state, updateState, showNotif, currentUser, addLog } = useContext(AppCtx);
  const [modal, setModal] = useState(null);
  const [selectedAlb, setSelectedAlb] = useState(null);
  const allAlbums = state.albums;
  const toggleAlbum = (albumId) => {
    updateState(s => { const k = s.users.kids.find(u=>u.id===selectedKid?.id); if (!k) return; if (k.allowedAlbums.includes(albumId)) k.allowedAlbums = k.allowedAlbums.filter(a=>a!==albumId); else k.allowedAlbums.push(albumId); });
  };
  const addAlbum = (form) => {
    const alb = { id:uid(), name:form.name, emoji:form.emoji, videos:[], createdBy:currentUser.id, color:form.color };
    updateState(s => { s.albums.push(alb); });
    addLog(currentUser.name, `Menambah album "${form.name}"`, 'edit');
    showNotif('Album berhasil ditambahkan');
  };
  return (
    <div className="fade-in">
      <div className="flex items-center justify-between mb-6">
        <div><h2 style={{color:'var(--t1)'}}>▶ Kelola Video</h2>{selectedKid && <p style={{color:'var(--t3)',fontSize:12,marginTop:2}}>Untuk: {selectedKid.avatar} {selectedKid.name}</p>}</div>
        <button className="btn btn-family" onClick={()=>setModal({type:'addAlbum'})}>+ Buat Album</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1.4fr',gap:20}}>
        <div className="card">
          <h3 style={{color:'var(--t1)',marginBottom:4}}>📂 Semua Album</h3>
          <p style={{color:'var(--t3)',fontSize:11,marginBottom:16}}>Toggle untuk izinkan akses ke {selectedKid?.name||'anak'}</p>
          {allAlbums.map(alb => {
            const allowed = selectedKid?.allowedAlbums?.includes(alb.id);
            return (
        <div key={alb.id} onClick={()=>setSelectedAlb(alb.id===selectedAlb?null:alb.id)} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 12px',borderRadius:10,marginBottom:6,cursor:'pointer',background:selectedAlb===alb.id?'var(--family-dim)':'var(--bg-elevated)',border:`1px solid ${selectedAlb===alb.id?'rgba(123,220,56,0.3)':'var(--border)'}`,transition:'all 0.15s'}}>
                <span style={{fontSize:22}}>{alb.emoji}</span>
                <div style={{flex:1}}><div style={{fontWeight:600,color:'var(--t1)',fontSize:13}}>{alb.name}</div><div style={{fontSize:11,color:'var(--t3)'}}>{alb.videos.length} video</div></div>
                {selectedKid && <div onClick={e=>{e.stopPropagation();toggleAlbum(alb.id);}}><Toggle checked={allowed||false} onChange={()=>toggleAlbum(alb.id)} /></div>}

        <div className="card">

            const alb = state.albums.find(a=>a.id===selectedAlb);
            const videos = DEMO_VIDEOS.filter(v => alb?.videos?.includes(v.id));
            return (<>
              <div className="flex items-center justify-between mb-4">
                <div className="flex items-center gap-2"><span style={{fontSize:22}}>{alb?.emoji}</span><h3 style={{color:'var(--t1)'}}>{alb?.name}</h3></div>
                <button className="btn btn-family btn-sm" onClick={()=>setModal({type:'addVideo',albumId:selectedAlb})}>+ Tambah Video</button>
              </div>
              {videos.length ? videos.map(v => (<div key={v.id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 0',borderBottom:'1px solid var(--border)'}}><div style={{width:40,height:40,background:'var(--bg)',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,border:'1px solid var(--border)'}}>{v.thumb}</div><div style={{flex:1}}><div style={{fontWeight:600,color:'var(--t1)',fontSize:13}}>{v.title}</div><div style={{fontSize:11,color:'var(--t3)'}}>⏱ {v.duration}</div></div><button className="btn btn-icon btn-sm" onClick={()=>{updateState(s=>{const a=s.albums.find(x=>x.id===selectedAlb);if(a)a.videos=a.videos.filter(i=>i!==v.id);});showNotif('Video dihapus');}}>🗑️</button></div>)) : (<div style={{textAlign:'center',padding:'40px 0',color:'var(--t3)'}}><div style={{fontSize:40,marginBottom:12}}>📭</div><div>Album kosong. Tambahkan video!</div></div>)}
            </>);
          })() : <div style={{textAlign:'center',padding:'60px 0',color:'var(--t3)'}}><div style={{fontSize:40,marginBottom:12}}>👈</div><div>Pilih album di sebelah kiri</div></div>}
        </div>
      </div>
{modal?.type==='addAlbum' && <Modal open title="+ Buat Album Baru" onClose={()=>setModal(null)}><div style={{marginBottom:16}}><label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:5,fontFamily:'var(--font-display)'}}>Nama Album</label><input placeholder="Contoh: Belajar Membaca" id="alb-name" /></div><div className="flex gap-3 justify-end"><button className="btn btn-ghost" onClick={()=>setModal(null)}>Batal</button><button className="btn btn-family" onClick={()=>{const n=document.getElementById('alb-name').value;if(n){addAlbum({name:n,emoji:'📚',color:'#0078ff'});setModal(null);}}}>Buat Album</button></div></Modal>}

    </div>
  );

function FamilyPhotoGallery() {

  const [modal, setModal] = useState(null);
  const photoAlbums = (state.photoAlbums || []).filter(a => a.familyId === currentUser.id);
  const selectedAlbum = photoAlbums.find(a => a.id === selectedAlbumId) || photoAlbums[0];

  const addAlbum = (form) => {
    const album = {
      id: uid(),
      familyId: currentUser.id,
      name: form.name,
      description: form.description,
      cover: form.cover,
      createdAt: now(),
      photos: []
    };
    updateState(s => {
      if (!Array.isArray(s.photoAlbums)) s.photoAlbums = [];
      s.photoAlbums.unshift(album);
    });
    setSelectedAlbumId(album.id);
    addLog(currentUser.name, `Membuat album foto "${form.name}"`, 'photo');
    showNotif('Album foto berhasil dibuat');
    setModal(null);
  };

  const addPhoto = (albumId, form) => {
    updateState(s => {
      if (!Array.isArray(s.photoAlbums)) s.photoAlbums = [];
      const album = s.photoAlbums.find(a => a.id === albumId && a.familyId === currentUser.id);
      if (!album) return;
      if (!Array.isArray(album.photos)) album.photos = [];
      album.photos.unshift({
        id: uid(),
        title: form.title,
        caption: form.caption,
        src: form.src,
        color: form.color,
        emoji: form.emoji,
        createdAt: now()
      });
    });
    addLog(currentUser.name, `Menambah foto ke album kenangan`, 'photo');
    showNotif('Foto kenangan ditambahkan');
    setModal(null);
  };

  const deletePhoto = (albumId, photoId) => {
    updateState(s => {
      const album = (s.photoAlbums || []).find(a => a.id === albumId && a.familyId === currentUser.id);
      if (album) album.photos = (album.photos || []).filter(p => p.id !== photoId);
    });
    showNotif('Foto dihapus');
  };

  return (
    <div className="fade-in">
      <div className="flex items-center justify-between mb-6">
        <div>
          <h2 style={{color:'var(--t1)'}}>Foto Keluarga</h2>
          <p style={{color:'var(--t3)',fontSize:12,marginTop:2}}>Galeri album kenangan dan momen keluarga</p>
        </div>
        <button className="btn btn-family" onClick={()=>setModal({type:'album'})}>+ Album</button>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1.25fr',gap:18}}>
        <div>
          <div style={{display:'grid',gap:12}}>
            {photoAlbums.length ? photoAlbums.map(album => (
              <div key={album.id} className="photo-album-card" onClick={()=>setSelectedAlbumId(album.id)} style={{borderRadius:20,padding:12,cursor:'pointer',border:selectedAlbum?.id===album.id?'2px solid var(--primary)':'1px solid var(--border)',transition:'all 0.18s'}}>
                <div className="photo-cover" style={{'--photo-color':album.cover || '#0aa7e5',minHeight:112}}>
                  {(album.photos || [])[0]?.src ? <img src={album.photos[0].src} alt={album.name} /> : <div className="photo-cover-emoji">FOTO</div>}
                  <div className="photo-count-badge">{(album.photos||[]).length} foto</div>
                </div>
                <div style={{padding:'12px 4px 2px'}}>
                  <div style={{fontFamily:'var(--font-display)',fontWeight:900,color:'var(--t1)',fontSize:15}}>{album.name}</div>
                  <div style={{fontSize:12,color:'var(--t3)',marginTop:2,lineHeight:1.35}}>{album.description || 'Album kenangan keluarga'}</div>
                </div>
              </div>
            )) : (
              <div className="card" style={{textAlign:'center',padding:28}}>
                <div style={{fontSize:44,marginBottom:10}}>📷</div>
                <div style={{fontWeight:800,color:'var(--t1)',fontFamily:'var(--font-display)'}}>Belum ada album foto</div>
                <div style={{fontSize:12,color:'var(--t3)',marginTop:4}}>Buat album pertama untuk momen keluarga</div>
              </div>
            )}
          </div>
        </div>

        <div className="card" style={{minHeight:420}}>
          {selectedAlbum ? (
            <>
              <div className="flex items-center justify-between mb-4">
                <div>
                  <h3 style={{color:'var(--t1)'}}>{selectedAlbum.name}</h3>
                  <p style={{fontSize:12,color:'var(--t3)',marginTop:2}}>{selectedAlbum.description || 'Album kenangan keluarga'}</p>
                </div>
                <button className="btn btn-primary btn-sm" onClick={()=>setModal({type:'photo', albumId:selectedAlbum.id})}>+ Foto</button>
              </div>
              {(selectedAlbum.photos || []).length ? (
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(150px,1fr))',gap:12}}>
                  {selectedAlbum.photos.map(photo => (
                    <div key={photo.id} className="photo-memory-card" style={{borderRadius:18,padding:10,position:'relative'}}>
                      <div className="photo-cover" style={{'--photo-color':photo.color || selectedAlbum.cover || '#0aa7e5',minHeight:132}}>
                        {photo.src ? <img src={photo.src} alt={photo.title} /> : <div className="photo-cover-emoji">{photo.emoji || '\u{1F4F7}'}</div>}
                      </div>
                      <div style={{padding:'10px 2px 2px'}}>
                        <div style={{fontFamily:'var(--font-display)',fontWeight:800,color:'var(--t1)',fontSize:13}}>{photo.title}</div>
                        <div style={{fontSize:11,color:'var(--t3)',lineHeight:1.35,marginTop:3}}>{photo.caption || 'Momen keluarga'}</div>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:8}}>
                          <span style={{fontSize:10,color:'var(--t4)'}}>{timeAgo(photo.createdAt)}</span>
                          <button className="btn btn-ghost btn-sm" onClick={()=>deletePhoto(selectedAlbum.id, photo.id)} style={{padding:'3px 8px',fontSize:10}}>Hapus</button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
                <div style={{textAlign:'center',padding:'70px 0',color:'var(--t3)'}}>
                  <div style={{fontSize:20,marginBottom:12,fontFamily:'var(--font-display)',fontWeight:900}}>FOTO</div>
                  <div style={{fontFamily:'var(--font-display)',fontWeight:800,color:'var(--t1)'}}>Album ini masih kosong</div>
                  <div style={{fontSize:12,marginTop:4}}>Tambahkan foto keluarga pertama</div>
                </div>
              )}
            </>
          ) : (
            <div style={{textAlign:'center',padding:'70px 0',color:'var(--t3)'}}>Pilih atau buat album foto</div>
          )}
        </div>
      </div>

      {modal?.type === 'album' && <Modal open title="Album Foto Baru" onClose={()=>setModal(null)}><AddPhotoAlbumForm onSave={addAlbum} onClose={()=>setModal(null)} /></Modal>}
      {modal?.type === 'photo' && <Modal open title="Tambah Foto Kenangan" onClose={()=>setModal(null)}><AddPhotoForm onSave={(form)=>addPhoto(modal.albumId, form)} onClose={()=>setModal(null)} /></Modal>}
    </div>
  );
}

function AddPhotoForm({ onSave, onClose }) {
  const [form, setForm] = useState({ title:'', caption:'', src:'', color:'#0aa7e5', emoji:'\u{1F4F7}' });
  const [reading, setReading] = useState(false);
  const handleFile = (file) => {
    if (!file) return;
    if (!file.type.startsWith('image/')) return;
    setReading(true);
    const reader = new FileReader();
    reader.onload = () => {
      setForm(prev => ({ ...prev, src: reader.result }));
      setReading(false);
    };
    reader.onerror = () => setReading(false);
    reader.readAsDataURL(file);
  };
  return (
    <>
      <div className="photo-cover mb-4" style={{'--photo-color':form.color,minHeight:170}}>
        {form.src ? <img src={form.src} alt="Preview foto" /> : <div className="photo-cover-emoji">{form.emoji}</div>}
      </div>
      <div style={{marginBottom:14}}>
        <label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:5,fontFamily:'var(--font-display)'}}>Upload Foto</label>
        <input type="file" accept="image/*" onChange={e=>handleFile(e.target.files?.[0])} />
        {reading && <div style={{fontSize:11,color:'var(--t3)',marginTop:6}}>Membaca foto...</div>}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 92px',gap:10,marginBottom:14}}>
        <div>
          <label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:5,fontFamily:'var(--font-display)'}}>Judul</label>
          <input value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="Contoh: Ulang Tahun Sari" />
        </div>
        <div>
          <label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:5,fontFamily:'var(--font-display)'}}>Ikon</label>
          <input value={form.emoji} maxLength="4" onChange={e=>setForm({...form,emoji:e.target.value})} />

      </div>
      <div style={{marginBottom:18}}>
        <label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:5,fontFamily:'var(--font-display)'}}>Cerita Momen</label>
        <textarea value={form.caption} onChange={e=>setForm({...form,caption:e.target.value})} placeholder="Tuliskan kenangan singkat" rows="3" />
      </div>
      <div className="flex gap-3 justify-end">
        <button className="btn btn-ghost" onClick={onClose}>Batal</button>
        <button className="btn btn-primary" onClick={()=>form.title && onSave(form)} disabled={!form.title || reading}>Simpan Foto</button>
      </div>
    </>
  );

  const streamRef = useRef(null);

              {[{label:'Tonton',value:selectedKid.watchTime+' mnt',icon:'⏱'},{label:'Video',value:selectedKid.totalVideos,icon:'✓'},{label:'Hafalan',value:(selectedKid.hafalanDone||[]).length,icon:'📖'},{label:'Koin',value:'🪙 '+(selectedKid.coins||0),icon:'🪙'}].map(r=>(<div key={r.label} style={{background:'var(--bg-elevated)',borderRadius:8,padding:'12px',textAlign:'center',border:'1px solid var(--border)'}}><div style={{fontSize:20,marginBottom:4}}>{r.icon}</div><div style={{fontFamily:'var(--font-display)',fontWeight:700,fontSize:16,color:'var(--t1)'}}>{r.value}</div><div style={{fontSize:10,color:'var(--t3)',marginTop:2}}>{r.label}</div></div>))}

  const [loading, setLoading] = useState(false);
  const [localKey, setLocalKey] = useState(apiKey||'');
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const streamRef = useRef(null);
  const startCam = async () => { try { const s = await navigator.mediaDevices.getUserMedia({video:true}); streamRef.current=s; if(videoRef.current)videoRef.current.srcObject=s; setCameraOn(true); } catch(e){showNotif('Izin kamera diperlukan','error');} };
  const stopCam = () => { streamRef.current?.getTracks().forEach(t=>t.stop()); setCameraOn(false); };
  const analyze = async () => {
    if (!cameraOn) { showNotif('Aktifkan kamera dulu','error'); return; }
    const key = localKey||apiKey;
    if (!key) { showNotif('Masukkan API Key dulu','error'); return; }
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    canvas.width = videoRef.current.videoWidth; canvas.height = videoRef.current.videoHeight;
    ctx.drawImage(videoRef.current, 0, 0);
    const b64 = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
    setLoading(true); setResult(null);
    try {
      const resp = await fetch('/api/ai/analyze', { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()}, body:JSON.stringify({ imageBase64: b64, apiKey: key }) });
      const data = await resp.json();
      const text = data.content?.[0]?.text||'';
      let parsed;
      try { const json = text.match(/\{[\s\S]*\}/)?.[0]; parsed = JSON.parse(json); } catch(e) { parsed = {kondisi:text,postur:'—',lingkungan:'—',rekomendasi:'—',skor_perhatian:5}; }
      setResult(parsed);
      addLog(currentUser.name, `AI analisis kondisi ${selectedKid?.name}`, 'ai');
    } catch(e) { showNotif('Error API: '+e.message,'error'); }
    setLoading(false);
  };
  useEffect(()=>()=>streamRef.current?.getTracks().forEach(t=>t.stop()),[]);
  return (
    <div className="fade-in">
      <div className="flex items-center justify-between mb-6"><div><h2 style={{color:'var(--t1)'}}>🧠 AI Face Analysis</h2><p style={{color:'var(--t3)',fontSize:12,marginTop:2}}>Analisis kondisi anak menggunakan Claude AI</p></div>{cameraOn&&<span className="badge badge-danger animate-pulse">● KAMERA</span>}</div>
      <div className="card mb-5" style={{border:'1px solid rgba(0,120,255,0.28)'}}><div className="flex items-center gap-3"><span style={{fontSize:20}}>🔑</span><div style={{flex:1}}><label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:4,fontFamily:'var(--font-display)'}}>Anthropic API Key</label><input type="password" value={localKey} onChange={e=>setLocalKey(e.target.value)} placeholder="sk-ant-..." /></div></div></div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
        <div>
          <div style={{background:'#000',borderRadius:14,aspectRatio:'4/3',position:'relative',overflow:'hidden',marginBottom:14,display:'flex',alignItems:'center',justifyContent:'center'}}><video ref={videoRef} autoPlay playsInline muted style={{width:'100%',height:'100%',objectFit:'cover',display:cameraOn?'block':'none'}} /><canvas ref={canvasRef} style={{display:'none'}} />{!cameraOn&&<div style={{textAlign:'center',color:'var(--t3)'}}><div style={{fontSize:48,marginBottom:12}}>🧠</div><div style={{fontSize:13}}>Aktifkan kamera untuk AI</div></div>}{cameraOn&&<div style={{position:'absolute',inset:0,pointerEvents:'none'}}><div className="cam-corner tl"/><div className="cam-corner tr"/><div className="cam-corner bl"/><div className="cam-corner br"/>{loading&&<div className="scan-line"/>}</div>}</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}><button className={`btn ${cameraOn?'btn-danger':'btn-family'}`} style={{justifyContent:'center'}} onClick={cameraOn?stopCam:startCam}>{cameraOn?'⏹ Stop':'📷 Kamera'}</button><button className="btn btn-primary" style={{justifyContent:'center'}} onClick={analyze} disabled={loading||!cameraOn}>{loading?<span className="animate-spin">⊙</span>:null}{loading?'Menganalisis...':'🧠 Analisis AI'}</button></div>
        </div>
        <div>
          <h3 style={{color:'var(--t1)',marginBottom:14}}>📊 Hasil Analisis</h3>
          {result?(<div className="fade-in">
            <div style={{background:'var(--bg-elevated)',borderRadius:12,padding:16,marginBottom:14,textAlign:'center',border:'1px solid var(--border)'}}><div style={{fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:8,fontFamily:'var(--font-display)'}}>Skor Perhatian</div><div style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:48,color:result.skor_perhatian>=7?'var(--success)':result.skor_perhatian>=4?'var(--warn)':'var(--danger)'}}>{result.skor_perhatian}<span style={{fontSize:20,opacity:0.5}}>/10</span></div><div className="progress" style={{marginTop:10}}><div className="progress-bar" style={{width:`${result.skor_perhatian*10}%`,background:result.skor_perhatian>=7?'var(--success)':result.skor_perhatian>=4?'var(--warn)':'var(--danger)'}}/></div></div>
            {[{key:'kondisi',label:'Kondisi Umum',icon:'😊'},{key:'postur',label:'Postur',icon:'🧍'},{key:'lingkungan',label:'Lingkungan',icon:'🏠'},{key:'rekomendasi',label:'Rekomendasi',icon:'💡'}].map(f=>(<div key={f.key} style={{background:'var(--bg-elevated)',borderRadius:10,padding:12,marginBottom:8,border:'1px solid var(--border)'}}><div style={{fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:4,fontFamily:'var(--font-display)'}}>{f.icon} {f.label}</div><div style={{fontSize:13,color:'var(--t1)'}}>{result[f.key]||'—'}</div></div>))}
          </div>):(<div style={{background:'var(--bg-elevated)',borderRadius:12,padding:30,textAlign:'center',color:'var(--t3)'}}><div style={{fontSize:48,marginBottom:12}}>🔍</div><div style={{fontSize:13}}>Tekan "Analisis AI" untuk laporan kondisi anak</div></div>)}
        </div>
      </div>
    </div>
  );
}

// ============================================================
// MATH GAME
// ============================================================
function MathGame({ kid, onBack }) {
  const { addCoins, updateState, showNotif } = useContext(AppCtx);
  const [score, setScore] = useState(0);
  const [total, setTotal] = useState(0);
  const [q, setQ] = useState(null);
  const [answered, setAnswered] = useState(null);
  const [gameOver, setGameOver] = useState(false);
  const [streak, setStreak] = useState(0);
  const [coinAnim, setCoinAnim] = useState(false);
  const MAX_Q = 10;

  const genQuestion = useCallback(() => {
    const level = kid?.age <= 6 ? 'easy' : kid?.age <= 9 ? 'medium' : 'hard';
    let a, b, op, answer;
    if (level === 'easy') { a = Math.floor(Math.random()*10)+1; b = Math.floor(Math.random()*10)+1; op = '+'; answer = a+b; }
    else if (level === 'medium') { a = Math.floor(Math.random()*20)+5; b = Math.floor(Math.random()*15)+1; op = Math.random()>0.5?'+':'-'; answer = op==='+'?a+b:Math.max(a,b)-Math.min(a,b); if(op==='-'){const tmp=Math.max(a,b);b=Math.min(a,b);a=tmp;} }
    else { a = Math.floor(Math.random()*50)+10; b = Math.floor(Math.random()*10)+2; op = Math.random()>0.7?'×':Math.random()>0.5?'+':'-'; answer = op==='+'?a+b:op==='-'?a-b:a*b; if(op==='-'&&answer<0){const tmp=a;a=b;b=tmp;answer=a-b;} }
    const opts = new Set([answer]);
    while(opts.size < 4) { const w = answer + (Math.floor(Math.random()*10)-5); if(w!==answer&&w>=0) opts.add(w); }
    return { text: `${a} ${op} ${b} = ?`, answer, options: [...opts].sort(()=>Math.random()-0.5), emoji: op==='+'?'➕':op==='-'?'➖':'✖️' };
  }, [kid]);

  useEffect(() => { if (!q && !gameOver) setQ(genQuestion()); }, [q, gameOver, genQuestion]);

  const handleAnswer = (opt) => {
    if (answered !== null) return;
    const correct = opt === q.answer;
    setAnswered(opt);
    setTotal(t => t+1);
    if (correct) {
      setScore(s => s+1);
      setStreak(s => s+1);
      addCoins(kid?.id, 5, 'Jawaban benar matematika');
      setCoinAnim(true);
      setTimeout(()=>setCoinAnim(false), 800);
      updateState(s => { const k = s.users.kids.find(u=>u.id===kid?.id); if(k){if(!k.gameStats)k.gameStats={};if(!k.gameStats.math)k.gameStats.math={played:0,correct:0};k.gameStats.math.played++;k.gameStats.math.correct++;} });
    } else {
      setStreak(0);
      updateState(s => { const k = s.users.kids.find(u=>u.id===kid?.id); if(k){if(!k.gameStats)k.gameStats={};if(!k.gameStats.math)k.gameStats.math={played:0,correct:0};k.gameStats.math.played++;} });
    }
    setTimeout(() => {
      setAnswered(null);
      if (total + 1 >= MAX_Q) setGameOver(true);
      else setQ(genQuestion());
    }, 1200);
  };

  if (gameOver) return (
    <div style={{padding:'40px 24px',textAlign:'center'}}>
      <div className="animate-star" style={{fontSize:80,marginBottom:16}}>{score>=8?'🏆':score>=6?'⭐':'🎯'}</div>
      <div style={{fontFamily:'var(--font-kids)',fontSize:32,color:'#fff',marginBottom:8}}>{score>=8?'Luar Biasa!':score>=6?'Bagus Sekali!':'Terus Semangat!'}</div>
      <div style={{fontSize:18,color:'rgba(255,255,255,0.6)',marginBottom:20}}>Skor kamu: {score}/{total}</div>
      <div className="coin-badge" style={{fontSize:22,justifyContent:'center',marginBottom:24}}>🪙 +{score*5} koin didapat!</div>
      <div style={{display:'flex',gap:12,justifyContent:'center'}}>
        <button className="btn btn-ghost" onClick={onBack} style={{color:'#fff',borderColor:'rgba(255,255,255,0.2)'}}>&lt; Kembali</button>
        <button className="btn" style={{background:'var(--primary)',color:'#fff',fontFamily:'var(--font-display)',fontWeight:700}} onClick={()=>{setScore(0);setTotal(0);setGameOver(false);setStreak(0);setQ(genQuestion());}}>🔄 Main Lagi</button>
      </div>
    </div>
  );

  if (!q) return <div style={{textAlign:'center',padding:'80px',color:'rgba(255,255,255,0.5)'}}>Memuat...</div>;

  return (
    <div style={{padding:'20px 24px'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
        <div style={{fontFamily:'var(--font-display)',fontWeight:700,color:'rgba(255,255,255,0.6)',fontSize:13}}>
          Soal {total+1}/{MAX_Q}
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          {streak >= 3 && <span style={{background:'rgba(251,146,60,0.2)',borderRadius:20,padding:'4px 10px',fontSize:12,color:'var(--warn)',fontFamily:'var(--font-display)',fontWeight:700}}>🔥 Streak {streak}!</span>}
          <div className="coin-badge" style={{fontSize:14}}>🪙 {kid?.coins||0}</div>
        </div>
      </div>

      {coinAnim && <div style={{position:'fixed',top:'30%',left:'50%',transform:'translateX(-50%)',fontSize:32,color:'var(--coin)',fontFamily:'var(--font-display)',fontWeight:900,pointerEvents:'none',animation:'coinPop 0.8s ease forwards',zIndex:100}}>+5🪙</div>}

    <div style={{background:'linear-gradient(135deg, rgba(0,120,255,0.15), rgba(0,120,255,0.05))',border:'1.5px solid rgba(0,120,255,0.32)',borderRadius:24,padding:'40px 30px',textAlign:'center',marginBottom:24}}>
        <div style={{fontSize:50,marginBottom:16}}>{q.emoji}</div>
        <div style={{fontFamily:'var(--font-kids)',fontSize:42,color:'#fff',lineHeight:1.2}}>{q.text}</div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        {q.options.map((opt,i) => (
          <button key={i} className={`answer-btn ${answered!==null?(opt===q.answer?'correct':opt===answered?'wrong':''):''}` } onClick={()=>handleAnswer(opt)} style={{fontSize:28,fontFamily:'var(--font-display)',fontWeight:800}}>
            {opt}
          </button>
        ))}
      </div>

      <div style={{marginTop:16,background:'rgba(255,255,255,0.04)',borderRadius:12,height:6,overflow:'hidden'}}>
        <div style={{height:'100%',background:'var(--primary)',borderRadius:12,width:`${(total/MAX_Q)*100}%`,transition:'width 0.4s'}}/>
      </div>
    </div>
  );
}

// TEBAK GAME (Hewan / Tanaman / Warna)
// ============================================================
function TebakGame({ kid, gameId, onBack }) {
  const { addCoins, updateState } = useContext(AppCtx);
  const gameData = GAME_DATA[gameId];
  const questions = [...gameData.questions].sort(()=>Math.random()-0.5);
  const [qIdx, setQIdx] = useState(0);
  const [answered, setAnswered] = useState(null);
  const [score, setScore] = useState(0);
  const [gameOver, setGameOver] = useState(false);
  const [coinAnim, setCoinAnim] = useState(false);
  const MAX_Q = Math.min(questions.length, 8);
  const q = questions[qIdx];

  const handleAnswer = (opt) => {
    if (answered !== null) return;
    const correct = opt === q.a;
    setAnswered(opt);
    if (correct) {
      setScore(s=>s+1);
      addCoins(kid?.id, 3, `Jawaban benar ${gameData.title}`);
      setCoinAnim(true);
      setTimeout(()=>setCoinAnim(false), 800);
      updateState(s => { const k = s.users.kids.find(u=>u.id===kid?.id); if(k){if(!k.gameStats)k.gameStats={};if(!k.gameStats[gameId])k.gameStats[gameId]={played:0,correct:0};k.gameStats[gameId].played++;k.gameStats[gameId].correct++;} });
    } else {
      updateState(s => { const k = s.users.kids.find(u=>u.id===kid?.id); if(k){if(!k.gameStats)k.gameStats={};if(!k.gameStats[gameId])k.gameStats[gameId]={played:0,correct:0};k.gameStats[gameId].played++;} });
    }
    setTimeout(() => {
      setAnswered(null);
      if (qIdx + 1 >= MAX_Q) setGameOver(true);
      else setQIdx(i=>i+1);
    }, 1300);
  };

  if (gameOver) return (
    <div style={{padding:'40px 24px',textAlign:'center'}}>
      <div style={{fontSize:80,marginBottom:16}}>{score>=6?'🏆':score>=4?'⭐':'🎯'}</div>
      <div style={{fontFamily:'var(--font-kids)',fontSize:30,color:'#fff',marginBottom:8}}>{score>=6?'Hebat Sekali!':score>=4?'Bagus!':'Terus Belajar!'}</div>
      <div style={{fontSize:18,color:'rgba(255,255,255,0.6)',marginBottom:20}}>Skor: {score}/{MAX_Q}</div>
      <div className="coin-badge" style={{fontSize:22,justifyContent:'center',marginBottom:24}}>🪙 +{score*3} koin didapat!</div>
      <div style={{display:'flex',gap:12,justifyContent:'center'}}>
        <button className="btn btn-ghost" onClick={onBack} style={{color:'#fff',borderColor:'rgba(255,255,255,0.2)'}}>&lt; Kembali</button>
        <button className="btn" style={{background:gameData.color,color:'#fff',fontFamily:'var(--font-display)',fontWeight:700}} onClick={()=>{setScore(0);setQIdx(0);setGameOver(false);}}>🔄 Main Lagi</button>
      </div>
    </div>
  );

  return (
    <div style={{padding:'20px 24px'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:24}}>{gameData.emoji}</span>
          <div style={{fontFamily:'var(--font-display)',fontWeight:700,color:'rgba(255,255,255,0.8)',fontSize:14}}>{gameData.title}</div>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <span style={{color:'rgba(255,255,255,0.5)',fontSize:12}}>{qIdx+1}/{MAX_Q}</span>
          <div className="coin-badge" style={{fontSize:13}}>🪙 {kid?.coins||0}</div>
        </div>
      </div>

      {coinAnim && <div style={{position:'fixed',top:'30%',left:'50%',transform:'translateX(-50%)',fontSize:32,color:'var(--coin)',fontFamily:'var(--font-display)',fontWeight:900,pointerEvents:'none',animation:'coinPop 0.8s ease forwards',zIndex:100}}>+3🪙</div>}

      <div style={{background:`linear-gradient(135deg, ${gameData.color}22, ${gameData.color}08)`,border:`1.5px solid ${gameData.color}40`,borderRadius:24,padding:'30px 24px',textAlign:'center',marginBottom:20}}>
        <div style={{fontSize:60,marginBottom:16}}>{q.emoji}</div>
        <div style={{fontFamily:'var(--font-body)',fontSize:17,color:'rgba(255,255,255,0.9)',lineHeight:1.6}}>{q.q}</div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        {q.options.map((opt,i) => (
          <button key={i} className={`answer-btn ${answered!==null?(opt===q.a?'correct':opt===answered?'wrong':''):''}` } onClick={()=>handleAnswer(opt)}>
            {opt}
          </button>
        ))}
      </div>

      {answered && <div style={{textAlign:'center',marginTop:14,fontFamily:'var(--font-display)',fontWeight:700,color:answered===q.a?'var(--success)':'var(--danger)',fontSize:15}}>{answered===q.a?'✅ Benar! Hebat!':'❌ Salah. Jawabannya: '+q.a}</div>}

      <div style={{marginTop:14,background:'rgba(255,255,255,0.04)',borderRadius:12,height:6,overflow:'hidden'}}>
        <div style={{height:'100%',background:gameData.color,borderRadius:12,width:`${(qIdx/MAX_Q)*100}%`,transition:'width 0.4s'}}/>
      </div>
    </div>
  );
}

                  <span className="badge badge-coin" style={{fontSize:11}}>🪙 +{item.coins}</span>
                </div>
              </div>
              <div style={{textAlign:'center'}}>
                {isDone ? (<div><div style={{fontSize:28}}>✅</div><div style={{fontSize:11,color:'var(--success)',fontFamily:'var(--font-display)',fontWeight:700}}>Selesai!</div></div>) : (<div><div style={{fontSize:28}}>🎙️</div><div style={{fontSize:11,color:'rgba(255,255,255,0.5)',fontFamily:'var(--font-display)',fontWeight:700}}>Rekam</div></div>)}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ============================================================
// HAFALAN RECORDER
// ============================================================
function HafalanRecorder({ hafalanItem, kid, onBack }) {
  const { addCoins, updateState, showNotif } = useContext(AppCtx);
  const [recording, setRecording] = useState(false);
  const [recorded, setRecorded] = useState(false);
  const [audioUrl, setAudioUrl] = useState(null);
  const [duration, setDuration] = useState(0);
  const [submitted, setSubmitted] = useState(false);
  const [timer, setTimer] = useState(0);
  const mediaRecorder = useRef(null);
  const chunks = useRef([]);
  const timerRef = useRef(null);
  const isDone = (kid?.hafalanDone||[]).includes(hafalanItem.id);

  const startRecording = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder.current = new MediaRecorder(stream);
      chunks.current = [];
      mediaRecorder.current.ondataavailable = e => chunks.current.push(e.data);
      mediaRecorder.current.onstop = () => {
        const blob = new Blob(chunks.current, { type: 'audio/webm' });
        const url = URL.createObjectURL(blob);
        setAudioUrl(url);
        setRecorded(true);
        setDuration(timer);
        stream.getTracks().forEach(t=>t.stop());
      };
      mediaRecorder.current.start();
      setRecording(true);
      setTimer(0);
      timerRef.current = setInterval(()=>setTimer(t=>t+1),1000);
    } catch(e) {
      showNotif('Izin mikrofon diperlukan','error');
    }
  };

  const stopRecording = () => {
    mediaRecorder.current?.stop();
    setRecording(false);
    clearInterval(timerRef.current);
  };

  const submitHafalan = () => {
    updateState(s => {
      const k = s.users.kids.find(u=>u.id===kid?.id);
      if (k && !k.hafalanDone.includes(hafalanItem.id)) {
        k.hafalanDone.push(hafalanItem.id);
        // Check badge
        if (!k.badges) k.badges = [];
        if (k.hafalanDone.length >= 5 && !k.badges.includes('hafalan_hero')) k.badges.push('hafalan_hero');
      }
      s.hafalanRecords.push({ id:uid(), kidId:kid?.id, hafalanId:hafalanItem.id, recordedAt:now(), duration, approved:false });
    });
    addCoins(kid?.id, hafalanItem.coins, `Hafalan ${hafalanItem.name} selesai`);
    setSubmitted(true);
  };

  const formatTime = (s) => `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;

  if (submitted || isDone) return (
    <div style={{padding:'40px 24px',textAlign:'center'}}>
      <div style={{fontSize:80,marginBottom:16}} className="animate-star">🎉</div>
      <div style={{fontFamily:'var(--font-kids)',fontSize:28,color:'#fff',marginBottom:8}}>Alhamdulillah! 🌟</div>
      <div style={{fontSize:16,color:'rgba(255,255,255,0.6)',marginBottom:20}}>Hafalan {hafalanItem.name} berhasil direkam!</div>
      <div className="coin-badge" style={{fontSize:22,justifyContent:'center',marginBottom:8}}>🪙 +{hafalanItem.coins} koin!</div>
      <div style={{fontSize:12,color:'rgba(255,255,255,0.4)',marginBottom:24}}>Orang tua akan mendengarkan rekamanmu</div>
      <button className="btn" style={{background:'var(--success)',color:'#fff',fontFamily:'var(--font-display)',fontWeight:700,padding:'12px 32px'}} onClick={onBack}>← Kembali ke Daftar</button>
    </div>
  );

  return (
    <div style={{padding:'20px 24px'}}>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:24}}>
        <button onClick={onBack} style={{background:'rgba(255,255,255,0.08)',border:'1px solid rgba(255,255,255,0.1)',color:'rgba(255,255,255,0.7)',borderRadius:8,padding:'6px 12px',cursor:'pointer',fontSize:12,fontFamily:'var(--font-display)',fontWeight:700}}>&lt; Kembali</button>
      </div>

      <div style={{background:'linear-gradient(135deg, rgba(0,120,255,0.15), rgba(31,182,255,0.06))',border:'1.5px solid rgba(0,120,255,0.28)',borderRadius:24,padding:24,marginBottom:20,textAlign:'center'}}>
        <div style={{fontSize:50,marginBottom:12}}>{hafalanItem.emoji}</div>
        <div style={{fontFamily:'var(--font-display)',fontWeight:800,color:'#fff',fontSize:20,marginBottom:4}}>{hafalanItem.name}</div>
        <div style={{fontSize:24,color:'rgba(255,255,255,0.6)',fontFamily:'serif',marginBottom:8,lineHeight:2}}>{hafalanItem.arabic}</div>
        <span className="badge badge-coin" style={{fontSize:13}}>🪙 +{hafalanItem.coins} koin jika selesai!</span>
      </div>

      {/* Recording area */}
      <div style={{background:'rgba(255,255,255,0.04)',borderRadius:20,padding:24,textAlign:'center',border:'1px solid rgba(255,255,255,0.06)',marginBottom:20}}>
        {recording ? (
          <>
          <div style={{width:80,height:80,borderRadius:'50%',background:'rgba(255,95,125,0.2)',border:'3px solid var(--danger)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px',fontSize:36,animation:'recordPulse 1.5s ease-in-out infinite'}}>
              🎙️
            </div>
            <div style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:32,color:'var(--danger)',marginBottom:8}}>{formatTime(timer)}</div>
            <div style={{fontSize:13,color:'rgba(255,255,255,0.5)',marginBottom:20}}>Sedang merekam... Baca dengan jelas!</div>
            <button onClick={stopRecording} style={{background:'var(--danger)',border:'none',color:'#fff',borderRadius:50,padding:'14px 32px',fontSize:16,fontFamily:'var(--font-display)',fontWeight:700,cursor:'pointer'}}>
              ⏹ Stop Rekaman
            </button>
          </>
        ) : recorded ? (
          <>
            <div style={{fontSize:50,marginBottom:12}}>✅</div>
            <div style={{fontFamily:'var(--font-display)',fontWeight:700,color:'var(--success)',marginBottom:4}}>Rekaman Selesai!</div>
            <div style={{fontSize:13,color:'rgba(255,255,255,0.5)',marginBottom:16}}>Durasi: {formatTime(duration)}</div>
            {audioUrl && <audio controls src={audioUrl} style={{width:'100%',marginBottom:16}} />}
            <div style={{display:'flex',gap:10,justifyContent:'center'}}>
              <button onClick={()=>{setRecorded(false);setAudioUrl(null);}} style={{background:'rgba(255,255,255,0.08)',border:'1px solid rgba(255,255,255,0.1)',color:'rgba(255,255,255,0.7)',borderRadius:10,padding:'10px 20px',fontSize:13,fontFamily:'var(--font-display)',fontWeight:700,cursor:'pointer'}}>🔄 Rekam Ulang</button>
              <button onClick={submitHafalan} style={{background:'var(--success)',border:'none',color:'#fff',borderRadius:10,padding:'10px 24px',fontSize:13,fontFamily:'var(--font-display)',fontWeight:700,cursor:'pointer'}}>✅ Kirim Hafalan!</button>
            </div>
          </>
        ) : (
          <>
            <div style={{fontSize:60,marginBottom:16,opacity:0.5}}>🎙️</div>
            <div style={{fontFamily:'var(--font-display)',fontWeight:700,color:'rgba(255,255,255,0.6)',marginBottom:20}}>Tekan tombol untuk mulai merekam</div>
      <button onClick={startRecording} style={{background:'linear-gradient(135deg, #7bdc38, #35a81f)',border:'none',color:'#03112c',borderRadius:50,padding:'16px 40px',fontSize:17,fontFamily:'var(--font-display)',fontWeight:800,cursor:'pointer',boxShadow:'0 4px 20px rgba(123,220,56,0.4)'}}>
              🎙️ Mulai Rekam
            </button>
          </>
        )}
      </div>

      <div style={{background:'rgba(255,190,26,0.06)',border:'1px solid rgba(255,190,26,0.18)',borderRadius:12,padding:14}}>
        <div style={{fontSize:13,color:'rgba(255,255,255,0.6)',lineHeight:1.8}}>
          💡 <strong style={{color:'rgba(255,255,255,0.8)'}}>Tips:</strong> Baca dengan suara jelas dan pelan. Tekan stop setelah selesai membaca. Orang tua akan mendengarkan rekamanmu dan memberi tanda bintang!
        </div>
      </div>
    </div>
  );
}

// ============================================================
// KIDS COINS PAGE
// ============================================================
function KidsCoinsPage({ kid }) {
  const { state, updateState, showNotif, addLog } = useContext(AppCtx);
  const [claimModal, setClaimModal] = useState(null);
  const myFamily = state.users.families.find(f => f.id === kid?.familyId);
  const myRewards = state.rewards.filter(r => r.familyId === kid?.familyId && r.active);
  const myRedemptions = state.redemptions.filter(r => r.kidId === kid?.id);

  const claimReward = (reward) => {
    if ((kid?.coins||0) < reward.cost) { showNotif('Koin tidak cukup! 😢','error'); return; }
    updateState(s => {
      const k = s.users.kids.find(u=>u.id===kid?.id);
      if (k) k.coins = (k.coins||0) - reward.cost;
      s.redemptions.push({ id:uid(), kidId:kid?.id, rewardId:reward.id, status:'pending', requestedAt:now(), kidName:kid?.name, rewardName:reward.name, cost:reward.cost });
    });
    addLog(kid?.name, `Mengklaim hadiah: ${reward.name} (${reward.cost} koin)`, 'coin');
    showNotif(`Permintaan "${reward.name}" terkirim ke orang tua! 🎉`, 'coin');
    setClaimModal(null);
  };

  return (
    <div style={{padding:'20px 20px'}}>
      {/* Coin wallet */}
    <div style={{background:'linear-gradient(135deg, #ff9f1c 0%, #ffbe1a 100%)',borderRadius:24,padding:28,marginBottom:24,textAlign:'center',boxShadow:'0 8px 32px rgba(255,190,26,0.32)'}}>
        <div style={{fontSize:18,color:'rgba(255,255,255,0.7)',fontFamily:'var(--font-display)',fontWeight:700,marginBottom:8}}>💰 Dompet Koinku</div>
        <div style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:60,color:'#fff',lineHeight:1}}>🪙 {kid?.coins||0}</div>
        <div style={{fontSize:14,color:'rgba(255,255,255,0.7)',marginTop:8}}>koin tersedia untuk ditukar</div>
      </div>

      {/* Earn tips */}
      <div style={{background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.06)',borderRadius:16,padding:14,marginBottom:20}}>
        <div style={{fontFamily:'var(--font-display)',fontWeight:700,color:'rgba(255,255,255,0.6)',fontSize:12,marginBottom:10,textTransform:'uppercase',letterSpacing:'0.8px'}}>💡 Cara Dapat Koin</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          {[{icon:'🔢',text:'Matematika benar',val:'+5🪙'},{icon:'🐾',text:'Tebak hewan benar',val:'+3🪙'},{icon:'📖',text:'Hafalan selesai',val:'+20🪙'},{icon:'🎬',text:'Video selesai',val:'+2🪙'}].map(t=>(
            <div key={t.text} style={{display:'flex',alignItems:'center',gap:8,background:'rgba(255,255,255,0.04)',borderRadius:10,padding:'8px 10px'}}>
              <span style={{fontSize:18}}>{t.icon}</span>
              <div><div style={{fontSize:11,color:'rgba(255,255,255,0.6)',lineHeight:1.3}}>{t.text}</div><div style={{fontSize:12,color:'var(--coin)',fontFamily:'var(--font-display)',fontWeight:700}}>{t.val}</div></div>
            </div>
          ))}
        </div>
      </div>

      {/* Rewards catalog */}
      <div style={{marginBottom:20}}>
        <h3 style={{fontFamily:'var(--font-kids)',color:'#fff',fontSize:20,marginBottom:14}}>🎁 Pilih Hadiahmu!</h3>
        {myRewards.length === 0 ? (
          <div style={{textAlign:'center',padding:'30px 0',color:'rgba(255,255,255,0.4)'}}>Belum ada hadiah. Minta orang tua tambahkan!</div>
        ) : (
          <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:12}}>
            {myRewards.map(reward => {
              const canAfford = (kid?.coins||0) >= reward.cost;
              return (
              <div key={reward.id} onClick={()=>canAfford&&setClaimModal(reward)} style={{background:canAfford?'linear-gradient(135deg, rgba(255,190,26,0.12), rgba(250,204,21,0.06))':'rgba(255,255,255,0.03)',border:`1.5px solid ${canAfford?'rgba(255,190,26,0.3)':'rgba(255,255,255,0.06)'}`,borderRadius:16,padding:16,textAlign:'center',cursor:canAfford?'pointer':'not-allowed',transition:'all 0.2s',opacity:canAfford?1:0.6}}
                  onMouseEnter={e=>{if(canAfford){e.currentTarget.style.borderColor='var(--coin)';e.currentTarget.style.transform='translateY(-2px)';}}}
              onMouseLeave={e=>{if(canAfford){e.currentTarget.style.borderColor='rgba(255,190,26,0.3)';e.currentTarget.style.transform='translateY(0)';}}}>
                  <div style={{fontSize:40,marginBottom:8}}>{reward.emoji}</div>
                  <div style={{fontFamily:'var(--font-display)',fontWeight:700,color:'#fff',fontSize:13,marginBottom:8}}>{reward.name}</div>
                  <div className="coin-badge" style={{justifyContent:'center',marginBottom:canAfford?0:4}}>🪙 {reward.cost}</div>
                  {!canAfford && <div style={{fontSize:10,color:'rgba(255,255,255,0.4)',marginTop:6}}>Perlu {reward.cost-(kid?.coins||0)} koin lagi</div>}
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* My redemptions */}
      {myRedemptions.length > 0 && (
        <div>
          <h3 style={{fontFamily:'var(--font-display)',color:'rgba(255,255,255,0.6)',fontSize:14,marginBottom:12,textTransform:'uppercase',letterSpacing:'0.8px'}}>Riwayat Klaim</h3>
          {myRedemptions.map(red => (
            <div key={red.id} style={{display:'flex',alignItems:'center',gap:12,background:'rgba(255,255,255,0.04)',borderRadius:12,padding:'12px 14px',marginBottom:8,border:'1px solid rgba(255,255,255,0.06)'}}>
              <div style={{flex:1}}>
                <div style={{fontFamily:'var(--font-display)',fontWeight:700,color:'#fff',fontSize:13}}>{red.rewardName}</div>
                <div style={{fontSize:11,color:'rgba(255,255,255,0.4)'}}>{timeAgo(red.requestedAt)} · <span className="badge badge-coin" style={{fontSize:9}}>🪙 {red.cost}</span></div>
              </div>
              <span className={`badge ${red.status==='approved'?'badge-success':red.status==='rejected'?'badge-danger':'badge-warn'}`}>{red.status==='approved'?'✅ Disetujui':red.status==='rejected'?'✕ Ditolak':'⏳ Menunggu'}</span>
            </div>
          ))}
        </div>
      )}

      {/* Claim modal */}
      {claimModal && (
        <div className="overlay" onClick={()=>setClaimModal(null)}>
          <div className="modal fade-in" onClick={e=>e.stopPropagation()} style={{maxWidth:360,textAlign:'center',padding:32}}>
            <div style={{fontSize:60,marginBottom:12}}>{claimModal.emoji}</div>
            <div style={{fontFamily:'var(--font-display)',fontWeight:800,color:'#fff',fontSize:20,marginBottom:8}}>{claimModal.name}</div>
            <div className="coin-badge" style={{justifyContent:'center',fontSize:20,marginBottom:16}}>🪙 {claimModal.cost} koin</div>
            <div style={{fontSize:13,color:'rgba(255,255,255,0.5)',marginBottom:24}}>Kamu punya 🪙 {kid?.coins||0} koin. Minta orang tua menyetujui klaim ini!</div>
            <div style={{display:'flex',gap:10,justifyContent:'center'}}>
              <button onClick={()=>setClaimModal(null)} style={{padding:'10px 20px',borderRadius:10,border:'1px solid rgba(255,255,255,0.15)',background:'transparent',color:'rgba(255,255,255,0.6)',cursor:'pointer',fontFamily:'var(--font-display)',fontWeight:700}}>Batal</button>
              <button onClick={()=>claimReward(claimModal)} style={{padding:'10px 24px',borderRadius:10,border:'none',background:'linear-gradient(135deg, #ffda4a, #ffbe1a)',color:'#03112c',cursor:'pointer',fontFamily:'var(--font-display)',fontWeight:800,fontSize:14}}>🎁 Klaim!</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ============================================================
// LOCK SCREEN
// ============================================================
function KidsLockScreen({ kid }) {
  const { updateState, showNotif } = useContext(AppCtx);
  const [pin, setPin] = useState('');
  const [error, setError] = useState(false);
  const tryUnlock = () => {
    if (pin === kid.lockPin) {
      updateState(s => { const k = s.users.kids.find(u=>u.id===kid.id); if (k) k.isLocked = false; });
    } else {
      setError(true);
      setTimeout(()=>setError(false), 1500);
      setPin('');
    }
  };
  return (
    <div className="lock-screen">
      <div className="animate-float" style={{textAlign:'center',marginBottom:20}}>
        <div style={{fontSize:80,marginBottom:10}}>🔒</div>
        <div style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:24,color:'#fff'}}>Layar Terkunci</div>
        <div style={{fontSize:13,color:'rgba(255,255,255,0.4)',marginTop:6}}>Orang tua telah mengunci perangkat ini</div>
      </div>
      <div style={{textAlign:'center'}}>
        <div style={{fontSize:13,color:'rgba(255,255,255,0.5)',marginBottom:16}}>Masukkan PIN untuk membuka</div>
        <div style={{display:'flex',gap:10,justifyContent:'center',marginBottom:20}}>
          {[0,1,2,3].map(i => (<div key={i} style={{width:20,height:20,borderRadius:'50%',border:`2px solid ${error?'var(--danger)':pin.length>i?'var(--family)':'rgba(255,255,255,0.2)'}`,background:pin.length>i?(error?'var(--danger)':'var(--family)'):'transparent',transition:'all 0.15s'}}/>))}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,60px)',gap:10,justifyContent:'center',margin:'0 auto'}}>
          {[1,2,3,4,5,6,7,8,9,'','0','⌫'].map((n,i) => (
            <button key={i} onClick={()=>{if(n==='⌫')setPin(p=>p.slice(0,-1));else if(n!==''&&pin.length<4){const np=pin+n;setPin(np);}}} style={{width:60,height:60,borderRadius:'50%',background:n===''?'transparent':'rgba(255,255,255,0.08)',border:`1px solid ${n===''?'transparent':'rgba(255,255,255,0.12)'}`,color:'#fff',fontSize:n==='⌫'?18:20,fontFamily:'var(--font-display)',fontWeight:700,cursor:n===''?'default':'pointer',transition:'all 0.15s'}}
              onMouseEnter={e=>n!==''&&(e.currentTarget.style.background='rgba(255,255,255,0.15)')} onMouseLeave={e=>n!==''&&(e.currentTarget.style.background='rgba(255,255,255,0.08)')}>{n}</button>
          ))}
        </div>
        <button className="btn btn-family" style={{marginTop:20,padding:'12px 40px',fontSize:15,justifyContent:'center'}} onClick={tryUnlock} disabled={pin.length!==4}>Buka Kunci</button>
        {error && <div style={{color:'var(--danger)',fontSize:13,marginTop:10}}>PIN salah. Coba lagi.</div>}
      </div>
    </div>
  );
}

// ============================================================
// ROOT APP
// ============================================================
function App() {
  const { currentUser } = useContext(AppCtx);
  if (!currentUser) return <LoginScreen />;
  if (currentUser.role === ROLES.ADMIN) return <AdminDashboard />;
  if (currentUser.role === ROLES.FAMILY) return <FamilyDashboard />;
  if (currentUser.role === ROLES.KIDS) return <KidsDashboard />;
  return <LoginScreen />;
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <AppProvider><App /></AppProvider>
);
</script>
