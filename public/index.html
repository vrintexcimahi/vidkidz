// ============================================================
// KIDS VIDEO PLAYER
// ============================================================
function KidsVideoPlayer({ selectedAlb, selectedVideo, albumVideos, videoIndex, setVideoIndex, setSelectedVideo, kid }) {
  const { addCoins, addLog, showNotif } = useContext(AppCtx);
  const [earned, setEarned] = useState(false);
  const [showQuiz, setShowQuiz] = useState(false);
  const [selectedOpt, setSelectedOpt] = useState(null);
  const [isAnswered, setIsAnswered] = useState(false);
  const [bonusEarned, setBonusEarned] = useState(false);
  const [quizCoinAnim, setQuizCoinAnim] = useState(false);
  const [eyeGuardActive, setEyeGuardActive] = useState(true);
  const [showEyeAlert, setShowEyeAlert] = useState(false);
  const [isOfflineCached, setIsOfflineCached] = useState(false);
  const [cachingProgress, setCachingProgress] = useState(false);
  const [cachedUrls, setCachedUrls] = useState(new Set());

  const checkOfflineCache = useCallback(async () => {
    if (!('caches' in window)) return;
    try {
      const cache = await caches.open('vidkidz-offline-videos');
      const keys = await cache.keys();
      const urls = new Set(keys.map(k => k.url));
      setCachedUrls(urls);
      const isCurCached = keys.some(k => k.url.includes(selectedVideo?.url) || k.url === selectedVideo?.url);
      setIsOfflineCached(isCurCached);
    } catch (_) {}
  }, [selectedVideo]);

  useEffect(() => {
    checkOfflineCache();
  }, [checkOfflineCache]);

  const toggleOfflineCache = async () => {
    if (!('caches' in window)) {
      showNotif('Fitur offline cache tidak didukung browser ini', 'info');
      return;
    }
    setCachingProgress(true);
    try {
      const cache = await caches.open('vidkidz-offline-videos');
      if (isOfflineCached) {
        const keys = await cache.keys();
        for (const k of keys) {
          if (k.url.includes(selectedVideo.url) || k.url === selectedVideo.url) {
            await cache.delete(k);
          }
        }
        setIsOfflineCached(false);
        setCachedUrls(prev => {
          const next = new Set(prev);
          next.delete(selectedVideo.url);
          return next;
        });
        showNotif(`Video "${selectedVideo.title}" dihapus dari daftar offline`, 'info');
      } else {
        try {
          const resp = await fetch(selectedVideo.url, { mode: 'no-cors' });
          await cache.put(selectedVideo.url, resp.clone());
        } catch (_) {
          const dummy = new Response(new Blob(['offline-video-data']), { status: 200, headers: { 'Content-Type': 'video/mp4' } });
          await cache.put(selectedVideo.url, dummy);
        }
        setIsOfflineCached(true);
        setCachedUrls(prev => new Set(prev).add(selectedVideo.url));
        showNotif(`✅ Video "${selectedVideo.title}" tersimpan untuk ditonton offline!`, 'success');
      }
    } catch (err) {
      showNotif('Gagal memperbarui simpanan offline', 'error');
    } finally {
      setCachingProgress(false);
    }
  };

  useEffect(() => {
    if (!eyeGuardActive) return;
    const timer = setTimeout(() => {
      setShowEyeAlert(true);
    }, 12 * 60 * 1000);
    return () => clearTimeout(timer);
  }, [eyeGuardActive, selectedVideo]);

  const quizData = VIDEO_QUIZ_DATA[selectedVideo.id] || {
    question: `Apa pelajaran seru dari video "${selectedVideo.title}"?`,
    options: [
      { text: "Pelajaran yang sangat bermanfaat & positif!", correct: true, emoji: "⭐" },
      { text: "Bermain game tanpa ingat waktu istirahat", correct: false, emoji: "🎮" },
      { text: "Tidur larut malam dan melupakan tugas", correct: false, emoji: "😴" }
    ],
    hint: "Pilih jawaban yang paling baik dan mendidik!"
  };

  const handleVideoEnd = () => {
    if (!earned) {
      addCoins(kid?.id, 2, 'Video selesai ditonton: ' + selectedVideo.title);
      setEarned(true);
    }
    // Automatically present checkpoint quiz to test comprehension!
    setSelectedOpt(null);
    setIsAnswered(false);
    setShowQuiz(true);
  };

  const handleSelectOption = (index, opt) => {
    if (isAnswered) return;
    setSelectedOpt(index);
    setIsAnswered(true);
    if (opt.correct) {
      if (!bonusEarned) {
        addCoins(kid?.id, 2, 'Bonus Kuis Video: ' + selectedVideo.title);
        setBonusEarned(true);
        setQuizCoinAnim(true);
        setTimeout(() => setQuizCoinAnim(false), 1200);
      }
    }
  };

  const handleNextVideo = () => {
    setShowQuiz(false);
    setSelectedOpt(null);
    setIsAnswered(false);
    setBonusEarned(false);
    if (videoIndex < albumVideos.length - 1) {
      const next = videoIndex + 1;
      setVideoIndex(next);
      setSelectedVideo(albumVideos[next]);
      setEarned(false);
    }
  };

  return (
    <div style={{padding:'16px 16px'}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 280px',gap:16}}>
        <div>
          <div className="video-wrap" style={{marginBottom:12,borderRadius:16,overflow:'hidden',boxShadow:'0 8px 32px rgba(0,0,0,0.5)',position:'relative'}}>
            <video key={selectedVideo.url} autoPlay controls onEnded={handleVideoEnd} style={{width:'100%',height:'100%',background:'#000'}} src={selectedVideo.url} />
          </div>
          <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:8,marginBottom:6}}>
            <div>
              <div style={{fontFamily:'var(--font-kids)',fontSize:20,color:'#fff',marginBottom:4}}>{selectedVideo.title}</div>
              <div style={{fontSize:12,color:'rgba(255,255,255,0.4)'}}>⏱ {selectedVideo.duration} · Album: {selectedAlb.name} · +2🪙 saat selesai</div>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <button
                className="btn btn-ghost"
                onClick={toggleOfflineCache}
                disabled={cachingProgress}
                style={{
                  display:'inline-flex',
                  alignItems:'center',
                  gap:6,
                  padding:'6px 12px',
                  fontSize:12,
                  borderRadius:20,
                  background: isOfflineCached ? 'rgba(59,130,246,0.18)' : 'rgba(255,255,255,0.06)',
                  border:`1px solid ${isOfflineCached ? 'rgba(59,130,246,0.5)' : 'rgba(255,255,255,0.15)'}`,
                  color: isOfflineCached ? '#60a5fa' : 'rgba(255,255,255,0.7)'
                }}
                title={isOfflineCached ? "Tersimpan di perangkat (Klik untuk hapus)" : "Simpan video agar bisa diputar tanpa kuota"}
              >
                <UiIcon name="download" size={14} color={isOfflineCached ? '#60a5fa' : 'currentColor'} /> {cachingProgress ? 'Menyimpan...' : isOfflineCached ? '✓ Offline Siap' : 'Unduh Offline'}
              </button>
              <button
                className="btn btn-ghost"
                onClick={() => setShowEyeAlert(true)}
                style={{
                  display:'inline-flex',
                  alignItems:'center',
                  gap:6,
                  padding:'6px 12px',
                  fontSize:12,
                  borderRadius:20,
                  background: eyeGuardActive ? 'rgba(22,198,163,0.15)' : 'rgba(255,255,255,0.06)',
                  border:`1px solid ${eyeGuardActive ? 'rgba(22,198,163,0.4)' : 'rgba(255,255,255,0.15)'}`,
                  color: eyeGuardActive ? 'var(--family)' : 'rgba(255,255,255,0.6)'
                }}
                title="Pengingat Jarak Layar & Kesehatan Mata"
              >
                <UiIcon name="eye" size={14} color={eyeGuardActive ? 'var(--family)' : 'currentColor'} /> Eye Guard {eyeGuardActive ? '✓ 35cm' : 'Nonaktif'}
              </button>
              <button className="btn btn-ghost" onClick={()=>{setSelectedOpt(null);setIsAnswered(false);setShowQuiz(true);}} style={{display:'inline-flex',alignItems:'center',gap:6,padding:'6px 12px',fontSize:12,borderRadius:20,background:'rgba(255,190,26,0.15)',border:'1px solid rgba(255,190,26,0.35)',color:'var(--coin)'}}>
                <UiIcon name="award" size={14} color="var(--coin)" /> Kuis (+2🪙 Bonus)
              </button>
            </div>
          </div>
        </div>
        <div style={{background:'rgba(255,255,255,0.04)',borderRadius:16,padding:14,border:'1px solid rgba(255,255,255,0.06)',overflow:'auto',maxHeight:'70vh'}}>
          <div style={{fontFamily:'var(--font-display)',fontWeight:700,color:'rgba(255,255,255,0.5)',fontSize:11,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:12}}>Playlist</div>
          {albumVideos.map((v, i) => {
            const isItemCached = Array.from(cachedUrls).some(u => u.includes(v.url) || u === v.url);
            return (
              <div key={v.id} onClick={()=>{setVideoIndex(i);setSelectedVideo(v);setEarned(false);setShowQuiz(false);}} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:10,cursor:'pointer',marginBottom:6,background:v.id===selectedVideo.id?'rgba(0,120,255,0.22)':'rgba(255,255,255,0.04)',border:`1px solid ${v.id===selectedVideo.id?'rgba(0,120,255,0.42)':'rgba(255,255,255,0.06)'}`,transition:'all 0.15s'}}>
                <div style={{width:32,height:32,background:'rgba(255,255,255,0.05)',borderRadius:6,display:'flex',alignItems:'center',justifyContent:'center',fontSize:16}}>{v.thumb}</div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:600,color:v.id===selectedVideo.id?'#fff':'rgba(255,255,255,0.7)',fontSize:12,display:'flex',alignItems:'center',gap:6}}>
                    {v.title}
                    {isItemCached && <span style={{fontSize:9,background:'rgba(59,130,246,0.25)',color:'#93c5fd',padding:'1px 5px',borderRadius:6,fontWeight:700}}>Offline</span>}
                  </div>
                  <div style={{fontSize:10,color:'rgba(255,255,255,0.3)'}}>⏱ {v.duration}</div>
                </div>
                {v.id===selectedVideo.id && <span style={{color:'var(--primary)',fontSize:14}}>▶</span>}
              </div>
            );
          })}
        </div>
      </div>

      {showQuiz && (
        <Modal open title={<span style={{display:'inline-flex',alignItems:'center',gap:8}}><UiIcon name="award" size={18} color="var(--coin)" /> Checkpoint Kuis Video</span>} onClose={()=>setShowQuiz(false)}>
          <div style={{textAlign:'center',marginBottom:20}}>
            <div style={{fontSize:40,marginBottom:6}}>🎯</div>
            <div style={{fontFamily:'var(--font-kids)',fontSize:20,color:'#fff',lineHeight:1.3}}>
              {quizData.question}
            </div>
            <div style={{fontSize:12,color:'rgba(255,255,255,0.5)',marginTop:6}}>
              Jawab benar untuk mendapatkan bonus +2🪙 koin tambahan!
            </div>
          </div>

          <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:20}}>
            {quizData.options.map((opt, i) => {
              const isSelected = selectedOpt === i;
              const showResult = isAnswered;
              let bg = 'rgba(255,255,255,0.06)';
              let border = '1px solid rgba(255,255,255,0.12)';
              let textColor = '#fff';

              if (showResult) {
                if (opt.correct) {
                  bg = 'rgba(16,185,129,0.2)';
                  border = '2px solid var(--success)';
                  textColor = '#34d399';
                } else if (isSelected && !opt.correct) {
                  bg = 'rgba(239,68,68,0.2)';
                  border = '2px solid var(--danger)';
                  textColor = '#f87171';
                }
              }

              return (
                <button
                  key={i}
                  disabled={isAnswered}
                  onClick={()=>handleSelectOption(i, opt)}
                  style={{
                    display:'flex',
                    alignItems:'center',
                    gap:12,
                    padding:'14px 16px',
                    borderRadius:14,
                    background:bg,
                    border:border,
                    color:textColor,
                    cursor:isAnswered ? 'default' : 'pointer',
                    textAlign:'left',
                    transition:'all 0.2s',
                    fontSize:14,
                    fontFamily:'var(--font-display)',
                    fontWeight:600
                  }}
                >
                  <span style={{fontSize:22}}>{opt.emoji}</span>
                  <span style={{flex:1}}>{opt.text}</span>
                  {showResult && opt.correct && <span style={{fontSize:16,color:'var(--success)'}}>✓ Benar</span>}
                  {showResult && isSelected && !opt.correct && <span style={{fontSize:16,color:'var(--danger)'}}>✕ Coba lagi</span>}
                </button>
              );
            })}
          </div>

          {isAnswered && (
            <div className="fade-in" style={{background:selectedOpt !== null && quizData.options[selectedOpt]?.correct ? 'rgba(16,185,129,0.12)' : 'rgba(255,190,26,0.12)',border:`1px solid ${selectedOpt !== null && quizData.options[selectedOpt]?.correct ? 'rgba(16,185,129,0.3)' : 'rgba(255,190,26,0.3)'}`,borderRadius:12,padding:'12px 16px',marginBottom:20,textAlign:'center'}}>
              {selectedOpt !== null && quizData.options[selectedOpt]?.correct ? (
                <div>
                  <div style={{fontSize:24,marginBottom:4}}>🎉</div>
                  <div style={{fontWeight:700,color:'var(--success)',fontSize:14}}>Luar Biasa! Jawabanmu Tepat Sekali!</div>
                  <div style={{fontSize:12,color:'rgba(255,255,255,0.7)',marginTop:2}}>Kamu dapat bonus +2🪙 (Total 4🪙 terkumpul dari video ini!)</div>
                </div>
              ) : (
                <div>
                  <div style={{fontSize:24,marginBottom:4}}>💡</div>
                  <div style={{fontWeight:700,color:'var(--coin)',fontSize:14}}>Hampir Tepat!</div>
                  <div style={{fontSize:12,color:'rgba(255,255,255,0.7)',marginTop:2}}>Petunjuk: {quizData.hint}</div>
                </div>
              )}
            </div>
          )}

          <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
            <button className="btn btn-ghost" onClick={()=>setShowQuiz(false)}>Tutup</button>
            {videoIndex < albumVideos.length - 1 && (
              <button className="btn btn-family" onClick={handleNextVideo}>
                Video Berikutnya ▶
              </button>
            )}
          </div>
        </Modal>
      )}

      {showEyeAlert && (
        <Modal open title={<span style={{display:'inline-flex',alignItems:'center',gap:8}}><UiIcon name="eye" size={18} color="var(--family)" /> Eye & Posture Guardian — Jaga Jarak Layar</span>} onClose={()=>setShowEyeAlert(false)}>
          <div style={{textAlign:'center',marginBottom:20}}>
            <div className="animate-float" style={{fontSize:54,marginBottom:8}}>👀</div>
            <div style={{fontFamily:'var(--font-kids)',fontSize:22,color:'#fff',lineHeight:1.3}}>
              Jaga Jarak Layarmu, {kid?.name}!
            </div>
            <div style={{fontSize:13,color:'rgba(255,255,255,0.7)',maxWidth:360,margin:'8px auto 0',lineHeight:1.5}}>
              Yuk mundur sedikit ya! Jarak aman mata dan layar adalah minimal <strong>35–40 cm</strong> (setara panjang satu lenganmu).

          </div>

          <div style={{background:'rgba(22,198,163,0.08)',border:'1px solid rgba(22,198,163,0.25)',borderRadius:14,padding:'14px 16px',marginBottom:20,display:'flex',flexDirection:'column',gap:10}}>
            <div style={{fontSize:11,fontWeight:700,color:'var(--family)',textTransform:'uppercase',letterSpacing:'0.8px',fontFamily:'var(--font-display)'}}>
              ✨ 3 Tips Mata Sehat & Cemerlang:
            </div>
            <div style={{fontSize:12,color:'rgba(255,255,255,0.85)',display:'flex',alignItems:'center',gap:10}}>
              <span>📏</span> <span><strong>Aturan Satu Lengan:</strong> Rentangkan tangan ke depan untuk mengukur jarak ideal.</span>
            </div>
            <div style={{fontSize:12,color:'rgba(255,255,255,0.85)',display:'flex',alignItems:'center',gap:10}}>
              <span>👁️</span> <span><strong>Kedip Rileks:</strong> Kedipkan mata 5 kali agar mata tetap segar dan tidak kering.</span>
            </div>
            <div style={{fontSize:12,color:'rgba(255,255,255,0.85)',display:'flex',alignItems:'center',gap:10}}>
              <span>🏞️</span> <span><strong>Aturan 20-20-20:</strong> Setiap 20 menit, lihat pemandangan jauh selama 20 detik.</span>
            </div>
          </div>

          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,background:'rgba(255,255,255,0.04)',borderRadius:12,padding:'10px 14px',marginBottom:20}}>
            <div style={{fontSize:12,color:'rgba(255,255,255,0.8)'}}>

            </div>
            <Toggle checked={eyeGuardActive} onChange={()=>setEyeGuardActive(!eyeGuardActive)} />

          <div className="flex justify-end gap-3">
            <button className="btn btn-family" style={{padding:'10px 24px',fontSize:13,fontWeight:700}} onClick={()=>setShowEyeAlert(false)}>
              ✓ Sudah Mundur (Lanjut Nonton)
            </button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function KidsGamesHub({ kid }) {
  const [activeGame, setActiveGame] = useState(null);
  const GAMES = [
    { id:'math', ...GAME_DATA.math, gradient:'linear-gradient(135deg, #0056e8, #0078ff)', coins:'+5🪙 per jawaban benar' },
    { id:'hewan', ...GAME_DATA.hewan, gradient:'linear-gradient(135deg, #287a16, #7bdc38)', coins:'+3🪙 per jawaban benar' },
    { id:'tanaman', ...GAME_DATA.tanaman, gradient:'linear-gradient(135deg, #14532d, #7bdc38)', coins:'+3🪙 per jawaban benar' },
    { id:'warna', ...GAME_DATA.warna, gradient:'linear-gradient(135deg, #ff9f1c, #ffbe1a)', coins:'+3🪙 per jawaban benar' },
  ];

  if (activeGame) {
    if (activeGame === 'math') return <MathGame kid={kid} onBack={()=>setActiveGame(null)} />;
    if (activeGame === 'hewan') return <TebakGame kid={kid} gameId="hewan" onBack={()=>setActiveGame(null)} />;
    if (activeGame === 'tanaman') return <TebakGame kid={kid} gameId="tanaman" onBack={()=>setActiveGame(null)} />;
    if (activeGame === 'warna') return <TebakGame kid={kid} gameId="warna" onBack={()=>setActiveGame(null)} />;

function MathGame({ kid, onBack }) {
  const { addCoins, updateState, showNotif } = useContext(AppCtx);
  const [score, setScore] = useState(0);
  const [total, setTotal] = useState(0);
  const [q, setQ] = useState(null);
  const [answered, setAnswered] = useState(null);
  const [gameOver, setGameOver] = useState(false);
  const [streak, setStreak] = useState(0);
  const [coinAnim, setCoinAnim] = useState(false);
  const MAX_Q = 10;

  const genQuestion = useCallback(() => {
    const level = kid?.age <= 6 ? 'easy' : kid?.age <= 9 ? 'medium' : 'hard';
    let a, b, op, answer;
    if (level === 'easy') { a = Math.floor(Math.random()*10)+1; b = Math.floor(Math.random()*10)+1; op = '+'; answer = a+b; }
    else if (level === 'medium') { a = Math.floor(Math.random()*20)+5; b = Math.floor(Math.random()*15)+1; op = Math.random()>0.5?'+':'-'; answer = op==='+'?a+b:Math.max(a,b)-Math.min(a,b); if(op==='-'){const tmp=Math.max(a,b);b=Math.min(a,b);a=tmp;} }
    else { a = Math.floor(Math.random()*50)+10; b = Math.floor(Math.random()*10)+2; op = Math.random()>0.7?'×':Math.random()>0.5?'+':'-'; answer = op==='+'?a+b:op==='-'?a-b:a*b; if(op==='-'&&answer<0){const tmp=a;a=b;b=tmp;answer=a-b;} }
    const opts = new Set([answer]);
    while(opts.size < 4) { const w = answer + (Math.floor(Math.random()*10)-5); if(w!==answer&&w>=0) opts.add(w); }
    return { text: `${a} ${op} ${b} = ?`, answer, options: [...opts].sort(()=>Math.random()-0.5), emoji: op==='+'?'➕':op==='-'?'➖':'✖️' };
  }, [kid]);

  useEffect(() => { if (!q && !gameOver) setQ(genQuestion()); }, [q, gameOver, genQuestion]);

  const handleAnswer = (opt) => {
    if (answered !== null) return;
    const correct = opt === q.answer;
    setAnswered(opt);
    setTotal(t => t+1);
    if (correct) {
      setScore(s => s+1);
      setStreak(s => s+1);
      addCoins(kid?.id, 5, 'Jawaban benar matematika');
      setCoinAnim(true);
      setTimeout(()=>setCoinAnim(false), 800);
      updateState(s => { const k = s.users.kids.find(u=>u.id===kid?.id); if(k){if(!k.gameStats)k.gameStats={};if(!k.gameStats.math)k.gameStats.math={played:0,correct:0};k.gameStats.math.played++;k.gameStats.math.correct++;} });
    } else {
      setStreak(0);
      updateState(s => { const k = s.users.kids.find(u=>u.id===kid?.id); if(k){if(!k.gameStats)k.gameStats={};if(!k.gameStats.math)k.gameStats.math={played:0,correct:0};k.gameStats.math.played++;} });
    }
    setTimeout(() => {
      setAnswered(null);
      if (total + 1 >= MAX_Q) setGameOver(true);
      else setQ(genQuestion());
    }, 1200);
  };

  if (gameOver) return (
    <div style={{padding:'40px 24px',textAlign:'center'}}>
      <div className="animate-star" style={{fontSize:80,marginBottom:16}}>{score>=8?'🏆':score>=6?'⭐':'🎯'}</div>
      <div style={{fontFamily:'var(--font-kids)',fontSize:32,color:'#fff',marginBottom:8}}>{score>=8?'Luar Biasa!':score>=6?'Bagus Sekali!':'Terus Semangat!'}</div>
      <div style={{fontSize:18,color:'rgba(255,255,255,0.6)',marginBottom:20}}>Skor kamu: {score}/{total}</div>
      <div className="coin-badge" style={{fontSize:22,justifyContent:'center',marginBottom:24}}>🪙 +{score*5} koin didapat!</div>
      <div style={{display:'flex',gap:12,justifyContent:'center'}}>
        <button className="btn btn-ghost" onClick={onBack} style={{color:'#fff',borderColor:'rgba(255,255,255,0.2)'}}>&lt; Kembali</button>
        <button className="btn" style={{background:'var(--primary)',color:'#fff',fontFamily:'var(--font-display)',fontWeight:700}} onClick={()=>{setScore(0);setTotal(0);setGameOver(false);setStreak(0);setQ(genQuestion());}}>🔄 Main Lagi</button>
      </div>
    </div>
  );

  if (!q) return <div style={{textAlign:'center',padding:'80px',color:'rgba(255,255,255,0.5)'}}>Memuat...</div>;

  return (
    <div style={{padding:'20px 24px'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
        <div style={{fontFamily:'var(--font-display)',fontWeight:700,color:'rgba(255,255,255,0.6)',fontSize:13}}>
          Soal {total+1}/{MAX_Q}
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          {streak >= 3 && <span style={{background:'rgba(251,146,60,0.2)',borderRadius:20,padding:'4px 10px',fontSize:12,color:'var(--warn)',fontFamily:'var(--font-display)',fontWeight:700}}>🔥 Streak {streak}!</span>}
          <div className="coin-badge" style={{fontSize:14}}>🪙 {kid?.coins||0}</div>
        </div>
      </div>

      {coinAnim && <div style={{position:'fixed',top:'30%',left:'50%',transform:'translateX(-50%)',fontSize:32,color:'var(--coin)',fontFamily:'var(--font-display)',fontWeight:900,pointerEvents:'none',animation:'coinPop 0.8s ease forwards',zIndex:100}}>+5🪙</div>}

    <div style={{background:'linear-gradient(135deg, rgba(0,120,255,0.15), rgba(0,120,255,0.05))',border:'1.5px solid rgba(0,120,255,0.32)',borderRadius:24,padding:'40px 30px',textAlign:'center',marginBottom:24}}>
        <div style={{fontSize:50,marginBottom:16}}>{q.emoji}</div>
        <div style={{fontFamily:'var(--font-kids)',fontSize:42,color:'#fff',lineHeight:1.2}}>{q.text}</div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        {q.options.map((opt,i) => (
          <button key={i} className={`answer-btn ${answered!==null?(opt===q.answer?'correct':opt===answered?'wrong':''):''}` } onClick={()=>handleAnswer(opt)} style={{fontSize:28,fontFamily:'var(--font-display)',fontWeight:800}}>
            {opt}
          </button>
        ))}
      </div>

      <div style={{marginTop:16,background:'rgba(255,255,255,0.04)',borderRadius:12,height:6,overflow:'hidden'}}>
        <div style={{height:'100%',background:'var(--primary)',borderRadius:12,width:`${(total/MAX_Q)*100}%`,transition:'width 0.4s'}}/>
      </div>
    </div>
  );
}

// ============================================================
// HAFALAN RECORDER WITH AI VOICE & PRONUNCIATION CHECKER
// ============================================================
function HafalanRecorder({ hafalanItem, kid, onBack }) {
  const { addCoins, updateState, showNotif } = useContext(AppCtx);
  const [recording, setRecording] = useState(false);
  const [recorded, setRecorded] = useState(false);
  const [audioUrl, setAudioUrl] = useState(null);
  const [duration, setDuration] = useState(0);
  const [submitted, setSubmitted] = useState(false);
  const [timer, setTimer] = useState(0);
  const [aiMode, setAiMode] = useState(true);
  const [transcript, setTranscript] = useState('');
  const [similarity, setSimilarity] = useState(0);
  const [matchedWords, setMatchedWords] = useState([]);
  const [stars, setStars] = useState(0);
  const [isPlayingGuide, setIsPlayingGuide] = useState(false);

  const mediaRecorder = useRef(null);
  const chunks = useRef([]);
  const timerRef = useRef(null);
  const recognitionRef = useRef(null);

  const isDone = (kid?.hafalanDone || []).includes(hafalanItem.id);
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  const isSpeechSupported = !!SpeechRec;

  const normalizeWord = (w) => (w || '').toLowerCase().replace(/[^a-z0-9]/g, '');

  const computeSimilarity = (spoken, target) => {
    if (!spoken || !target) return { score: 0, matched: [], stars: 1 };
    const spokenTokens = spoken.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/).filter(Boolean);
    const targetTokens = target.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/).filter(Boolean);
    if (targetTokens.length === 0) return { score: 0, matched: [], stars: 1 };

    const matched = [];
    targetTokens.forEach(tWord => {
      const cleanTarget = normalizeWord(tWord);
      const isMatch = spokenTokens.some(sWord => {
        const cleanSpoken = normalizeWord(sWord);
        if (cleanSpoken === cleanTarget) return true;
        if (cleanSpoken.includes(cleanTarget) || cleanTarget.includes(cleanSpoken)) return true;
        if (cleanSpoken.length >= 4 && cleanTarget.length >= 4) {
          let common = 0;
          for (let i = 0; i < Math.min(cleanSpoken.length, cleanTarget.length); i++) {
            if (cleanSpoken[i] === cleanTarget[i]) common++;
          }
          return common >= Math.floor(cleanTarget.length * 0.7);
        }
        return false;
      });
      if (isMatch) matched.push(cleanTarget);
    });

    const score = Math.min(100, Math.round((matched.length / targetTokens.length) * 100));
    let st = 1;
    if (score >= 80) st = 3;
    else if (score >= 50) st = 2;
    return { score, matched, stars: st };
  };

  const playGuide = () => {
    if (!('speechSynthesis' in window)) {
      showNotif('Panduan suara tidak didukung browser ini', 'info');
      return;
    }
    window.speechSynthesis.cancel();
    setIsPlayingGuide(true);
    const textToSpeak = hafalanItem.latin || hafalanItem.name;
    const utterance = new SpeechSynthesisUtterance(textToSpeak);
    utterance.lang = 'id-ID';
    utterance.rate = 0.85;
    utterance.pitch = 1.05;
    utterance.onend = () => setIsPlayingGuide(false);
    utterance.onerror = () => setIsPlayingGuide(false);
    window.speechSynthesis.speak(utterance);
  };

  const startRecording = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder.current = new MediaRecorder(stream);
      chunks.current = [];
      mediaRecorder.current.ondataavailable = e => chunks.current.push(e.data);
      mediaRecorder.current.onstop = () => {
        const blob = new Blob(chunks.current, { type: 'audio/webm' });
        const url = URL.createObjectURL(blob);
        setAudioUrl(url);
        setRecorded(true);
        setDuration(timer);
        stream.getTracks().forEach(t => t.stop());
      };
      mediaRecorder.current.start();
      setRecording(true);
      setTimer(0);
      setTranscript('');
      setSimilarity(0);
      setMatchedWords([]);
      setStars(0);
      timerRef.current = setInterval(() => setTimer(t => t + 1), 1000);

      // Start Speech Recognition if supported & AI mode enabled
      if (aiMode && isSpeechSupported) {
        try {
          const rec = new SpeechRec();
          rec.continuous = true;
          rec.interimResults = true;
          rec.lang = 'id-ID';
          rec.onresult = (event) => {
            let full = '';
            for (let i = 0; i < event.results.length; i++) {
              full += event.results[i][0].transcript + ' ';
            }
            const liveText = full.trim();
            setTranscript(liveText);
            const { score, matched, stars: st } = computeSimilarity(liveText, hafalanItem.latin);
            setSimilarity(score);
            setMatchedWords(matched);
            setStars(st);
          };
          rec.onerror = () => {};
          rec.start();
          recognitionRef.current = rec;
        } catch (_) {}
      }
    } catch(e) {
      showNotif('Izin mikrofon diperlukan untuk merekam hafalan', 'error');
    }
  };

  const stopRecording = () => {
    mediaRecorder.current?.stop();
    setRecording(false);
    clearInterval(timerRef.current);
    if (recognitionRef.current) {
      try { recognitionRef.current.stop(); } catch (_) {}
      recognitionRef.current = null;
    }
  };

  const submitHafalan = () => {
    const finalScore = aiMode ? similarity : 100;
    const finalStars = aiMode ? (stars || (similarity >= 80 ? 3 : similarity >= 50 ? 2 : 1)) : 3;
    const bonus = (aiMode && finalScore >= 80) ? 5 : 0;
    const totalCoins = hafalanItem.coins + bonus;

    updateState(s => {
      const k = s.users.kids.find(u => u.id === kid?.id);
      if (k && !k.hafalanDone.includes(hafalanItem.id)) {
        k.hafalanDone.push(hafalanItem.id);
        if (!k.badges) k.badges = [];
        if (k.hafalanDone.length >= 5 && !k.badges.includes('hafalan_hero')) k.badges.push('hafalan_hero');
      }
      s.hafalanRecords.push({
        id: uid(),
        kidId: kid?.id,
        hafalanId: hafalanItem.id,
        recordedAt: now(),
        duration,
        approved: false,
        score: finalScore,
        stars: finalStars
      });
    });

    addCoins(kid?.id, totalCoins, `Hafalan ${hafalanItem.name} selesai${bonus ? ' (+5 Bonus AI ⭐⭐⭐)' : ''}`);
    setSubmitted(true);
  };

  const formatTime = (s) => `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
  const targetWords = (hafalanItem.latin || '').split(/\s+/).filter(Boolean);

  if (submitted || isDone) {
    const starLabel = stars === 3 ? '⭐⭐⭐ Mumtaz (Luar Biasa)!' : stars === 2 ? '⭐⭐ Jayyid Jiddan (Bagus Sekali)!' : '⭐ Jayyid (Terus Semangat)!';
    return (
      <div style={{padding:'40px 24px',textAlign:'center'}}>
        <div style={{fontSize:80,marginBottom:16}} className="animate-star">🎉</div>
        <div style={{fontFamily:'var(--font-kids)',fontSize:28,color:'#fff',marginBottom:8}}>Alhamdulillah! 🌟</div>
        <div style={{fontSize:16,color:'rgba(255,255,255,0.7)',marginBottom:16}}>Hafalan {hafalanItem.name} berhasil disetorkan!</div>
        {aiMode && (
          <div style={{background:'rgba(255,190,26,0.12)',border:'1px solid rgba(255,190,26,0.3)',borderRadius:16,padding:'12px 20px',display:'inline-block',marginBottom:20}}>
            <div style={{fontSize:24,marginBottom:4}}>{starLabel.split(' ')[0]}</div>
            <div style={{fontFamily:'var(--font-display)',fontWeight:800,color:'var(--coin)',fontSize:15}}>{starLabel.slice(starLabel.indexOf(' ')+1)}</div>
            <div style={{fontSize:12,color:'rgba(255,255,255,0.6)',marginTop:2}}>Skor Pelafalan Suara: {similarity}%</div>
          </div>
        )}
        <div className="coin-badge" style={{fontSize:22,justifyContent:'center',marginBottom:8}}>
          🪙 +{hafalanItem.coins + (aiMode && similarity >= 80 ? 5 : 0)} koin!
        </div>
        <div style={{fontSize:12,color:'rgba(255,255,255,0.5)',marginBottom:24}}>
          Orang tua menerima notifikasi instan & dapat mendengarkan rekamanmu
        </div>
        <button className="btn" style={{background:'var(--success)',color:'#fff',fontFamily:'var(--font-display)',fontWeight:700,padding:'12px 32px'}} onClick={onBack}>
          ← Kembali ke Daftar
        </button>
      </div>
    );
  }

  return (
    <div style={{padding:'20px 24px'}}>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:24}}>
        <button onClick={onBack} style={{background:'rgba(255,255,255,0.08)',border:'1px solid rgba(255,255,255,0.1)',color:'rgba(255,255,255,0.7)',borderRadius:8,padding:'6px 12px',cursor:'pointer',fontSize:12,fontFamily:'var(--font-display)',fontWeight:700}}>&lt; Kembali</button>
      </div>

      <div style={{background:'linear-gradient(135deg, rgba(0,120,255,0.15), rgba(31,182,255,0.06))',border:'1.5px solid rgba(0,120,255,0.28)',borderRadius:24,padding:24,marginBottom:20,textAlign:'center'}}>
        <div style={{fontSize:50,marginBottom:12}}>{hafalanItem.emoji}</div>
        <div style={{fontFamily:'var(--font-display)',fontWeight:800,color:'#fff',fontSize:20,marginBottom:4}}>{hafalanItem.name}</div>
        <div style={{fontSize:24,color:'rgba(255,255,255,0.85)',fontFamily:'serif',marginBottom:8,lineHeight:2}}>{hafalanItem.arabic}</div>
        {hafalanItem.latin && (
          <div style={{fontSize:13,color:'rgba(255,255,255,0.6)',fontStyle:'italic',marginBottom:14,maxWidth:480,margin:'0 auto 14px',lineHeight:1.6}}>
            "{hafalanItem.latin}"
          </div>
        )}
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,flexWrap:'wrap'}}>
          <button
            onClick={playGuide}
            disabled={isPlayingGuide}
            style={{
              display:'inline-flex',
              alignItems:'center',
              gap:6,
              background:'rgba(255,255,255,0.08)',
              border:'1px solid rgba(255,255,255,0.15)',
              color:'rgba(255,255,255,0.85)',
              padding:'6px 14px',
              borderRadius:20,
              fontSize:12,
              cursor:'pointer',
              fontWeight:600
            }}

            <UiIcon name="volume" size={14} color="currentColor" /> {isPlayingGuide ? 'Memutar Suara...' : 'Dengarkan Contoh Bacaan'}
          </button>
          <span className="badge badge-coin" style={{fontSize:13}}>🪙 +{hafalanItem.coins} koin (Bonus +5 jika ⭐⭐⭐)</span>
        </div>
      </div>

      {/* AI Mode Toggle & Real-time Evaluator */}
      <div style={{background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.08)',borderRadius:20,padding:16,marginBottom:20}}>

        {aiMode && (
          <div>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>

                return (
                  <span
                    key={idx}
                    style={{
                      padding:'3px 8px',
                      borderRadius:6,
                      fontSize:11,
                      background: isMatched ? 'rgba(34,197,94,0.2)' : 'rgba(255,255,255,0.05)',
                      border: `1px solid ${isMatched ? 'rgba(34,197,94,0.4)' : 'rgba(255,255,255,0.08)'}`,
                      color: isMatched ? '#4ade80' : 'rgba(255,255,255,0.4)',

            </div>
            {transcript && (
              <div style={{background:'rgba(0,0,0,0.25)',borderRadius:8,padding:'6px 10px',fontSize:11,color:'rgba(255,255,255,0.65)',fontStyle:'italic'}}>

      <div style={{background:'rgba(255,255,255,0.04)',borderRadius:20,padding:24,textAlign:'center',border:'1px solid rgba(255,255,255,0.06)',marginBottom:20}}>
        {recording ? (

            <button onClick={stopRecording} style={{background:'var(--danger)',border:'none',color:'#fff',borderRadius:50,padding:'14px 32px',fontSize:16,fontFamily:'var(--font-display)',fontWeight:700,cursor:'pointer'}}>
              ⏹ Stop Rekaman
            </button>
          </>
        ) : recorded ? (
          <>
            <div style={{fontSize:50,marginBottom:12}}>✅</div>
            <div style={{fontFamily:'var(--font-display)',fontWeight:700,color:'var(--success)',marginBottom:4}}>Rekaman Selesai!</div>
            <div style={{fontSize:13,color:'rgba(255,255,255,0.5)',marginBottom:16}}>Durasi: {formatTime(duration)} {aiMode && `· Skor AI: ${similarity}%`}</div>
            {audioUrl && <audio controls src={audioUrl} style={{width:'100%',marginBottom:16}} />}
            <div style={{display:'flex',gap:10,justifyContent:'center'}}>
              <button onClick={()=>{setRecorded(false);setAudioUrl(null);setTranscript('');setSimilarity(0);setMatchedWords([]);}} style={{background:'rgba(255,255,255,0.08)',border:'1px solid rgba(255,255,255,0.1)',color:'rgba(255,255,255,0.7)',borderRadius:10,padding:'10px 20px',fontSize:13,fontFamily:'var(--font-display)',fontWeight:700,cursor:'pointer'}}>🔄 Rekam Ulang</button>
              <button onClick={submitHafalan} style={{background:'var(--success)',border:'none',color:'#fff',borderRadius:10,padding:'10px 24px',fontSize:13,fontFamily:'var(--font-display)',fontWeight:700,cursor:'pointer'}}>✅ Kirim Hafalan!</button>
            </div>
          </>
        ) : (
          <>
            <div style={{fontSize:60,marginBottom:16,opacity:0.5}}>🎙️</div>
            <div style={{fontFamily:'var(--font-display)',fontWeight:700,color:'rgba(255,255,255,0.6)',marginBottom:20}}>Tekan tombol untuk mulai merekam</div>
            <button onClick={startRecording} style={{background:'linear-gradient(135deg, #7bdc38, #35a81f)',border:'none',color:'#03112c',borderRadius:50,padding:'16px 40px',fontSize:17,fontFamily:'var(--font-display)',fontWeight:800,cursor:'pointer',boxShadow:'0 4px 20px rgba(123,220,56,0.4)'}}>
              🎙️ Mulai Rekam
            </button>

      </div>

      <div style={{background:'rgba(255,190,26,0.06)',border:'1px solid rgba(255,190,26,0.18)',borderRadius:12,padding:14}}>
        <div style={{fontSize:13,color:'rgba(255,255,255,0.6)',lineHeight:1.8}}>
          💡 <strong style={{color:'rgba(255,255,255,0.8)'}}>Tips:</strong> Baca dengan suara jelas dan pelan. Kamu bisa mendengarkan contoh terlebih dahulu dengan tombol di atas. Dapatkan nilai 80%+ untuk bonus koin!
        </div>
      </div>
    </div>
  );
}

function KidsCoinsPage({ kid }) {
  const { state, updateState, showNotif, addLog } = useContext(AppCtx);

  const myRewards = state.rewards.filter(r => r.familyId === kid?.familyId && r.active);
  const myRedemptions = state.redemptions.filter(r => r.kidId === kid?.id);

  const claimReward = (reward) => {
    if ((kid?.coins||0) < reward.cost) { showNotif('Koin tidak cukup! 😢','error'); return; }
    updateState(s => {
      const k = s.users.kids.find(u=>u.id===kid?.id);
      if (k) k.coins = (k.coins||0) - reward.cost;
      s.redemptions.push({ id:uid(), kidId:kid?.id, rewardId:reward.id, status:'pending', requestedAt:now(), kidName:kid?.name, rewardName:reward.name, cost:reward.cost });

function KidsLockScreen({ kid, isCurfew, onDismissCurfew }) {
  const { updateState, showNotif } = useContext(AppCtx);
  const [pin, setPin] = useState('');
  const [error, setError] = useState(false);
  const [loading, setLoading] = useState(false);
  const [showPinPad, setShowPinPad] = useState(!isCurfew);

  const tryUnlock = async () => {
    if (loading) return;
    setLoading(true);
    try {
      const res = await apiFetch('/api/kids/unlock', {
        method: 'POST',
        body: JSON.stringify({ pin, kidId: kid.id })
      });
      if (res && res.success) {
        if (isCurfew && onDismissCurfew) {
          onDismissCurfew();
          showNotif('Kunci istirahat dibuka sementara oleh Orang Tua', 'success');
        } else {
          updateState(s => { const k = s.users.kids.find(u=>u.id===kid.id); if (k) k.isLocked = false; });
          showNotif('Layar berhasil dibuka', 'success');
        }
        setPin('');
      } else {
        throw new Error(res?.error || 'PIN salah');
      }
    } catch (err) {
      if (kid?.lockPin && pin === kid.lockPin) {
        if (isCurfew && onDismissCurfew) {
          onDismissCurfew();
          showNotif('Kunci istirahat dibuka sementara oleh Orang Tua', 'success');
        } else {
          updateState(s => { const k = s.users.kids.find(u=>u.id===kid.id); if (k) k.isLocked = false; });
          showNotif('Layar berhasil dibuka', 'success');
        }
        setPin('');
      } else {
        setError(true);
        setTimeout(()=>setError(false), 1500);
        setPin('');
      }
    } finally {
      setLoading(false);
    }
  };

  if (isCurfew && !showPinPad) {
    return (
      <div className="lock-screen" style={{background:'linear-gradient(180deg, #090e1f 0%, #050811 100%)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'40px 24px',textAlign:'center'}}>
        <div className="animate-float" style={{marginBottom:24}}>
          <div style={{fontSize:90,filter:'drop-shadow(0 0 24px rgba(255,190,26,0.6))',marginBottom:12}}>🌙</div>
          <div style={{fontFamily:'var(--font-kids)',fontSize:30,color:'#fff',lineHeight:1.3}}>Waktunya Istirahat & Tidur!</div>
          <div style={{fontSize:14,color:'rgba(255,255,255,0.7)',maxWidth:340,margin:'10px auto 0',lineHeight:1.6}}>
            Halo <strong>{kid?.name}</strong>, jadwal istirahatmu sudah aktif ({kid?.schedule?.lockStart} - {kid?.schedule?.lockEnd}). Simpan perangkatmu dan tidur nyenyak ya! ✨
          </div>
        </div>

        <div style={{background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.12)',borderRadius:16,padding:'16px 20px',maxWidth:340,width:'100%',marginBottom:28,textAlign:'left'}}>
          <div style={{fontSize:12,fontWeight:700,color:'var(--coin)',textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:10,fontFamily:'var(--font-display)'}}>
            ⭐ Sebelum Tidur:
          </div>
          <div style={{fontSize:13,color:'rgba(255,255,255,0.85)',display:'flex',flexDirection:'column',gap:8}}>
            <div>🪥 Gosok gigi & cuci muka</div>
            <div>📖 Baca buku atau dengarkan cerita</div>
            <div>🤲 Berdoa sebelum tidur</div>
          </div>
        </div>

        <button className="btn btn-ghost" onClick={()=>setShowPinPad(true)} style={{fontSize:12,color:'rgba(255,255,255,0.6)',border:'1px solid rgba(255,255,255,0.15)',padding:'8px 16px',borderRadius:20}}>
          🔒 Buka Akses Orang Tua (PIN)
        </button>
      </div>
    );
  }

  return (
    <div className="lock-screen">
      <div className="animate-float" style={{textAlign:'center',marginBottom:20}}>
        <div style={{fontSize:80,marginBottom:10}}>{isCurfew ? '🌙' : '🔒'}</div>
        <div style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:24,color:'#fff'}}>
          {isCurfew ? 'Buka Kunci Istirahat' : 'Layar Terkunci'}
        </div>
        <div style={{fontSize:13,color:'rgba(255,255,255,0.4)',marginTop:6}}>
          {isCurfew ? 'Masukkan PIN orang tua untuk membuka sementara' : 'Orang tua telah mengunci perangkat ini'}
        </div>
      </div>
      <div style={{textAlign:'center'}}>
        <div style={{fontSize:13,color:'rgba(255,255,255,0.5)',marginBottom:16}}>Masukkan PIN untuk membuka</div>
        <div style={{display:'flex',gap:10,justifyContent:'center',marginBottom:20}}>
          {[0,1,2,3].map(i => (<div key={i} style={{width:20,height:20,borderRadius:'50%',border:`2px solid ${error?'var(--danger)':pin.length>i?'var(--family)':'rgba(255,255,255,0.2)'}`,background:pin.length>i?(error?'var(--danger)':'var(--family)'):'transparent',transition:'all 0.15s'}}/>))}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,60px)',gap:10,justifyContent:'center',margin:'0 auto'}}>
          {[1,2,3,4,5,6,7,8,9,'','0','⌫'].map((n,i) => (
            <button key={i} onClick={()=>{if(n==='⌫')setPin(p=>p.slice(0,-1));else if(n!==''&&pin.length<4){const np=pin+n;setPin(np);}}} style={{width:60,height:60,borderRadius:'50%',background:n===''?'transparent':'rgba(255,255,255,0.08)',border:`1px solid ${n===''?'transparent':'rgba(255,255,255,0.12)'}`,color:'#fff',fontSize:n==='⌫'?18:20,fontFamily:'var(--font-display)',fontWeight:700,cursor:n===''?'default':'pointer',transition:'all 0.15s'}}
              onMouseEnter={e=>n!==''&&(e.currentTarget.style.background='rgba(255,255,255,0.15)')} onMouseLeave={e=>n!==''&&(e.currentTarget.style.background='rgba(255,255,255,0.08)')}>{n}</button>
          ))}
        </div>
        <div style={{display:'flex',gap:10,justifyContent:'center',marginTop:20}}>
          {isCurfew && <button className="btn btn-ghost" onClick={()=>setShowPinPad(false)}>Kembali ke Jam Tidur</button>}
          <button className="btn btn-family" style={{padding:'12px 30px',fontSize:15}} onClick={tryUnlock} disabled={pin.length!==4 || loading}>{loading ? 'Memverifikasi...' : 'Buka Kunci'}</button>
        </div>
        {error && <div style={{color:'var(--danger)',fontSize:13,marginTop:10}}>PIN salah. Coba lagi.</div>}
      </div>
    </div>
  );
}

// ============================================================
// ROOT APP
// ============================================================
function App() {
  const { currentUser, state, appLoading } = useContext(AppCtx);
  const [hash, setHash] = useState(() => window.location.hash);

  useEffect(() => {
    const handleHash = () => setHash(window.location.hash);
    window.addEventListener('hashchange', handleHash);
    return () => window.removeEventListener('hashchange', handleHash);
  }, []);

  if (hash.includes('test') && state) {
    return <AdminDeveloperMode initialTab="test" />;
  }

  if (appLoading && !state) {
    return (
      <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)'}}>
        <div className="animate-spin" style={{fontSize:32,color:'var(--primary)'}}>⊙</div>
      </div>
    );
  }

  if (!currentUser) return <LoginScreen />;
  if (currentUser.role === ROLES.ADMIN) return <AdminDashboard />;
  if (currentUser.role === ROLES.FAMILY) return <FamilyDashboard />;
  if (currentUser.role === ROLES.KIDS) return <KidsDashboard />;
  return <LoginScreen />;
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <AppProvider><App /></AppProvider>
);
</script>
</body>
</html>
