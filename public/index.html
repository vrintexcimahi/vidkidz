function handleTestPreviewWheel(e) {
  const scroller = e.currentTarget.querySelector('.admin-main, .family-main, .kids-main');
  if (!scroller || scroller.scrollHeight <= scroller.clientHeight) return;
  const maxTop = scroller.scrollHeight - scroller.clientHeight;
  const nextTop = scroller.scrollTop + e.deltaY;
  if ((e.deltaY < 0 && scroller.scrollTop <= 0) || (e.deltaY > 0 && scroller.scrollTop >= maxTop)) return;
  e.preventDefault();
  e.stopPropagation();
  scroller.scrollTop = Math.max(0, Math.min(maxTop, nextTop));
}

function handleTestPreviewTouchStart(e) {
  e.currentTarget.dataset.touchY = String(e.touches?.[0]?.clientY || 0);
}

function handleTestPreviewTouchMove(e) {
  const lastY = Number(e.currentTarget.dataset.touchY || 0);
  const currentY = e.touches?.[0]?.clientY || lastY;
  const deltaY = lastY - currentY;
  if (!deltaY) return;
  e.currentTarget.dataset.touchY = String(currentY);
  const scroller = e.currentTarget.querySelector('.admin-main, .family-main, .kids-main');
  if (!scroller || scroller.scrollHeight <= scroller.clientHeight) return;
  const maxTop = scroller.scrollHeight - scroller.clientHeight;
  const nextTop = scroller.scrollTop + deltaY;
  if ((deltaY < 0 && scroller.scrollTop <= 0) || (deltaY > 0 && scroller.scrollTop >= maxTop)) return;
  e.preventDefault();
  e.stopPropagation();
  scroller.scrollTop = Math.max(0, Math.min(maxTop, nextTop));
}

function TestDashboardPreview({ item, previewBase, resetKey = 0 }) {
  const [previewUser, setPreviewUser] = useState(item.user);
  const [previewKidId, setPreviewKidId] = useState(item.user.role === ROLES.KIDS ? item.user.id : null);

  useEffect(() => {
    setPreviewUser(item.user);
    setPreviewKidId(item.user.role === ROLES.KIDS ? item.user.id : null);
  }, [item.user.id, item.user.role, resetKey]);

  const launchPreviewKidSession = useCallback((kidId) => {
    const kid = previewBase.state.users.kids.find(k => k.id === kidId);
    if (!kid || kid.isLocked) {
      previewBase.showNotif(kid?.isLocked ? 'Preview Kids terkunci' : 'Data anak tidak ditemukan', 'warn');
      return false;
    }
    setPreviewUser({ ...kid, role: ROLES.KIDS, demoAccess: true });
    setPreviewKidId(kid.id);
    return true;
  }, [previewBase]);

  const resetPreviewSession = useCallback(() => {
    setPreviewUser(item.user);
    setPreviewKidId(item.user.role === ROLES.KIDS ? item.user.id : null);
    previewBase.showNotif('Preview dikembalikan ke tampilan awal', 'warn');
  }, [item.user, previewBase]);

  let component = item.component;
  if (previewUser.role === ROLES.ADMIN) component = <AdminDashboard />;
  if (previewUser.role === ROLES.FAMILY) component = <FamilyDashboard />;
  if (previewUser.role === ROLES.KIDS) component = <KidsDashboard />;

  return (
    <AppCtx.Provider value={{
      ...previewBase,
      isTestPreview: true,
      currentUser: previewUser,
      currentKidId: previewKidId,
      setCurrentKidId: setPreviewKidId,
      launchKidSession: launchPreviewKidSession,
      logout: resetPreviewSession,
    }}>
      <div style={{position:'relative',width:'100%',height:'100%',overflow:'hidden'}}>
        <MobileNativeAppView
          item={item}
          previewBase={previewBase}
          previewUser={previewUser}
        />
      </div>
    </AppCtx.Provider>
  );
}

function AdminUserDataCenter({ users, devices = [], currentUser, updateState, addLog, showNotif, setModal, setConfirm }) {
  const [activeTab, setActiveTab] = useState('users');
  const [searchQuery, setSearchQuery] = useState('');
  const [roleFilter, setRoleFilter] = useState('all');
  const [deviceFilter, setDeviceFilter] = useState('all');
  const [osFilter, setOsFilter] = useState('all');
  const [copiedId, setCopiedId] = useState(null);

  const copyToClipboard = (text, id) => {
    try {
      navigator.clipboard.writeText(text);
      setCopiedId(id);
      showNotif('Tersalin ke clipboard');
      setTimeout(() => setCopiedId(null), 2000);
    } catch(e) {
      showNotif('Gagal menyalin', 'warn');
    }
  };

  const { admins = [], families = [], kids = [] } = users || {};

  const allUsers = useMemo(() => {
    const list = [];
    admins.forEach(a => list.push({ ...a, role: 'admin', roleLabel: 'Super Admin', identifier: a.email }));
    families.forEach(f => list.push({ ...f, role: 'family', roleLabel: 'Family (' + (f.plan || 'Basic') + ')', identifier: f.email || f.phone }));
    kids.forEach(k => {
      const fam = families.find(f => f.id === k.familyId);
      list.push({ ...k, role: 'kids', roleLabel: 'Kid (' + (fam ? fam.name : 'Family') + ')', identifier: 'ID: ' + k.id + ' · PIN: ' + k.lockPin });
    });
    return list;
  }, [admins, families, kids]);

  const userWithDevice = useMemo(() => {
    return allUsers.map(u => {
      const matchedDevices = devices.filter(d => d.userId === u.id);
      matchedDevices.sort((a, b) => (b.lastSeen || 0) - (a.lastSeen || 0));
      const latestDevice = matchedDevices[0] || null;
      return {
        user: u,
        device: latestDevice,
        deviceCount: matchedDevices.length
      };
    });
  }, [allUsers, devices]);

  const totalUsersCount = allUsers.length;
  const totalDevicesCount = devices.length;
  const active24hCount = devices.filter(d => Date.now() - (d.lastSeen || 0) < 86400000).length;
  const mobileCount = devices.filter(d => d.deviceType === 'mobile').length;
  const desktopCount = devices.filter(d => d.deviceType === 'desktop' || d.deviceType === 'desktop-touch').length;
  const pwaCount = devices.filter(d => d.pwa).length;

  const filteredUsers = useMemo(() => {
    return userWithDevice.filter(({ user, device }) => {
      if (roleFilter !== 'all' && user.role !== roleFilter) return false;
      if (deviceFilter !== 'all') {
        if (!device && deviceFilter !== 'none') return false;
        if (device && device.deviceType !== deviceFilter) return false;
      }
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        const matchName = String(user.name || '').toLowerCase().includes(q);
        const matchId = String(user.identifier || '').toLowerCase().includes(q);
        const matchDev = device ? (
          String(device.os || '').toLowerCase().includes(q) ||
          String(device.browser || '').toLowerCase().includes(q) ||
          String(device.id || '').toLowerCase().includes(q) ||
          String(device.ip || '').toLowerCase().includes(q)
        ) : false;
        if (!matchName && !matchId && !matchDev) return false;
      }
      return true;
    });
  }, [userWithDevice, roleFilter, deviceFilter, searchQuery]);

  const filteredDevices = useMemo(() => {
    return devices.filter(d => {
      if (deviceFilter !== 'all' && d.deviceType !== deviceFilter) return false;
      if (osFilter !== 'all' && String(d.os || '').toLowerCase() !== osFilter.toLowerCase()) return false;
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        const matchId = String(d.id || '').toLowerCase().includes(q);
        const matchUser = String(d.userName || '').toLowerCase().includes(q);
        const matchOs = String(d.os || '').toLowerCase().includes(q);
        const matchBrowser = String(d.browser || '').toLowerCase().includes(q);
        const matchIp = String(d.ip || '').toLowerCase().includes(q);
        if (!matchId && !matchUser && !matchOs && !matchBrowser && !matchIp) return false;
      }
      return true;
    });
  }, [devices, deviceFilter, osFilter, searchQuery]);

  const handleDeleteDevice = (dev) => {
    setConfirm({
      msg: `Hapus perangkat "${dev.os} · ${dev.browser}" (ID: ${dev.id.slice(0, 8)}...)?`,
      fn: async () => {
        try {
          await apiFetch('/api/device/' + dev.id, { method: 'DELETE' }).catch(() => null);
          updateState(s => {
            if (Array.isArray(s.devices)) {
              s.devices = s.devices.filter(d => d.id !== dev.id);
            }
          });
          addLog(currentUser.name, `Menghapus perangkat ${dev.id}`, 'admin');
          showNotif('Perangkat berhasil dihapus');
        } catch(e) {
          showNotif('Gagal menghapus perangkat', 'danger');
        }
      }
    });
  };

  const handleRegisterThisDevice = async () => {
    try {
      if (!window.VidkidzDevice) return;
      const data = window.VidkidzDevice.get();
      const res = await apiFetch('/api/device/register', {
        method: 'POST',
        body: JSON.stringify({
          ...data,
          userId: currentUser?.id || null,
          userName: currentUser?.name || null,
          userType: currentUser?.role || null
        })
      });
      if (res && res.ok) {
        updateState(s => {
          if (!Array.isArray(s.devices)) s.devices = [];
          const nowTs = Date.now();
          const exist = s.devices.find(d => d.id === data.deviceId);
          if (exist) {
            Object.assign(exist, data, {
              ip: res.ip || exist.ip,
              lastSeen: nowTs,
              userId: currentUser?.id || exist.userId,
              userName: currentUser?.name || exist.userName,
              userType: currentUser?.role || exist.userType
            });
          } else {
            s.devices.unshift({
              id: data.deviceId,
              ...data,
              ip: res.ip || '127.0.0.1',
              firstSeen: nowTs,
              lastSeen: nowTs,
              userId: currentUser?.id || null,
              userName: currentUser?.name || null,
              userType: currentUser?.role || null
            });
          }
        });
        showNotif('Perangkat saat ini berhasil didaftarkan / disinkronisasi');
      }
    } catch(e) {
      showNotif('Gagal mendaftarkan perangkat: ' + e.message, 'warn');
    }
  };

  return (
    <div className="fade-in" style={{width:'100%',minWidth:0}}>
      <div className="admin-header page-header" style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:24,flexWrap:'wrap',gap:16}}>
        <div>
          <h2 style={{color:'var(--t1)',fontSize:24,display:'flex',alignItems:'center',gap:10}}>
            <UiIcon name="server" size={26} color="var(--admin)" />
            User Data Center & Device Intelligence
          </h2>
          <p style={{color:'var(--t3)',marginTop:4,fontSize:13}}>
            Pusat data seluruh pengguna, perangkat terdaftar, profil adaptif UI, serta telemetri hardware & layar.
          </p>
        </div>
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          <button className="btn btn-outline" onClick={handleRegisterThisDevice} style={{display:'inline-flex',alignItems:'center',gap:6}}>
            <UiIcon name="refresh" size={14} color="currentColor" /> Sinkron Perangkat Ini
          </button>
        </div>
      </div>

      <div className="dashboard-stats userdata-stats" style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(min(200px,100%),1fr))',gap:14,marginBottom:24}}>
        <StatCard label="Total User" value={totalUsersCount} icon="ui:users" color="var(--primary)" sub={`${admins.length} Admin · ${families.length} Fam · ${kids.length} Kid`} />
        <StatCard label="Perangkat" value={totalDevicesCount} icon="ui:server" color="var(--admin)" sub="Terdaftar di registry" />
        <StatCard label="Aktif 24 Jam" value={active24hCount} icon="ui:activity" color="#24c66f" sub="Terakhir terlihat hari ini" />
        <StatCard label="Mobile / Desktop" value={`${mobileCount} / ${desktopCount}`} icon="ui:smartphone" color="#10b981" sub={`${mobileCount} HP · ${desktopCount} PC/Laptop`} />
        <StatCard label="PWA Standalone" value={pwaCount} icon="ui:monitor" color="#f59e0b" sub="Aplikasi terpasang" />
      </div>

      <div style={{display:'flex',gap:10,marginBottom:20,borderBottom:'1px solid var(--border)',paddingBottom:12}}>
        <button
          className={`userdata-tab-btn ${activeTab==='users'?'active':''}`}
          onClick={()=>setActiveTab('users')}
        >
          <UiIcon name="users" size={16} color="currentColor" />
          Data Pengguna & Perangkat ({filteredUsers.length})
        </button>
        <button
          className={`userdata-tab-btn ${activeTab==='devices'?'active':''}`}
          onClick={()=>setActiveTab('devices')}
        >
          <UiIcon name="monitor" size={16} color="currentColor" />
          Registry Perangkat ({filteredDevices.length})
        </button>
      </div>

      <div className="card mb-4" style={{padding:'14px 18px'}}>
        <div style={{display:'flex',gap:12,flexWrap:'wrap',alignItems:'center',justifyContent:'space-between'}}>
          <div style={{display:'flex',alignItems:'center',gap:8,background:'var(--bg-elevated)',padding:'6px 12px',borderRadius:8,border:'1px solid var(--border)',flex:1,minWidth:220,maxWidth:400}}>

            <input
              type="text"

            />
            {searchQuery && (

                  <th>PWA</th>

                        <td>

                        </td>
                        <td>
                          <span style={{fontSize:11,color:'var(--t3)',fontFamily:'monospace'}}>{ipStr}</span>
                        </td>
                        <td>
                          <span style={{fontSize:11,color:'var(--t3)'}}>
                            {lastActiveTs ? timeAgo(lastActiveTs) : '—'}
                          </span>
                        </td>
                        <td style={{textAlign:'right'}}>
                          <button
                            className="btn btn-ghost btn-sm"

                              const devData = device || (isCurrentUser && window.VidkidzDevice ? {
                                id: window.VidkidzDevice.getDeviceId(),
                                ...window.VidkidzDevice.get(),
                                userId: user.id,
                                userName: user.name,
                                userType: user.role,
                                ip: '127.0.0.1',
                                firstSeen: Date.now(),
                                lastSeen: Date.now()
                              } : null);
                              setModal({ type:'deviceTelemetry', data: { user, device: devData } });
                            }}
                            style={{display:'inline-flex',alignItems:'center',gap:4}}

                            <UiIcon name="eye" size={14} color="currentColor" /> Telemetri

                      </tr>
                    );
                  })
                )}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {activeTab === 'devices' && (
        <div className="card">
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse'}}>
              <thead>
                <tr>
                  <th>Perangkat</th>
                  <th>Device ID</th>
                  <th>Pengguna Terkait</th>
                  <th>OS & Browser</th>
                  <th>Layar & Viewport</th>
                  <th>Input & Profil</th>
                  <th>PWA</th>
                  <th>IP Server</th>
                  <th>Terakhir Aktif</th>
                  <th style={{textAlign:'right'}}>Aksi</th>
                </tr>
              </thead>
              <tbody>
                {filteredDevices.length === 0 ? (
                  <tr>
                    <td colSpan={10} style={{textAlign:'center',padding:'32px',color:'var(--t3)'}}>
                      Belum ada perangkat terdaftar di sistem.
                    </td>
                  </tr>
                ) : (
                  filteredDevices.map(dev => {
                    const devBadgeClass = dev.deviceType === 'mobile' ? 'badge-device-mobile' : dev.deviceType === 'desktop-touch' ? 'badge-device-touch' : 'badge-device-desktop';

                    return (
                      <tr key={dev.id}>
                        <td>
                          <div style={{display:'flex',alignItems:'center',gap:8}}>
                            <span className={`badge-device ${devBadgeClass}`} style={{padding:'4px 8px'}}>
                              <UiIcon name={dev.deviceType==='mobile'?'smartphone':'monitor'} size={14} color="currentColor" />
                              {dev.deviceType}
                            </span>
                          </div>
                        </td>
                        <td>
                          <div style={{display:'flex',alignItems:'center',gap:6}}>
                            <span style={{fontSize:11,fontFamily:'monospace',color:'var(--t2)',background:'var(--bg-elevated)',padding:'2px 6px',borderRadius:4}}>
                              {dev.id.slice(0, 12)}...
                            </span>
                            <button
                              onClick={() => copyToClipboard(dev.id, dev.id)}
                              className="btn btn-ghost btn-sm"
                              title="Salin Device ID"
                              style={{padding:2,minHeight:'auto'}}
                            >
                              <UiIcon name="copy" size={12} color={isCopied ? '#24c66f' : 'var(--t3)'} />
                            </button>
                          </div>
                        </td>
                        <td>
                          {dev.userName ? (
                            <div>
                              <span style={{fontWeight:700,color:'var(--t1)',fontSize:12}}>{dev.userName}</span>
                              <span style={{fontSize:10,color:'var(--t3)',display:'block'}}>{dev.userType || 'User'}</span>
                            </div>
                          ) : (
                            <span style={{color:'var(--t3)',fontSize:12,fontStyle:'italic'}}>Anonim / Belum Login</span>
                          )}
                        </td>
                        <td>
                          <div style={{fontSize:12,fontWeight:600,color:'var(--t1)'}}>{dev.os}</div>
                          <div style={{fontSize:11,color:'var(--t3)'}}>{dev.browser}</div>
                        </td>
                        <td>
                          <div style={{fontSize:11,fontFamily:'monospace',color:'var(--t2)'}}>
                            Layar: {dev.screenWidth || '—'}x{dev.screenHeight || '—'} ({dev.pixelRatio || 1}x)
                          </div>
                          <div style={{fontSize:10,fontFamily:'monospace',color:'var(--t3)'}}>
                            Viewport: {dev.viewportWidth || '—'}x{dev.viewportHeight || '—'}
                          </div>
                        </td>
                        <td>
                          <div style={{display:'flex',flexDirection:'column',gap:3}}>
                            <span style={{fontSize:10,padding:'1px 5px',borderRadius:3,background:'var(--bg-elevated)',color:'var(--t2)',alignSelf:'flex-start'}}>
                              {dev.uiProfile}
                            </span>
                            <span style={{fontSize:10,color:'var(--t3)'}}>
                              {dev.touch ? `Touch (${dev.maxTouchPoints || 1} pt)` : 'Mouse / Pointer'}
                            </span>
                          </div>
                        </td>
                        <td>
                          <span className={`badge-device ${dev.pwa ? 'badge-pwa-active' : 'badge-pwa-inactive'}`}>
                            {dev.pwa ? 'Standalone' : 'Browser'}
                          </span>
                        </td>
                        <td>
                          <span style={{fontSize:11,fontFamily:'monospace',color:'var(--t3)'}}>{dev.ip || '—'}</span>
                        </td>
                        <td>
                          <div style={{fontSize:11,color:'var(--t2)'}}>{dev.lastSeen ? timeAgo(dev.lastSeen) : '—'}</div>
                          <div style={{fontSize:10,color:'var(--t3)'}}>{dev.lastSeen ? formatTs(dev.lastSeen) : ''}</div>
                        </td>
                        <td style={{textAlign:'right'}}>
                          <div style={{display:'inline-flex',gap:6}}>
                            <button
                              className="btn btn-ghost btn-sm"
                              title="Lihat Detail Telemetri"
                              onClick={() => setModal({ type:'deviceTelemetry', data: { device: dev } })}
                              style={{padding:'4px 8px'}}
                            >
                              <UiIcon name="eye" size={14} color="currentColor" />
                            </button>
                            <button
                              className="btn btn-ghost btn-sm"
                              title="Hapus Perangkat"
                              onClick={() => handleDeleteDevice(dev)}
                              style={{padding:'4px 8px',color:'var(--danger)'}}
                            >
                              <UiIcon name="trash" size={14} color="currentColor" />
                            </button>
                          </div>
                        </td>
                      </tr>
                    );
                  })
                )}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

function DeviceTelemetryModal({ data, onClose }) {
  const { device, user } = data || {};
  const [copied, setCopied] = useState(false);

  if (!device) {
    return (
      <Modal open={true} onClose={onClose} title="Detail Telemetri Perangkat">
        <div style={{padding:'20px 0',textAlign:'center',color:'var(--t3)'}}>
          <p>Data telemetri perangkat tidak tersedia.</p>
          <button className="btn btn-outline mt-4" onClick={onClose}>Tutup</button>
        </div>
      </Modal>
    );
  }

  const jsonStr = JSON.stringify(device, null, 2);

  const copyJson = () => {
    navigator.clipboard.writeText(jsonStr);
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  return (
    <Modal open={true} onClose={onClose} title="Telemetri & Intelijensi Perangkat" lg>
      <div style={{display:'flex',flexDirection:'column',gap:16}}>
        <div style={{
          display:'flex',
          alignItems:'center',
          justifyContent:'space-between',
          padding:'14px 18px',
          borderRadius:12,
          background:'var(--bg-elevated)',
          border:'1px solid var(--border)',
          flexWrap:'wrap',
          gap:12
        }}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div style={{
              width:42,
              height:42,
              borderRadius:10,
              background:'var(--admin-dim)',
              display:'flex',
              alignItems:'center',
              justifyContent:'center',
              color:'var(--admin)'
            }}>
              <UiIcon name={device.deviceType==='mobile'?'smartphone':'monitor'} size={22} color="currentColor" />
            </div>
            <div>
              <h4 style={{color:'var(--t1)',margin:0,fontSize:15}}>
                {device.os} · {device.browser}
              </h4>
              <span style={{fontSize:11,color:'var(--t3)',fontFamily:'monospace'}}>
                Device ID: {device.id}
              </span>
            </div>
          </div>
          <div style={{display:'flex',gap:8}}>
            <span className={`badge-device ${device.deviceType==='mobile'?'badge-device-mobile':device.deviceType==='desktop-touch'?'badge-device-touch':'badge-device-desktop'}`}>
              {device.deviceType}
            </span>
            <span className={`badge-device ${device.pwa ? 'badge-pwa-active' : 'badge-pwa-inactive'}`}>
              {device.pwa ? 'PWA Standalone' : 'Browser'}
            </span>
          </div>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'repeat(2,minmax(0,1fr))',gap:10}}>
          <div className="telemetry-kv">
            <span className="k">Pengguna Terkait</span>
            <span className="v">{user ? `${user.name} (${user.role})` : (device.userName || 'Anonim')}</span>
          </div>
          <div className="telemetry-kv">
            <span className="k">IP Address (Server)</span>
            <span className="v">{device.ip || '—'}</span>
          </div>
          <div className="telemetry-kv">
            <span className="k">UI Profile Aktif</span>
            <span className="v">{device.uiProfile || '—'}</span>
          </div>
          <div className="telemetry-kv">
            <span className="k">Orientasi Layar</span>
            <span className="v">{device.orientation || '—'}</span>
          </div>
          <div className="telemetry-kv">
            <span className="k">Resolusi Layar Fisik</span>
            <span className="v">{device.screenWidth} × {device.screenHeight} px</span>
          </div>
          <div className="telemetry-kv">
            <span className="k">Dimensi Viewport</span>
            <span className="v">{device.viewportWidth} × {device.viewportHeight} px</span>
          </div>
          <div className="telemetry-kv">
            <span className="k">Device Pixel Ratio (DPR)</span>
            <span className="v">{device.pixelRatio}x</span>
          </div>
          <div className="telemetry-kv">
            <span className="k">Input Touch Support</span>
            <span className="v">{device.touch ? `Ya (${device.maxTouchPoints || 1} titik sentuh)` : 'Tidak'}</span>
          </div>
          <div className="telemetry-kv">
            <span className="k">Tipe Pointer Utama</span>
            <span className="v">{device.pointerType || '—'}</span>

          <div className="telemetry-kv">
            <span className="k">Hover Didukung</span>
            <span className="v">{device.hoverSupported ? 'Ya' : 'Tidak'}</span>
          </div>
          <div className="telemetry-kv">
            <span className="k">Bahasa Browser</span>
            <span className="v">{device.language || 'id-ID'}</span>
          </div>
          <div className="telemetry-kv">
            <span className="k">Zona Waktu (Timezone)</span>
            <span className="v">{device.timezone || 'Asia/Jakarta'}</span>
          </div>
          <div className="telemetry-kv">
            <span className="k">Pertama Terlihat</span>
            <span className="v">{device.firstSeen ? formatTs(device.firstSeen) : '—'}</span>

              className="btn btn-outline btn-sm"
              onClick={copyJson}

          <pre style={{
            background:'#051d2d',
            color:'#38bdf8',
            padding:'12px 16px',
            borderRadius:8,
            fontSize:11,
            maxHeight:200,
            overflowY:'auto',
            fontFamily:'monospace',
            border:'1px solid rgba(255,255,255,0.08)'
          }}>
            {jsonStr}
          </pre>
        </div>

        <div style={{display:'flex',justifyContent:'flex-end',marginTop:8}}>
          <button className="btn btn-outline" onClick={onClose}>Tutup</button>
        </div>
      </div>
    </Modal>
  );
}

function AddFamilyModal({ onClose }) {
  const { updateState, addLog, showNotif, currentUser } = useContext(AppCtx);
  const [form, setForm] = useState({ name:'', email:'', password:'', phone:'', plan:'Basic' });
  const handle = () => {
    if (!form.name||!form.email||!form.password) { showNotif('Isi semua field wajib','error'); return; }
    updateState(s => { s.users.families.push({ ...form, id:uid(), linkedKids:[], createdAt:now(), lastLogin:now() }); });
    addLog(currentUser.name, `Menambah keluarga baru: ${form.name}`, 'admin');
    showNotif('Keluarga berhasil ditambahkan'); onClose();
  };
  return (
    <Modal open title={<span style={{display:'inline-flex',alignItems:'center',gap:8}}><UiIcon name="plus" size={18} color="var(--primary)" /> Tambah Keluarga</span>} onClose={onClose}>
      {['name','email','password','phone'].map(f => (<div key={f} style={{marginBottom:12}}><label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:4,fontFamily:'var(--font-display)'}}>{f}</label><input type={f==='password'?'password':'text'} value={form[f]} onChange={e=>setForm({...form,[f]:e.target.value})} /></div>))}
      <div style={{marginBottom:16}}><label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:4,fontFamily:'var(--font-display)'}}>Plan</label><select value={form.plan} onChange={e=>setForm({...form,plan:e.target.value})}><option>Basic</option><option>Premium</option></select></div>
      <div className="flex gap-3 justify-end"><button className="btn btn-ghost" onClick={onClose}>Batal</button><button className="btn btn-admin" onClick={handle}>Simpan</button></div>
    </Modal>
  );
}

function EditAdminModal({ data, onClose }) {
  const { updateState, addLog, showNotif, currentUser } = useContext(AppCtx);
  const [form, setForm] = useState({ ...data });
  const handle = () => {
    if (!form.name || !form.email) { showNotif('Nama dan email wajib diisi', 'error'); return; }
    updateState(s => {
      const idx = s.users.admins.findIndex(a=>a.id===data.id);
      if (idx>=0) s.users.admins[idx] = {
        ...s.users.admins[idx],
        name: form.name,
        email: form.email,
        password: form.password || s.users.admins[idx].password
      };
    });
    addLog(currentUser.name, `Mengubah admin: ${form.name}`, 'admin');
    showNotif('Admin diperbarui'); onClose();
  };
  return (
    <Modal open title={<span style={{display:'inline-flex',alignItems:'center',gap:8}}><UiIcon name="edit" size={18} color="var(--primary)" /> Edit Admin</span>} onClose={onClose}>
      {['name','email','password'].map(f => (
        <div key={f} style={{marginBottom:12}}>
          <label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:4,fontFamily:'var(--font-display)'}}>{f}</label>
          <input type={f==='password'?'password':'text'} value={form[f]||''} onChange={e=>setForm({...form,[f]:e.target.value})} />
        </div>
      ))}
      <div className="flex gap-3 justify-end"><button className="btn btn-ghost" onClick={onClose}>Batal</button><button className="btn btn-admin" onClick={handle}>Simpan</button></div>
    </Modal>
  );
}

function AdminEditKidModal({ data, onClose }) {
  const { state, updateState, addLog, showNotif, currentUser } = useContext(AppCtx);
  const [form, setForm] = useState({ ...data });
  const handle = () => {
    if (!form.name || !form.familyId || !form.lockPin) { showNotif('Nama, keluarga, dan PIN wajib diisi','error'); return; }
    updateState(s => {
      const prev = s.users.kids.find(k=>k.id===data.id);
      const idx = s.users.kids.findIndex(k=>k.id===data.id);
      if (idx >= 0) {
        s.users.kids[idx] = {
          ...s.users.kids[idx],
          name: form.name,
          age: parseInt(form.age)||1,
          avatar: form.avatar,
          familyId: form.familyId,
          lockPin: form.lockPin,
          isLocked: !!form.isLocked
        };
      }
      if (prev?.familyId !== form.familyId) {
        const oldFam = s.users.families.find(f=>f.id===prev?.familyId);
        const newFam = s.users.families.find(f=>f.id===form.familyId);
        if (oldFam) oldFam.linkedKids = (oldFam.linkedKids || []).filter(id=>id!==data.id);
        if (newFam) newFam.linkedKids = [...new Set([...(newFam.linkedKids || []), data.id])];
      }
    });
    addLog(currentUser.name, `Mengubah akun anak: ${form.name}`, 'admin');
    showNotif('Akun anak diperbarui'); onClose();
  };
  return (
    <Modal open title={<span style={{display:'inline-flex',alignItems:'center',gap:8}}><UiIcon name="edit" size={18} color="var(--primary)" /> Edit Akun Anak</span>} onClose={onClose}>
      <div style={{marginBottom:12}}><label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:4,fontFamily:'var(--font-display)'}}>Nama</label><input value={form.name||''} onChange={e=>setForm({...form,name:e.target.value})} /></div>
      <div style={{marginBottom:12,display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <div><label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:4,fontFamily:'var(--font-display)'}}>Usia</label><input type="number" min="1" max="18" value={form.age||1} onChange={e=>setForm({...form,age:parseInt(e.target.value)||1})} /></div>
        <div><label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:4,fontFamily:'var(--font-display)'}}>Avatar</label><select value={form.avatar||'👦'} onChange={e=>setForm({...form,avatar:e.target.value})}>{['👦','👧','🧒','👶','🧑'].map(a=><option key={a} value={a}>{a}</option>)}</select></div>
      </div>
      <div style={{marginBottom:12}}><label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:4,fontFamily:'var(--font-display)'}}>Keluarga</label><select value={form.familyId||''} onChange={e=>setForm({...form,familyId:e.target.value})}><option value="">— Pilih Keluarga —</option>{state.users.families.map(f=><option key={f.id} value={f.id}>{f.name}</option>)}</select></div>
      <div style={{marginBottom:12}}><label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:4,fontFamily:'var(--font-display)'}}>PIN</label><input maxLength={4} value={form.lockPin||''} onChange={e=>setForm({...form,lockPin:e.target.value})} /></div>
      <div className="flex items-center justify-between" style={{marginBottom:16,padding:'10px 0',borderTop:'1px solid var(--border)',borderBottom:'1px solid var(--border)'}}>
        <span style={{fontSize:13,color:'var(--t1)',display:'inline-flex',alignItems:'center',gap:6}}><UiIcon name="lock" size={15} color="var(--primary)" /> Lock akun anak</span>
        <Toggle checked={!!form.isLocked} onChange={v=>setForm({...form,isLocked:v})} accent="admin" />
      </div>
      <div className="flex gap-3 justify-end"><button className="btn btn-ghost" onClick={onClose}>Batal</button><button className="btn btn-admin" onClick={handle}>Simpan</button></div>
    </Modal>
  );
}

function LogDetailModal({ data, onClose }) {
  const [copied, setCopied] = useState(false);
  if (!data) return null;

  const handleCopy = () => {
    try {
      navigator.clipboard.writeText(JSON.stringify(data, null, 2));
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch (_) {}
  };

  const handleResolve = () => {
    if (window.VidkidzLogger) {
      window.VidkidzLogger.resolveError(data.id);
      onClose();
    }
  };

  return (
    <Modal open title="🔍 Detail Log & Diagnostik" onClose={onClose} lg>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16,flexWrap:'wrap'}}>
        <span className={`log-badge-level log-level-${data.level}`}>{data.level}</span>
        <span style={{background:'rgba(255,255,255,0.08)',padding:'2px 8px',borderRadius:4,fontSize:11,fontWeight:700,color:'var(--t2)'}}>{data.module}</span>
        <span style={{color:'var(--t3)',fontSize:12}}>Aktor: <strong style={{color:'var(--t1)'}}>{data.actor}</strong></span>
        <span style={{color:'var(--t3)',fontSize:12,marginLeft:'auto'}}>{new Date(data.timestamp).toLocaleString('id-ID')}</span>
      </div>

      <div style={{marginBottom:16}}>
        <label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:6}}>Pesan Sistem</label>
        <div style={{background:'rgba(0,0,0,0.35)',border:'1px solid var(--border)',borderRadius:8,padding:'10px 14px',color:'var(--t1)',fontSize:13,fontFamily:'monospace',wordBreak:'break-word'}}>
          {data.message}
        </div>
      </div>

      {data.details && (
        <div style={{marginBottom:16}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
            <label style={{fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px'}}>Payload Data / Detail Context</label>
            <button className="btn btn-ghost btn-xs" onClick={handleCopy} style={{fontSize:11,padding:'2px 8px'}}>
              {copied ? '✓ Disalin' : '📋 Salin JSON'}
            </button>
          </div>
          <pre style={{background:'#0a0f1d',border:'1px solid rgba(255,255,255,0.08)',borderRadius:8,padding:12,fontSize:11,color:'#38bdf8',maxHeight:220,overflow:'auto',lineHeight:1.5}}>
            {JSON.stringify(data.details, null, 2)}
          </pre>
        </div>
      )}

      {data.stack && (
        <div style={{marginBottom:16}}>
          <label style={{display:'block',fontSize:11,color:'#f87171',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:6}}>Stack Trace</label>
          <pre style={{background:'rgba(239,68,68,0.08)',border:'1px solid rgba(239,68,68,0.25)',borderRadius:8,padding:12,fontSize:11,color:'#fca5a5',maxHeight:160,overflow:'auto',lineHeight:1.4}}>
            {data.stack}
          </pre>
        </div>
      )}

      <div className="flex gap-3 justify-end items-center" style={{marginTop:20,borderTop:'1px solid var(--border)',paddingTop:14}}>
        {data.level === 'ERROR' && !data.resolved && (
          <button className="btn btn-sm" onClick={handleResolve} style={{background:'#10b981',color:'#fff',border:'none'}}>
            ✓ Tandai Resolved (Selesai)
          </button>
        )}
        <button className="btn btn-ghost btn-sm" onClick={onClose}>Tutup</button>
      </div>
    </Modal>
  );
}

function RestorePreviewModal({ data, onClose }) {
  const { updateState, showNotif } = useContext(AppCtx);
  const [isRestoring, setIsRestoring] = useState(false);

  if (!data || !data.state) return null;

  const st = data.state;
  const adminCount = st.users?.admins?.length || 0;
  const famCount = st.users?.families?.length || 0;
  const kidCount = st.users?.kids?.length || 0;
  const albCount = st.albums?.length || 0;
  const paCount = st.photoAlbums?.length || 0;
  const rewCount = st.rewards?.length || 0;
  const redCount = st.redemptions?.length || 0;
  const hafCount = st.hafalanRecords?.length || 0;
  const logCount = st.activityLog?.length || 0;
  const total = adminCount + famCount + kidCount + albCount + paCount + rewCount + redCount + hafCount + logCount;
  const sizeKB = (JSON.stringify(data).length / 1024).toFixed(1);

  const handleExecuteRestore = async () => {
    setIsRestoring(true);
    try {
      const token = localStorage.getItem('vidkidz_token') || sessionStorage.getItem('vidkidz_token');
      const res = await fetch('/api/admin/restore-state', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { Authorization: `Bearer ${token}` } : {})
        },
        body: JSON.stringify({ state: data.state })
      });
      const resData = await res.json();
      if (!res.ok) {
        throw new Error(resData.error || 'Gagal memulihkan state database');
      }
      updateState(() => data.state);
      if (window.VidkidzLogger) {
        window.VidkidzLogger.success('DATABASE', 'Admin', `Database berhasil dipulihkan dari cadangan (${total} record)`);
      }
      showNotif('Database berhasil dipulihkan sempurna!', 'success');
      onClose();
    } catch (err) {
      showNotif('Gagal memulihkan: ' + err.message, 'error');
      if (window.VidkidzLogger) {
        window.VidkidzLogger.error('DATABASE', 'Admin', 'Gagal memulihkan database', null, err.stack);
      }
    } finally {
      setIsRestoring(false);
    }
  };

  return (
    <Modal open title="📦 Konfirmasi Pemulihan Database" onClose={onClose} lg>
      <div style={{background:'rgba(239,68,68,0.12)',border:'1px solid rgba(239,68,68,0.3)',borderRadius:10,padding:'12px 16px',marginBottom:18,display:'flex',gap:12,alignItems:'flex-start'}}>
        <span style={{fontSize:20}}>⚠️</span>
        <div style={{fontSize:12,color:'#fca5a5',lineHeight:1.5}}>
          <strong>PERINGATAN KRITIKAL:</strong> Tindakan ini akan menimpa seluruh data sistem aktif saat ini dengan snapshot yang ada pada berkas cadangan ini.
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(3, 1fr)',gap:10,marginBottom:18}}>
        <div className="card" style={{padding:12,background:'rgba(255,255,255,0.03)',textAlign:'center'}}>
          <div style={{fontSize:11,color:'var(--t3)'}}>Versi Cadangan</div>
          <div style={{fontSize:16,fontWeight:800,color:'var(--admin)',marginTop:2}}>{data.version || 'v5.2.x'}</div>
        </div>
        <div className="card" style={{padding:12,background:'rgba(255,255,255,0.03)',textAlign:'center'}}>
          <div style={{fontSize:11,color:'var(--t3)'}}>Total Record</div>
          <div style={{fontSize:16,fontWeight:800,color:'var(--primary)',marginTop:2}}>{total} item</div>
        </div>
        <div className="card" style={{padding:12,background:'rgba(255,255,255,0.03)',textAlign:'center'}}>
          <div style={{fontSize:11,color:'var(--t3)'}}>Ukuran File</div>
          <div style={{fontSize:16,fontWeight:800,color:'var(--t1)',marginTop:2}}>{sizeKB} KB</div>
        </div>
      </div>

      <div style={{marginBottom:14}}>
        <div style={{fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:8}}>Rincian Koleksi yang Akan Dipulihkan:</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,fontSize:12}}>
          <div style={{padding:'8px 12px',background:'rgba(255,255,255,0.02)',borderRadius:6,border:'1px solid var(--border)',display:'flex',justifyContent:'space-between'}}>
            <span style={{color:'var(--t2)'}}>👨‍👩‍👧 Keluarga & Akun Anak</span>
            <strong>{famCount} fam / {kidCount} kid</strong>
          </div>
          <div style={{padding:'8px 12px',background:'rgba(255,255,255,0.02)',borderRadius:6,border:'1px solid var(--border)',display:'flex',justifyContent:'space-between'}}>
            <span style={{color:'var(--t2)'}}>🛡️ Akun Superadmin</span>
            <strong>{adminCount} admin</strong>
          </div>
          <div style={{padding:'8px 12px',background:'rgba(255,255,255,0.02)',borderRadius:6,border:'1px solid var(--border)',display:'flex',justifyContent:'space-between'}}>
            <span style={{color:'var(--t2)'}}>📺 Album Video Edukasi</span>
            <strong>{albCount} album</strong>
          </div>
          <div style={{padding:'8px 12px',background:'rgba(255,255,255,0.02)',borderRadius:6,border:'1px solid var(--border)',display:'flex',justifyContent:'space-between'}}>
            <span style={{color:'var(--t2)'}}>📸 Album Foto Kenangan</span>
            <strong>{paCount} album</strong>
          </div>
          <div style={{padding:'8px 12px',background:'rgba(255,255,255,0.02)',borderRadius:6,border:'1px solid var(--border)',display:'flex',justifyContent:'space-between'}}>
            <span style={{color:'var(--t2)'}}>🎁 Katalog Hadiah & Redeem</span>
            <strong>{rewCount} rew / {redCount} red</strong>
          </div>
          <div style={{padding:'8px 12px',background:'rgba(255,255,255,0.02)',borderRadius:6,border:'1px solid var(--border)',display:'flex',justifyContent:'space-between'}}>
            <span style={{color:'var(--t2)'}}>📖 Rekaman Hafalan & Log</span>
            <strong>{hafCount} haf / {logCount} log</strong>
          </div>
        </div>
      </div>

      <div className="flex gap-3 justify-end" style={{marginTop:24,borderTop:'1px solid var(--border)',paddingTop:14}}>
        <button className="btn btn-ghost" onClick={onClose} disabled={isRestoring}>Batalkan</button>
        <button className="btn btn-admin" onClick={handleExecuteRestore} disabled={isRestoring} style={{background:'var(--danger)',color:'#fff',borderColor:'var(--danger)'}}>
          {isRestoring ? '⚡ Sedang Memulihkan...' : '⚡ Ya, Timpa & Pulihkan Database'}
        </button>
      </div>
    </Modal>
  );
}

// ADMIN: LOG & REAL-TIME MONITORING COMPONENT

function AdminLogMonitoring({ onShowDetail, activityLog = [] }) {
  const [activeTab, setActiveTab] = useState('system');
  const [logs, setLogs] = useState(() => window.VidkidzLogger ? window.VidkidzLogger.getLogs() : []);
  const [search, setSearch] = useState('');
  const [levelFilter, setLevelFilter] = useState('ALL');
  const [moduleFilter, setModuleFilter] = useState('ALL');
  const [isPaused, setIsPaused] = useState(false);
  const [actSearch, setActSearch] = useState('');
  const [actTypeFilter, setActTypeFilter] = useState('all');
  const terminalRef = useRef(null);

  useEffect(() => {
    if (!window.VidkidzLogger) return;
    const unsub = window.VidkidzLogger.subscribe((newLogs) => {
      if (!isPaused) {
        setLogs([...newLogs]);
      }
    });
    return unsub;
  }, [isPaused]);

  const filteredLogs = useMemo(() => {
    return logs.filter(l => {
      if (levelFilter !== 'ALL' && l.level !== levelFilter) return false;
      if (moduleFilter !== 'ALL' && l.module !== moduleFilter) return false;
      if (search) {
        const q = search.toLowerCase();
        const mMatch = (l.message || '').toLowerCase().includes(q);
        const aMatch = (l.actor || '').toLowerCase().includes(q);
        const modMatch = (l.module || '').toLowerCase().includes(q);
        if (!mMatch && !aMatch && !modMatch) return false;
      }
      return true;
    });
  }, [logs, levelFilter, moduleFilter, search]);

  const filteredActivity = useMemo(() => {
    return activityLog.filter(l => {
      if (actTypeFilter !== 'all' && l.type !== actTypeFilter) return false;
      if (actSearch) {
        const q = actSearch.toLowerCase();
        return (l.user||'').toLowerCase().includes(q) || (l.action||'').toLowerCase().includes(q);
      }
      return true;
    });
  }, [activityLog, actTypeFilter, actSearch]);

  const activityTypes = useMemo(() => [...new Set(activityLog.map(l => l.type).filter(Boolean))], [activityLog]);

  const errorCount = useMemo(() => logs.filter(l => l.level === 'ERROR').length, [logs]);
  const warnCount = useMemo(() => logs.filter(l => l.level === 'WARN').length, [logs]);
  const successCount = useMemo(() => logs.filter(l => l.level === 'SUCCESS').length, [logs]);
  const unresolvedErrors = useMemo(() => logs.filter(l => l.level === 'ERROR' && !l.resolved).length, [logs]);

  const handleClear = () => {
    if (confirm('Bersihkan seluruh ring buffer log sistem dari memori?')) {
      if (window.VidkidzLogger) window.VidkidzLogger.clear();
      setLogs([]);
    }
  };

  const handleExportJSON = () => {
    const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(logs, null, 2));
    const a = document.createElement('a');
    a.href = dataStr;
    a.download = `vidkidz-system-logs-${Date.now()}.json`;
    a.click();
  };

  const handleExportCSV = () => {
    const headers = ['ID', 'Timestamp', 'Level', 'Module', 'Actor', 'Message', 'Resolved'];
    const rows = logs.map(l => [
      l.id,
      new Date(l.timestamp).toISOString(),
      l.level,
      l.module,
      `"${(l.actor||'').replace(/"/g, '""')}"`,
      `"${(l.message||'').replace(/"/g, '""')}"`,
      l.resolved ? 'TRUE' : 'FALSE'
    ]);
    const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `vidkidz-system-logs-${Date.now()}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const handleExportActivityCSV = () => {
    const headers = ['Waktu', 'User', 'Aksi', 'Tipe'];
    const rows = activityLog.map(l => [
      formatTs(l.ts),
      `"${(l.user||'').replace(/"/g, '""')}"`,
      `"${(l.action||'').replace(/"/g, '""')}"`,
      l.type
    ]);
    const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `vidkidz-activity-log-${Date.now()}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const handleSimulate = (lvl) => {
    if (window.VidkidzLogger) window.VidkidzLogger.simulate(lvl);
  };

  return (
    <div className="fade-in">
      {/* Header */}
      <div className="page-header flex items-center justify-between mb-5 flex-wrap gap-3">
        <div>
          <h2 style={{color:'var(--t1)',margin:0,display:'flex',alignItems:'center',gap:8}}>
            <UiIcon name="terminal" size={20} color="var(--primary)" /> Log & Monitoring
          </h2>
          <p style={{color:'var(--t3)',fontSize:12,marginTop:3}}>System telemetry, activity audit, dan ring buffer event runtime</p>
        </div>
      </div>

      {/* Tab Switcher */}
      <div style={{display:'flex',gap:4,marginBottom:20,borderBottom:'1px solid var(--border)',paddingBottom:0}}>
        {[
          { id:'system', label:'System Log', icon:'terminal' },
          { id:'activity', label:'Activity Log', icon:'activity', badge: activityLog.length },
        ].map(t => (
          <button key={t.id} onClick={()=>setActiveTab(t.id)} style={{
            padding:'8px 18px',
            fontSize:13,
            fontWeight:600,
            border:'none',
            borderBottom: activeTab===t.id ? '2px solid var(--primary)' : '2px solid transparent',
            background:'transparent',
            color: activeTab===t.id ? 'var(--primary)' : 'var(--t3)',
            cursor:'pointer',
            display:'flex',
            alignItems:'center',
            gap:6,
            transition:'all 0.15s',
            borderRadius:'6px 6px 0 0',
          }}>
            <UiIcon name={t.icon} size={14} color="currentColor" />
            {t.label}
            {t.badge != null && (

              <div style={{fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase'}}>Total Entri</div>

            </div>
            <div className="card" style={{padding:'12px 16px',background:'rgba(239,68,68,0.06)',border:'1px solid rgba(239,68,68,0.2)'}}>
              <div style={{fontSize:11,color:'#f87171',fontWeight:700,textTransform:'uppercase'}}>Error Runtime</div>
              <div style={{fontSize:22,fontWeight:800,color:'#f87171',marginTop:2}}>
                {errorCount} {unresolvedErrors > 0 && <span style={{fontSize:12,fontWeight:600,color:'#fca5a5'}}>({unresolvedErrors} unresolved)</span>}
              </div>
            </div>
            <div className="card" style={{padding:'12px 16px',background:'rgba(245,158,11,0.06)',border:'1px solid rgba(245,158,11,0.2)'}}>
              <div style={{fontSize:11,color:'#fbbf24',fontWeight:700,textTransform:'uppercase'}}>Peringatan</div>
              <div style={{fontSize:22,fontWeight:800,color:'#fbbf24',marginTop:2}}>{warnCount}</div>
            </div>
            <div className="card" style={{padding:'12px 16px',background:'rgba(16,185,129,0.06)',border:'1px solid rgba(16,185,129,0.2)'}}>
              <div style={{fontSize:11,color:'#34d399',fontWeight:700,textTransform:'uppercase'}}>Event Sukses</div>
              <div style={{fontSize:22,fontWeight:800,color:'#34d399',marginTop:2}}>{successCount}</div>
            </div>
          </div>

          {/* Log viewer */}
          <div className="card" style={{padding:0,overflow:'hidden',display:'flex',flexDirection:'column'}}>
            <div style={{padding:'12px 16px',background:'rgba(255,255,255,0.02)',borderBottom:'1px solid var(--border)',display:'flex',gap:12,alignItems:'center',flexWrap:'wrap'}}>
              <div style={{position:'relative',flex:1,minWidth:220}}>
                <input
                  placeholder="Cari pesan, aktor, modul..."
                  value={search}
                  onChange={e=>setSearch(e.target.value)}
                  style={{padding:'7px 12px 7px 30px',fontSize:12,borderRadius:6}}
                />
                <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--t3)',display:'flex',alignItems:'center'}}>
                  <UiIcon name="search" size={13} color="var(--primary)" />
                </span>
              </div>
              <div style={{display:'flex',gap:8,alignItems:'center'}}>
                <select value={levelFilter} onChange={e=>setLevelFilter(e.target.value)} style={{fontSize:12,padding:'6px 10px',borderRadius:6}}>
                  <option value="ALL">Semua Level</option>
                  <option value="ERROR">ERROR Only</option>
                  <option value="WARN">WARN Only</option>
                  <option value="SUCCESS">SUCCESS Only</option>
                  <option value="INFO">INFO Only</option>
                </select>
                <select value={moduleFilter} onChange={e=>setModuleFilter(e.target.value)} style={{fontSize:12,padding:'6px 10px',borderRadius:6}}>
                  <option value="ALL">Semua Modul</option>
                  <option value="SYSTEM">SYSTEM</option>
                  <option value="AUTH">AUTH</option>
                  <option value="DATABASE">DATABASE</option>
                  <option value="RUNTIME">RUNTIME</option>
                  <option value="NETWORK">NETWORK</option>
                  <option value="SOCKET">SOCKET</option>
                  <option value="SECURITY">SECURITY</option>
                </select>
              </div>
            </div>
            <div ref={terminalRef} style={{maxHeight:540,overflowY:'auto',padding:'8px 12px',background:'#070c18',fontFamily:'monospace',fontSize:12}}>
              {filteredLogs.length === 0 ? (
                <div style={{padding:40,textAlign:'center',color:'var(--t3)'}}>
                  <div style={{fontSize:28,marginBottom:8}}>📋</div>
                  <div>Tidak ada log yang sesuai dengan kriteria filter saat ini.</div>
                </div>
              ) : (
                filteredLogs.map(l => (
                  <div key={l.id} className="log-row-item" onClick={()=>onShowDetail(l)}>
                    <span style={{color:'var(--t3)',fontSize:11,width:68,flexShrink:0}}>{formatTs(l.timestamp).split(' ')[1] || formatTs(l.timestamp)}</span>
                    <span className={`log-badge-level log-level-${l.level}`}>{l.level}</span>
                    <span style={{fontSize:11,color:'var(--t3)',width:76,flexShrink:0,overflow:'hidden',textOverflow:'ellipsis',fontWeight:600}}>[{l.module}]</span>
                    <span style={{color:'#38bdf8',fontSize:11,width:80,flexShrink:0,overflow:'hidden',textOverflow:'ellipsis'}}>{l.actor}</span>
                    <span style={{color:'var(--t1)',flex:1,minWidth:0,wordBreak:'break-word'}}>{l.message}</span>
                    {l.level === 'ERROR' && (
                      <span style={{fontSize:10,fontWeight:700,padding:'1px 6px',borderRadius:4,background:l.resolved?'rgba(16,185,129,0.2)':'rgba(239,68,68,0.25)',color:l.resolved?'#34d399':'#f87171'}}>
                        {l.resolved ? 'RESOLVED' : 'UNRESOLVED'}
                      </span>
                    )}
                    <button className="btn btn-ghost btn-xs" style={{fontSize:10,padding:'2px 6px',color:'var(--t3)'}}>Detail →</button>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      )}

      {/* ── ACTIVITY LOG TAB ── */}
      {activeTab === 'activity' && (
        <div>
          <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginBottom:16}}>
            <div style={{position:'relative',flex:1,minWidth:200}}>
              <input
                placeholder="Cari user atau aksi..."
                value={actSearch}
                onChange={e=>setActSearch(e.target.value)}
                style={{padding:'7px 12px 7px 30px',fontSize:12,borderRadius:6,width:'100%'}}
              />
              <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--t3)',display:'flex',alignItems:'center'}}>
                <UiIcon name="search" size={13} color="var(--primary)" />
              </span>
            </div>
            <select value={actTypeFilter} onChange={e=>setActTypeFilter(e.target.value)} style={{fontSize:12,padding:'6px 10px',borderRadius:6}}>
              <option value="all">Semua Tipe</option>
              {activityTypes.map(t => <option key={t} value={t}>{t}</option>)}
            </select>
            <button className="btn btn-ghost btn-sm" onClick={handleExportActivityCSV}>Ekspor CSV</button>
            <span style={{marginLeft:'auto',color:'var(--t3)',fontSize:12}}>{activityLog.length} entri</span>
          </div>
          <div className="card" style={{padding:0,overflow:'hidden'}}>
            <div className="terminal" style={{maxHeight:520,overflow:'auto',padding:'8px 12px'}}>
              {filteredActivity.length === 0 ? (
                <div style={{padding:40,textAlign:'center',color:'var(--t3)'}}>
                  <div style={{fontSize:28,marginBottom:8}}>📋</div>
                  <div>Tidak ada aktivitas yang sesuai filter.</div>
                </div>
              ) : filteredActivity.map(log => (
                <div key={log.id} className="prompt" style={{display:'flex',gap:8,alignItems:'baseline',flexWrap:'wrap'}}>
                  <span className="t-gray" style={{fontSize:11,flexShrink:0}}>[{formatTs(log.ts)}]</span>
                  <span className="t-green" style={{fontWeight:700,flexShrink:0}}>{log.user}</span>
                  <span className="t-gray">→</span>
                  <span style={{flex:1}}>{log.action}</span>
                  <span className={`badge badge-${log.type==='coin'?'coin':log.type==='lock'||log.type==='unlock'?'warn':log.type==='admin'?'admin':'primary'}`} style={{fontSize:10,display:'inline-flex',alignItems:'center',gap:4}}>
                    <UiIcon name={log.type==='coin'?'coin':log.type==='lock'?'lock':log.type==='unlock'?'unlock':log.type==='admin'?'zap':log.type==='game'?'grid':log.type==='hafalan'?'book':'play'} size={10} color="currentColor" />
                    {log.type}
                  </span>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ============================================================
// ADMIN: BACKUP DATABASE & TELEGRAM BOT INTEGRATION
// ============================================================
function AdminBackupDatabase({ onRestorePreview }) {
  const { state, showNotif } = useContext(AppCtx);
  const [isExporting, setIsExporting] = useState(false);
  const [isTestingTg, setIsTestingTg] = useState(false);
  const [isSendingBackupTg, setIsSendingBackupTg] = useState(false);
  const [isDragOver, setIsDragOver] = useState(false);
  const fileInputRef = useRef(null);

  const [tgConfig, setTgConfig] = useState(() => {
    try {
      const saved = localStorage.getItem('vidkidz_telegram_config');
      return saved ? JSON.parse(saved) : { token: '', chatId: '', customCaption: '', sendDoc: true, sendSummary: true };
    } catch (_) {
      return { token: '', chatId: '', customCaption: '', sendDoc: true, sendSummary: true };
    }
  });

  const saveTgConfig = (newCfg) => {
    setTgConfig(newCfg);
    try {
      localStorage.setItem('vidkidz_telegram_config', JSON.stringify(newCfg));
    } catch (_) {}
  };

  const adminCount = state.users?.admins?.length || 0;
  const famCount = state.users?.families?.length || 0;
  const kidCount = state.users?.kids?.length || 0;
  const albCount = state.albums?.length || 0;
  const paCount = state.photoAlbums?.length || 0;
  const rewCount = state.rewards?.length || 0;
  const redCount = state.redemptions?.length || 0;
  const hafCount = state.hafalanRecords?.length || 0;
  const logCount = state.activityLog?.length || 0;
  const totalRecords = adminCount + famCount + kidCount + albCount + paCount + rewCount + redCount + hafCount + logCount;
  const sizeBytes = new TextEncoder().encode(JSON.stringify(state)).length;
  const sizeKB = (sizeBytes / 1024).toFixed(2);

  const collections = [
    { name: 'Akun Administrator', count: adminCount, icon: 'ui:shield', desc: 'Kredensial superadmin & hak akses' },
    { name: 'Keluarga (Parents)', count: famCount, icon: 'ui:users', desc: 'Profil orang tua, kontak, dan paket langganan' },
    { name: 'Anak-anak (Kids)', count: kidCount, icon: 'ui:smile', desc: 'Profil anak, PIN, koin, streak, dan progres' },
    { name: 'Album Video Edukasi', count: albCount, icon: 'ui:play', desc: 'Katalog kurasi video YouTube ramah anak' },
    { name: 'Album Foto Momen', count: paCount, icon: 'ui:camera', desc: 'Dokumentasi kegiatan dan foto keluarga' },
    { name: 'Katalog Hadiah (Rewards)', count: rewCount, icon: 'ui:gift', desc: 'Master reward penukaran koin anak' },
    { name: 'Pengajuan Penukaran Koin', count: redCount, icon: 'ui:coin', desc: 'Riwayat penukaran hadiah pending/approved' },
    { name: 'Rekaman Hafalan Quran', count: hafCount, icon: 'ui:book', desc: 'Rekaman audio dan histori evaluasi hafalan' },
    { name: 'Log Audit & Aktivitas', count: logCount, icon: 'ui:activity', desc: 'Rekam jejak seluruh interaksi pengguna' },
  ];

  const handleExportJson = () => {
    setIsExporting(true);
    try {
      const now = new Date();
      const payload = {
        appName: 'VIDKIDZ',
        version: '5.2.20',
        backupDate: now.toISOString(),
        backupTimestamp: now.getTime(),
        totalRecords,
        state
      };
      const jsonStr = JSON.stringify(payload, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const timestampStr = now.toISOString().replace(/[:.]/g, '-');
      a.href = url;
      a.download = `vidkidz-backup-${timestampStr}.json`;
      a.click();
      URL.revokeObjectURL(url);
      if (window.VidkidzLogger) {
        window.VidkidzLogger.success('DATABASE', 'Admin', `Berkas cadangan JSON berhasil diunduh (${sizeKB} KB)`);
      }
      showNotif('Berkas cadangan JSON berhasil diunduh!', 'success');
    } catch (err) {
      showNotif('Gagal mengekspor data: ' + err.message, 'error');
    } finally {
      setIsExporting(false);
    }
  };

  const processBackupFile = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        const st = parsed.state || parsed;
        if (!st.users || !Array.isArray(st.users.families)) {
          showNotif('Format berkas tidak valid: tidak ditemukan struktur state VIDKIDZ', 'error');
          return;
        }
        onRestorePreview({
          version: parsed.version || 'v5.x',
          backupDate: parsed.backupDate || new Date().toISOString(),
          totalRecords: parsed.totalRecords || 0,
          state: st
        });
      } catch (err) {
        showNotif('Gagal membaca JSON: ' + err.message, 'error');
      }
    };
    reader.readAsText(file);
  };

  const handleDrop = (e) => {
    e.preventDefault();
    setIsDragOver(false);
    const file = e.dataTransfer?.files?.[0];
    processBackupFile(file);
  };

  const handleTestTelegram = async () => {
    if (!tgConfig.token || !tgConfig.chatId) {
      showNotif('Mohon isi Bot Token dan Chat ID Telegram terlebih dahulu', 'error');
      return;
    }
    setIsTestingTg(true);
    try {
      const token = localStorage.getItem('vidkidz_token') || sessionStorage.getItem('vidkidz_token');
      const res = await fetch('/api/admin/telegram-test', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { Authorization: `Bearer ${token}` } : {})
        },
        body: JSON.stringify({
          token: tgConfig.token,
          chatId: tgConfig.chatId,
          message: `🤖 *VIDKIDZ — Uji Koneksi Bot Telegram*\n\n✅ Koneksi bot berhasil terverifikasi pada ${new Date().toLocaleString('id-ID')} WIB.\nPlatform siap mencadangkan database otomatis!`
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Uji koneksi gagal');
      saveTgConfig(tgConfig);
      showNotif('Pesan uji coba berhasil terkirim ke Telegram!', 'success');
      if (window.VidkidzLogger) window.VidkidzLogger.success('TELEGRAM', 'Admin', 'Uji koneksi Bot Telegram sukses');
    } catch (err) {
      showNotif(err.message, 'error');
      if (window.VidkidzLogger) window.VidkidzLogger.error('TELEGRAM', 'Admin', err.message);
    } finally {
      setIsTestingTg(false);
    }
  };

  const handleSendBackupTelegram = async () => {
    if (!tgConfig.token || !tgConfig.chatId) {
      showNotif('Mohon lengkapi Bot Token dan Chat ID Telegram', 'error');
      return;
    }
    setIsSendingBackupTg(true);
    try {
      const token = localStorage.getItem('vidkidz_token') || sessionStorage.getItem('vidkidz_token');
      const res = await fetch('/api/admin/telegram-backup', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { Authorization: `Bearer ${token}` } : {})
        },
        body: JSON.stringify({
          token: tgConfig.token,
          chatId: tgConfig.chatId,
          sendDoc: tgConfig.sendDoc,
          sendSummary: tgConfig.sendSummary,
          customCaption: tgConfig.customCaption
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Pengiriman backup ke Telegram gagal');
      saveTgConfig(tgConfig);
      showNotif('Backup database berhasil terkirim ke channel/grup Telegram!', 'success');
      if (window.VidkidzLogger) window.VidkidzLogger.success('TELEGRAM', 'Admin', 'Backup database lengkap terkirim ke Telegram');
    } catch (err) {
      showNotif(err.message, 'error');
      if (window.VidkidzLogger) window.VidkidzLogger.error('TELEGRAM', 'Admin', err.message);
    } finally {
      setIsSendingBackupTg(false);
    }
  };

  return (
    <div className="fade-in">
      <div className="page-header flex items-center justify-between mb-5 flex-wrap gap-3">
        <div>
          <h2 style={{color:'var(--t1)',margin:0,display:'flex',alignItems:'center',gap:8}}>
            <UiIcon name="database" size={20} color="var(--primary)" /> Pencadangan & Pemulihan Database (God Mode)
          </h2>
          <p style={{color:'var(--t3)',fontSize:12,marginTop:3}}>Ekspor snapshot atomik, drag & drop restore, serta sinkronisasi Bot Telegram</p>
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(min(200px, 100%), 1fr))',gap:12,marginBottom:20}}>
        <div className="card" style={{padding:'14px 16px',background:'rgba(255,255,255,0.02)'}}>
          <div style={{fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase'}}>Total Record Sistem</div>
          <div style={{fontSize:24,fontWeight:800,color:'var(--admin)',marginTop:2}}>{totalRecords}</div>
        </div>
        <div className="card" style={{padding:'14px 16px',background:'rgba(255,255,255,0.02)'}}>
          <div style={{fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase'}}>Perkiraan Ukuran Snapshot</div>
          <div style={{fontSize:24,fontWeight:800,color:'var(--primary)',marginTop:2}}>{sizeKB} KB</div>
        </div>
        <div className="card" style={{padding:'14px 16px',background:'rgba(255,255,255,0.02)'}}>
          <div style={{fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase'}}>Status Integrasi Bot</div>
          <div style={{fontSize:18,fontWeight:800,color:tgConfig.token?'#34d399':'var(--t3)',marginTop:4}}>
            {tgConfig.token ? '✓ Terkonfigurasi' : '○ Belum Diisi'}
          </div>
        </div>
        <div className="card" style={{padding:'14px 16px',background:'rgba(255,255,255,0.02)'}}>
          <div style={{fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase'}}>Pencadangan Terakhir</div>
          <div style={{fontSize:13,fontWeight:700,color:'var(--t1)',marginTop:6}}>
            {state.systemSettings?.lastTelegramBackup ? formatTs(state.systemSettings.lastTelegramBackup) : 'Sesi ini belum ada'}
          </div>
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(min(340px, 100%), 1fr))',gap:20,marginBottom:24}}>
        <div className="card" style={{display:'flex',flexDirection:'column',justifyContent:'space-between'}}>
          <div>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
              <UiIcon name="download" size={20} color="var(--primary)" />
              <h3 style={{color:'var(--t1)',margin:0}}>Unduh Berkas Cadangan</h3>
            </div>
            <p style={{color:'var(--t2)',fontSize:13,lineHeight:1.5}}>
              Unduh salinan lengkap database dalam format JSON terstruktur. Berkas ini mencakup seluruh data keluarga, akun anak, album, hadiah, dan log aktivitas.
            </p>
          </div>
          <div style={{marginTop:20}}>
            <button className="btn btn-admin w-full" onClick={handleExportJson} disabled={isExporting} style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,padding:12}}>
              <UiIcon name="download" size={16} />
              <span>{isExporting ? 'Memproses Berkas...' : 'Unduh Cadangan JSON Sekarang'}</span>
            </button>
          </div>
        </div>

        <div className="card" style={{display:'flex',flexDirection:'column',justifyContent:'space-between'}}>
          <div>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
              <UiIcon name="upload" size={20} color="var(--primary)" />
              <h3 style={{color:'var(--t1)',margin:0}}>Unggah & Pulihkan Database</h3>
            </div>
            <p style={{color:'var(--t2)',fontSize:13,lineHeight:1.5}}>
              Tarik & letakkan berkas JSON cadangan VIDKIDZ ke area di bawah untuk memverifikasi dan memulihkan seluruh data.
            </p>
          </div>
          <div
            className={`dropzone-box ${isDragOver?'drag-over':''}`}
            onDragOver={e=>{e.preventDefault();setIsDragOver(true);}}
            onDragLeave={()=>setIsDragOver(false)}
            onDrop={handleDrop}
            onClick={()=>fileInputRef.current?.click()}
            style={{marginTop:12,padding:'24px 16px'}}
          >
            <input
              type="file"
              ref={fileInputRef}
              accept=".json"
              style={{display:'none'}}
              onChange={e=>processBackupFile(e.target.files?.[0])}
            />
            <div style={{marginBottom:6,display:'flex',justifyContent:'center'}}><UiIcon name="file" size={28} color="var(--primary)" /></div>
            <div style={{fontSize:13,fontWeight:700,color:'var(--t1)'}}>Klik atau Tarik File JSON ke Sini</div>
            <div style={{fontSize:11,color:'var(--t3)',marginTop:4}}>Format valid: vidkidz-backup-*.json</div>
          </div>
        </div>
      </div>

      <div className="card mb-6">
        <div className="flex items-center justify-between mb-4">
          <h3 style={{color:'var(--t1)',margin:0,display:'flex',alignItems:'center',gap:8}}>
            <UiIcon name="grid" size={18} color="var(--primary)" /> Ringkasan Inventaris Koleksi Database
          </h3>
          <span style={{fontSize:12,color:'var(--t3)'}}>Snapshot real-time di RAM server</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>Koleksi Sistem</th>
              <th>Deskripsi Data</th>
              <th style={{textAlign:'right'}}>Jumlah Record</th>
            </tr>
          </thead>
          <tbody>
            {collections.map(c => (

function AddKidModal({ onClose, familyId }) {
  const { state, updateState, addLog, showNotif, currentUser } = useContext(AppCtx);
  const forcedFamilyId = familyId || (currentUser.role === ROLES.FAMILY ? currentUser.id : '');
  const isFamilyOwned = !!forcedFamilyId;
  const [form, setForm] = useState({ name:'', age:5, avatar:'👦', familyId:forcedFamilyId, lockPin:'1234' });
  const handle = () => {
    if (!form.name||!form.familyId) { showNotif('Isi semua field wajib','error'); return; }
    const newKid = { ...form, id:uid(), isLocked:false, allowedAlbums:[], isOnline:false, lastSeen:now(), watchTime:0, totalVideos:0, coins:10, streak:0, badges:[], hafalanDone:[], gameStats:{math:{played:0,correct:0},hewan:{played:0,correct:0},tanaman:{played:0,correct:0},warna:{played:0,correct:0}} };
    updateState(s => { s.users.kids.push(newKid); const fam = s.users.families.find(f=>f.id===form.familyId); if (fam) fam.linkedKids = [...new Set([...(fam.linkedKids||[]), newKid.id])]; });
    addLog(currentUser.name, `Menambah anak baru: ${form.name}`, isFamilyOwned ? 'edit' : 'admin');
    showNotif('Anak berhasil ditambahkan'); onClose();
  };
  return (
    <Modal open title={<span style={{display:'inline-flex',alignItems:'center',gap:8}}><UiIcon name="plus" size={18} color="var(--primary)" /> Tambah Anak</span>} onClose={onClose}>
      <div style={{marginBottom:12}}><label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:4,fontFamily:'var(--font-display)'}}>Nama</label><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} /></div>
      <div style={{marginBottom:12,display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <div><label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:4,fontFamily:'var(--font-display)'}}>Usia</label><input type="number" min="1" max="18" value={form.age} onChange={e=>setForm({...form,age:parseInt(e.target.value)})} /></div>
        <div><label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:4,fontFamily:'var(--font-display)'}}>Avatar</label><select value={form.avatar} onChange={e=>setForm({...form,avatar:e.target.value})}>{['👦','👧','🧒','👶','🧑'].map(a=><option key={a} value={a}>{a}</option>)}</select></div>
      </div>
      {!isFamilyOwned && <div style={{marginBottom:12}}><label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:4,fontFamily:'var(--font-display)'}}>Keluarga</label><select value={form.familyId} onChange={e=>setForm({...form,familyId:e.target.value})}><option value="">— Pilih Keluarga —</option>{state.users.families.map(f=><option key={f.id} value={f.id}>{f.name}</option>)}</select></div>}
      <div style={{marginBottom:16}}><label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:4,fontFamily:'var(--font-display)'}}>PIN (4 digit)</label><input maxLength={4} value={form.lockPin} onChange={e=>setForm({...form,lockPin:e.target.value})} placeholder="1234" /></div>

    </Modal>
  );
}

function EditKidModal({ data, onClose }) {
  const { updateState, addLog, showNotif, currentUser } = useContext(AppCtx);
  const [form, setForm] = useState({ ...data });
  const handle = () => {
    if (!form.name || !form.lockPin) { showNotif('Nama dan PIN wajib diisi','error'); return; }
    updateState(s => {
      const idx = s.users.kids.findIndex(k=>k.id===data.id && k.familyId===currentUser.id);
      if (idx >= 0) s.users.kids[idx] = { ...s.users.kids[idx], name:form.name, age:parseInt(form.age)||1, avatar:form.avatar, lockPin:form.lockPin };
    });
    addLog(currentUser.name, `Mengubah profil anak: ${form.name}`, 'edit');
    showNotif('Profil anak diperbarui'); onClose();
  };
  return (
    <Modal open title={<span style={{display:'inline-flex',alignItems:'center',gap:8}}><UiIcon name="edit" size={18} color="var(--primary)" /> Edit Anak</span>} onClose={onClose}>
      <div style={{marginBottom:12}}><label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:4,fontFamily:'var(--font-display)'}}>Nama</label><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} /></div>
      <div style={{marginBottom:12,display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <div><label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:4,fontFamily:'var(--font-display)'}}>Usia</label><input type="number" min="1" max="18" value={form.age} onChange={e=>setForm({...form,age:parseInt(e.target.value)||1})} /></div>
        <div><label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:4,fontFamily:'var(--font-display)'}}>Avatar</label><select value={form.avatar} onChange={e=>setForm({...form,avatar:e.target.value})}>{['👦','👧','🧒','👶','🧑'].map(a=><option key={a} value={a}>{a}</option>)}</select></div>

  );
