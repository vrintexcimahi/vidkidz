function FamilyAIAnalysis({ selectedKid }) {
  const { apiKey, showNotif, addLog, currentUser } = useContext(AppCtx);
  const [cameraOn, setCameraOn] = useState(false);
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [localKey, setLocalKey] = useState(apiKey||'');
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const streamRef = useRef(null);
  const startCam = async () => { try { const s = await navigator.mediaDevices.getUserMedia({video:true}); streamRef.current=s; if(videoRef.current)videoRef.current.srcObject=s; setCameraOn(true); } catch(e){showNotif('Izin kamera diperlukan','error');} };
  const stopCam = () => { streamRef.current?.getTracks().forEach(t=>t.stop()); setCameraOn(false); };
  const analyze = async () => {
    if (!cameraOn) { showNotif('Aktifkan kamera dulu','error'); return; }
    const key = localKey||apiKey;
    if (!key) { showNotif('Masukkan API Key dulu','error'); return; }
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    canvas.width = videoRef.current.videoWidth; canvas.height = videoRef.current.videoHeight;
    ctx.drawImage(videoRef.current, 0, 0);
    const b64 = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
    setLoading(true); setResult(null);
    try {
      const resp = await fetch('/api/ai/analyze', { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()}, body:JSON.stringify({ imageBase64: b64, apiKey: key }) });
      const data = await resp.json();
      const text = data.content?.[0]?.text||'';
      let parsed;
      try { const json = text.match(/\{[\s\S]*\}/)?.[0]; parsed = JSON.parse(json); } catch(e) { parsed = {kondisi:text,postur:'—',lingkungan:'—',rekomendasi:'—',skor_perhatian:5}; }
      setResult(parsed);
      addLog(currentUser.name, `AI analisis kondisi ${selectedKid?.name}`, 'ai');
    } catch(e) { showNotif('Error API: '+e.message,'error'); }
    setLoading(false);
  };
  useEffect(()=>()=>streamRef.current?.getTracks().forEach(t=>t.stop()),[]);
  return (
    <div className="fade-in">
      <div className="page-header flex items-center justify-between mb-6" style={{gap:12,flexWrap:'wrap'}}><div><h2 style={{color:'var(--t1)',display:'flex',alignItems:'center',gap:8}}><UiIcon name="brain" size={20} color="var(--primary)" /> AI Face Analysis</h2><p style={{color:'var(--t3)',fontSize:12,marginTop:2}}>Analisis kondisi anak menggunakan Claude AI</p></div>{cameraOn&&<span className="badge badge-danger animate-pulse">● KAMERA</span>}</div>
      <div className="card mb-5" style={{border:'1px solid rgba(0,120,255,0.28)'}}><div className="flex items-center gap-3"><UiIcon name="key" size={18} color="var(--primary)" /><div style={{flex:1}}><label style={{display:'block',fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:4,fontFamily:'var(--font-display)'}}>Anthropic API Key</label><input type="password" value={localKey} onChange={e=>setLocalKey(e.target.value)} placeholder="sk-ant-..." /></div></div></div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
        <div>
          <div style={{background:'#000',borderRadius:14,aspectRatio:'4/3',position:'relative',overflow:'hidden',marginBottom:14,display:'flex',alignItems:'center',justifyContent:'center'}}><video ref={videoRef} autoPlay playsInline muted style={{width:'100%',height:'100%',objectFit:'cover',display:cameraOn?'block':'none'}} /><canvas ref={canvasRef} style={{display:'none'}} />{!cameraOn&&<div style={{textAlign:'center',color:'var(--t3)'}}><div style={{display:'flex',justifyContent:'center',marginBottom:12}}><UiIcon name="brain" size={48} color="var(--primary)" /></div><div style={{fontSize:13}}>Aktifkan kamera untuk AI</div></div>}{cameraOn&&<div style={{position:'absolute',inset:0,pointerEvents:'none'}}><div className="cam-corner tl"/><div className="cam-corner tr"/><div className="cam-corner bl"/><div className="cam-corner br"/>{loading&&<div className="scan-line"/>}</div>}</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}><button className={`btn ${cameraOn?'btn-danger':'btn-family'}`} style={{justifyContent:'center'}} onClick={cameraOn?stopCam:startCam}>{cameraOn?'⏹ Stop':'Kamera'}</button><button className="btn btn-primary" style={{justifyContent:'center'}} onClick={analyze} disabled={loading||!cameraOn}>{loading?<span className="animate-spin">⊙</span>:null}{loading?'Menganalisis...':'Analisis AI'}</button></div>
        </div>
        <div>
          <h3 style={{color:'var(--t1)',marginBottom:14,display:'flex',alignItems:'center',gap:8}}><UiIcon name="activity" size={18} color="var(--primary)" /> Hasil Analisis</h3>
          {result?(<div className="fade-in">
            <div style={{background:'var(--bg-elevated)',borderRadius:12,padding:16,marginBottom:14,textAlign:'center',border:'1px solid var(--border)'}}><div style={{fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:8,fontFamily:'var(--font-display)'}}>Skor Perhatian</div><div style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:48,color:result.skor_perhatian>=7?'var(--success)':result.skor_perhatian>=4?'var(--warn)':'var(--danger)'}}>{result.skor_perhatian}<span style={{fontSize:20,opacity:0.5}}>/10</span></div><div className="progress" style={{marginTop:10}}><div className="progress-bar" style={{width:`${result.skor_perhatian*10}%`,background:result.skor_perhatian>=7?'var(--success)':result.skor_perhatian>=4?'var(--warn)':'var(--danger)'}}/></div></div>
            {[{key:'kondisi',label:'Kondisi Umum',icon:'smile'},{key:'postur',label:'Postur',icon:'user'},{key:'lingkungan',label:'Lingkungan',icon:'grid'},{key:'rekomendasi',label:'Rekomendasi',icon:'zap'}].map(f=>(<div key={f.key} style={{background:'var(--bg-elevated)',borderRadius:10,padding:12,marginBottom:8,border:'1px solid var(--border)'}}><div style={{fontSize:11,color:'var(--t3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:4,fontFamily:'var(--font-display)',display:'flex',alignItems:'center',gap:6}}><UiIcon name={f.icon} size={14} color="var(--primary)" /> {f.label}</div><div style={{fontSize:13,color:'var(--t1)'}}>{result[f.key]||'—'}</div></div>))}
          </div>):(<div style={{background:'var(--bg-elevated)',borderRadius:12,padding:30,textAlign:'center',color:'var(--t3)'}}><div style={{fontSize:48,marginBottom:12}}>🔍</div><div style={{fontSize:13}}>Tekan "Analisis AI" untuk laporan kondisi anak</div></div>)}
        </div>
      </div>
    </div>
  );
}

// ============================================================
// KIDS BEDTIME STORY HUB (AUDIO BOOK & MORAL STORYTELLING)
// ============================================================
function KidsStoryHub({ kid }) {
  const { state, updateState, addCoins, showNotif, addLog } = useContext(AppCtx);
  const [activeStory, setActiveStory] = useState(null);
  const [isPlaying, setIsPlaying] = useState(false);
  const [isPaused, setIsPaused] = useState(false);
  const [currentParagraph, setCurrentParagraph] = useState(-1);
  const [rate, setRate] = useState(1.0);
  const synthRef = useRef(typeof window !== 'undefined' ? window.speechSynthesis : null);
  const currentUtteranceRef = useRef(null);

  const myStoryRecords = (state.storyRecords || []).filter(r => r.kidId === kid?.id);
  const completedStoryIds = new Set(myStoryRecords.map(r => r.storyId));

  // Clean up speech on unmount or story exit
  useEffect(() => {
    return () => {
      if (synthRef.current) synthRef.current.cancel();
    };
  }, []);

  const stopAudio = () => {
    if (synthRef.current) {
      synthRef.current.cancel();
    }
    setIsPlaying(false);
    setIsPaused(false);
    setCurrentParagraph(-1);
  };

  const playStoryAudio = (story, startIdx = 0) => {
    if (!('speechSynthesis' in window)) {
      showNotif('Peramban tidak mendukung text-to-speech otomatis. Silakan baca langsung ya!', 'warn');
      return;
    }
    synthRef.current.cancel();
    setIsPlaying(true);
    setIsPaused(false);

    let idx = startIdx;
    const speakNext = () => {
      if (idx >= story.paragraphs.length) {
        setIsPlaying(false);
        setIsPaused(false);
        setCurrentParagraph(-1);
        showNotif('🌙 Dongeng selesai dibacakan! Renungkan hikmahnya ya.', 'coin');
        return;
      }
      setCurrentParagraph(idx);
      const text = story.paragraphs[idx];
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'id-ID';
      utter.rate = rate;
      utter.pitch = 1.05;
      utter.onend = () => {
        idx++;
        speakNext();
      };
      utter.onerror = (e) => {
        console.warn('Speech error:', e);
        setIsPlaying(false);
        setIsPaused(false);
      };
      currentUtteranceRef.current = utter;
      synthRef.current.speak(utter);
    };
    speakNext();
  };

  const togglePause = () => {
    if (!isPlaying) return;
    if (isPaused) {
      synthRef.current.resume();
      setIsPaused(false);
    } else {
      synthRef.current.pause();
      setIsPaused(true);
    }
  };

  const handleClaimStory = (story) => {
    const isAlreadyClaimed = completedStoryIds.has(story.id);
    if (isAlreadyClaimed) {
      showNotif('Hadiah koin dongeng ini sudah kamu peroleh!', 'info');
      return;
    }
    const recordId = 'srec_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
    const newRecord = {
      id: recordId,
      kidId: kid.id,
      storyId: story.id,
      title: story.title,
      completedAt: Date.now(),
      rewardCoins: story.rewardCoins || 10,
      moralLearned: story.moralLearned
    };

    updateState(s => {
      if (!Array.isArray(s.storyRecords)) s.storyRecords = [];
      s.storyRecords.unshift(newRecord);
    });

    addCoins(kid.id, story.rewardCoins || 10, `Dongeng: ${story.title} 📚`);
    addLog(kid.name, `Menuntaskan dongeng "${story.title}" (+${story.rewardCoins||10}🪙)`, 'story');
    showNotif(`🎉 Luar Biasa! +${story.rewardCoins || 10} Koin dari Dongeng "${story.title}"! 🌙`, 'coin');
  };

  return (
    <div style={{padding:'20px 20px',minHeight:'100%'}}>
      {!activeStory ? (
        <div>
          {/* Header Banner */}
          <div style={{background:'linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%)',borderRadius:20,padding:22,color:'#fff',boxShadow:'0 10px 25px rgba(49,46,129,0.3)',marginBottom:22,border:'1px solid rgba(255,255,255,0.15)',position:'relative',overflow:'hidden'}}>
            <div style={{position:'absolute',top:-10,right:-10,fontSize:80,opacity:0.15,pointerEvents:'none'}}>🌙</div>
            <div style={{display:'inline-flex',alignItems:'center',gap:6,background:'rgba(255,255,255,0.15)',padding:'4px 10px',borderRadius:20,fontSize:11,fontWeight:700,letterSpacing:'0.5px',marginBottom:8}}>
              <span>🌙</span> CERITA & AUDIO BOOK VIDKIDZ
            </div>
            <h2 style={{fontFamily:'var(--font-kids)',fontSize:24,marginBottom:6,color:'#fff'}}>Dongeng Sebelum Tidur</h2>
            <p style={{fontSize:13,color:'rgba(255,255,255,0.82)',lineHeight:1.4,maxWidth:420}}>
              Dengarkan kisah penuh hikmah & budi pekerti dengan narator suara otomatis. Raih <strong>+10 Koin</strong> untuk setiap dongeng yang kamu selesaikan!
            </p>
            <div style={{display:'flex',gap:16,marginTop:14,fontSize:12,color:'rgba(255,255,255,0.75)'}}>
              <div>📖 <strong>{STORY_LIST.length}</strong> Pilihan Cerita</div>
              <div>⭐ <strong>{completedStoryIds.size}</strong> Selesai Dibaca</div>
              <div>🪙 <strong>+{completedStoryIds.size * 10}</strong> Koin Diperoleh</div>
            </div>
          </div>

          {/* Story Cards Grid */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(280px, 1fr))',gap:14}}>
            {STORY_LIST.map((story) => {
              const isDone = completedStoryIds.has(story.id);
              return (
                <div key={story.id} onClick={() => { setActiveStory(story); setCurrentParagraph(-1); }}
                  style={{background:'rgba(255,255,255,0.06)',border:isDone?'1.5px solid #10b981':'1px solid rgba(255,255,255,0.12)',borderRadius:18,padding:16,cursor:'pointer',transition:'all 0.2s',position:'relative',display:'flex',flexDirection:'column',justifyContent:'space-between'}}
                  onMouseEnter={e => { e.currentTarget.style.transform = 'translateY(-3px)'; e.currentTarget.style.background = 'rgba(255,255,255,0.1)'; }}
                  onMouseLeave={e => { e.currentTarget.style.transform = 'translateY(0)'; e.currentTarget.style.background = 'rgba(255,255,255,0.06)'; }}>
                  <div>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
                      <div style={{fontSize:38}}>{story.emoji}</div>
                      <span style={{background:isDone?'rgba(16,185,129,0.2)':'rgba(245,158,11,0.2)',color:isDone?'#34d399':'#fbbf24',border:`1px solid ${isDone?'#10b981':'#f59e0b'}`,borderRadius:12,padding:'3px 8px',fontSize:10,fontWeight:700,fontFamily:'var(--font-display)'}}>
                        {isDone ? '✓ Tuntas (+10🪙)' : '+10🪙 Hadiah'}
                      </span>
                    </div>
                    <div style={{fontSize:11,color:story.color,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:4}}>{story.category}</div>
                    <h3 style={{fontFamily:'var(--font-display)',fontSize:16,fontWeight:800,color:'#fff',lineHeight:1.3,marginBottom:8}}>{story.title}</h3>
                    <p style={{fontSize:12,color:'rgba(255,255,255,0.6)',lineHeight:1.4,marginBottom:12}}>
                      {story.paragraphs[0].slice(0, 85)}...
                    </p>
                  </div>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',borderTop:'1px solid rgba(255,255,255,0.08)',paddingTop:10,fontSize:11,color:'rgba(255,255,255,0.5)'}}>
                    <span>⏱️ {story.durationMinutes} menit dengar</span>
                    <span style={{color:'#60a5fa',fontWeight:700}}>Buka Cerita →</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      ) : (
        /* Reading & Audio Mode */
        <div className="fade-in">
          <button onClick={() => { stopAudio(); setActiveStory(null); }}
            style={{background:'rgba(255,255,255,0.1)',border:'none',color:'#fff',borderRadius:10,padding:'8px 14px',cursor:'pointer',fontSize:12,fontWeight:700,fontFamily:'var(--font-display)',display:'inline-flex',alignItems:'center',gap:6,marginBottom:16}}>
            <span>←</span> Kembali ke Daftar Dongeng
          </button>

          {/* Parent Voice Note Banner if available */}
          {(() => {
            const parentAudio = (state.parentStoryAudios || []).find(a => a.storyId === activeStory.id);
            if (!parentAudio) return null;
            return (
              <div style={{background:'linear-gradient(135deg, rgba(236,72,153,0.18), rgba(168,85,247,0.18))',border:'1.5px solid rgba(236,72,153,0.35)',borderRadius:18,padding:'14px 18px',marginBottom:16,display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
                <div style={{display:'flex',alignItems:'center',gap:12}}>
                  <span style={{fontSize:28}}>🎙️</span>
                  <div>
                    <div style={{fontFamily:'var(--font-kids)',fontSize:16,color:'#f472b6',fontWeight:700}}>Ada Suara Dongeng dari Bunda / Ayah! ❤️</div>
                    <div style={{fontSize:12,color:'rgba(255,255,255,0.7)',marginTop:2}}>Dengarkan rekaman suara asli hangat membacakan kisah ini</div>
                  </div>
                </div>
                <audio controls src={parentAudio.audioData} style={{height:38,borderRadius:20}} onPlay={stopAudio} />
              </div>
            );
          })()}

          {/* Reader Topbar */}
          <div style={{background:'rgba(15,23,42,0.85)',border:'1px solid rgba(255,255,255,0.12)',borderRadius:20,padding:18,marginBottom:18,boxShadow:'0 10px 30px rgba(0,0,0,0.35)'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:12}}>
              <div style={{display:'flex',alignItems:'center',gap:12}}>
                <div style={{fontSize:40}}>{activeStory.emoji}</div>
                <div>
                  <div style={{fontSize:11,color:activeStory.color,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.5px'}}>{activeStory.category}</div>
                  <h2 style={{fontFamily:'var(--font-display)',fontSize:18,fontWeight:900,color:'#fff',lineHeight:1.2}}>{activeStory.title}</h2>
                  <div style={{fontSize:11,color:'rgba(255,255,255,0.5)',marginTop:2}}>⏱️ Estimasi {activeStory.durationMinutes} menit • {activeStory.paragraphs.length} bagian</div>
                </div>
              </div>

              {/* Audio Controls */}
              <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                {!isPlaying ? (
                  <button onClick={() => playStoryAudio(activeStory, currentParagraph >= 0 ? currentParagraph : 0)}
                    style={{background:'linear-gradient(135deg, #10b981, #059669)',border:'none',color:'#fff',borderRadius:12,padding:'8px 16px',cursor:'pointer',fontSize:12,fontWeight:700,fontFamily:'var(--font-display)',display:'inline-flex',alignItems:'center',gap:6,boxShadow:'0 4px 12px rgba(16,185,129,0.35)'}}>
                    <span>🔊</span> Putar Suara Narator
                  </button>
                ) : (
                  <>
                    <button onClick={togglePause}
                      style={{background:isPaused?'#f59e0b':'#3b82f6',border:'none',color:'#fff',borderRadius:12,padding:'8px 14px',cursor:'pointer',fontSize:12,fontWeight:700,fontFamily:'var(--font-display)',display:'inline-flex',alignItems:'center',gap:6}}>
                      {isPaused ? '▶️ Lanjutkan' : '⏸️ Jeda'}
                    </button>
                    <button onClick={stopAudio}
                      style={{background:'rgba(239,68,68,0.2)',border:'1px solid #ef4444',color:'#ef4444',borderRadius:12,padding:'8px 12px',cursor:'pointer',fontSize:12,fontWeight:700}}>
                      ⏹ Berhenti
                    </button>
                  </>
                )}

                {/* Speed Toggle */}
                <div style={{display:'inline-flex',background:'rgba(255,255,255,0.08)',borderRadius:10,padding:2}}>
                  {[0.8, 1.0, 1.2].map(s => (
                    <button key={s} onClick={() => { setRate(s); if (isPlaying) playStoryAudio(activeStory, Math.max(0, currentParagraph)); }}
                      style={{background:rate===s?'#6366f1':'transparent',border:'none',color:rate===s?'#fff':'rgba(255,255,255,0.5)',borderRadius:8,padding:'4px 8px',fontSize:10,fontWeight:700,cursor:'pointer'}}>
                      {s}x
                    </button>
                  ))}
                </div>
              </div>
            </div>

            {isPlaying && (
              <div style={{marginTop:12,padding:'6px 12px',background:'rgba(99,102,241,0.15)',borderRadius:8,fontSize:11,color:'#a5b4fc',display:'flex',alignItems:'center',gap:6}}>
                <span className="animate-pulse">🎙️</span> Narator membaca bagian {currentParagraph + 1} dari {activeStory.paragraphs.length}...
              </div>
            )}
          </div>

          {/* Story Paragraphs Container */}
          <div style={{background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.08)',borderRadius:20,padding:'24px 20px',marginBottom:20}}>
            {activeStory.paragraphs.map((p, idx) => {
              const isCurrent = currentParagraph === idx;
              return (
                <div key={idx} onClick={() => { playStoryAudio(activeStory, idx); }}
                  style={{fontSize:16,lineHeight:1.75,color:isCurrent?'#fff':'rgba(255,255,255,0.85)',marginBottom:16,padding:isCurrent?'14px 18px':'8px 12px',background:isCurrent?'rgba(139,92,246,0.22)':'transparent',borderLeft:isCurrent?'4px solid #a855f7':'4px solid transparent',borderRadius:8,transition:'all 0.25s',cursor:'pointer',position:'relative'}}
                  title="Klik untuk mendengarkan dari bagian ini">
                  {p}
                </div>
              );
            })}
          </div>

          {/* Moral Lesson Card */}
          <div style={{background:'linear-gradient(135deg, rgba(245,158,11,0.15), rgba(217,119,6,0.08))',border:'1.5px solid rgba(245,158,11,0.35)',borderRadius:18,padding:20,marginBottom:22}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
              <span style={{fontSize:22}}>💡</span>
              <h3 style={{fontFamily:'var(--font-kids)',fontSize:18,color:'#fbbf24',margin:0}}>Hikmah & Pesan Budi Pekerti:</h3>
            </div>
            <p style={{fontSize:14,color:'#fff',lineHeight:1.5,fontStyle:'italic',margin:0,paddingLeft:30}}>
              "{activeStory.moralLearned}"
            </p>
          </div>

          {/* Action Claim Card */}
          <div style={{textAlign:'center',padding:'10px 0 30px'}}>
            {completedStoryIds.has(activeStory.id) ? (
              <div style={{background:'rgba(16,185,129,0.15)',border:'1.5px solid #10b981',borderRadius:16,padding:16,display:'inline-flex',alignItems:'center',gap:10,color:'#34d399',fontFamily:'var(--font-display)',fontWeight:800,fontSize:14}}>
                <span>✓</span> Kamu sudah menuntaskan dongeng ini! (+10🪙 sudah masuk ke dompetmu)
              </div>
            ) : (
              <button onClick={() => handleClaimStory(activeStory)}
                style={{background:'linear-gradient(135deg, #f59e0b, #d97706)',border:'none',color:'#fff',borderRadius:16,padding:'14px 28px',fontSize:16,fontWeight:900,fontFamily:'var(--font-kids)',cursor:'pointer',boxShadow:'0 6px 20px rgba(245,158,11,0.4)',display:'inline-flex',alignItems:'center',gap:8}}>
                <span>🏆</span> Selesai Membaca & Ambil +10 Koin! 🪙
              </button>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Mane
      ctx.beginPath();
      ctx.arc(w/2 - 40, h/2 - 30, 85, 0, Math.PI * 2);
      ctx.stroke();

      // Lion Head
      ctx.beginPath();
      ctx.arc(w/2 - 40, h/2 - 30, 52, 0, Math.PI * 2);
      ctx.stroke();

      // Lion Ears
      ctx.beginPath();
      ctx.arc(w/2 - 85, h/2 - 80, 16, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(w/2 + 5, h/2 - 80, 16, 0, Math.PI * 2);
      ctx.stroke();

      // Lion Eyes
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.arc(w/2 - 58, h/2 - 35, 6, 0, Math.PI * 2);
      ctx.arc(w/2 - 22, h/2 - 35, 6, 0, Math.PI * 2);
      ctx.fill();

      // Lion Nose & Mouth
      ctx.beginPath();
      ctx.moveTo(w/2 - 40, h/2 - 20);
      ctx.lineTo(w/2 - 48, h/2 - 10);
      ctx.lineTo(w/2 - 32, h/2 - 10);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.arc(w/2 - 48, h/2 - 2, 8, 0, Math.PI);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(w/2 - 32, h/2 - 2, 8, 0, Math.PI);
      ctx.stroke();

      // Lion Body
      ctx.beginPath();
      ctx.ellipse(w/2 - 40, h/2 + 80, 65, 55, 0, 0, Math.PI * 2);
      ctx.stroke();

      // Little Mouse
      ctx.beginPath();
      ctx.ellipse(w/2 + 85, h/2 + 75, 26, 20, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(w/2 + 75, h/2 + 55, 12, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(w/2 + 95, h/2 + 55, 12, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(w/2 + 85, h/2 + 70, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(w/2 + 120, h/2 + 75, 15, Math.PI, 0);
      ctx.stroke();
    }
  },
  {
    id: 'burung_hantu',
    title: 'Burung Hantu Bijak',
    emoji: '🦉',
    desc: 'Di atas dahan malam purnama',
    draw: (ctx, w, h) => {
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Moon
      ctx.beginPath();
      ctx.arc(w * 0.22, 90, 50, 0, Math.PI * 2);
      ctx.stroke();

      // Branch
      ctx.beginPath();
      ctx.moveTo(0, h - 90);
      ctx.bezierCurveTo(w * 0.4, h - 80, w * 0.7, h - 120, w, h - 90);
      ctx.lineTo(w, h - 60);
      ctx.bezierCurveTo(w * 0.7, h - 90, w * 0.4, h - 50, 0, h - 70);
      ctx.closePath();
      ctx.stroke();

      // Owl Body
      ctx.beginPath();
      ctx.ellipse(w/2, h/2 - 10, 60, 75, 0, 0, Math.PI * 2);
      ctx.stroke();

      // Eyes
      ctx.beginPath();
      ctx.arc(w/2 - 25, h/2 - 40, 22, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(w/2 + 25, h/2 - 40, 22, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.arc(w/2 - 25, h/2 - 40, 8, 0, Math.PI * 2);
      ctx.arc(w/2 + 25, h/2 - 40, 8, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.beginPath();
      ctx.moveTo(w/2, h/2 - 22);
      ctx.lineTo(w/2 - 8, h/2 - 32);
      ctx.lineTo(w/2 + 8, h/2 - 32);
      ctx.closePath();
      ctx.fill();

      // Ear tufts
      ctx.beginPath();
      ctx.moveTo(w/2 - 45, h/2 - 75);
      ctx.lineTo(w/2 - 35, h/2 - 105);
      ctx.lineTo(w/2 - 15, h/2 - 80);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(w/2 + 45, h/2 - 75);
      ctx.lineTo(w/2 + 35, h/2 - 105);
      ctx.lineTo(w/2 + 15, h/2 - 80);
      ctx.stroke();
    }
  },
  {
    id: 'gajah',
    title: 'Gajah Ceria',
    emoji: '🐘',
    desc: 'Gajah bermain air gembira',
    draw: (ctx, w, h) => {
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Elephant Body
      ctx.beginPath();
      ctx.ellipse(w/2 + 20, h/2 + 20, 80, 65, 0, 0, Math.PI * 2);
      ctx.stroke();

      // Head
      ctx.beginPath();
      ctx.arc(w/2 - 50, h/2 - 10, 50, 0, Math.PI * 2);
      ctx.stroke();

      // Ear
      ctx.beginPath();
      ctx.ellipse(w/2 - 25, h/2 - 15, 30, 45, 0.2, 0, Math.PI * 2);
      ctx.stroke();

      // Eye
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.arc(w/2 - 65, h/2 - 20, 5, 0, Math.PI * 2);
      ctx.fill();

      // Trunk
      ctx.beginPath();
      ctx.moveTo(w/2 - 85, h/2 - 5);
      ctx.bezierCurveTo(w/2 - 130, h/2 - 10, w/2 - 120, h/2 - 90, w/2 - 80, h/2 - 95);
      ctx.bezierCurveTo(w/2 - 100, h/2 - 80, w/2 - 105, h/2 - 5, w/2 - 75, h/2 + 15);
      ctx.stroke();

      // Water drops
      const drop = (x, y) => { ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.stroke(); };
      drop(w/2 - 60, h/2 - 125);
      drop(w/2 - 40, h/2 - 145);
      drop(w/2 - 15, h/2 - 135);

      // Legs
      ctx.beginPath();
      ctx.rect(w/2 - 35, h/2 + 75, 26, 50);
      ctx.rect(w/2 + 5, h/2 + 75, 26, 50);
      ctx.rect(w/2 + 45, h/2 + 75, 26, 50);
      ctx.stroke();
    }
  },
  {
    id: 'roket',
    title: 'Roket Antariksa Cilik',
    emoji: '🚀',
    desc: 'Meluncur menembus bintang-bintang',
    draw: (ctx, w, h) => {
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Rocket
      ctx.beginPath();
      ctx.moveTo(w/2, h/2 - 140);
      ctx.bezierCurveTo(w/2 + 55, h/2 - 60, w/2 + 55, h/2 + 50, w/2 + 45, h/2 + 70);
      ctx.lineTo(w/2 - 45, h/2 + 70);
      ctx.bezierCurveTo(w/2 - 55, h/2 + 50, w/2 - 55, h/2 - 60, w/2, h/2 - 140);
      ctx.stroke();

      // Window
      ctx.beginPath();
      ctx.arc(w/2, h/2 - 25, 25, 0, Math.PI * 2);
      ctx.stroke();

      // Wings
      ctx.beginPath();
      ctx.moveTo(w/2 - 45, h/2 + 30);
      ctx.lineTo(w/2 - 95, h/2 + 90);
      ctx.lineTo(w/2 - 45, h/2 + 70);
      ctx.closePath();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(w/2 + 45, h/2 + 30);
      ctx.lineTo(w/2 + 95, h/2 + 90);
      ctx.lineTo(w/2 + 45, h/2 + 70);
      ctx.closePath();
      ctx.stroke();

      // Flame
      ctx.beginPath();
      ctx.moveTo(w/2 - 30, h/2 + 70);
      ctx.lineTo(w/2 - 20, h/2 + 120);
      ctx.lineTo(w/2, h/2 + 85);
      ctx.lineTo(w/2 + 20, h/2 + 120);
      ctx.lineTo(w/2 + 30, h/2 + 70);
      ctx.closePath();
      ctx.stroke();
    }
  },
  {
    id: 'bebas',
    title: 'Kanvas Bebas Kreatif',
    emoji: '🎨',
    desc: 'Kanvas putih polos untuk lukisan bebasmu',
    draw: (ctx, w, h) => {
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.strokeRect(20, 20, w - 40, h - 40);
      ctx.setLineDash([]);
    }
  }
];

function KidsColoringStudio({ kid }) {
  const { state, updateState, addCoins, showNotif, addLog } = useContext(AppCtx);
  const [activeTemplate, setActiveTemplate] = useState(COLORING_TEMPLATES[0]);
  const [activeColor, setActiveColor] = useState('#ef4444');
  const [brushSize, setBrushSize] = useState(10);
  const [toolMode, setToolMode] = useState('brush'); // 'brush' | 'eraser' | 'stamp'
  const [activeStamp, setActiveStamp] = useState('⭐');
  const [isDrawing, setIsDrawing] = useState(false);
  const [history, setHistory] = useState([]);
  const [historyStep, setHistoryStep] = useState(-1);
  const [showMyArt, setShowMyArt] = useState(false);

  const canvasRef = useRef(null);

  const COLORS = [
    '#ef4444', '#f97316', '#f59e0b', '#84cc16', '#10b981', '#06b6d4',
    '#3b82f6', '#6366f1', '#a855f7', '#ec4899', '#78350f', '#475569',
    '#0f172a', '#ffffff'
  ];

  const STAMPS = ['⭐', '❤️', '🌈', '👑', '🌸', '🦋', '🎈', '☀️'];

  const initCanvas = (template) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    template.draw(ctx, canvas.width, canvas.height);
    const snap = ctx.getImageData(0, 0, canvas.width, canvas.height);
    setHistory([snap]);
    setHistoryStep(0);
  };

  useEffect(() => {
    initCanvas(activeTemplate);
  }, [activeTemplate]);

  const saveHistoryState = () => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const snap = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const nextHistory = history.slice(0, historyStep + 1);
    nextHistory.push(snap);
    if (nextHistory.length > 25) nextHistory.shift();
    setHistory(nextHistory);
    setHistoryStep(nextHistory.length - 1);
  };

  const handleUndo = () => {
    if (historyStep > 0) {
      const targetStep = historyStep - 1;
      const canvas = canvasRef.current;
      const ctx = canvas.getContext('2d');
      ctx.putImageData(history[targetStep], 0, 0);
      setHistoryStep(targetStep);
    }
  };

  const handleRedo = () => {
    if (historyStep < history.length - 1) {
      const targetStep = historyStep + 1;
      const canvas = canvasRef.current;
      const ctx = canvas.getContext('2d');
      ctx.putImageData(history[targetStep], 0, 0);
      setHistoryStep(targetStep);
    }
  };

  const handleClear = () => {
    if (window.confirm('Bersihkan kanvas dan mulai dari awal?')) {
      initCanvas(activeTemplate);
    }
  };

  const getCoords = (e) => {
    const canvas = canvasRef.current;
    if (!canvas) return { x: 0, y: 0 };
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * (canvas.width / rect.width),
      y: (clientY - rect.top) * (canvas.height / rect.height)
    };
  };

  const startDraw = (e) => {
    e.preventDefault();
    const coords = getCoords(e);
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');

    if (toolMode === 'stamp') {
      ctx.font = '42px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(activeStamp, coords.x, coords.y);
      saveHistoryState();
      return;
    }

    setIsDrawing(true);
    ctx.beginPath();
    ctx.moveTo(coords.x, coords.y);
    ctx.strokeStyle = toolMode === 'eraser' ? '#ffffff' : activeColor;
    ctx.lineWidth = brushSize;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  };

  const drawingMove = (e) => {
    if (!isDrawing || toolMode === 'stamp') return;
    e.preventDefault();
    const coords = getCoords(e);
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    ctx.lineTo(coords.x, coords.y);
    ctx.stroke();
  };

  const endDraw = (e) => {
    if (isDrawing) {
      if (e) e.preventDefault();
      setIsDrawing(false);
      const canvas = canvasRef.current;
      const ctx = canvas.getContext('2d');
      ctx.closePath();
      saveHistoryState();
    }
  };

  const handleSaveArtwork = () => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const dataUrl = canvas.toDataURL('image/png');
    const newRecord = {
      id: `draw_${Date.now()}`,
      kidId: kid.id,
      kidName: kid.name,
      templateId: activeTemplate.id,
      title: activeTemplate.title,
      dataUrl: dataUrl,
      rewardCoins: 10,
      createdAt: Date.now()
    };

    updateState(s => {
      if (!Array.isArray(s.drawingRecords)) s.drawingRecords = [];
      s.drawingRecords.unshift(newRecord);
    });

    addCoins(kid.id, 10);
    addLog(kid.name, `Menyelesaikan karya seni: ${activeTemplate.title}`, 'game');
    showNotif('🎨 Hore! Hasil karyamu berhasil disimpan & kamu dapat +10 Koin! 🪙', 'coin');
  };

  const handleDownload = () => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const dataUrl = canvas.toDataURL('image/png');
    const link = document.createElement('a');
    link.download = `karya_${kid.name}_${activeTemplate.id}.png`;
    link.href = dataUrl;
    link.click();
    showNotif('📥 Gambar berhasil diunduh ke perangkatmu!', 'success');
  };

  const mySavedDrawings = (state.drawingRecords || []).filter(d => d.kidId === kid?.id);

  return (
    <div style={{padding:'16px 16px 80px'}}>
      {/* Header & Template Picker */}
      <div style={{marginBottom:14}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:8,marginBottom:10}}>
          <div>
            <h2 style={{fontFamily:'var(--font-kids)',fontSize:22,color:'#fff',margin:0,display:'flex',alignItems:'center',gap:8}}>
              <span>🎨</span> Studio Mewarnai Cilik
            </h2>
            <div style={{fontSize:12,color:'rgba(255,255,255,0.6)',marginTop:2}}>
              Warnai karakter fabel dan dapatkan +10 koin untuk setiap karya!
            </div>
          </div>
          <button onClick={() => setShowMyArt(!showMyArt)}
            style={{background:'rgba(255,255,255,0.08)',border:'1px solid rgba(255,255,255,0.15)',color:'#fff',borderRadius:12,padding:'6px 12px',fontSize:12,fontWeight:700,fontFamily:'var(--font-display)',cursor:'pointer'}}>
            🖼️ Galeri Saya ({mySavedDrawings.length})
          </button>
        </div>

        {/* Template Buttons */}
        <div style={{display:'flex',gap:8,overflowX:'auto',paddingBottom:8}}>
          {COLORING_TEMPLATES.map(t => (
            <button key={t.id} onClick={() => setActiveTemplate(t)}
              style={{flexShrink:0,background:activeTemplate.id===t.id?'linear-gradient(135deg,#ec4899,#8b5cf6)':'rgba(255,255,255,0.06)',border:activeTemplate.id===t.id?'2px solid #fff':'1px solid rgba(255,255,255,0.1)',borderRadius:14,padding:'8px 14px',color:'#fff',cursor:'pointer',display:'flex',alignItems:'center',gap:8,transition:'all 0.2s'}}>
              <span style={{fontSize:20}}>{t.emoji}</span>
              <span style={{fontSize:12,fontWeight:700,fontFamily:'var(--font-display)'}}>{t.title}</span>
            </button>
          ))}
        </div>
      </div>

      {/* Canvas Wrap */}
      <div style={{position:'relative',width:'100%',maxWidth:640,margin:'0 auto 14px',borderRadius:20,overflow:'hidden',boxShadow:'0 16px 40px rgba(0,0,0,0.5)',background:'#ffffff',border:'4px solid #334155',touchAction:'none'}}>
        <canvas
          ref={canvasRef}
          width={640}
          height={460}
          onMouseDown={startDraw}
          onMouseMove={drawingMove}
          onMouseUp={endDraw}
          onMouseLeave={endDraw}
          onTouchStart={startDraw}
          onTouchMove={drawingMove}
          onTouchEnd={endDraw}
          style={{display:'block',width:'100%',height:'auto',aspectRatio:'640 / 460',cursor:toolMode==='stamp'?'cell':toolMode==='eraser'?'grab':'crosshair'}}
        />
      </div>

      {/* Toolbar & Palette Panel */}
      <div style={{maxWidth:640,margin:'0 auto',background:'rgba(15,23,42,0.92)',backdropFilter:'blur(10px)',border:'1.5px solid rgba(255,255,255,0.12)',borderRadius:20,padding:'14px 16px',boxShadow:'0 10px 30px rgba(0,0,0,0.3)'}}>
        {/* Tool Mode Buttons */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:8,marginBottom:12,borderBottom:'1px solid rgba(255,255,255,0.08)',paddingBottom:10}}>
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            <button onClick={() => setToolMode('brush')}
              style={{background:toolMode==='brush'?'#3b82f6':'rgba(255,255,255,0.08)',border:'none',color:'#fff',borderRadius:10,padding:'6px 12px',fontSize:12,fontWeight:700,cursor:'pointer',display:'inline-flex',alignItems:'center',gap:6}}>
              <span>🖌️</span> Kuas
            </button>
            <button onClick={() => setToolMode('eraser')}
              style={{background:toolMode==='eraser'?'#ec4899':'rgba(255,255,255,0.08)',border:'none',color:'#fff',borderRadius:10,padding:'6px 12px',fontSize:12,fontWeight:700,cursor:'pointer',display:'inline-flex',alignItems:'center',gap:6}}>
              <span>🧼</span> Penghapus
            </button>
            <button onClick={() => setToolMode('stamp')}
              style={{background:toolMode==='stamp'?'#f59e0b':'rgba(255,255,255,0.08)',border:'none',color:'#fff',borderRadius:10,padding:'6px 12px',fontSize:12,fontWeight:700,cursor:'pointer',display:'inline-flex',alignItems:'center',gap:6}}>
              <span>✨</span> Stiker
            </button>
          </div>

          <div style={{display:'flex',gap:6}}>
            <button onClick={handleUndo} disabled={historyStep <= 0}
              style={{background:'rgba(255,255,255,0.08)',border:'none',color:'#fff',borderRadius:8,padding:'6px 10px',fontSize:12,cursor:historyStep>0?'pointer':'not-allowed',opacity:historyStep>0?1:0.3}} title="Batalkan (Undo)">
              ↩️
            </button>
            <button onClick={handleRedo} disabled={historyStep >= history.length - 1}
              style={{background:'rgba(255,255,255,0.08)',border:'none',color:'#fff',borderRadius:8,padding:'6px 10px',fontSize:12,cursor:historyStep<history.length-1?'pointer':'not-allowed',opacity:historyStep<history.length-1?1:0.3}} title="Ulangi (Redo)">
              ↪️
            </button>
            <button onClick={handleClear}
              style={{background:'rgba(239,68,68,0.15)',border:'1px solid rgba(239,68,68,0.3)',color:'#ef4444',borderRadius:8,padding:'6px 10px',fontSize:12,cursor:'pointer'}} title="Bersihkan Kanvas">
              🗑️
            </button>
          </div>
        </div>

        {/* Secondary controls based on mode */}
        {toolMode === 'stamp' ? (
          <div style={{display:'flex',gap:8,alignItems:'center',overflowX:'auto',paddingBottom:4,marginBottom:12}}>
            <span style={{fontSize:11,color:'rgba(255,255,255,0.6)',fontWeight:700}}>Pilih Stiker:</span>
            {STAMPS.map(s => (
              <button key={s} onClick={() => setActiveStamp(s)}
                style={{fontSize:22,background:activeStamp===s?'rgba(245,158,11,0.3)':'transparent',border:activeStamp===s?'2px solid #f59e0b':'1px solid transparent',borderRadius:10,padding:'4px 8px',cursor:'pointer'}}>
                {s}
              </button>
            ))}
          </div>
        ) : (
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
            <span style={{fontSize:11,color:'rgba(255,255,255,0.6)',fontWeight:700}}>Ukuran:</span>
            {[
              { label:'Halus', size:4 },
              { label:'Sedang', size:10 },
              { label:'Tebal', size:22 },
              { label:'Super', size:40 }
            ].map(b => (
              <button key={b.size} onClick={() => setBrushSize(b.size)}
                style={{background:brushSize===b.size?'#6366f1':'rgba(255,255,255,0.08)',border:'none',color:'#fff',borderRadius:8,padding:'4px 10px',fontSize:11,fontWeight:700,cursor:'pointer'}}>
                {b.label}
              </button>
            ))}
          </div>
        )}

        {/* Color Palette */}
        {toolMode !== 'eraser' && (
          <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginBottom:14}}>
            {COLORS.map(c => (
              <button key={c} onClick={() => { setActiveColor(c); if (toolMode === 'eraser') setToolMode('brush'); }}
                style={{width:28,height:28,borderRadius:'50%',background:c,border:activeColor===c?'3px solid #ffffff':'2px solid rgba(0,0,0,0.2)',cursor:'pointer',boxShadow:activeColor===c?'0 0 10px '+c:'none',transition:'transform 0.15s',transform:activeColor===c?'scale(1.2)':'scale(1)'}}
              />
            ))}
            <input type="color" value={activeColor} onChange={e => setActiveColor(e.target.value)}
              style={{width:28,height:28,borderRadius:'50%',border:'none',cursor:'pointer',background:'none',padding:0}} title="Pilih warna bebas" />
          </div>
        )}

        {/* Action Buttons: Save (+10 Coins) & Download */}
        <div style={{display:'flex',gap:10,alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',paddingTop:6,borderTop:'1px solid rgba(255,255,255,0.08)'}}>
          <button onClick={handleSaveArtwork}
            style={{flex:1,background:'linear-gradient(135deg, #f59e0b, #d97706)',border:'none',color:'#fff',borderRadius:14,padding:'12px 18px',fontSize:14,fontWeight:900,fontFamily:'var(--font-kids)',cursor:'pointer',boxShadow:'0 4px 16px rgba(245,158,11,0.35)',display:'inline-flex',alignItems:'center',justifyContent:'center',gap:8}}>
            <span>💾</span> Simpan Hasil Karya (+10🪙)
          </button>
          <button onClick={handleDownload}
            style={{background:'rgba(255,255,255,0.1)',border:'1px solid rgba(255,255,255,0.15)',color:'#fff',borderRadius:14,padding:'12px 16px',fontSize:13,fontWeight:700,fontFamily:'var(--font-display)',cursor:'pointer',display:'inline-flex',alignItems:'center',gap:6}}>
            <span>📥</span> Unduh PNG
          </button>
        </div>
      </div>

      {/* Child's Personal Gallery Section */}
      {showMyArt && (
        <div style={{maxWidth:640,margin:'20px auto 0',background:'rgba(15,23,42,0.85)',borderRadius:20,padding:18,border:'1px solid rgba(255,255,255,0.1)'}}>
          <h3 style={{fontFamily:'var(--font-kids)',fontSize:18,color:'#fff',margin:'0 0 12px'}}>
            🖼️ Koleksi Lukisan Saya ({mySavedDrawings.length})
          </h3>
          {mySavedDrawings.length === 0 ? (
            <div style={{textAlign:'center',padding:'30px 10px',color:'rgba(255,255,255,0.5)',fontSize:13}}>
              Belum ada lukisan yang disimpan. Klik "Simpan Hasil Karya" di atas untuk menyimpannya ke galeri!
            </div>
          ) : (
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(140px,1fr))',gap:12}}>
              {mySavedDrawings.map(d => (
                <div key={d.id} style={{background:'rgba(255,255,255,0.05)',borderRadius:14,padding:8,border:'1px solid rgba(255,255,255,0.08)'}}>
                  <div style={{borderRadius:10,overflow:'hidden',background:'#fff',aspectRatio:'4/3',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:6}}>
                    <img src={d.dataUrl} alt={d.title} style={{width:'100%',height:'100%',objectFit:'contain'}} />
                  </div>
                  <div style={{fontSize:11,fontWeight:700,color:'#fff',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{d.title}</div>
                  <div style={{fontSize:9,color:'rgba(255,255,255,0.4)'}}>{new Date(d.createdAt).toLocaleDateString('id-ID')}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function KidsQuizDuel({ kid }) {
  const { state, updateState, addCoins, showNotif, addLog } = useContext(AppCtx);
  const [phase, setPhase] = useState('menu'); // 'menu' | 'p1_ready' | 'p1_playing' | 'pass_device' | 'p2_ready' | 'p2_playing' | 'finish'
  const [activeCategory, setActiveCategory] = useState('math');
  const [duelMode, setDuelMode] = useState('bot'); // 'bot' | 'sibling'
  const [opponentKid, setOpponentKid] = useState(null);
  const [questions, setQuestions] = useState([]);
  const [questionIdx, setQuestionIdx] = useState(0);
  const [timer, setTimer] = useState(15);
  const [selectedOpt, setSelectedOpt] = useState(null);
  const [answered, setAnswered] = useState(false);

  const [p1Score, setP1Score] = useState(0);
  const [p1Time, setP1Time] = useState(0);
  const [p2Score, setP2Score] = useState(0);
  const [p2Time, setP2Time] = useState(0);

  const siblings = (state.users.kids || []).filter(k => k.familyId === kid?.familyId && k.id !== kid?.id);

  useEffect(() => {
    let interval = null;
    if ((phase === 'p1_playing' || phase === 'p2_playing') && !answered && timer > 0) {
      interval = setInterval(() => {
        setTimer(t => {
          if (t <= 1) {
            handleTimeUp();
            return 0;
          }
          return t - 1;
        });
      }, 1000);
    }
    return () => clearInterval(interval);
  }, [phase, answered, timer]);

  const handleStartDuel = (categoryKey, mode, selectedSibling = null) => {
    setActiveCategory(categoryKey);
    setDuelMode(mode);
    setOpponentKid(selectedSibling || { id: 'bot', name: 'Robot Pintar VIDKIDZ', avatar: '🤖' });

    const bank = QUIZ_BANKS[categoryKey]?.questions || [];
    const shuffled = [...bank].sort(() => 0.5 - Math.random()).slice(0, 5);
    setQuestions(shuffled);
    setQuestionIdx(0);
    setP1Score(0);
    setP1Time(0);
    setP2Score(0);
    setP2Time(0);
    setSelectedOpt(null);
    setAnswered(false);
    setTimer(15);
    setPhase('p1_ready');
  };

  const handleTimeUp = () => {
    setAnswered(true);
    setTimeout(() => {
      nextQuestion(false, 15);
    }, 1200);
  };

  const handleAnswer = (optIdx) => {
    if (answered) return;
    setSelectedOpt(optIdx);
    setAnswered(true);
    const currQ = questions[questionIdx];
    const isCorrect = optIdx === currQ.answer;
    const timeTaken = 15 - timer;

    setTimeout(() => {
      nextQuestion(isCorrect, timeTaken);
    }, 900);
  };

  const nextQuestion = (isCorrect, timeTaken) => {
    if (phase === 'p1_playing') {
      let newP1Score = p1Score;
      if (isCorrect) {
        newP1Score = p1Score + 20;
        setP1Score(newP1Score);
      }
      setP1Time(t => t + timeTaken);

      if (questionIdx + 1 < questions.length) {
        setQuestionIdx(i => i + 1);
        setSelectedOpt(null);
        setAnswered(false);
        setTimer(15);
      } else {
        if (duelMode === 'sibling') {
          setPhase('pass_device');
        } else {
          runBotTurn(newP1Score);
        }
      }
    } else if (phase === 'p2_playing') {
      let newP2Score = p2Score;
      if (isCorrect) {
        newP2Score = p2Score + 20;
        setP2Score(newP2Score);
      }
      setP2Time(t => t + timeTaken);

      if (questionIdx + 1 < questions.length) {
        setQuestionIdx(i => i + 1);
        setSelectedOpt(null);
        setAnswered(false);
        setTimer(15);
      } else {
        finalizeDuel(p1Score, newP2Score);
      }
    }
  };

  const runBotTurn = (finalP1) => {
    const botScores = [60, 60, 80, 80, 100, 40];
    const botFinalScore = botScores[Math.floor(Math.random() * botScores.length)];
    const botTotalTime = 25 + Math.floor(Math.random() * 20);
    setP2Score(botFinalScore);
    setP2Time(botTotalTime);
    finalizeDuel(finalP1, botFinalScore);
  };

  const finalizeDuel = (finalP1, finalP2) => {
    setPhase('finish');
    let winnerId = null;
    let winnerName = null;
    if (finalP1 > finalP2) {
      winnerId = kid.id;
      winnerName = kid.name;
    } else if (finalP2 > finalP1) {
      winnerId = opponentKid.id;
      winnerName = opponentKid.name;
    } else {
      winnerId = 'draw';
      winnerName = 'Seri';
    }

    const duelRecord = {
      id: `qduel_${Date.now()}`,
      familyId: kid.familyId,
      category: activeCategory,
      title: QUIZ_BANKS[activeCategory]?.title || 'Duel Kuis',
      challengerKidId: kid.id,
      challengerKidName: kid.name,
      challengerAvatar: kid.avatar,
      challengerScore: finalP1,
      challengerTimeSeconds: p1Time || 40,
      opponentKidId: opponentKid.id,
      opponentKidName: opponentKid.name,
      opponentAvatar: opponentKid.avatar,
      opponentScore: finalP2,
      opponentTimeSeconds: p2Time || 40,
      winnerKidId: winnerId,
      winnerKidName: winnerName,
      status: 'completed',
      createdAt: Date.now(),
      rewardCoins: 15
    };

    updateState(s => {
      if (!Array.isArray(s.quizDuels)) s.quizDuels = [];
      s.quizDuels.unshift(duelRecord);
    });

    if (winnerId === kid.id) {
      addCoins(kid.id, 15);
      showNotif('🎉 Selamat! Kamu memenangkan duel kuis & dapat +15 Koin! 🪙', 'coin');
    } else if (winnerId === 'draw') {
      addCoins(kid.id, 10);
      showNotif('🤝 Hasil Seri! Kamu dan lawanmu hebat & dapat +10 Koin! 🪙', 'coin');
    } else {
      addCoins(kid.id, 5);
      showNotif('👏 Tetap semangat! Kamu dapat bonus +5 Koin partisipasi! 🪙', 'coin');
    }
    addLog(kid.name, `Menyelesaikan duel kuis ${QUIZ_BANKS[activeCategory]?.title}: Skor ${finalP1} vs ${finalP2}`, 'game');
  };

  const currQ = questions[questionIdx];
  const myDuels = (state.quizDuels || []).filter(q => q.challengerKidId === kid?.id || q.opponentKidId === kid?.id);

  return (
    <div style={{padding:'20px 20px'}}>
      {/* Header Banner */}
      <div style={{background:'linear-gradient(135deg, rgba(245,158,11,0.2), rgba(234,179,8,0.05))',border:'1.5px solid rgba(245,158,11,0.3)',borderRadius:22,padding:'20px',marginBottom:20}}>
        <div style={{display:'flex',alignItems:'center',gap:16}}>
          <div style={{fontSize:48}}>🥊</div>
          <div>
            <h2 style={{fontFamily:'var(--font-kids)',fontSize:24,color:'#fff',margin:0}}>Duel Kuis Asah Otak!</h2>
            <p style={{color:'rgba(255,255,255,0.7)',fontSize:13,marginTop:4,marginBottom:0}}>
              Tantang saudara atau lawan Robot Pintar VIDKIDZ dalam 5 babak soal kilat!
            </p>
          </div>
        </div>
      </div>

      {phase === 'menu' && (
        <div className="fade-in">
          <h3 style={{fontFamily:'var(--font-kids)',color:'#fff',fontSize:18,marginBottom:14}}>1. Pilih Kategori Soal</h3>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(140px,1fr))',gap:12,marginBottom:24}}>
            {Object.values(QUIZ_BANKS).map(cat => (
              <div
                key={cat.id}
                onClick={() => setActiveCategory(cat.id)}
                style={{
                  background: activeCategory === cat.id ? `linear-gradient(135deg, ${cat.color}33, ${cat.color}11)` : 'rgba(255,255,255,0.05)',
                  border: `2px solid ${activeCategory === cat.id ? cat.color : 'rgba(255,255,255,0.1)'}`,
                  borderRadius: 18,
                  padding: 16,
                  cursor: 'pointer',
                  textAlign: 'center',
                  transition: 'all 0.2s',
                  transform: activeCategory === cat.id ? 'translateY(-2px)' : 'none'
                }}
              >
                <div style={{fontSize:38,marginBottom:8}}>{cat.emoji}</div>
                <div style={{fontFamily:'var(--font-kids)',color:'#fff',fontSize:14,fontWeight:700}}>{cat.title}</div>
                <div style={{fontSize:11,color:'rgba(255,255,255,0.5)',marginTop:4}}>{cat.questions.length} Soal Siap</div>
              </div>
            ))}
          </div>

          <h3 style={{fontFamily:'var(--font-kids)',color:'#fff',fontSize:18,marginBottom:14}}>2. Pilih Lawan Tanding</h3>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:14,marginBottom:28}}>
            {/* Robot AI Bot */}
            <div
              onClick={() => handleStartDuel(activeCategory, 'bot')}
              style={{
                background: 'linear-gradient(135deg, rgba(99,102,241,0.2), rgba(99,102,241,0.05))',
                border: '1.5px solid rgba(99,102,241,0.4)',
                borderRadius: 18,
                padding: 16,
                cursor: 'pointer',
                display: 'flex',
                alignItems: 'center',
                gap: 12
              }}
            >
              <div style={{fontSize:36}}>🤖</div>
              <div>
                <div style={{fontFamily:'var(--font-display)',fontWeight:800,color:'#fff',fontSize:14}}>Robot Pintar</div>
                <div style={{fontSize:11,color:'rgba(255,255,255,0.5)'}}>Lawan Bot Otomatis</div>
                <div style={{fontSize:10,color:'#818cf8',fontWeight:700,marginTop:2}}>Mulai Sekarang →</div>
              </div>
            </div>

            {/* Siblings */}
            {siblings.map(sib => (
              <div
                key={sib.id}
                onClick={() => handleStartDuel(activeCategory, 'sibling', sib)}
                style={{
                  background: 'linear-gradient(135deg, rgba(236,72,153,0.2), rgba(236,72,153,0.05))',
                  border: '1.5px solid rgba(236,72,153,0.4)',
                  borderRadius: 18,
                  padding: 16,
                  cursor: 'pointer',
                  display: 'flex',
                  alignItems: 'center',
                  gap: 12
                }}
              >
                <div style={{fontSize:36}}>{sib.avatar}</div>
                <div>
                  <div style={{fontFamily:'var(--font-display)',fontWeight:800,color:'#fff',fontSize:14}}>{sib.name}</div>
                  <div style={{fontSize:11,color:'rgba(255,255,255,0.5)'}}>Duel 1 HP Bergantian</div>
                  <div style={{fontSize:10,color:'#f472b6',fontWeight:700,marginTop:2}}>Tantang Saudara →</div>
                </div>
              </div>
            ))}
          </div>

          {/* Riwayat Duel */}
          {myDuels.length > 0 && (
            <div>
              <h3 style={{fontFamily:'var(--font-kids)',color:'rgba(255,255,255,0.8)',fontSize:16,marginBottom:12}}>🏆 Riwayat Duel Terakhir</h3>
              <div style={{display:'flex',flexDirection:'column',gap:10}}>
                {myDuels.slice(0, 5).map(d => {
                  const won = d.winnerKidId === kid.id;
                  const draw = d.winnerKidId === 'draw';
                  return (
                    <div key={d.id} style={{background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.08)',borderRadius:14,padding:'10px 14px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                      <div style={{display:'flex',alignItems:'center',gap:10}}>
                        <span style={{fontSize:22}}>{won ? '👑' : draw ? '🤝' : '🥊'}</span>
                        <div>
                          <div style={{fontSize:13,fontWeight:700,color:'#fff'}}>{d.title} vs {d.opponentKidName}</div>
                          <div style={{fontSize:11,color:'rgba(255,255,255,0.4)'}}>{new Date(d.createdAt).toLocaleDateString('id-ID')}</div>
                        </div>
                      </div>
                      <div style={{textAlign:'right'}}>
                        <div style={{fontSize:14,fontWeight:900,color:won?'var(--success)':draw?'var(--warn)':'rgba(255,255,255,0.6)',fontFamily:'var(--font-display)'}}>
                          {d.challengerScore} - {d.opponentScore}
                        </div>
                        <div style={{fontSize:10,color:'var(--coin)',fontWeight:700}}>+{d.rewardCoins} 🪙</div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      )}

      {/* P1 Ready Screen */}
      {phase === 'p1_ready' && (
        <div className="fade-in" style={{textAlign:'center',padding:'40px 20px'}}>
          <div style={{fontSize:64,marginBottom:16}}>{kid.avatar}</div>
          <h2 style={{fontFamily:'var(--font-kids)',color:'#fff',fontSize:26}}>Giliran {kid.name}!</h2>
          <p style={{color:'rgba(255,255,255,0.7)',fontSize:14,maxWidth:360,margin:'8px auto 24px'}}>
            Siap-siap menjawab 5 pertanyaan secepat mungkin! Waktu tiap soal 15 detik.
          </p>
          <button
            onClick={() => { setTimer(15); setPhase('p1_playing'); }}
            style={{background:'linear-gradient(135deg, #10b981, #059669)',border:'none',color:'#fff',fontWeight:800,fontSize:16,padding:'14px 32px',borderRadius:20,cursor:'pointer',boxShadow:'0 6px 20px rgba(16,185,129,0.4)'}}
          >
            Mulai Sekarang! 🚀
          </button>
        </div>
      )}

      {/* Playing Screen */}
      {(phase === 'p1_playing' || phase === 'p2_playing') && currQ && (
        <div className="fade-in">
          {/* Top Status Bar */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <span style={{fontSize:24}}>{phase === 'p1_playing' ? kid.avatar : opponentKid.avatar}</span>
              <span style={{fontWeight:800,color:'#fff',fontSize:14}}>
                {phase === 'p1_playing' ? kid.name : opponentKid.name}
              </span>
            </div>
            <div style={{fontSize:12,fontWeight:700,color:'rgba(255,255,255,0.6)',background:'rgba(255,255,255,0.1)',padding:'4px 12px',borderRadius:20}}>
              Soal {questionIdx + 1} dari 5
            </div>
            <div style={{fontSize:14,fontWeight:900,color:timer<=5?'var(--danger)':'var(--warn)',fontFamily:'var(--font-display)',display:'flex',alignItems:'center',gap:4}}>
              <span>⏱️</span> {timer}s
            </div>
          </div>

          {/* Question Card */}
          <div style={{background:'rgba(255,255,255,0.08)',border:'1.5px solid rgba(255,255,255,0.15)',borderRadius:22,padding:'24px 20px',marginBottom:20,textAlign:'center'}}>
            <h3 style={{fontFamily:'var(--font-kids)',fontSize:20,color:'#fff',lineHeight:1.4,margin:0}}>
              {currQ.q}
            </h3>
          </div>

          {/* Options */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            {currQ.options.map((opt, idx) => {
              let optBg = 'rgba(255,255,255,0.06)';
              let optBorder = 'rgba(255,255,255,0.15)';
              let optColor = '#fff';

              if (answered) {
                if (idx === currQ.answer) {
                  optBg = 'rgba(16,185,129,0.3)';
                  optBorder = '#10b981';
                  optColor = '#34d399';
                } else if (idx === selectedOpt) {
                  optBg = 'rgba(239,68,68,0.3)';
                  optBorder = '#ef4444';
                  optColor = '#f87171';
                }
              }

              return (
                <button
                  key={idx}
                  disabled={answered}
                  onClick={() => handleAnswer(idx)}
                  style={{
                    background: optBg,
                    border: `2px solid ${optBorder}`,
                    color: optColor,
                    borderRadius: 18,
                    padding: '16px 14px',
                    fontSize: 15,
                    fontFamily: 'var(--font-kids)',
                    cursor: answered ? 'default' : 'pointer',
                    transition: 'all 0.2s',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    textAlign: 'center'
                  }}
                >
                  {opt}
                </button>
              );
            })}
          </div>
        </div>
      )}

      {/* Pass Device Screen */}
      {phase === 'pass_device' && (
        <div className="fade-in" style={{textAlign:'center',padding:'40px 20px'}}>
          <div style={{fontSize:64,marginBottom:16}}>📱 ➔ {opponentKid.avatar}</div>
          <h2 style={{fontFamily:'var(--font-kids)',color:'#fff',fontSize:26}}>Oper HP ke {opponentKid.name}!</h2>
          <p style={{color:'rgba(255,255,255,0.7)',fontSize:14,maxWidth:360,margin:'8px auto 24px'}}>
            Skor babak pertama sudah tersimpan. Sekarang giliran {opponentKid.name} menjawab pertanyaan yang sama!
          </p>
          <button
            onClick={() => {
              setQuestionIdx(0);
              setSelectedOpt(null);
              setAnswered(false);
              setTimer(15);
              setPhase('p2_playing');

            style={{background:'linear-gradient(135deg, #ec4899, #db2777)',border:'none',color:'#fff',fontWeight:800,fontSize:16,padding:'14px 32px',borderRadius:20,cursor:'pointer',boxShadow:'0 6px 20px rgba(236,72,153,0.4)'}}
          >
            {opponentKid.name} Siap Main! 🚀
          </button>
        </div>
      )}

      {/* Finish Screen */}
      {phase === 'finish' && (
        <div className="fade-in" style={{textAlign:'center',padding:'30px 16px'}}>
          <div style={{fontSize:64,marginBottom:8}}>🏆</div>
          <h2 style={{fontFamily:'var(--font-kids)',fontSize:28,color:'#fff',margin:0}}>
            {p1Score > p2Score ? `Hore! ${kid.name} Menang! 🎉` : p2Score > p1Score ? `${opponentKid.name} Menang! 🎉` : 'Pertandingan Seri! 🤝'}
          </h2>
          <p style={{color:'rgba(255,255,255,0.7)',fontSize:14,marginTop:6,marginBottom:20}}>
            Duel kuis {QUIZ_BANKS[activeCategory]?.title} selesai!
          </p>

          {/* Scores comparison */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:24,background:'rgba(255,255,255,0.06)',padding:'20px',borderRadius:22,maxWidth:420,margin:'0 auto 24px'}}>
            <div style={{flex:1}}>
              <div style={{fontSize:36}}>{kid.avatar}</div>
              <div style={{fontSize:14,fontWeight:800,color:'#fff',marginTop:4}}>{kid.name}</div>
              <div style={{fontSize:28,fontWeight:900,color:p1Score>=p2Score?'var(--success)':'rgba(255,255,255,0.6)',fontFamily:'var(--font-display)',marginTop:4}}>{p1Score}</div>
            </div>
            <div style={{fontSize:20,fontWeight:900,color:'rgba(255,255,255,0.3)'}}>VS</div>
            <div style={{flex:1}}>
              <div style={{fontSize:36}}>{opponentKid.avatar}</div>
              <div style={{fontSize:14,fontWeight:800,color:'#fff',marginTop:4}}>{opponentKid.name}</div>
              <div style={{fontSize:28,fontWeight:900,color:p2Score>=p1Score?'var(--success)':'rgba(255,255,255,0.6)',fontFamily:'var(--font-display)',marginTop:4}}>{p2Score}</div>
            </div>
          </div>

          <div style={{display:'flex',gap:12,justifyContent:'center',flexWrap:'wrap'}}>
            <button
              onClick={() => setPhase('menu')}
              style={{background:'linear-gradient(135deg, #0078ff, #0056b3)',border:'none',color:'#fff',fontWeight:800,fontSize:14,padding:'12px 24px',borderRadius:16,cursor:'pointer'}}
            >
              Main Lagi 🥊
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// KIDS DAILY QUESTS & STREAK ENGINE
// ============================================================
function KidsDailyQuestsCard({ kid, onNavigate }) {
  const { state, updateState, addCoins, showNotif } = useContext(AppCtx);
  const today = new Date().toISOString().slice(0, 10);
  
  const quests = kid?.dailyQuests?.date === today 
    ? kid.dailyQuests 
    : { date: today, video: false, hafalan: false, game: false, claimed: false };

  const hasHafalanToday = quests.hafalan || (kid?.hafalanDone || []).length > 0 || (state.hafalanRecords || []).some(r => r.kidId === kid?.id && new Date(r.recordedAt).toISOString().slice(0, 10) === today);
  const hasVideoToday = quests.video || ((kid?.watchTime || 0) > 0);
  const totalGames = Object.values(kid?.gameStats || {}).reduce((s, g) => s + (g.played || 0), 0);
  const hasGameToday = quests.game || totalGames > 0;

  const completedCount = (hasVideoToday ? 1 : 0) + (hasHafalanToday ? 1 : 0) + (hasGameToday ? 1 : 0);
  const allCompleted = completedCount === 3;
  const isClaimed = quests.claimed;

  const handleClaim = () => {
    if (!allCompleted) {
      showNotif('Selesaikan 3 misi harian untuk membuka hadiah!', 'warn');
      return;
    }
    if (isClaimed) {
      showNotif('Bonus misi harian hari ini sudah diklaim!', 'info');
      return;
    }
    updateState(s => {
      const k = s.users.kids.find(u => u.id === kid?.id);
      if (k) {
        k.dailyQuests = { date: today, video: true, hafalan: true, game: true, claimed: true };
        k.streak = (k.streak || 0) + 1;
      }
    });
    addCoins(kid?.id, 15, 'Bonus Misi Harian Selesai! 🎉');
    showNotif('🎉 Selamat! +15 Koin & Streak bertambah! 🔥', 'coin');
  };

  return (
    <div style={{background:'linear-gradient(135deg, rgba(99,102,241,0.12), rgba(168,85,247,0.06))',border:'1.5px solid rgba(168,85,247,0.28)',borderRadius:20,padding:18,marginBottom:20}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:22}}>🎯</span>
          <div>
            <div style={{fontFamily:'var(--font-kids)',fontSize:17,color:'#fff'}}>Misi Harian Kamu</div>
            <div style={{fontSize:11,color:'rgba(255,255,255,0.5)'}}>Selesaikan 3 misi untuk dapat +15 🪙 bonus koin!</div>
          </div>
        </div>
        <span style={{background: allCompleted ? 'rgba(34,197,94,0.2)' : 'rgba(255,255,255,0.08)',color: allCompleted ? 'var(--success)' : 'rgba(255,255,255,0.7)',border:`1px solid ${allCompleted ? 'rgba(34,197,94,0.4)' : 'rgba(255,255,255,0.15)'}`,borderRadius:20,padding:'3px 10px',fontSize:11,fontFamily:'var(--font-display)',fontWeight:700}}>
          {completedCount}/3 Selesai
        </span>
      </div>

      <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:14}}>
        {[
          { label: 'Tonton 1 Video Edukasi Seru', done: hasVideoToday, icon: '🎬', tab: 'videos' },
          { label: 'Latih 1 Hafalan Surah / Doa', done: hasHafalanToday, icon: '📖', tab: 'hafalan' },
          { label: 'Mainkan 1 Game Pintar', done: hasGameToday, icon: '🎮', tab: 'games' }
        ].map((q, idx) => (
          <div key={idx} style={{display:'flex',alignItems:'center',justifyContent:'space-between',background:'rgba(255,255,255,0.04)',borderRadius:12,padding:'8px 12px',border:`1px solid ${q.done ? 'rgba(34,197,94,0.3)' : 'rgba(255,255,255,0.06)'}`}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <span style={{fontSize:16}}>{q.icon}</span>
              <span style={{fontSize:12,color: q.done ? '#4ade80' : 'rgba(255,255,255,0.8)',fontWeight: q.done ? 700 : 500}}>
                {q.label}
              </span>
            </div>
            {q.done ? (
              <span style={{color:'var(--success)',fontSize:12,fontWeight:700}}>✓ Selesai</span>
            ) : (
              <button onClick={()=>onNavigate(q.tab)} style={{background:'rgba(255,255,255,0.08)',border:'1px solid rgba(255,255,255,0.15)',color:'rgba(255,255,255,0.8)',borderRadius:10,padding:'3px 8px',fontSize:11,cursor:'pointer',fontWeight:600}}>
                Mulai ›
              </button>
            )}
          </div>
        ))}
      </div>

      {allCompleted ? (
        isClaimed ? (
          <div style={{background:'rgba(34,197,94,0.12)',border:'1px solid rgba(34,197,94,0.3)',borderRadius:12,padding:'8px 14px',textAlign:'center',color:'var(--success)',fontSize:12,fontWeight:700}}>
            ✅ Misi Harian Selesai! Kamu Hebat! (+15 Koin Sudah Diklaim)
          </div>
        ) : (
          <button onClick={handleClaim} style={{width:'100%',background:'linear-gradient(135deg, #f59e0b, #eab308)',border:'none',color:'#000',fontWeight:800,fontSize:13,padding:'10px 16px',borderRadius:12,cursor:'pointer',boxShadow:'0 4px 16px rgba(234,179,8,0.4)',display:'flex',alignItems:'center',justifyContent:'center',gap:6}}>
            <span>🎁</span> Klaim Hadiah Misi Harian (+15 🪙 Koin & +1 Streak 🔥)
          </button>
        )
      ) : (
        <div style={{fontSize:11,color:'rgba(255,255,255,0.4)',textAlign:'center'}}>
          Selesaikan misi yang tersisa di atas untuk membuka hadiah koin!
        </div>
      )}
    </div>
  );
}
