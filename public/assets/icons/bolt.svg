<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="bt-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.42"/>
    </filter>
    <linearGradient id="bt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="bt-side" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <g filter="url(#bt-shadow)">
    <!-- 3D Extruded Depth Side (Shifted X+4, Y+5) -->
    <polygon points="68,12 34,60 58,60 44,106 90,52 64,52" transform="translate(4, 5)" fill="url(#bt-side)"/>

    <!-- Bolt Front Face -->
    <polygon points="68,12 34,60 58,60 44,106 90,52 64,52" fill="url(#bt-grad)"/>

    <!-- Specular Highlight Bevel -->
    <polyline points="68,12 34,60 58,60" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <line x1="64" y1="52" x2="90" y2="52" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Energy Sparkles -->
    <polygon points="26,38 28,42 32,43 28,45 26,49 24,45 20,43 24,42" fill="#ffffff"/>
    <polygon points="88,78 90,82 94,83 90,85 88,89 86,85 82,83 86,82" fill="#fde047"/>
    <polygon points="80,24 81.5,27 84.5,28 81.5,29 80,32 78.5,29 75.5,28 78.5,27" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>