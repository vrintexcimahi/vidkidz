<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="hm-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#f97316" flood-opacity="0.32"/>
    </filter>
    <linearGradient id="hm-roof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b60"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="hm-roof-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="hm-wall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="hm-door" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <radialGradient id="hm-window" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
    <linearGradient id="hm-chimney" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <g filter="url(#hm-shadow)">
    <!-- Chimney & Smoke -->
    <rect x="76" y="24" width="16" height="28" rx="4" fill="url(#hm-chimney)"/>
    <rect x="74" y="22" width="20" height="6" rx="3" fill="#ef4444"/>
    <!-- Smoke puffs -->
    <ellipse cx="88" cy="16" rx="5" ry="4" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="94" cy="9" rx="7" ry="5.5" fill="#ffffff" opacity="0.75"/>
    <ellipse cx="102" cy="4" rx="5" ry="4" fill="#ffffff" opacity="0.6"/>

    <!-- Main House Body -->
    <rect x="26" y="52" width="68" height="48" rx="10" fill="url(#hm-wall)"/>
    <!-- Wall base trim / foundation -->
    <path d="M26 94 h68 v6 a6 6 0 0 1 -6 6 h-56 a6 6 0 0 1 -6 -6 z" fill="#cbd5e1"/>

    <!-- Door -->
    <path d="M48 100 v-28 a12 12 0 0 1 24 0 v28 z" fill="url(#hm-door)"/>
    <!-- Door Frame -->
    <path d="M48 100 v-28 a12 12 0 0 1 24 0 v28" fill="none" stroke="#fef08a" stroke-width="2.5"/>
    <!-- Door Knob -->
    <circle cx="67" cy="85" r="2.8" fill="#fbbf24"/>
    <circle cx="66" cy="84" r="1" fill="#fff"/>

    <!-- Cute Bush beside door -->
    <circle cx="37" cy="96" r="8" fill="#22c55e"/>
    <circle cx="37" cy="94" r="6" fill="#4ade80"/>
    <circle cx="83" cy="96" r="8" fill="#22c55e"/>
    <circle cx="83" cy="94" r="6" fill="#4ade80"/>

    <!-- Overhanging 3D Roof -->
    <path d="M16 54 L60 16 L104 54 C104 54 98 58 92 58 L60 28 L28 58 C22 58 16 54 16 54 Z" fill="url(#hm-roof)"/>
    <path d="M16 54 L60 16 L104 54 L98 60 L60 26 L22 60 Z" fill="url(#hm-roof-rim)" opacity="0.8"/>

    <!-- Attic Round Window -->
    <circle cx="60" cy="42" r="10" fill="#ffffff"/>
    <circle cx="60" cy="42" r="8" fill="url(#hm-window)"/>
    <!-- Window Cross Bar -->
    <line x1="60" y1="34" x2="60" y2="50" stroke="#ffffff" stroke-width="1.8"/>
    <line x1="52" y1="42" x2="68" y2="42" stroke="#ffffff" stroke-width="1.8"/>
    <!-- Specular glare on roof -->
    <path d="M28 50 L58 24 L56 22 L24 48 Z" fill="#ffffff" opacity="0.45"/>
  </g>
</svg>