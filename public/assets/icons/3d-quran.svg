<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="qr-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="wood-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="70%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="quran-cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="gold-foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <g filter="url(#qr-shadow)">
    <!-- Wooden Rehal (Bookstand) -->
    <polygon points="32,74 61,96 52,106 20,84" fill="url(#wood-grad)"/>
    <polygon points="88,74 59,96 68,106 100,84" fill="#92400e"/>
    <polygon points="60,94 52,104 68,104" fill="#451a03"/>

    <!-- Left Open Page -->
    <path d="M60 76 C46 72 28 66 18 62 C18 42 20 32 60 40 Z" fill="#f8fafc"/>
    <path d="M60 76 C46 72 28 66 18 62 C17 62 16 61 16 60 L16 38 C16 37 17 37 18 38 C28 42 46 48 60 40 Z" fill="url(#quran-cover)"/>
    <path d="M60 74 C46 70 30 65 21 61 C21 43 23 35 60 42 Z" fill="#ffffff"/>
    
    <!-- Left text lines -->
    <line x1="26" y1="46" x2="54" y2="52" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="26" y1="52" x2="54" y2="58" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="26" y1="58" x2="54" y2="64" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="64" x2="50" y2="68" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Open Page -->
    <path d="M60 76 C74 72 92 66 102 62 C102 42 100 32 60 40 Z" fill="#f8fafc"/>
    <path d="M60 76 C74 72 92 66 102 62 C103 62 104 61 104 60 L104 38 C104 37 103 37 102 38 C92 42 74 48 60 40 Z" fill="url(#quran-cover)"/>
    <path d="M60 74 C74 70 90 65 99 61 C99 43 97 35 60 42 Z" fill="#ffffff"/>

    <!-- Right text lines -->
    <line x1="66" y1="52" x2="94" y2="46" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="66" y1="58" x2="94" y2="52" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="66" y1="64" x2="94" y2="58" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="70" y1="68" x2="90" y2="64" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

    <!-- Gold Center Spine & Ribbon Bookmark -->
    <path d="M59 38 Q60 58 60 78 Q61 58 61 38 Z" fill="url(#gold-foil)"/>
    <path d="M60 76 Q62 90 58 98 L64 96 L66 102 Q64 90 60 76 Z" fill="url(#gold-foil)"/>

    <!-- Crescent Moon & Star Aura on Top -->
    <path d="M60 18 A 8 8 0 1 0 68 26 A 6 6 0 1 1 60 18 Z" fill="url(#gold-foil)"/>
    <polygon points="72,16 73,19 76,20 73,21 72,24 71,21 68,20 71,19" fill="#fbbf24"/>
  </g>
</svg>