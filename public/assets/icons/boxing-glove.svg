<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="bg-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#b91c1c" flood-opacity="0.38"/>
    </filter>
    <linearGradient id="bg-glove" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b92"/>
      <stop offset="35%" stop-color="#ef4444"/>
      <stop offset="75%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="bg-thumb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8fa3"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="bg-wrist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="bg-lace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <g filter="url(#bg-shadow)">
    <!-- Wrist Cuff Back Depth Layer -->
    <rect x="36" y="86" width="48" height="24" rx="8" fill="#450a0a"/>
    <!-- Wrist Padded Cuff -->
    <rect x="36" y="82" width="48" height="24" rx="8" fill="url(#bg-wrist)"/>
    <rect x="40" y="84" width="40" height="4" rx="2" fill="#ffffff" opacity="0.8"/>
    <!-- Wrist Strap / Lace Accent -->
    <rect x="44" y="94" width="32" height="6" rx="3" fill="url(#bg-lace)"/>
    <!-- Stitching Dots on Wrist -->
    <circle cx="42" cy="97" r="1.5" fill="#94a3b8"/>
    <circle cx="78" cy="97" r="1.5" fill="#94a3b8"/>

    <!-- Main Glove Depth Base (Shifted Y+5) -->
    <path d="M30 52 C26 28 44 14 66 14 C86 14 96 26 96 52 C96 74 86 86 64 86 C46 86 32 74 30 52 Z" transform="translate(0, 5)" fill="#7f1d1d"/>

    <!-- Main Glove Body (Chubby Padded Knuckles) -->
    <path d="M30 52 C26 28 44 14 66 14 C86 14 96 26 96 52 C96 74 86 86 64 86 C46 86 32 74 30 52 Z" fill="url(#bg-glove)"/>

    <!-- Specular Knuckle Highlight Curve -->
    <path d="M38 32 C48 20 74 20 86 30 C76 24 50 24 38 32 Z" fill="#ffffff" opacity="0.65"/>
    <ellipse cx="46" cy="36" rx="10" ry="5" transform="rotate(-20 46 36)" fill="#ffffff" opacity="0.5"/>

    <!-- Plump Curved Thumb Section -->
    <path d="M22 56 C16 46 22 36 32 38 C40 40 46 48 44 62 C42 70 34 74 26 70 C20 66 20 60 22 56 Z" fill="url(#bg-thumb)"/>
    <!-- Thumb Seam Line -->
    <path d="M32 38 C38 46 38 60 36 72" fill="none" stroke="#7f1d1d" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <!-- Thumb Highlight -->
    <ellipse cx="27" cy="48" rx="4" ry="7" transform="rotate(-15 27 48)" fill="#ffffff" opacity="0.55"/>

    <!-- Knuckle Padding Indentation Lines -->
    <path d="M54 22 C56 34 56 46 54 54" fill="none" stroke="#991b1b" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M72 22 C74 34 74 46 72 54" fill="none" stroke="#991b1b" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>

    <!-- Impact Stars / Sparkles -->
    <polygon points="98,22 100,26 104,27 100,29 98,33 96,29 92,27 96,26" fill="#fde047"/>
    <polygon points="18,28 19.5,31 22.5,32 19.5,33 18,36 16.5,33 13.5,32 16.5,31" fill="#ffffff"/>
  </g>
</svg>
