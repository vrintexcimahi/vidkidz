<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="lo-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#e11d48" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="lo-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="lo-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="lo-arrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <g filter="url(#lo-shadow)">
    <!-- Outer Door Frame -->
    <rect x="18" y="16" width="56" height="88" rx="10" fill="url(#lo-frame)"/>
    <!-- Door Threshold / Step -->
    <rect x="12" y="98" width="68" height="10" rx="5" fill="#334155"/>

    <!-- Door Interior Opening with Warm Light -->
    <rect x="24" y="22" width="44" height="76" rx="6" fill="url(#lo-light)"/>

    <!-- Partially Open Door Panel (Perspective Angle) -->
    <path d="M24 22 L52 28 V92 L24 98 Z" fill="#3b82f6"/>
    <path d="M24 22 L52 28 V92 L24 98 Z" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <!-- Brass Handle on Open Door -->
    <circle cx="48" cy="62" r="3.5" fill="#fbbf24"/>

    <!-- Chunky 3D Exit Arrow Leaping Out (Right) -->
    <!-- Arrow Shadow -->
    <path d="M48 60 H82 V48 L106 66 L82 84 V72 H48 Z" transform="translate(0, 4)" fill="#0f172a" opacity="0.4"/>
    <!-- Arrow Body -->
    <path d="M48 60 H82 V48 L106 66 L82 84 V72 H48 Z" fill="url(#lo-arrow)"/>
    <!-- Arrow Top Specular Highlight -->
    <path d="M48 60 H82 V48 L106 66" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>

    <!-- Sparkle -->
    <polygon points="106,42 108,46 112,47 108,49 106,53 104,49 100,47 104,46" fill="#fde047"/>
  </g>
</svg>