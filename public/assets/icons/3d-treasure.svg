<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="tc-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#d97706" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="wood-chest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="60%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="gold-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="coin-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
  </defs>

  <g filter="url(#tc-shadow)">
    <!-- Open Lid Upper Section (Tilted back) -->
    <path d="M22 46 C22 28 98 28 98 46 L94 48 C94 34 26 34 26 48 Z" fill="#92400e"/>
    <path d="M22 46 C22 28 98 28 98 46 L98 52 C98 38 22 38 22 52 Z" fill="url(#gold-metal)"/>

    <!-- Gold Coins Overflowing & Glowing -->
    <ellipse cx="60" cy="50" rx="34" ry="12" fill="#d97706"/>
    <!-- Stacked coins -->
    <circle cx="48" cy="46" r="7" fill="url(#coin-glow)" stroke="#b45309" stroke-width="1"/>
    <circle cx="62" cy="44" r="8" fill="url(#coin-glow)" stroke="#b45309" stroke-width="1"/>
    <circle cx="74" cy="47" r="7" fill="url(#coin-glow)" stroke="#b45309" stroke-width="1"/>
    <circle cx="40" cy="52" r="6" fill="url(#coin-glow)" stroke="#b45309" stroke-width="1"/>
    <circle cx="56" cy="50" r="7.5" fill="url(#coin-glow)" stroke="#b45309" stroke-width="1"/>
    <circle cx="68" cy="51" r="7" fill="url(#coin-glow)" stroke="#b45309" stroke-width="1"/>
    <circle cx="80" cy="53" r="6" fill="url(#coin-glow)" stroke="#b45309" stroke-width="1"/>
    <!-- Sparkling Red & Blue Gems -->
    <polygon points="52,40 56,36 60,40 56,44" fill="#ef4444"/>
    <polygon points="70,41 73,38 76,41 73,44" fill="#38bdf8"/>

    <!-- Chest Lower Box -->
    <path d="M22 52 H98 V86 C98 94 92 98 84 98 H36 C28 98 22 94 22 86 Z" fill="url(#wood-chest)"/>

    <!-- Metal Trim Bands on Box -->
    <!-- Left Band -->
    <rect x="28" y="52" width="9" height="46" fill="url(#gold-metal)"/>
    <circle cx="32.5" cy="58" r="1.5" fill="#451a03"/>
    <circle cx="32.5" cy="74" r="1.5" fill="#451a03"/>
    <circle cx="32.5" cy="90" r="1.5" fill="#451a03"/>

    <!-- Right Band -->
    <rect x="83" y="52" width="9" height="46" fill="url(#gold-metal)"/>
    <circle cx="87.5" cy="58" r="1.5" fill="#451a03"/>
    <circle cx="87.5" cy="74" r="1.5" fill="#451a03"/>
    <circle cx="87.5" cy="90" r="1.5" fill="#451a03"/>

    <!-- Top Rim of Box -->
    <rect x="20" y="52" width="80" height="6" rx="2" fill="url(#gold-metal)"/>

    <!-- Golden Lock Hasp in Center -->
    <rect x="54" y="54" width="12" height="18" rx="4" fill="url(#gold-metal)"/>
    <circle cx="60" cy="62" r="2.5" fill="#451a03"/>
    <rect x="59" y="62" width="2" height="4" fill="#451a03"/>

    <!-- Sparkles -->
    <polygon points="34,36 36,40 40,42 36,44 34,48 32,44 28,42 32,40" fill="#fde047"/>
    <polygon points="86,32 87,35 90,36 87,37 86,40 85,37 82,36 85,35" fill="#fde047"/>
  </g>
</svg>