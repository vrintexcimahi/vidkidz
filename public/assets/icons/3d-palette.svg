<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="pal-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#854d0e" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="pal-wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="35%" stop-color="#fde68a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="pal-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="paint-red" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fca5a5"/><stop offset="60%" stop-color="#ef4444"/><stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <radialGradient id="paint-blue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#93c5fd"/><stop offset="60%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1e40af"/>
    </radialGradient>
    <radialGradient id="paint-green" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#86efac"/><stop offset="60%" stop-color="#22c55e"/><stop offset="100%" stop-color="#15803d"/>
    </radialGradient>
    <radialGradient id="paint-purple" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d8b4fe"/><stop offset="60%" stop-color="#a855f7"/><stop offset="100%" stop-color="#6b21a8"/>
    </radialGradient>
    <radialGradient id="paint-amber" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/><stop offset="60%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <linearGradient id="brush-handle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/><stop offset="50%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <g filter="url(#pal-shadow)">
    <!-- 3D Palette Depth Offset -->
    <path d="M58 20 C84 20 104 36 104 58 C104 76 92 90 76 96 C70 98 64 92 62 86 C60 80 54 74 46 76 C40 78 36 84 32 86 C22 88 14 80 14 68 C14 42 32 20 58 20 Z" transform="translate(0, 6)" fill="url(#pal-base)"/>

    <!-- Palette Main Board -->
    <path d="M58 20 C84 20 104 36 104 58 C104 76 92 90 76 96 C70 98 64 92 62 86 C60 80 54 74 46 76 C40 78 36 84 32 86 C22 88 14 80 14 68 C14 42 32 20 58 20 Z" fill="url(#pal-wood)"/>
    <path d="M58 22 C82 22 101 37 101 58 C101 74 90 87 75 93" fill="none" stroke="#fffbeb" stroke-width="2" opacity="0.6"/>

    <!-- Thumb Hole with 3D Bevel -->
    <ellipse cx="80" cy="74" rx="9" ry="11" fill="#78350f"/>
    <ellipse cx="80" cy="72" rx="9" ry="11" fill="#0f172a" opacity="0.3"/>

    <!-- Juicy 3D Paint Dollops -->
    <!-- Red -->
    <ellipse cx="34" cy="38" rx="8" ry="7.5" fill="url(#paint-red)"/>
    <ellipse cx="32.5" cy="36" rx="2.5" ry="1.5" fill="#ffffff" opacity="0.75"/>
    
    <!-- Blue -->
    <ellipse cx="54" cy="32" rx="8" ry="7.5" fill="url(#paint-blue)"/>
    <ellipse cx="52.5" cy="30" rx="2.5" ry="1.5" fill="#ffffff" opacity="0.75"/>

    <!-- Green -->
    <ellipse cx="74" cy="36" rx="8" ry="7.5" fill="url(#paint-green)"/>
    <ellipse cx="72.5" cy="34" rx="2.5" ry="1.5" fill="#ffffff" opacity="0.75"/>

    <!-- Purple -->
    <ellipse cx="90" cy="50" rx="8" ry="7.5" fill="url(#paint-purple)"/>
    <ellipse cx="88.5" cy="48" rx="2.5" ry="1.5" fill="#ffffff" opacity="0.75"/>

    <!-- Amber -->
    <ellipse cx="32" cy="58" rx="8" ry="7.5" fill="url(#paint-amber)"/>
    <ellipse cx="30.5" cy="56" rx="2.5" ry="1.5" fill="#ffffff" opacity="0.75"/>

    <!-- 3D Paintbrush Piercing Through -->
    <!-- Brush Handle -->
    <path d="M42 98 L88 44 L94 48 L48 102 Z" fill="#b91c1c"/>
    <path d="M44 99 L89 46" stroke="#fca5a5" stroke-width="1.5" opacity="0.7"/>
    <!-- Ferrule (Silver) -->
    <path d="M40 100 L48 102 L44 108 L36 106 Z" fill="url(#brush-handle)"/>
    <!-- Bristles & Wet Blue Paint Tip -->
    <path d="M36 106 L44 108 C40 114 36 116 32 114 C30 112 32 108 36 106 Z" fill="#1d4ed8"/>
    <circle cx="33" cy="113" r="1.5" fill="#93c5fd"/>
  </g>
</svg>
