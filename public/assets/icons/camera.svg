<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="cam-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#ec4899" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="cam-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="cam-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <radialGradient id="lens-grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>

  <g filter="url(#cam-shadow)">
    <!-- Shutter Button -->
    <rect x="30" y="24" width="16" height="8" rx="3" fill="#cbd5e1"/>
    <!-- Flash Unit -->
    <rect x="74" y="22" width="18" height="10" rx="3" fill="#fbcfe8"/>
    <circle cx="83" cy="27" r="3" fill="#fbbf24"/>

    <!-- Camera Body Top Plate -->
    <rect x="18" y="30" width="84" height="18" rx="8" fill="url(#cam-top)"/>

    <!-- Camera Main Body -->
    <rect x="18" y="40" width="84" height="56" rx="18" fill="url(#cam-body)"/>
    <rect x="18" y="40" width="84" height="10" fill="#f472b6" opacity="0.6"/>

    <!-- Grip Texture on Left -->
    <rect x="22" y="52" width="8" height="32" rx="4" fill="#9d174d" opacity="0.4"/>

    <!-- Camera Lens Assembly (Large Circular Glass Lens) -->
    <!-- Outer silver rim -->
    <circle cx="63" cy="67" r="25" fill="#f1f5f9"/>
    <!-- Middle dark ring -->
    <circle cx="63" cy="67" r="22" fill="#334155"/>
    <circle cx="63" cy="67" r="20" fill="#1e293b"/>
    <!-- Inner glass element -->
    <circle cx="63" cy="67" r="18" fill="url(#lens-grad)"/>
    
    <!-- Glass Specular Reflection Highlight -->
    <ellipse cx="58" cy="61" rx="8" ry="4" transform="rotate(-35 58 61)" fill="#ffffff" opacity="0.6"/>
    <circle cx="68" cy="74" r="2.5" fill="#38bdf8" opacity="0.7"/>

    <!-- Small Red Sensor / Viewfinder -->
    <circle cx="86" cy="48" r="3.5" fill="#ef4444"/>
  </g>
</svg>