<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="sh-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#1e40af" flood-opacity="0.38"/>
    </filter>
    <linearGradient id="sh-gold-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="sh-blue-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="sh-star-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <g filter="url(#sh-shadow)">
    <!-- 3D Shield Depth (Y+6) -->
    <path d="M22 28 C22 28 60 16 60 16 C60 16 98 28 98 28 C98 68 60 102 60 102 C60 102 22 68 22 28 Z" transform="translate(0, 6)" fill="#1e293b"/>

    <!-- Gold Beveled Outer Shield Border -->
    <path d="M22 26 C22 26 60 14 60 14 C60 14 98 26 98 26 C98 66 60 100 60 100 C60 100 22 66 22 26 Z" fill="url(#sh-gold-rim)"/>

    <!-- Inner Blue Shield Surface -->
    <path d="M28 32 C28 32 60 22 60 22 C60 22 92 32 92 32 C92 64 60 92 60 92 C60 92 28 64 28 32 Z" fill="url(#sh-blue-face)"/>

    <!-- Specular Light Sheen (Diagonal curved slash) -->
    <path d="M36 34 C44 32 54 30 60 30 L40 84 C34 72 30 54 36 34 Z" fill="#ffffff" opacity="0.35"/>

    <!-- Embossed 3D Star in Center -->
    <polygon points="60,38 64,50 77,50 67,58 71,70 60,63 49,70 53,58 43,50 56,50" transform="translate(0, 3)" fill="#b45309" opacity="0.4"/>
    <polygon points="60,38 64,50 77,50 67,58 71,70 60,63 49,70 53,58 43,50 56,50" fill="url(#sh-star-gold)"/>

    <!-- Star Top Rim Glint -->
    <polygon points="60,38 64,50 77,50 67,58 60,63" fill="#ffffff" opacity="0.5"/>

    <!-- Star Sparkle on Crest -->
    <polygon points="90,26 92,30 96,31 92,33 90,37 88,33 84,31 88,30" fill="#ffffff"/>
  </g>
</svg>