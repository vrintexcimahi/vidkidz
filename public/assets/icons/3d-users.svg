<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="usr-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#2563eb" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="bg-bubble-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="avatar-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="avatar-secondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <g filter="url(#usr-shadow)">
    <!-- Round Squircle Background -->
    <rect x="10" y="10" width="100" height="100" rx="30" fill="url(#bg-bubble-blue)"/>
    
    <!-- Secondary Avatar (Behind, right) -->
    <circle cx="76" cy="46" r="14" fill="url(#avatar-secondary)"/>
    <path d="M58 84 C58 72 68 64 80 64 C90 64 98 72 98 84 Z" fill="url(#avatar-secondary)"/>

    <!-- Primary Avatar (Front, left) -->
    <circle cx="48" cy="48" r="17" fill="url(#avatar-primary)"/>
    <path d="M26 92 C26 78 38 68 52 68 C64 68 76 78 76 92 Z" fill="url(#avatar-primary)"/>
    
    <!-- Specular rim highlight -->
    <circle cx="48" cy="46" r="14" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.6"/>
  </g>
</svg>