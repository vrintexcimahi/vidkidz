<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="gft-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#b45309" flood-opacity="0.38"/>
    </filter>
    <linearGradient id="gft-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="40%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="gft-lid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="60%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="gft-ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <g filter="url(#gft-shadow)">
    <!-- 3D Box Bottom Shadow Base -->
    <rect x="26" y="56" width="68" height="52" rx="14" fill="#881337"/>

    <!-- Main Gift Box Body -->
    <rect x="26" y="50" width="68" height="52" rx="14" fill="url(#gft-box)"/>

    <!-- Vertical Ribbon on Body -->
    <rect x="52" y="50" width="16" height="52" fill="url(#gft-ribbon)"/>
    <line x1="53" y1="50" x2="53" y2="102" stroke="#fffbeb" stroke-width="1.5" opacity="0.6"/>

    <!-- Gift Box Lid -->
    <rect x="20" y="38" width="80" height="18" rx="8" fill="url(#gft-lid)"/>
    <rect x="22" y="40" width="76" height="3" rx="1.5" fill="#ffffff" opacity="0.4"/>

    <!-- Vertical Ribbon on Lid -->
    <rect x="52" y="38" width="16" height="18" fill="url(#gft-ribbon)"/>

    <!-- Big 3D Bow Loops on Top -->
    <!-- Left Loop -->
    <path d="M54 38 C32 16 28 32 50 36 Z" fill="url(#gft-ribbon)"/>
    <path d="M52 36 C36 22 34 30 48 34 Z" fill="#92400e" opacity="0.5"/>
    <path d="M50 34 C36 20 40 18 52 32 Z" fill="#ffffff" opacity="0.6"/>

    <!-- Right Loop -->
    <path d="M66 38 C88 16 92 32 70 36 Z" fill="url(#gft-ribbon)"/>
    <path d="M68 36 C84 22 86 30 72 34 Z" fill="#92400e" opacity="0.5"/>
    <path d="M70 34 C84 20 80 18 68 32 Z" fill="#ffffff" opacity="0.6"/>

    <!-- Center Bow Knot -->
    <circle cx="60" cy="37" r="7" fill="url(#gft-ribbon)"/>
    <circle cx="58.5" cy="35.5" r="2" fill="#ffffff" opacity="0.8"/>

    <!-- Sparkles Around Gift -->
    <polygon points="98,30 100,34 104,35 100,37 98,41 96,37 92,35 96,34" fill="#fde047"/>
    <polygon points="18,48 19.5,51 23,52 19.5,53 18,56 16.5,53 13,52 16.5,51" fill="#fef08a"/>
  </g>
</svg>
