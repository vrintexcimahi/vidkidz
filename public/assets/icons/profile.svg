<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="pr-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#7c3aed" flood-opacity="0.35"/>
    </filter>
    <radialGradient id="pr-skin" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="60%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba86d"/>
    </radialGradient>
    <linearGradient id="pr-hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="50%" stop-color="#713f12"/>
      <stop offset="100%" stop-color="#3f2305"/>
    </linearGradient>
    <linearGradient id="pr-hoodie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <g filter="url(#pr-shadow)">
    <!-- Shoulders / Torso -->
    <path d="M22 108 C22 74 38 66 60 66 C82 66 98 74 98 108 Z" fill="url(#pr-hoodie)"/>
    <!-- Collar V-Neck / Strings -->
    <polygon points="60,70 52,82 68,82" fill="#ffedd5"/>
    <circle cx="54" cy="92" r="2" fill="#ffffff"/>
    <circle cx="66" cy="92" r="2" fill="#ffffff"/>

    <!-- Neck -->
    <rect x="52" y="52" width="16" height="18" rx="6" fill="#fba86d"/>

    <!-- Head -->
    <circle cx="60" cy="42" r="26" fill="url(#pr-skin)"/>

    <!-- Ears -->
    <circle cx="34" cy="42" r="6" fill="url(#pr-skin)"/>
    <circle cx="86" cy="42" r="6" fill="url(#pr-skin)"/>

    <!-- Stylish Pixar Hair -->
    <path d="M34 38 C34 16 86 16 86 38 C76 26 44 26 34 38 Z" fill="url(#pr-hair)"/>
    <!-- Hair Forelock Bangs -->
    <path d="M42 28 C54 22 70 24 78 34 C68 30 52 30 42 28 Z" fill="#a16207"/>

    <!-- Eyes -->
    <ellipse cx="50" cy="42" rx="3.5" ry="5" fill="#1e293b"/>
    <ellipse cx="70" cy="42" rx="3.5" ry="5" fill="#1e293b"/>
    <circle cx="48.5" cy="39.5" r="1.5" fill="#ffffff"/>
    <circle cx="68.5" cy="39.5" r="1.5" fill="#ffffff"/>

    <!-- Friendly Smile -->
    <path d="M52 52 Q60 60 68 52" fill="none" stroke="#9a3412" stroke-width="2.8" stroke-linecap="round"/>

    <!-- Rosy Cheeks -->
    <circle cx="43" cy="49" r="4.5" fill="#f43f5e" opacity="0.45"/>
    <circle cx="77" cy="49" r="4.5" fill="#f43f5e" opacity="0.45"/>
  </g>
</svg>