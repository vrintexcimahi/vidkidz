<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="msg-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#059669" flood-opacity="0.32"/>
    </filter>
    <linearGradient id="msg-bubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="msg-dot" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
  </defs>

  <g filter="url(#msg-shadow)">
    <!-- 3D Bubble Depth Extrusion -->
    <path d="M22 28 C22 18 32 12 58 12 C84 12 98 18 98 28 C98 52 84 66 58 66 C48 66 40 68 30 76 C32 68 30 64 26 60 C23 54 22 42 22 28 Z" transform="translate(0, 5) scale(1.1) translate(-5, 0)" fill="#064e3b" opacity="0.4"/>

    <!-- Main Bubble Body -->
    <path d="M18 52 C18 30 32 16 60 16 C88 16 102 30 102 52 C102 72 88 84 60 84 C50 84 42 86 28 98 C31 88 28 82 24 78 C20 72 18 62 18 52 Z" fill="url(#msg-bubble)"/>

    <!-- Glossy Specular Highlight on Top Edge -->
    <path d="M30 26 C42 20 78 20 90 26 C82 22 48 22 30 26 Z" fill="#ffffff" opacity="0.65"/>
    <ellipse cx="40" cy="28" rx="14" ry="4" transform="rotate(-10 40 28)" fill="#ffffff" opacity="0.5"/>

    <!-- Three 3D Floating Speech Dots -->
    <circle cx="42" cy="50" r="7" fill="url(#msg-dot)"/>
    <circle cx="60" cy="50" r="7" fill="url(#msg-dot)"/>
    <circle cx="78" cy="50" r="7" fill="url(#msg-dot)"/>

    <!-- Mini Star Sparkle -->
    <polygon points="98,18 100,22 104,23 100,25 98,29 96,25 92,23 96,22" fill="#fde047"/>
  </g>
</svg>