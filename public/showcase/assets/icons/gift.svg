<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="gf-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#be185d" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="gf-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="45%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
    <linearGradient id="gf-lid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="40%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="gf-ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <g filter="url(#gf-shadow)">
    <!-- Main Box Body -->
    <rect x="24" y="52" width="72" height="52" rx="12" fill="url(#gf-box)"/>

    <!-- Vertical Ribbon on Body -->
    <rect x="52" y="52" width="16" height="52" fill="url(#gf-ribbon)"/>
    <rect x="54" y="52" width="4" height="52" fill="#ffffff" opacity="0.4"/>

    <!-- Horizontal Ribbon on Body -->
    <rect x="24" y="72" width="72" height="14" fill="url(#gf-ribbon)"/>
    <rect x="24" y="74" width="72" height="3" fill="#ffffff" opacity="0.4"/>

    <!-- Box Lid (Overhanging) -->
    <rect x="20" y="42" width="80" height="18" rx="8" fill="url(#gf-lid)"/>
    <!-- Lid Vertical Ribbon -->
    <rect x="52" y="42" width="16" height="18" fill="url(#gf-ribbon)"/>
    <rect x="54" y="42" width="4" height="18" fill="#ffffff" opacity="0.4"/>

    <!-- Specular Highlight on Lid -->
    <rect x="24" y="44" width="72" height="4" rx="2" fill="#ffffff" opacity="0.5"/>

    <!-- Big Fluffy Golden Bow on Top -->
    <!-- Left Loop -->
    <path d="M56 42 C40 24 28 28 34 38 C38 44 48 43 56 42 Z" fill="url(#gf-ribbon)"/>
    <path d="M52 40 C42 28 36 30 40 36 C42 40 48 40 52 40 Z" fill="#b45309" opacity="0.5"/>

    <!-- Right Loop -->
    <path d="M64 42 C80 24 92 28 86 38 C82 44 72 43 64 42 Z" fill="url(#gf-ribbon)"/>
    <path d="M68 40 C78 28 84 30 80 36 C78 40 72 40 68 40 Z" fill="#b45309" opacity="0.5"/>

    <!-- Bow Center Knot -->
    <circle cx="60" cy="42" r="8" fill="url(#gf-ribbon)"/>
    <circle cx="58" cy="40" r="3" fill="#ffffff" opacity="0.7"/>

    <!-- Sparkles -->
    <polygon points="98,28 100,32 104,33 100,35 98,39 96,35 92,33 96,32" fill="#fde047"/>
    <polygon points="20,32 21.5,35 24.5,36 21.5,37 20,40 18.5,37 15.5,36 18.5,35" fill="#ffffff"/>
  </g>
</svg>