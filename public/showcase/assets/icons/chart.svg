<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="ch-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#059669" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="ch-bar1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="ch-bar2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="ch-bar3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="ch-arrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <g filter="url(#ch-shadow)">
    <!-- Base Platform -->
    <rect x="14" y="96" width="92" height="12" rx="6" fill="#1e293b"/>
    <rect x="14" y="94" width="92" height="6" rx="3" fill="#334155"/>

    <!-- Bar 1 (Coral - Left, Height: 36) -->
    <rect x="22" y="62" width="22" height="34" rx="7" fill="url(#ch-bar1)"/>
    <ellipse cx="33" cy="62" rx="11" ry="5" fill="#fda4af"/>
    <!-- Specular highlight streak -->
    <line x1="26" y1="67" x2="26" y2="88" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.55"/>

    <!-- Bar 2 (Gold - Middle, Height: 52) -->
    <rect x="49" y="46" width="22" height="50" rx="7" fill="url(#ch-bar2)"/>
    <ellipse cx="60" cy="46" rx="11" ry="5" fill="#fef08a"/>
    <line x1="53" y1="51" x2="53" y2="88" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Bar 3 (Emerald - Right, Height: 70) -->
    <rect x="76" y="28" width="22" height="68" rx="7" fill="url(#ch-bar3)"/>
    <ellipse cx="87" cy="28" rx="11" ry="5" fill="#a7f3d0"/>
    <line x1="80" y1="33" x2="80" y2="88" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.65"/>

    <!-- Dynamic 3D Upward Trend Arrow -->
    <path d="M20 74 Q56 50 86 20" fill="none" stroke="#b45309" stroke-width="6" stroke-linecap="round"/>
    <path d="M20 72 Q56 48 86 18" fill="none" stroke="url(#ch-arrow)" stroke-width="5" stroke-linecap="round"/>
    <!-- Arrow Head -->
    <polygon points="82,10 98,16 92,32 87,24" fill="url(#ch-arrow)"/>

    <!-- Star at peak -->
    <polygon points="100,8 102,12 106,13 102,15 100,19 98,15 94,13 98,12" fill="#fde047"/>
  </g>
</svg>