<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="tgt-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#e11d48" flood-opacity="0.38"/>
    </filter>
    <radialGradient id="tgt-red" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="25%" stop-color="#f43f5e"/>
      <stop offset="70%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </radialGradient>
    <radialGradient id="tgt-white" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <linearGradient id="tgt-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="tgt-dart-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="tgt-dart-feather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <g filter="url(#tgt-shadow)">
    <!-- 3D Base Thickness Rim -->
    <ellipse cx="60" cy="66" rx="50" ry="50" fill="#9f1239"/>
    <ellipse cx="60" cy="63" rx="50" ry="50" fill="#be123c"/>

    <!-- Outer Gold Rim -->
    <circle cx="60" cy="58" r="50" fill="url(#tgt-rim)"/>
    
    <!-- Outer Red Ring -->
    <circle cx="60" cy="58" r="46" fill="url(#tgt-red)"/>
    
    <!-- Outer White Ring -->
    <circle cx="60" cy="58" r="35" fill="url(#tgt-white)"/>
    
    <!-- Inner Red Ring -->
    <circle cx="60" cy="58" r="24" fill="url(#tgt-red)"/>
    
    <!-- Inner Bullseye Yellow/Gold -->
    <circle cx="60" cy="58" r="13" fill="url(#tgt-white)"/>
    <circle cx="60" cy="58" r="8" fill="url(#tgt-red)"/>
    
    <!-- Glossy Specular Arch -->
    <path d="M22 45 C32 25 55 16 80 18 C64 16 38 23 28 42 Z" fill="#ffffff" opacity="0.6"/>

    <!-- 3D Dart Arrow Piercing Bullseye -->
    <!-- Dart Tip Shadow -->
    <ellipse cx="62" cy="60" rx="3" ry="2" fill="#000000" opacity="0.4"/>
    
    <!-- Dart Shaft -->
    <path d="M59 57 L88 28 L92 32 L63 61 Z" fill="url(#tgt-dart-body)"/>
    <line x1="60" y1="58" x2="89" y2="29" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
    
    <!-- Dart Flights / Feathers -->
    <path d="M86 30 L98 14 L103 21 L91 35 Z" fill="url(#tgt-dart-feather)"/>
    <path d="M89 27 L95 11 L108 18 L95 31 Z" fill="#f59e0b"/>
    <path d="M91 32 L106 28 L102 38 L88 34 Z" fill="#e11d48"/>

    <!-- Sparkle Stars -->
    <polygon points="30,24 32,28 36,29 32,31 30,35 28,31 24,29 28,28" fill="#ffffff" opacity="0.9"/>
    <polygon points="96,62 97.5,65 101,66 97.5,67 96,70 94.5,67 91,66 94.5,65" fill="#fde047"/>
  </g>
</svg>
