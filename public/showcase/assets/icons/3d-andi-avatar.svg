<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="andi-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="andi-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="andi-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
  </defs>
  <g filter="url(#andi-shadow)">
    <!-- Circular Background -->
    <circle cx="60" cy="60" r="54" fill="url(#andi-bg)"/>
    <circle cx="60" cy="60" r="52" fill="none" stroke="#38bdf8" stroke-width="3"/>

    <!-- Shirt / Collar -->
    <path d="M30 108 C30 90 44 82 60 82 C76 82 90 90 90 108 Z" fill="#2563eb"/>
    <polygon points="60,82 52,94 60,102 68,94" fill="#ffffff"/>

    <!-- Head -->
    <ellipse cx="60" cy="58" rx="26" ry="28" fill="#ffedd5"/>
    
    <!-- Hair -->
    <path d="M34 52 C32 32 46 24 60 24 C74 24 88 32 86 52 C82 40 76 38 70 42 C64 36 56 38 52 42 C46 38 38 42 34 52 Z" fill="#1e293b"/>
    
    <!-- Ears -->
    <circle cx="34" cy="58" r="6" fill="#fed7aa"/>
    <circle cx="86" cy="58" r="6" fill="#fed7aa"/>

    <!-- Eyes (Big Sparkling) -->
    <ellipse cx="49" cy="56" rx="4.5" ry="5.5" fill="#0f172a"/>
    <circle cx="47.5" cy="54" r="2" fill="#ffffff"/>
    <ellipse cx="71" cy="56" rx="4.5" ry="5.5" fill="#0f172a"/>
    <circle cx="69.5" cy="54" r="2" fill="#ffffff"/>

    <!-- Smile & Rosy Cheeks -->
    <path d="M52 67 Q60 76 68 67" fill="none" stroke="#991b1b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="43" cy="64" r="4.5" fill="#f43f5e" opacity="0.35"/>
    <circle cx="77" cy="64" r="4.5" fill="#f43f5e" opacity="0.35"/>
  </g>
</svg>