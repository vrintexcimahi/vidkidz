<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="pal-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#92400e" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="pal-wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="pal-brush" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="pal-ferrule" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <g filter="url(#pal-shadow)">
    <!-- Palette 3D Depth Layer (Y+5) -->
    <path d="M24 60 C16 38 34 16 66 16 C96 16 108 36 106 62 C104 84 88 102 62 102 C44 102 46 86 38 86 C30 86 32 82 24 60 Z" transform="translate(0, 5)" fill="#78350f"/>

    <!-- Palette Wood Body -->
    <path d="M24 60 C16 38 34 16 66 16 C96 16 108 36 106 62 C104 84 88 102 62 102 C44 102 46 86 38 86 C30 86 32 82 24 60 Z" fill="url(#pal-wood)"/>

    <!-- Thumbhole -->
    <ellipse cx="44" cy="74" rx="9" ry="12" transform="rotate(-20 44 74)" fill="#78350f"/>
    <ellipse cx="44" cy="73" rx="8" ry="11" transform="rotate(-20 44 73)" fill="#fef08a"/>
    <ellipse cx="44" cy="73" rx="7" ry="10" transform="rotate(-20 44 73)" fill="#451a03" opacity="0.8"/>

    <!-- 5 Plump 3D Paint Blobs -->
    <!-- Blob 1: Red -->
    <circle cx="42" cy="34" r="8.5" fill="#ef4444"/>
    <ellipse cx="40" cy="32" rx="3.5" ry="2" fill="#ffffff" opacity="0.6"/>

    <!-- Blob 2: Yellow -->
    <circle cx="64" cy="26" r="8.5" fill="#fde047"/>
    <ellipse cx="62" cy="24" rx="3.5" ry="2" fill="#ffffff" opacity="0.7"/>

    <!-- Blob 3: Blue -->
    <circle cx="86" cy="36" r="8.5" fill="#3b82f6"/>
    <ellipse cx="84" cy="34" rx="3.5" ry="2" fill="#ffffff" opacity="0.6"/>

    <!-- Blob 4: Green -->
    <circle cx="94" cy="58" r="8.5" fill="#10b981"/>
    <ellipse cx="92" cy="56" rx="3.5" ry="2" fill="#ffffff" opacity="0.6"/>

    <!-- Blob 5: Purple -->
    <circle cx="82" cy="80" r="8.5" fill="#a855f7"/>
    <ellipse cx="80" cy="78" rx="3.5" ry="2" fill="#ffffff" opacity="0.6"/>

    <!-- Paintbrush angled across palette -->
    <!-- Wooden Handle -->
    <path d="M12 108 L54 62 L60 67 L17 113 Z" fill="url(#pal-brush)"/>
    <!-- Silver Ferrule -->
    <path d="M54 62 L62 53 L68 58 L60 67 Z" fill="url(#pal-ferrule)"/>
    <!-- Bristles & Wet Blue Tip -->
    <path d="M62 53 C64 50 72 42 78 40 C76 46 72 54 68 58 Z" fill="#1e293b"/>
    <path d="M72 44 C74 42 78 40 78 40 C76 46 75 48 72 44 Z" fill="#38bdf8"/>
  </g>
</svg>