<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="cb-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#312e81" flood-opacity="0.38"/>
    </filter>
    <linearGradient id="cb-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cb-stripe-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cb-stripe-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="cb-hinge" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="80%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <linearGradient id="cb-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <g filter="url(#cb-shadow)">
    <!-- 3D Board Depth Layer (Y+6) -->
    <rect x="20" y="52" width="80" height="54" rx="12" fill="#020617"/>

    <!-- Main Clapper Body (Slate) -->
    <rect x="20" y="46" width="80" height="54" rx="12" fill="url(#cb-body)"/>

    <!-- Slate Chalk Lines -->
    <rect x="28" y="54" width="28" height="18" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="32" y="66" font-family="Arial, sans-serif" font-weight="900" font-size="8" fill="#94a3b8">SCENE</text>
    <text x="32" y="74" font-family="Arial, sans-serif" font-weight="900" font-size="7" fill="#38bdf8">01</text>

    <rect x="60" y="54" width="32" height="18" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="64" y="66" font-family="Arial, sans-serif" font-weight="900" font-size="8" fill="#94a3b8">TAKE</text>
    <text x="64" y="74" font-family="Arial, sans-serif" font-weight="900" font-size="7" fill="#4ade80">03</text>

    <!-- Center Film Emblem / Star on Lower Slate -->
    <circle cx="60" cy="85" r="8" fill="#1e293b"/>
    <polygon points="60,79 62,83 67,83 63,86 65,90 60,88 55,90 57,86 53,83 58,83" fill="url(#cb-star)"/>

    <!-- Top Fixed Clapper Bar -->
    <g transform="translate(20, 36)">
      <rect x="0" y="0" width="80" height="14" rx="4" fill="url(#cb-stripe-dark)"/>
      <!-- Diagonal White Stripes -->
      <polygon points="12,0 24,0 16,14 4,14" fill="url(#cb-stripe-light)"/>
      <polygon points="36,0 48,0 40,14 28,14" fill="url(#cb-stripe-light)"/>
      <polygon points="60,0 72,0 64,14 52,14" fill="url(#cb-stripe-light)"/>
      <!-- Top edge specular gloss -->
      <line x1="2" y1="1" x2="78" y2="1" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- Angled Clapper Top Arm (Opened at 18 degrees) -->
    <g transform="rotate(-18 24 38)">
      <rect x="20" y="24" width="80" height="14" rx="4" fill="url(#cb-stripe-dark)"/>
      <!-- Diagonal White Stripes -->
      <polygon points="32,24 44,24 36,38 24,38" fill="url(#cb-stripe-light)"/>
      <polygon points="56,24 68,24 60,38 48,38" fill="url(#cb-stripe-light)"/>
      <polygon points="80,24 92,24 84,38 72,38" fill="url(#cb-stripe-light)"/>
      <!-- Highlight -->
      <line x1="22" y1="25" x2="98" y2="25" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
    </g>

    <!-- Metallic Chrome Hinge Bolt -->
    <circle cx="25" cy="38" r="6.5" fill="url(#cb-hinge)"/>
    <circle cx="25" cy="38" r="3" fill="#0f172a"/>
    <circle cx="24" cy="37" r="1.2" fill="#ffffff"/>

    <!-- Sparkles -->
    <polygon points="102,18 104,22 108,23 104,25 102,29 100,25 96,23 100,22" fill="#fde047"/>
    <polygon points="12,48 13.5,51 16.5,52 13.5,53 12,56 10.5,53 7.5,52 10.5,51" fill="#ffffff"/>
  </g>
</svg>
