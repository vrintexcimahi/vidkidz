<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="ph-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#4338ca" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="ph-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="ph-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="ph-call" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <g filter="url(#ph-shadow)">
    <!-- 3D Phone Depth (Y+6) -->
    <rect x="32" y="18" width="56" height="92" rx="18" fill="#1e1b4b"/>

    <!-- Phone Casing -->
    <rect x="32" y="14" width="56" height="92" rx="18" fill="url(#ph-body)"/>
    <rect x="34" y="16" width="52" height="6" rx="3" fill="#a5b4fc" opacity="0.6"/>

    <!-- Glass Screen -->
    <rect x="38" y="24" width="44" height="72" rx="10" fill="url(#ph-screen)"/>

    <!-- Screen Diagonal Glare -->
    <path d="M40 26 L76 26 L48 94 L40 94 Z" fill="#ffffff" opacity="0.08"/>

    <!-- Speaker Bar & Camera -->
    <rect x="52" y="18" width="16" height="3" rx="1.5" fill="#312e81"/>
    <circle cx="45" cy="19.5" r="1.5" fill="#312e81"/>

    <!-- Calling Wave Glow Disc -->
    <circle cx="60" cy="60" r="16" fill="url(#ph-call)"/>
    <circle cx="60" cy="60" r="15" fill="none" stroke="#86efac" stroke-width="1.5" opacity="0.6"/>

    <!-- Phone Receiver Icon Inside Screen -->
    <path d="M53 53 C52 56 54 62 60 67 C65 72 71 74 74 73 L71 68 C70 67 68 67 67 68 L66 69 C63 67 61 65 59 62 L60 61 C61 60 61 58 60 57 Z" fill="#ffffff" transform="translate(1, -2)"/>

    <!-- Sound Wave Arcs Floating Beside Phone -->
    <path d="M94 44 C99 52 99 68 94 76" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M102 38 C109 50 109 70 102 82" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Mini Sparkle -->
    <polygon points="24,34 26,38 30,39 26,41 24,45 22,41 18,39 22,38" fill="#fde047"/>
  </g>
</svg>