<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="sb-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#7c3aed" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="book-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6584"/>
      <stop offset="70%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="book-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="book-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="70%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="pages-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="gold-ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <g filter="url(#sb-shadow)">
    <!-- BOTTOM BOOK (Blue) -->
    <rect x="18" y="72" width="84" height="22" rx="6" fill="url(#book-blue)"/>
    <path d="M26 75 h72 v16 h-72 z" fill="url(#pages-grad)"/>
    <line x1="30" y1="79" x2="94" y2="79" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="30" y1="83" x2="94" y2="83" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="30" y1="87" x2="94" y2="87" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Spine curve -->
    <rect x="18" y="72" width="10" height="22" rx="4" fill="#1e40af"/>

    <!-- MIDDLE BOOK (Green) -->
    <g transform="rotate(-4 60 55)">
      <rect x="22" y="47" width="80" height="21" rx="6" fill="url(#book-green)"/>
      <path d="M30 50 h68 v15 h-68 z" fill="url(#pages-grad)"/>
      <line x1="34" y1="54" x2="94" y2="54" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="34" y1="58" x2="94" y2="58" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="34" y1="62" x2="94" y2="62" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
      <rect x="22" y="47" width="10" height="21" rx="4" fill="#047857"/>
    </g>

    <!-- TOP BOOK (Red/Pink) -->
    <g transform="rotate(3 60 32)">
      <rect x="24" y="24" width="76" height="20" rx="6" fill="url(#book-red)"/>
      <path d="M32 27 h64 v14 h-64 z" fill="url(#pages-grad)"/>
      <line x1="36" y1="31" x2="92" y2="31" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="36" y1="35" x2="92" y2="35" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
      <rect x="24" y="24" width="10" height="20" rx="4" fill="#be123c"/>
      <!-- Gold Bookmark ribbon -->
      <path d="M78 24 v26 l-5 -4 l-5 4 v-26 z" fill="url(#gold-ribbon)"/>
    </g>

    <!-- Sparkles -->
    <polygon points="102,20 104,24 108,26 104,28 102,32 100,28 96,26 100,24" fill="#fbbf24"/>
    <polygon points="14,48 15,51 18,52 15,53 14,56 13,53 10,52 13,51" fill="#f472b6"/>
  </g>
</svg>