<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="pl-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.38"/>
    </filter>
    <linearGradient id="pl-disc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="pl-triangle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="pl-disc-shine" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g filter="url(#pl-shadow)">
    <!-- 3D Disc Depth Extrusion (Y+6) -->
    <ellipse cx="60" cy="66" rx="46" ry="46" fill="#0c4a6e"/>

    <!-- Main Disc Face -->
    <circle cx="60" cy="60" r="46" fill="url(#pl-disc)"/>
    <!-- Outer Specular Ring Rim -->
    <circle cx="60" cy="60" r="44" fill="none" stroke="#7dd3fc" stroke-width="2" opacity="0.7"/>

    <!-- Glass Specular Dome Shine -->
    <circle cx="60" cy="60" r="46" fill="url(#pl-disc-shine)"/>

    <!-- Raised 3D Play Triangle (with rounded points) -->
    <!-- Shadow under triangle -->
    <path d="M48 39 C48 36 52 34 55 36 L87 56 C90 58 90 62 87 64 L55 84 C52 86 48 84 48 81 Z" transform="translate(0, 4)" fill="#0f172a" opacity="0.4"/>

    <!-- Triangle Body -->
    <path d="M48 39 C48 36 52 34 55 36 L87 56 C90 58 90 62 87 64 L55 84 C52 86 48 84 48 81 Z" fill="url(#pl-triangle)"/>

    <!-- Triangle Top Highlight Bevel -->
    <path d="M48 40 L55 36 L87 56" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- Flare Sparkle -->
    <polygon points="34,36 36,40 40,41 36,43 34,47 32,43 28,41 32,40" fill="#ffffff" opacity="0.85"/>
  </g>
</svg>