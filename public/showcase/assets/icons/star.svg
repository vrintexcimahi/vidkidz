<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="sr-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.42"/>
    </filter>
    <linearGradient id="sr-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="sr-side" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <g filter="url(#sr-shadow)">
    <!-- 3D Star Depth Base (Shifted Y+6) -->
    <path d="M60 16 C61 16 63 18 64 21 L74 44 C75 46 77 47 79 48 L104 50 C107 50 109 53 107 55 L88 71 C86 73 85 75 86 77 L92 101 C93 104 90 106 88 104 L62 90 C60 89 58 89 56 90 L30 104 C28 106 25 104 26 101 L32 77 C33 75 32 73 30 71 L11 55 C9 53 11 50 14 50 L39 48 C41 47 43 46 44 44 L54 21 C55 18 57 16 60 16 Z" transform="translate(0, 6)" fill="url(#sr-side)"/>

    <!-- Star Main Front Face -->
    <path d="M60 16 C61 16 63 18 64 21 L74 44 C75 46 77 47 79 48 L104 50 C107 50 109 53 107 55 L88 71 C86 73 85 75 86 77 L92 101 C93 104 90 106 88 104 L62 90 C60 89 58 89 56 90 L30 104 C28 106 25 104 26 101 L32 77 C33 75 32 73 30 71 L11 55 C9 53 11 50 14 50 L39 48 C41 47 43 46 44 44 L54 21 C55 18 57 16 60 16 Z" fill="url(#sr-gold)"/>

    <!-- Specular Highlight Curve on Top Point -->
    <path d="M60 18 L73 44 C74 46 76 47 78 47 L98 49 C90 44 72 30 60 18 Z" fill="#ffffff" opacity="0.6"/>

    <!-- Cute Pixar Oval Eyes -->
    <ellipse cx="51" cy="62" rx="4.5" ry="8" fill="#1e293b"/>
    <ellipse cx="69" cy="62" rx="4.5" ry="8" fill="#1e293b"/>
    <!-- Catchlights -->
    <circle cx="49.5" cy="58" r="2.2" fill="#ffffff"/>
    <circle cx="52" cy="65" r="1.2" fill="#ffffff"/>
    <circle cx="67.5" cy="58" r="2.2" fill="#ffffff"/>
    <circle cx="70" cy="65" r="1.2" fill="#ffffff"/>

    <!-- Rosy Cheeks -->
    <circle cx="41" cy="71" r="4.5" fill="#f43f5e" opacity="0.45"/>
    <circle cx="79" cy="71" r="4.5" fill="#f43f5e" opacity="0.45"/>

    <!-- Star Twinkle -->
    <polygon points="98,28 100,32 104,33 100,35 98,39 96,35 92,33 96,32" fill="#ffffff"/>
  </g>
