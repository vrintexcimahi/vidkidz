<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="flm-shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#ea580c" flood-opacity="0.5"/>
    </filter>
    <!-- Outer Red Flame -->
    <linearGradient id="flm-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <!-- Mid Orange Flame -->
    <linearGradient id="flm-orange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <!-- Inner Yellow Core -->
    <linearGradient id="flm-yellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <!-- 3D Base Thickness -->
    <linearGradient id="flm-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
  </defs>

  <g filter="url(#flm-shadow)">
    <!-- 3D Flame Depth Offset Base -->
    <path d="M60 14 C65 26 80 44 86 58 C93 72 94 86 86 98 C78 108 66 112 56 112 C42 112 30 104 26 90 C22 76 29 64 36 54 C38 51 40 48 39 44 C38 38 32 36 30 30 C38 32 46 38 48 46 C52 36 55 24 60 14 Z" transform="translate(0, 6)" fill="url(#flm-base)"/>

    <!-- Outer Flame Body (Vibrant Red-Orange) -->
    <path d="M60 14 C65 26 80 44 86 58 C93 72 94 86 86 98 C78 108 66 112 56 112 C42 112 30 104 26 90 C22 76 29 64 36 54 C38 51 40 48 39 44 C38 38 32 36 30 30 C38 32 46 38 48 46 C52 36 55 24 60 14 Z" fill="url(#flm-red)"/>

    <!-- Middle Flame (Bright Orange-Gold) -->
    <path d="M60 38 C64 46 76 58 78 70 C80 82 74 92 65 98 C56 103 48 101 42 94 C36 86 38 76 44 68 C46 64 47 60 46 56 C44 50 40 48 38 44 C44 46 50 50 51 56 C54 48 57 42 60 38 Z" fill="url(#flm-orange)"/>

    <!-- Inner Core Flame (Blazing Yellow & White) -->
    <path d="M58 58 C62 64 68 72 68 80 C68 88 64 94 58 97 C52 100 47 98 44 93 C40 87 42 80 46 74 C47 71 48 68 47 65 C48 68 52 70 52 74 C54 68 56 62 58 58 Z" fill="url(#flm-yellow)"/>

    <!-- Glossy Specular Catchlight Curves -->
    <path d="M36 60 C32 70 32 82 38 90 C34 82 35 72 40 64 Z" fill="#ffffff" opacity="0.6"/>
    <ellipse cx="50" cy="88" rx="6" ry="8" fill="#ffffff" opacity="0.35"/>

    <!-- Cute Pixar Sparks -->
    <circle cx="28" cy="40" r="3" fill="#fde047"/>
    <circle cx="88" cy="48" r="3.5" fill="#facc15"/>
    <circle cx="78" cy="28" r="2.5" fill="#f97316"/>
    <polygon points="86,34 87.5,37 91,38 87.5,39 86,42 84.5,39 81,38 84.5,37" fill="#ffffff"/>
  </g>
</svg>
