<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="sm-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#059669" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="bg-bubble-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="smile-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <g filter="url(#sm-shadow)">
    <rect x="10" y="10" width="100" height="100" rx="30" fill="url(#bg-bubble-green)"/>
    <circle cx="60" cy="60" r="32" fill="url(#smile-grad)"/>
    
    <!-- Eyes -->
    <circle cx="48" cy="54" r="4.5" fill="#ffffff"/>
    <circle cx="72" cy="54" r="4.5" fill="#ffffff"/>
    <!-- Cheerful Smile Curve -->
    <path d="M46 68 Q60 82 74 68" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="41" cy="64" r="3.5" fill="#f43f5e" opacity="0.5"/>
    <circle cx="79" cy="64" r="3.5" fill="#f43f5e" opacity="0.5"/>
  </g>
</svg>