<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🖥️ SERVER PC — Localhost Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080c14;
    --bg2: #0d1420;
    --bg3: #111927;
    --card: #131c2b;
    --card-hover: #1a253a;
    --border: rgba(255,255,255,0.06);
    --border-hover: rgba(99,179,255,0.25);
    --text: #e8f0fe;
    --text-muted: #6b82a6;
    --text-dim: #3d5273;
    --accent: #3b82f6;
    --accent2: #8b5cf6;
    --accent3: #06b6d4;
    --green: #10b981;
    --yellow: #f59e0b;
    --red: #ef4444;
    --orange: #f97316;
    --pink: #ec4899;
    --glow: rgba(59,130,246,0.15);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background mesh */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% -10%, rgba(59,130,246,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 110%, rgba(139,92,246,0.07) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 50% 50%, rgba(6,182,212,0.04) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 0 24px; }

  /* ─── Header ─── */
  header {
    padding: 40px 0 28px;
    border-bottom: 1px solid var(--border);
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-icon {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, #1e3a5f, #0f2040);
    border: 1px solid rgba(59,130,246,0.3);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    box-shadow: 0 0 20px rgba(59,130,246,0.15);
  }

  .brand-title {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .brand-sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
    font-weight: 400;
    letter-spacing: 0.3px;
  }

  .header-meta {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(16,185,129,0.1);
    border: 1px solid rgba(16,185,129,0.25);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    color: var(--green);
    letter-spacing: 0.5px;
  }

  .live-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse-dot 1.5s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .time-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
    background: var(--bg3);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 999px;
  }

  /* ─── Stats Bar ─── */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin: 28px 0;
  }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    transition: border-color 0.2s, transform 0.2s;
  }

  .stat-card:hover {
    border-color: var(--border-hover);
    transform: translateY(-1px);
  }

  .stat-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .stat-value {
    font-size: 28px;
    font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }

  .stat-value.green { background: linear-gradient(135deg, #10b981, #34d399); -webkit-background-clip: text; background-clip: text; }
  .stat-value.red { background: linear-gradient(135deg, #ef4444, #f87171); -webkit-background-clip: text; background-clip: text; }
  .stat-value.yellow { background: linear-gradient(135deg, #f59e0b, #fbbf24); -webkit-background-clip: text; background-clip: text; }

  /* ─── Toolbar ─── */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .section-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
  }

  .btn-refresh {
    display: flex;
    align-items: center;
    gap: 7px;
    background: linear-gradient(135deg, #1d4ed8, #7c3aed);
    border: none;
    color: white;
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
    font-family: 'Inter', sans-serif;
  }

  .btn-refresh:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-refresh:active { transform: translateY(0); }
  .btn-refresh.loading { opacity: 0.6; pointer-events: none; }

  .refresh-icon { transition: transform 0.4s; }
  .btn-refresh.loading .refresh-icon { animation: spin 0.8s linear infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── Category Headers ─── */
  .category {
    margin-bottom: 32px;
  }

  .cat-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .cat-icon {
    width: 28px; height: 28px;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }

  .cat-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
  }

  .cat-count {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 9px;
    margin-left: auto;
  }

  /* ─── Service Grid ─── */
  .service-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }

  .service-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    text-decoration: none;
    color: inherit;
    display: block;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    cursor: pointer;
  }

  .service-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--card-accent, linear-gradient(90deg, #3b82f6, #8b5cf6));
    opacity: 0;
    transition: opacity 0.2s;
  }

  .service-card:hover {
    border-color: var(--border-hover);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(59,130,246,0.1);
  }

  .service-card:hover::before { opacity: 1; }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .card-icon-wrap {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.3px;
    transition: all 0.3s;
  }

  .status-pill.checking { background: rgba(107,130,166,0.15); color: var(--text-muted); }
  .status-pill.online { background: rgba(16,185,129,0.15); color: var(--green); border: 1px solid rgba(16,185,129,0.2); }
  .status-pill.offline { background: rgba(239,68,68,0.12); color: var(--red); border: 1px solid rgba(239,68,68,0.15); }
  .status-pill.unknown { background: rgba(245,158,11,0.12); color: var(--yellow); border: 1px solid rgba(245,158,11,0.15); }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  .status-pill.online .status-dot { animation: pulse-dot 1.5s ease-in-out infinite; }

  .card-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-desc {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 12px;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .port-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent3);
    background: rgba(6,182,212,0.08);
    border: 1px solid rgba(6,182,212,0.15);
    padding: 3px 10px;
    border-radius: 6px;
  }

  .open-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .service-card:hover .open-btn { opacity: 1; }

  .ping-time {
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-dim);
    margin-top: 6px;
    transition: color 0.3s;
  }

  .ping-time.fast { color: var(--green); }
  .ping-time.slow { color: var(--yellow); }

  /* ─── Footer ─── */
  footer {
    border-top: 1px solid var(--border);
    padding: 24px 0 40px;
    margin-top: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .footer-text {
    font-size: 12px;
    color: var(--text-dim);
  }

  .footer-text strong { color: var(--text-muted); }

  .kbd {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 7px;
    color: var(--text-muted);
  }

  /* ─── Toast ─── */
  #toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--card);
    border: 1px solid var(--border-hover);
    color: var(--text);
    padding: 11px 20px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    z-index: 100;
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
    white-space: nowrap;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  #toast.show { transform: translateX(-50%) translateY(0); }

  /* ─── Skeleton ─── */
  @keyframes shimmer {
    0% { background-position: -400px 0; }
    100% { background-position: 400px 0; }
  }

  .shimmer {
    background: linear-gradient(90deg, var(--bg3) 0%, var(--card-hover) 50%, var(--bg3) 100%);
    background-size: 800px 100%;
    animation: shimmer 1.5s infinite linear;
    border-radius: 4px;
  }

  /* ─── Search ─── */
  .search-wrap {
    position: relative;
  }

  .search-input {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 14px 9px 38px;
    border-radius: 8px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    width: 220px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .search-input:focus {
    border-color: rgba(59,130,246,0.4);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.08);
  }

  .search-icon {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    pointer-events: none;
  }

  .hidden { display: none !important; }

  @media (max-width: 640px) {
    .service-grid { grid-template-columns: 1fr; }
    .header-inner { flex-direction: column; align-items: flex-start; }
    .stats-bar { grid-template-columns: repeat(2, 1fr); }
    .search-input { width: 100%; }
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- Header -->
  <header>
    <div class="header-inner">
      <div class="brand">

  <div class="toolbar">

      <div class="search-wrap">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="search-input" type="text" id="search" placeholder="Cari service..." oninput="filterCards()">
      </div>

        Refresh Status
      </button>
    </div>
  </div>

  <!-- Cards container -->
  <div id="main-content"></div>

  <footer class="wrap">
    <div class="footer-text">
      <strong>SERVER PC</strong> · Auto-check setiap 30 detik · <span id="next-check">—</span>
    </div>
    <div class="footer-text">
      Tekan <kbd class="kbd">R</kbd> untuk refresh · Klik kartu untuk buka service
    </div>
  </footer>

</div>

<div id="toast"></div>

<script>
// ─────────────────────────────────────────────────────────────
// Service Definitions
// ─────────────────────────────────────────────────────────────
const SERVICES = [
  // ── Dev Apps ──────────────────────────────────────────────
  {
    id: 'vrintexcorp',
    port: 3000,
    name: 'VRINTEXCORP',
    desc: 'Website utama VRINTEXCORP — landing page, produk & POS',
    icon: '🏢',

  {

  {

  },
  {

  },
  {

    category: 'ai',
    path: '/'
  },
  {
    id: 'mcp',
    port: 3101,
    name: 'Terminator MCP',

    bg: 'rgba(249,115,22,0.1)',

    path: '/'
  },
  {
    id: 'vite-hmr1',
    port: 24678,
    name: 'Vite HMR',
    desc: 'Hot Module Replacement WebSocket — VRINTEXCORP dev',

    color: '#a78bfa',
    gradient: 'linear-gradient(135deg,#7c3aed,#a78bfa)',
    bg: 'rgba(167,139,250,0.1)',
    category: 'tools',
    path: '/',
    noOpen: true
  },
  {
    id: 'ssh',
    port: 22,
    name: 'SSH Server',
    desc: 'OpenSSH — akses remote terminal ke SERVER PC',
    icon: '🔐',
    color: '#6b82a6',
    gradient: 'linear-gradient(135deg,#475569,#6b82a6)',
    bg: 'rgba(107,130,166,0.1)',
    category: 'system',
    noOpen: true
  },
  {
    id: 'rdp',
    port: 3389,
    name: 'Remote Desktop (RDP)',
    desc: 'Windows Remote Desktop Protocol — akses desktop jarak jauh',
    icon: '🖥️',
    color: '#6b82a6',
    gradient: 'linear-gradient(135deg,#475569,#6b82a6)',

  {

    port: 53,
    name: 'Warp DNS',
    desc: 'Cloudflare Warp DNS resolver',

    color: '#6b82a6',
    gradient: 'linear-gradient(135deg,#475569,#6b82a6)',
    bg: 'rgba(107,130,166,0.1)',
    category: 'system',
    noOpen: true
  }

const CATEGORIES = {
  apps: { label: 'Web Applications', icon: '🌐', iconBg: 'rgba(59,130,246,0.15)' },
  ai:   { label: 'AI & Python Services', icon: '🤖', iconBg: 'rgba(236,72,153,0.12)' },
  tools:{ label: 'Dev Tools', icon: '🔧', iconBg: 'rgba(249,115,22,0.12)' },
  system:{ label: 'System Services', icon: '⚙️', iconBg: 'rgba(107,130,166,0.1)' }
};

// ─────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────
const state = {};
SERVICES.forEach(s => state[s.id] = { status: 'checking', ping: null });

let nextCheckTimer = 30;
let countdown;

// ─────────────────────────────────────────────────────────────
// Render
// ─────────────────────────────────────────────────────────────
function render() {
  const container = document.getElementById('main-content');
  const catOrder = ['apps', 'ai', 'tools', 'system'];
  let html = '';

  catOrder.forEach(catId => {
    const svcs = SERVICES.filter(s => s.category === catId);
    if (!svcs.length) return;
    const cat = CATEGORIES[catId];
    html += `
      <div class="category" data-cat="${catId}">
        <div class="cat-header">
          <div class="cat-icon" style="background:${cat.iconBg}">${cat.icon}</div>
          <span class="cat-name">${cat.label}</span>
          <span class="cat-count">${svcs.length} service</span>
        </div>
        <div class="service-grid">
          ${svcs.map(s => renderCard(s)).join('')}
        </div>
      </div>`;
  });

  container.innerHTML = html;
  updateStats();
}

function renderCard(svc) {
  const s = state[svc.id];
  const url = `http://localhost:${svc.port}${svc.path || '/'}`;
  const canOpen = !svc.noOpen;

  const statusLabel = {
    checking: 'Checking…',
    online: 'Online',
    offline: 'Offline',
    unknown: 'Unknown'
  }[s.status] || 'Checking…';

  const pingHtml = s.ping !== null
    ? `<div class="ping-time ${s.ping < 100 ? 'fast' : 'slow'}">⚡ ${s.ping}ms</div>`
    : `<div class="ping-time">Pinging…</div>`;

  return `
    <div class="service-card" id="card-${svc.id}"
         style="--card-accent:${svc.gradient}"
         onclick="${canOpen ? `openService('${url}')` : `showToast('${svc.name} tidak bisa dibuka di browser')`}">
      <div class="card-top">
        <div class="card-icon-wrap" style="background:${svc.bg}; font-size:20px">${svc.icon}</div>
        <div class="status-pill checking" id="pill-${svc.id}">
          <div class="status-dot"></div>
          <span id="pill-label-${svc.id}">${statusLabel}</span>
        </div>
      </div>
      <div class="card-name">${svc.name}</div>
      <div class="card-desc">${svc.desc}</div>
      <div class="card-footer">
        <span class="port-badge">:${svc.port}</span>
        ${canOpen
          ? `<a class="open-btn" href="${url}" target="_blank" onclick="event.stopPropagation()">
              Buka
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            </a>`
          : `<span style="font-size:11px;color:var(--text-dim)">System</span>`
        }
      </div>
      <div id="ping-${svc.id}">${pingHtml}</div>
    </div>`;
}

// ─────────────────────────────────────────────────────────────
// Status Check
// ─────────────────────────────────────────────────────────────
async function checkService(svc) {
  const pill = document.getElementById(`pill-${svc.id}`);
  const label = document.getElementById(`pill-label-${svc.id}`);
  const pingEl = document.getElementById(`ping-${svc.id}`);

  if (!pill) return;

  // Set checking
  pill.className = 'status-pill checking';
  if (label) label.textContent = 'Checking…';

  const start = Date.now();
  const url = `http://localhost:${svc.port}/`;

  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 3000);

    await fetch(url, {
      method: 'HEAD',
      mode: 'no-cors',
      signal: controller.signal,
      cache: 'no-store'
    });

    clearTimeout(timeout);
    const ping = Date.now() - start;

    state[svc.id] = { status: 'online', ping };
    pill.className = 'status-pill online';
    if (label) label.textContent = 'Online';
    if (pingEl) {
      pingEl.innerHTML = `<div class="ping-time ${ping < 100 ? 'fast' : 'slow'}">⚡ ${ping}ms</div>`;
    }
  } catch (e) {
    const ping = Date.now() - start;
    const isAborted = e.name === 'AbortError';
    state[svc.id] = { status: 'offline', ping: isAborted ? null : ping };
    pill.className = 'status-pill offline';
    if (label) label.textContent = isAborted ? 'Timeout' : 'Offline';
    if (pingEl) {
      pingEl.innerHTML = `<div class="ping-time">${isAborted ? '⏱ Timeout' : '✗ Tidak tersedia'}</div>`;
    }
  }

  updateStats();
}

async function checkAll() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('loading');
  btn.querySelector('span') && (btn.querySelector('span').textContent = 'Checking…');

  // Reset countdown
  nextCheckTimer = 30;

  await Promise.allSettled(SERVICES.map(s => checkService(s)));

  btn.classList.remove('loading');

  const now = new Date();
  document.getElementById('stat-last').textContent =
    now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  showToast('✅ Status semua service diperbarui');
}

// ─────────────────────────────────────────────────────────────
// Stats
// ─────────────────────────────────────────────────────────────
function updateStats() {
  const total = SERVICES.length;
  const online = Object.values(state).filter(s => s.status === 'online').length;
  const offline = Object.values(state).filter(s => s.status === 'offline').length;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-online').textContent = online;
  document.getElementById('stat-offline').textContent = offline;
}

// ─────────────────────────────────────────────────────────────
// Clock & Countdown
// ─────────────────────────────────────────────────────────────
function startClock() {
  setInterval(() => {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }, 1000);
}

function startAutoRefresh() {
  setInterval(() => {
    nextCheckTimer--;
    const el = document.getElementById('next-check');
    if (el) el.textContent = `Refresh dalam ${nextCheckTimer}s`;
    if (nextCheckTimer <= 0) {
      nextCheckTimer = 30;
      checkAll();
    }
  }, 1000);
}

// ─────────────────────────────────────────────────────────────
// Search / Filter
// ─────────────────────────────────────────────────────────────
function filterCards() {
  const q = document.getElementById('search').value.toLowerCase();
  SERVICES.forEach(svc => {
    const card = document.getElementById(`card-${svc.id}`);
    if (!card) return;
    const match = svc.name.toLowerCase().includes(q) ||
                  svc.desc.toLowerCase().includes(q) ||
                  String(svc.port).includes(q) ||
                  svc.category.includes(q);
    card.style.display = match ? '' : 'none';
  });

  // Hide empty category headers
  document.querySelectorAll('.category').forEach(cat => {
    const visible = [...cat.querySelectorAll('.service-card')].some(c => c.style.display !== 'none');
    cat.style.display = visible ? '' : 'none';
  });
}

// ─────────────────────────────────────────────────────────────
// Helpers
// ─────────────────────────────────────────────────────────────
function openService(url) {
  window.open(url, '_blank');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

// Keyboard shortcut
document.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') {
    if (document.activeElement.tagName === 'INPUT') return;
    checkAll();
  }
});

// ─────────────────────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────────────────────
render();
startClock();
startAutoRefresh();
updateStats();
checkAll();
</script>

</body>
</html>
